/* ---- Raporlar ---- */
Views.reports = () => {
  const r = App.report, t = NOW(), daily = r.mode === 'daily';
  const from = daily ? T.sod(r.date) : T.sow(r.date), to = daily ? T.eod(r.date) : T.addDays(from, 7), isCurrent = t >= from && t < to;
  const label = daily ? T.fmt(from, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : `${T.fmt(from, { day: 'numeric', month: 'short' })} – ${T.fmt(to - 1, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  return `<div class="toolbar">
      <div class="seg"><button class="${daily ? 'on' : ''}" data-act="reportMode" data-v="daily">${ic('calendar', 15)} Günlük</button><button class="${!daily ? 'on' : ''}" data-act="reportMode" data-v="weekly">${ic('chart', 15)} Haftalık</button></div>
      <div class="datenav"><button class="btn-icon sm" data-act="reportShift" data-n="-1">${ic('left', 16)}</button>
        <span class="lbl-date">${label}<input type="date" id="reportDate" value="${T.key(r.date)}"></span>
        <button class="btn-icon sm" data-act="reportShift" data-n="1" ${to > t ? 'disabled style="opacity:.35;pointer-events:none"' : ''}>${ic('right', 16)}</button></div>
      ${isCurrent ? '<span class="badge live">● Canlı</span>' : '<span class="badge gray">Kesinleşmiş</span>'}
      <span class="spacer"></span>
      ${!isCurrent ? `<button class="btn btn-ghost" data-act="reportToday">${daily ? 'Bugün' : 'Bu hafta'}</button>` : ''}
      <button class="btn btn-ghost" data-act="exportCsv">${ic('download', 16)} CSV indir</button>
    </div>${daily ? Views.reportDaily(from, to, isCurrent) : Views.reportWeekly(from, to, isCurrent)}`;
};
const autoSummary = (title, lines) => `<section class="card summary-card span-all"><div class="card-head"><h3>${ic('sparkles', 17)} ${title}</h3><span class="sub">Kayıtlardan otomatik oluşturuldu</span></div><div class="sum-text">${lines.map(l => `<p>${l}</p>`).join('')}</div></section>`;
const goalTxt = () => String(DB.get('settings').dailyGoal).replace('.', ',');

Views.reportDaily = (from, to, isCurrent) => {
  const users = DB.get('users'), goal = DB.get('settings').dailyGoal * HOUR, team = Tracker.summary(null, from, to);
  if (!team.total) { const last = Tracker.lastWorkedDay(); return `<div class="card">${emptyBox('calendar', 'Bu gün için kayıt yok', isCurrent ? 'Ekipten henüz kimse güne başlamadı.' : 'Seçilen tarihte çalışma kaydı bulunmuyor.', last && last !== from ? `<button class="btn btn-primary" data-act="gotoDate" data-ts="${last}">${ic('calendar', 15)} Son çalışılan güne git</button>` : '')}</div>`; }
  const rows = users.map(u => ({ u, sm: Tracker.summary(u.id, from, to), day: Tracker.day(u.id, from), open: Tracker.openSession(u.id) })).sort((a, b) => b.sm.work - a.sm.work);
  const worked = rows.filter(r => r.sm.total > 0), items = Charts.actItems(team.byAct), workItems = items.filter(i => i.work);
  const startOf = r => r.day ? r.day.start : r.sm.first;
  const starts = worked.map(r => startOf(r) - from), avgStart = starts.length ? from + starts.reduce((a, b) => a + b, 0) / starts.length : null;
  const reached = worked.filter(r => r.sm.work >= goal).length, early = [...worked].sort((a, b) => startOf(a) - startOf(b))[0];
  const deepTop = [...worked].sort((a, b) => b.sm.deep - a.sm.deep)[0];
  const lines = [
    `Ekip ${isCurrent ? 'bugün şu ana kadar' : 'bu gün'} toplam <b>${T.dur(team.work)}</b> net çalıştı ve <b>${team.breaks}</b> molada toplam <b>${T.dur(team.brk)}</b> dinlendi.`,
    worked.length ? `En uzun mesai <b>${esc(worked[0].u.name)}</b> (${T.dur(worked[0].sm.work)}); güne en erken başlayan <b>${esc(firstName(early.u.name))}</b> (${T.hm(startOf(early))}).` : '',
    team.deep ? `Deep Work toplamı <b>${T.dur(team.deep)}</b> — en uzun odak süresi <b>${esc(firstName(deepTop.u.name))}</b> (${T.dur(deepTop.sm.deep)}).` : '',
    workItems.length ? `En çok zaman ayrılan alan: <b>${workItems[0].emoji} ${esc(workItems[0].label)}</b> — net çalışmanın %${Math.round(workItems[0].value / (team.work || 1) * 100)}'i.` : '',
    `${reached}/${users.length} üye ${goalTxt()} saatlik günlük hedefe ulaştı.`
  ].filter(Boolean);
  return `<div class="grid g-4">
      ${kpi('clock', 'Ekip net çalışma', T.dur(team.work), `${worked.length} üye çalıştı`)}
      ${kpi('coffee', 'Net mola', T.dur(team.brk), `${team.breaks} mola`, '', 'brk')}
      ${kpi('brain', 'Deep Work', T.dur(team.deep), `çalışmanın %${team.work ? Math.round(team.deep / team.work * 100) : 0}'i`, '', 'deep')}
      ${kpi('sunrise', 'Ortalama başlama', avgStart ? T.hm(avgStart) : '—', `${reached}/${users.length} hedefe ulaştı`, '', 'ok')}
    </div>
    <div class="grid g-3 mt">
      ${autoSummary('Otomatik gün sonu özeti', lines)}
      <section class="card span-2"><div class="card-head"><h3>Üye bazlı günlük rapor</h3><span class="sub">Net çalışmaya göre sıralı</span></div>
        ${rows.map(({ u, sm, day, open }) => {
          const pct = Math.round(Math.min(1, sm.work / goal) * 100), ai = Charts.actItems(sm.byAct);
          const end = day?.end ? T.hm(day.end) : (isCurrent && open ? 'Devam ediyor' : (sm.last ? T.hm(sm.last) : '—'));
          return `<div class="rep-row"><div class="rr-user">${avatar(u, 42)}<div><b>${esc(u.name)}</b><span>${esc(u.title || '')}</span></div></div>
            <div class="rr-body"><div class="rr-stats">
              <div><span>Giriş</span><b>${startOf({ day, sm }) ? T.hm(startOf({ day, sm })) : '—'}</b></div>
              <div><span>Çıkış</span><b>${end}</b></div>
              <div><span>Net çalışma</span><b>${T.dur(sm.work)}</b></div>
              <div><span>Net mola</span><b>${T.dur(sm.brk)} <small class="muted">(${sm.breaks})</small></b></div>
              <div><span>Deep Work</span><b>${T.dur(sm.deep)}</b></div>
              <div><span>Hedef</span><b>%${pct}</b></div></div>
              <div class="progress"><i style="width:${pct}%"></i></div>
              ${Charts.timeline(u.id, from, true)}
              ${ai.length ? `<div class="chips">${ai.slice(0, 7).map(a => `<span class="chip" style="--c:${a.color}">${a.emoji} ${esc(a.label)} <b>${T.dur(a.value)}</b></span>`).join('')}</div>` : ''}
            </div></div>`;
        }).join('')}</section>
      <section class="card"><div class="card-head"><h3>Ekip vakit dağılımı</h3></div>
        <div style="display:flex;justify-content:center;margin-bottom:18px">${Charts.donut(items, { size: 180, center: T.dur(team.total), sub: 'toplam süre' })}</div>${Charts.legend(items, 10)}</section>
    </div>`;
};

Views.reportWeekly = (from, to, isCurrent) => {
  const users = DB.get('users'), goal = DB.get('settings').dailyGoal * HOUR, t = NOW(), team = Tracker.summary(null, from, to);
  if (!team.total) { const last = Tracker.lastWorkedDay(); return `<div class="card">${emptyBox('chart', 'Bu hafta için kayıt yok', 'Seçilen haftada çalışma kaydı bulunmuyor.', last && T.sow(last) !== from ? `<button class="btn btn-primary" data-act="gotoDate" data-ts="${last}">${ic('calendar', 15)} Son çalışılan haftaya git</button>` : '')}</div>`; }
  const days = DAYS_SHORT.map((l, i) => { const d = T.addDays(from, i); return { ts: d, label: l, sub: T.fmt(d, { day: 'numeric', month: 'short' }), today: T.key(d) === T.key(t) }; });
  const matrix = users.map(u => ({ u, cells: days.map(d => Tracker.summary(u.id, d.ts, T.addDays(d.ts, 1))), sm: Tracker.summary(u.id, from, to) }));
  const dayTotals = days.map((d, i) => matrix.reduce((a, m) => a + m.cells[i].work, 0));
  const maxCell = Math.max(HOUR, ...matrix.flatMap(m => m.cells.map(c => c.work))), busiest = dayTotals.indexOf(Math.max(...dayTotals));
  const elapsed = days.filter(d => T.isWeekday(d.ts) && d.ts <= t).length;
  const goalPct = elapsed ? Math.round(team.work / (goal * users.length * elapsed) * 100) : 0;
  const items = Charts.actItems(team.byAct), workItems = items.filter(i => i.work), ranked = [...matrix].sort((a, b) => b.sm.work - a.sm.work);
  const cols = days.map((d, i) => ({ label: d.label, sub: d.sub, today: d.today, total: dayTotals[i], segs: matrix.map(m => ({ value: m.cells[i].work, color: m.u.color, title: `${m.u.name} · ${T.dur(m.cells[i].work)}` })) }));
  const lines = [
    `Ekip bu hafta ${isCurrent ? 'şu ana kadar ' : ''}toplam <b>${T.dur(team.work)}</b> net çalıştı; kişi başı ortalama <b>${T.dur(team.work / users.length)}</b>. Toplam mola <b>${T.dur(team.brk)}</b> (${team.breaks} mola).`,
    `Haftanın en yoğun günü <b>${T.fmt(days[busiest].ts, { weekday: 'long' })}</b> (${T.dur(dayTotals[busiest])}); en çok çalışan üye <b>${esc(ranked[0].u.name)}</b> (${T.dur(ranked[0].sm.work)}).`,
    team.deep ? `Haftalık Deep Work: <b>${T.dur(team.deep)}</b> — net çalışmanın %${Math.round(team.deep / (team.work || 1) * 100)}'i.` : '',
    workItems.length ? `En çok zaman ayrılan alan <b>${workItems[0].emoji} ${esc(workItems[0].label)}</b>${workItems[1] ? `, ardından <b>${esc(workItems[1].label)}</b>` : ''}.` : '',
    elapsed ? `Geçen ${elapsed} iş gününe göre hedef tamamlama oranı <b>%${goalPct}</b>.` : ''
  ].filter(Boolean);
  return `<div class="grid g-4">
      ${kpi('clock', 'Haftalık net çalışma', T.dur(team.work), `${T.dur(team.brk)} mola`)}
      ${kpi('users', 'Kişi başı ortalama', T.dur(team.work / users.length), `${users.length} üye`)}
      ${kpi('brain', 'Deep Work', T.dur(team.deep), 'haftalık toplam', '', 'deep')}
      ${kpi('target', 'Hedef tamamlama', elapsed ? '%' + goalPct : '—', `${elapsed} iş günü baz alındı`, '', 'ok')}
    </div>
    <div class="grid g-3 mt">
      ${autoSummary('Otomatik hafta sonu özeti', lines)}
      <section class="card span-2"><div class="card-head"><h3>Günlere göre ekip çalışması</h3><div class="chips">${users.map(u => `<span class="chip" style="--c:${u.color}">● ${esc(firstName(u.name))}</span>`).join('')}</div></div>
        ${Charts.columns(cols, { goal: goal * users.length, height: 300 })}</section>
      <section class="card"><div class="card-head"><h3>Vakit dağılımı</h3></div>

/* ---- Sohbet ---- */
const Chat = {
  draft: '',
  readKey() { return 'squadpulse.chatRead.' + Auth.current; },
  list() { return DB.get('messages').filter(m => m && (m.text || m.pending)).sort((a, b) => (a.at - b.at) || (a.id < b.id ? -1 : 1)); },
  lastRead() { try { return +localStorage.getItem(this.readKey()) || 0; } catch (e) { return this._read || 0; } },
  markRead() {
    const last = this.list().reduce((a, m) => Math.max(a, m.at || 0), 0);
    if (last <= this.lastRead()) return;
    this._read = last; try { localStorage.setItem(this.readKey(), String(last)); } catch (e) {}
    App.updateChatBadge();
  },
  unread() { if (!Auth.current) return 0; const lr = this.lastRead(); return this.list().filter(m => m.userId !== Auth.current && m.at > lr).length; },
  send() {
    const inp = $('#chatInput'); if (!inp || !Auth.current) return;
    const text = inp.value.replace(/\s+$/, '').replace(/^\s+/, '').slice(0, 1000);
    if (!text) { inp.focus(); return; }
    const m = { id: 'm' + NOW().toString(36) + Math.random().toString(36).slice(2, 7), userId: Auth.current, text, at: NOW() };
    App.seenMsgs.add(m.id);
    DB.insert('messages', m);
    inp.value = ''; this.draft = ''; this.autoGrow(inp); inp.focus();
    this.renderList([m.id]); this.markRead();
    if (Gemini.TRIGGER.test(text)) Gemini.handle(m);
  },
  stick: true,
  stickToBottom() { const el = $('#chatList'); if (el && this.stick) el.scrollTop = el.scrollHeight; },
  autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 140) + 'px'; },
  senderName(m) { if (m.bot || m.userId === Gemini.BOT_ID) return Gemini.NAME; const u = DB.find('users', m.userId); return u ? u.name : 'Eski üye'; },
  dayLabel(ts) {
    const d = T.sod(ts), today = T.sod();
    if (d === today) return 'Bugün';
    if (d === T.addDays(today, -1)) return 'Dün';
    return T.fmt(ts, { day: 'numeric', month: 'long', weekday: 'long' });
  },
  /** Mesaj listesini yeniden üretir ve en alta kaydırır (yazma alanına dokunmaz) */
  renderList(popIds = []) {
    const el = $('#chatList'); if (!el) return;
    el.innerHTML = Views.chatMessages(new Set(popIds));
    this.stick = true;
    el.scrollTop = el.scrollHeight;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }
};

Views.chatMessages = (pop = new Set()) => {
  const list = Chat.list(), me = Auth.current;
  if (!list.length) return `<div class="chat-empty">${ic('chat', 38)}<h4 style="color:var(--text);margin-bottom:4px">Henüz mesaj yok</h4><p>Ekibe ilk mesajı sen gönder 👋</p></div>`;
  let html = '', lastDay = null;
  list.forEach((m, i) => {
    const prev = list[i - 1], next = list[i + 1], day = T.key(m.at);
    if (day !== lastDay) { html += `<div class="day-sep">${Chat.dayLabel(m.at)}</div>`; lastDay = day; }
    const sameAsPrev = prev && prev.userId === m.userId && T.key(prev.at) === day && m.at - prev.at < 5 * MIN;
    const sameAsNext = next && next.userId === m.userId && T.key(next.at) === day && next.at - m.at < 5 * MIN;
    if (m.bot || m.userId === Gemini.BOT_ID) {
      const stale = m.pending && NOW() - m.at > 120000;
      const body = m.pending && !stale ? `<span class="typing"><i></i><i></i><i></i><span>düşünüyor…</span></span>`
        : stale ? '⚠️ Yanıt alınamadı (soruyu soran kişinin bağlantısı kesildi).' : miniMd(m.text);
      html += `<div class="msg theirs bot ${sameAsPrev ? '' : 'first'} ${sameAsNext ? '' : 'last'} ${pop.has(m.id) ? 'pop' : ''}" data-mid="${esc(m.id)}">
        <span class="av-slot">${sameAsNext ? '' : '<span class="bot-av" style="width:30px;height:30px">🤖</span>'}</span>
        <div class="bubble bot ${m.error || stale ? 'err' : ''}"><span class="who">${Gemini.NAME}</span><div class="txt">${body}</div><span class="meta">${T.hm(m.at)}</span></div>
      </div>`;
      return;
    }
    const u = DB.find('users', m.userId), mine = m.userId === me;
    const name = u ? (mine ? `${firstName(u.name)} (sen)` : u.name) : 'Eski üye';
    const color = u ? u.color : '#94a3b8';
    html += `<div class="msg ${mine ? 'mine' : 'theirs'} ${sameAsPrev ? '' : 'first'} ${sameAsNext ? '' : 'last'} ${pop.has(m.id) ? 'pop' : ''}" data-mid="${esc(m.id)}">
      ${mine ? '' : `<span class="av-slot">${sameAsNext ? '' : (u ? avatar(u, 30) : '')}</span>`}
      <div class="bubble" style="--c:${color}"><span class="who">${esc(name)}</span><div class="txt">${esc(m.text).replace(/^(\s*)@gemini\b/i, '$1<span class="mention">@Gemini</span>')}</div><span class="meta">${T.hm(m.at)}</span></div>
    </div>`;
  });
  return html;
};

/* ---- Gemini Asistan ---- */
function miniMd(s) {
  let h = esc(s);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<span class="md-pre">${c.replace(/\n$/, '')}</span>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^#{1,6}\s+(.*)$/gm, '<b>$1</b>');
  h = h.replace(/^(\s*)[*-]\s+/gm, '$1• ');
  return h;
}
const Gemini = {
  BOT_ID: 'gemini',
  NAME: '🤖 Gemini Asistan',
  TRIGGER: /^\s*@gemini\b[\s,:;.!?-]*/i,
  hasKey() { return !!GEMINI_API_KEY && !/BURAYA/i.test(GEMINI_API_KEY); },
  title(q) { const w = q.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean); return w.slice(0, 6).join(' ') + (w.length > 6 ? '…' : ''); },
  /** Soru soran kişinin cihazında çalışır: soruyu Gemini'a yollar, cevabı herkes için messages'a yazar */
  async handle(userMsg) {
    const me = Auth.user(); if (!me) return;
    const question = userMsg.text.replace(this.TRIGGER, '').trim();
    if (!question) { toast('Soru yazmayı unuttun: <b>@Gemini</b> sorunuz…'); return; }
    const t = NOW(), rnd = () => Math.random().toString(36).slice(2, 7);
    const botId = 'g' + t.toString(36) + rnd(), logId = 'l' + t.toString(36) + rnd();
    DB.insert('ai_logs', { id: logId, userId: me.id, userName: me.name, title: this.title(question), at: t, status: 'pending' });
    DB.insert('messages', { id: botId, userId: this.BOT_ID, bot: true, pending: true, text: '', at: t + 1, replyTo: userMsg.id, askedBy: me.id });
    App.seenMsgs.add(botId); Chat.renderList([botId]);
    let text, ok = true, model = null;
    try { const r = await this.ask(question, me); text = r.text; model = r.model; }
    catch (e) { ok = false; text = '⚠️ ' + (e.message || 'Bilinmeyen hata'); console.warn('[gemini]', e); }
    DB.update('messages', botId, { text, pending: null, error: ok ? null : true, model });
    DB.update('ai_logs', logId, { status: ok ? 'ok' : 'error', model, error: ok ? null : text.slice(0, 200) });
    Chat.renderList([]);
  },
  async ask(question, me) {
    if (!this.hasKey()) throw new Error('Gemini API anahtarı tanımlı değil. index.html içinde Firebase ayarlarının hemen altındaki GEMINI_API_KEY satırına anahtarını yaz.');
    const s = DB.get('settings');
    const recent = Chat.list().filter(m => !m.pending && m.text).slice(-11, -1)
      .map(m => `${m.bot ? 'Gemini Asistan' : Chat.senderName(m)}: ${m.text.slice(0, 400)}`).join('\n');
    const system = `Sen "${s.teamName}" ekibinin Squad Pulse uygulamasındaki ekip sohbetinde çalışan yardımcı asistansın (Gemini Asistan). ` +
      `Ekip sohbetinde herkes cevabını görür. Varsayılan olarak Türkçe, samimi, kısa ve net yanıt ver (gerekmedikçe 150 kelimeyi geçme). Gerekirse madde işaretleri kullan.`;
    const body = {
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: (recent ? `Sohbetin son mesajları (bağlam için):\n${recent}\n\n` : '') + `${me.name} soruyor: ${question}` }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
    };
    const models = [GEMINI_MODEL, ...GEMINI_FALLBACK_MODELS.filter(m => m && m !== GEMINI_MODEL)];
    let lastErr = null;
    for (const model of models) {
      let res;
      try {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': GEMINI_API_KEY }, body: JSON.stringify(body)
        });
      } catch (e) { throw new Error('Gemini sunucusuna ulaşılamadı (ağ hatası).'); }
      let data = {}; try { data = await res.json(); } catch (e) {}
      const msg = data?.error?.message || res.statusText || '';
      if (res.status === 404) { lastErr = new Error(`Model bulunamadı: ${model}`); continue; }   // yedek modele geç
      if (!res.ok) {
        if (/api key not valid|API_KEY_INVALID/i.test(msg)) throw new Error('API anahtarı geçersiz. GEMINI_API_KEY değerini kontrol et.');
        if (res.status === 429) throw new Error('Gemini kullanım kotası doldu. Biraz sonra tekrar dene.');
        if (res.status === 403) throw new Error('API anahtarının bu isteğe izni yok (anahtar kısıtlamalarını kontrol et).');
        throw new Error(`Gemini hatası (${res.status}): ${msg.slice(0, 160)}`);
      }
      const cand = data.candidates && data.candidates[0];
      const text = ((cand && cand.content && cand.content.parts) || []).map(p => p.text || '').join('').trim();
      if (!text) { const why = data.promptFeedback?.blockReason || cand?.finishReason; throw new Error(why ? `Gemini bu soruya yanıt vermedi (${why}).` : 'Gemini boş yanıt döndürdü.'); }
      return { text: text.slice(0, 4000), model };
    }
    throw lastErr || new Error('Uygun Gemini modeli bulunamadı.');
  }
};

const Modal = {

function fileToAvatar(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Lütfen bir görsel dosyası seç.'));
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const S = 200, c = document.createElement('canvas'); c.width = c.height = S; const m = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S); res(c.toDataURL('image/jpeg', .85)); }; img.onerror = () => rej(new Error('Görsel okunamadı.')); img.src = r.result; };
    r.onerror = () => rej(new Error('Dosya okunamadı.')); r.readAsDataURL(file);
  });
}

    rows.push(''); rows.push(['ÖZET', 'Üye', 'Net çalışma (sa)', 'Net mola (sa)', 'Deep Work (sa)', 'Mola sayısı'].map(q).join(';'));

    download(`squad-pulse-${daily ? 'gunluk' : 'haftalik'}-${T.key(from)}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8'); toast('CSV raporu indirildi', 'success');

  addActivity() {

  async removeActivity(el) {

    DB.get('sessions').filter(x => x.activityId === id && !x.end).forEach(x => Tracker.close(x));
    if (used) updateActivity(id, { archived: true }); else DB.patchSettings({ activities: s.activities.filter(x => x.id !== id) });

  },
  restoreActivity(el) { updateActivity(el.dataset.id, { archived: false }); toast('Aktivite geri alındı', 'success'); App.renderMain(); },

  exportJson() {
    const data = { app: 'squad-pulse', version: 2, exportedAt: new Date(NOW()).toISOString(), data: { settings: DB.get('settings'), users: DB.cache.users, sessions: DB.cache.sessions, days: DB.cache.days, messages: DB.cache.messages, ai_logs: DB.cache.ai_logs } };

  importJson() { $('#fileImport').click(); },
  async loadDemo() {

  },
  async clearDemo() {

    if (!await confirmBox('Demo verileri sil', `${demo.length} demo kaydı silinecek. Gerçek kayıtlara dokunulmaz.`, 'Sil')) return;

  },
  async clearChat() {

  },
  sendChat() { Chat.send(); },
  gemHint() { const i = $('#chatInput'); if (!i) return; if (!/^\s*@gemini/i.test(i.value)) i.value = '@Gemini ' + i.value.replace(/^\s+/, ''); Chat.draft = i.value; i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} },
  unlockAdmin() { AdminGate.prompt(); },
  lockAdmin() { AdminGate.lock(); },
  exportAiLogs() {

    download(`squad-pulse-gemini-loglari-${T.key(NOW())}.csv`, '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8'); toast('Loglar indirildi', 'success');
  },
  async clearAiLogs() {
    if (!await confirmBox('Gemini loglarını temizle', 'Tüm yapay zeka kullanım kayıtları kalıcı olarak silinecek.', 'Temizle')) return;

  },
  async clearTime() {

    DB.multi({ sessions: null, days: null }); DB.get('users').forEach(u => { if (u.pomo) DB.update('users', u.id, { pomo: null }); }); toast('Zaman kayıtları temizlendi'); App.render();

  async resetAll() {

  uploadAvatar() { $('#fileAvatar').click(); },

  profileColor(el) { DB.update('users', Auth.current, { color: el.dataset.v }); App.render(); },
  saveProfile() {
    const name = $('#pfName').value.trim(), title = $('#pfTitle').value.trim(), pin = $('#pfPin').value.trim();
    if (name.length < 2) return toast('Lütfen geçerli bir ad gir.', 'error');
    if (pin && !/^\d{4,6}$/.test(pin)) return toast('PIN 4–6 haneli rakamlardan oluşmalı.', 'error');
    DB.update('users', Auth.current, { name, title, pin }); toast('Profil kaydedildi', 'success'); App.render();

  setMode(el) { updatePrefs({ mode: el.dataset.v }); },
  setAccent(el) { updatePrefs({ accent: el.dataset.v }); },
  setBg(el) { updatePrefs({ bg: el.dataset.v }); },

/* ---------------- 9. UYGULAMA ÇEKİRDEĞİ ---------------- */
const App = {
  view: 'dashboard', report: { mode: 'daily', date: Date.now() }, pressing: false, pressTimer: null, seenMsgs: new Set(), pendingBots: new Set(), msgSig: '',
  pending: false, renderTimer: null, lastMinute: null, dayKey: null, started: false,

  async init() {
    document.addEventListener('click', e => this.onClick(e));
    document.addEventListener('change', e => this.onChange(e));
    document.addEventListener('input', e => this.onInput(e));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && Modal.el) Modal.close();
      if (e.key === 'Enter' && e.target.id === 'chatInput' && !e.shiftKey && !e.isComposing) { e.preventDefault(); Chat.send(); return; }
      if (e.key === 'Enter' && e.target.id === 'pulseInput') { e.preventDefault(); savePulse(true); e.target.blur(); toast('Durum notu ekiple paylaşıldı', 'success'); }
    });
    document.addEventListener('focusout', e => { const t = e.target; if (t && t.dataset && t.dataset.dirty) { delete t.dataset.dirty; this.onChange({ target: t }); } if (t && t.id === 'pulseInput') savePulse(true); });
    window.addEventListener('hashchange', () => this.route());
    document.addEventListener('scroll', e => { if (e.target && e.target.id === 'chatList') { const l = e.target; Chat.stick = l.scrollHeight - l.scrollTop - l.clientHeight < 80; } }, true);
    const onResize = () => Chat.stickToBottom();
    window.addEventListener('resize', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && this.view === 'chat' && $('#chatList')) { Chat.markRead(); this.updateChatBadge(); } });
    const press = () => { this.pressing = true; clearTimeout(this.pressTimer); this.pressTimer = setTimeout(() => this.release(), 4000); };
    document.addEventListener('pointerdown', press, true);
    document.addEventListener('touchstart', press, { capture: true, passive: true });
    ['pointerup', 'pointercancel', 'touchend', 'touchcancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(this.pressTimer); this.pressTimer = setTimeout(() => this.release(), 350); }, { capture: true, passive: true }));
    window.addEventListener('beforeunload', () => { if ($('#pulseInput')) savePulse(true); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { const u = Auth.user(); if (u && Theme.prefs(u).mode === 'system') this.render(); });

    Theme.apply(Theme.defaults);
    let forceLocal = false; try { forceLocal = localStorage.getItem('squadpulse.forceLocal') === '1'; } catch (e) {}
    const sdk = typeof firebase !== 'undefined' && !!firebase.database;
    if (!forceLocal && !sdk) { $('#root').innerHTML = Views.setup('sdk'); return; }
    Net.mode = forceLocal ? 'local' : 'firebase';
    DB.backend = forceLocal ? LocalBackend : FirebaseBackend;
    $('#root').innerHTML = Views.loading(false);
    const slow = setTimeout(() => { if (!Net.ready) $('#root').innerHTML = Views.loading(true); }, 12000);
    try { await DB.backend.init(); }
    catch (e) { clearTimeout(slow); console.error(e); Net.error = e; $('#root').innerHTML = Views.setup(e); return; }
    clearTimeout(slow);

    // İlk kurulum: veritabanı boşsa yalnızca bir istemci başlangıç verisini yazar
    if (!DB.get('settings') || !DB.get('users').length) {
      const claim = await DB.backend.transaction('meta/seedLock', cur => (cur && NOW() - cur < 15000) ? undefined : NOW());
      if (claim.committed || !(await this.waitFor(() => DB.get('settings') && DB.get('users').length, 6000))) await Seed.run();
    }
    Net.ready = true;
    Chat.list().forEach(m => this.seenMsgs.add(m.id));
    this.dayKey = T.key(NOW());
    Auth.restore();
    if (Auth.current) Presence.attach(Auth.current);
    Tracker.autoClose();
    setInterval(() => this.tick(), 1000);
    this.started = true;
    this.route();
  },
  /** Yeni sohbet mesajı geldiğinde: sohbet açıksa yalnızca liste güncellenir, değilse rozet + bildirim */
  onMessages() {
    const answered = Chat.list().filter(m => m.bot && !m.pending && this.pendingBots.has(m.id));
    answered.forEach(m => this.pendingBots.delete(m.id));
    Chat.list().filter(m => m.bot && m.pending).forEach(m => this.pendingBots.add(m.id));
    const fresh = Chat.list().filter(m => !this.seenMsgs.has(m.id));
    fresh.forEach(m => this.seenMsgs.add(m.id));
    // Gemini cevabı sonradan tamamlandığında (mesaj kimliği zaten görülmüş olsa da) diğer sekmelerde bildirim göster
    if (!(this.view === 'chat' && $('#chatList'))) answered.forEach(m => { if (!fresh.some(f => f.id === m.id)) fresh.push(m); });
    if (!Auth.current) return;
    const sig = Chat.list().map(m => m.id + (m.pending ? 'p' : '') + (m.text || '').length).join('|');
    const changed = sig !== this.msgSig; this.msgSig = sig;
    if (this.view === 'chat' && $('#chatList')) {
      if (fresh.length || changed) Chat.renderList(fresh.map(m => m.id));
      if (!document.hidden) Chat.markRead();
    } else {
      fresh.filter(m => m.userId !== Auth.current).slice(-3).forEach(m => {
        if (m.pending || !m.text) return;
        const name = m.bot ? Gemini.NAME : firstName(Chat.senderName(m));
        const plain = m.bot ? m.text.replace(/```[\s\S]*?```/g, ' ').replace(/[*`#_>]/g, '').replace(/\s+/g, ' ').trim() : m.text;
        toast(`💬 <b>${esc(name)}:</b> ${esc(plain.length > 70 ? plain.slice(0, 70) + '…' : plain)}`);
      });
    }
    this.updateChatBadge();
  },
  updateChatBadge() {
    const b = $('#chatBadge'); if (!b) return;
    const n = Chat.unread(); b.textContent = n > 99 ? '99+' : n; b.hidden = !n;
  },
  release() { this.pressing = false; if (this.pending && !Modal.el) this.scheduleRender(); },
  waitFor(fn, ms) { return new Promise(res => { const t0 = Date.now(); const iv = setInterval(() => { if (fn()) { clearInterval(iv); res(true); } else if (Date.now() - t0 > ms) { clearInterval(iv); res(false); } }, 150); }); },
  allowed(v) { const n = NAV.find(x => x.id === v); return n && (!n.admin || Auth.isAdmin()); },
  /** Sekme değiştirme — adres çubuğuna bağımlı değil, gömülü önizleyicilerde de çalışır */
  go(view) {
    if (!this.started) return;
    this.view = this.allowed(view) ? view : 'dashboard';
    try { if (location.hash !== '#/' + this.view) history.replaceState(null, '', '#/' + this.view); } catch (e) { /* sandbox: adres güncellenemedi, sorun değil */ }
    clearTimeout(this.renderTimer); this.pending = false;
    this.render();
    window.scrollTo(0, 0);
    if (this.view === 'aipanel' && !AdminGate.unlocked) setTimeout(() => AdminGate.prompt(), 60);
  },
  /** Adres çubuğundan veya geri tuşundan gelen değişiklikler */
  route() {
    if (!this.started) return;
    let v = 'dashboard';
    try { v = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('?')[0]; } catch (e) {}
    if (v === this.view && $('#tabBar')) return;
    this.view = this.allowed(v) ? v : 'dashboard';
    this.render();
  },
  /** Alt menü / yan menü butonlarına doğrudan tıklama dinleyicisi bağlar (her çizimden sonra) */
  bindNav() {
    $$('#tabBar [data-nav]').forEach(btn => btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      this.pressing = false;
      this.go(btn.dataset.nav);
    }));
  },
  /** Uzak değişiklik geldiğinde — kısa gecikmeyle toplu yeniden çizim */
  onRemote(col) {
    if (!this.started) return;
    if (col === 'messages' || col === '*') this.onMessages();
    if (col === 'messages') return;
    if (col === 'ai_logs') { if (this.view === 'aipanel' && AdminGate.unlocked) this.scheduleRender(); return; }   // sohbet mesajları sayfanın tamamını yeniden çizmez
    if (Auth.current && !DB.find('users', Auth.current)) { Auth.logout(); }
    this.scheduleRender();
  },
  scheduleRender() {
    clearTimeout(this.renderTimer);
    this.renderTimer = setTimeout(() => {
      // Modal açıkken veya parmak/mouse ekrana basılıyken yeniden çizme — aksi halde dokunulan buton değişir ve tıklama kaybolur
      if (Modal.el || this.pressing) { this.pending = true; return; }
      this.pending = false; this.render();
    }, 60);
  },
  updateNet() { const b = $('#netBadge'); if (b) b.outerHTML = netBadge(); },
  render() {
    if (!this.started) return;
    if (Net.error && Net.ready) { $('#root').innerHTML = Views.setup(Net.error); return; }
    const u = Auth.user();
    if (!u) { Theme.apply(Theme.defaults); $('#root').innerHTML = Views.login(); return; }
    if (!this.allowed(this.view)) this.view = 'dashboard';
    // Yazı yazarken gelen canlı güncellemeler odağı ve imleci bozmasın
    const ae = document.activeElement, y = window.scrollY;
    const cl = $('#chatList'), chatAtBottom = !cl || cl.scrollHeight - cl.scrollTop - cl.clientHeight < 80, chatTop = cl ? cl.scrollTop : 0;
    const keep = ae && ae.id && $('#root').contains(ae) && 'value' in ae ? { id: ae.id, value: ae.value, s: ae.selectionStart, e: ae.selectionEnd } : null;
    Theme.apply(u.prefs);
    $('#root').innerHTML = Views.shell();
    $('#main').innerHTML = (Views[this.view] || Views.dashboard)();
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) {
        if (!['checkbox', 'color', 'range', 'file'].includes(el.type) && el.value !== keep.value) { el.value = keep.value; if (el.dataset.setting || el.dataset.field) el.dataset.dirty = '1'; }
        el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {}
      }
    }
    if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
    const ncl = $('#chatList');
    if (ncl) { ncl.scrollTop = chatAtBottom ? ncl.scrollHeight : chatTop; const ci = $('#chatInput'); if (ci) Chat.autoGrow(ci); if (!document.hidden) Chat.markRead(); }
    this.bindNav();
    this.updateChatBadge();
    this.tick(true);
  },
  renderMain() { this.render(); },

  onClick(e) { const el = e.target.closest('[data-act]'); if (!el) return; const fn = Actions[el.dataset.act]; if (!fn) return; e.preventDefault(); fn(el, e); },
  async onChange(e) {
    const t = e.target;
    if (t.id === 'fileAvatar') { const f = t.files[0]; t.value = ''; if (!f) return; try { DB.update('users', Auth.current, { avatar: { type: 'image', value: await fileToAvatar(f) } }); toast('Profil fotoğrafı güncellendi', 'success'); this.render(); } catch (err) { toast(err.message, 'error'); } return; }
    if (t.id === 'fileImport') {
      const f = t.files[0]; t.value = ''; if (!f) return;
      try {
        const json = JSON.parse(await f.text()), d = json.data || json;
        if (!d.users || !d.settings) throw new Error('Geçersiz yedek dosyası.');
        const users = toMap(d.users);
        if (!await confirmBox('Yedekten yükle', `${Object.keys(users).length} üye ve ${Object.keys(toMap(d.sessions)).length} kayıt yüklenecek. Mevcut veriler HERKES için değiştirilecek.`, 'Yükle')) return;
        await DB.multi({ settings: { ...Seed.settings(), ...d.settings }, users, sessions: toMap(d.sessions), days: toMap(d.days), messages: toMap(d.messages), ai_logs: toMap(d.ai_logs) });
        if (!DB.find('users', Auth.current)) Auth.logout();
        toast('Yedek yüklendi', 'success'); this.render();
      } catch (err) { toast(err.message || 'Dosya okunamadı', 'error'); }
      return;
    }
    if (t.id === 'reportDate' && t.value) { this.report.date = T.fromKey(t.value); this.render(); return; }
    if (t.id === 'profileColorInput') { DB.update('users', Auth.current, { color: t.value }); this.render(); return; }
    if (t.dataset.field) {
      const f = t.dataset.field, v = t.value.trim(), a = Tracker.activity(t.dataset.aid);
      if ((f === 'name' || f === 'emoji') && !v) { t.value = a[f]; return; }
      if (f === 'kind' && a.work && !a.deep && v !== 'work' && Tracker.visibleActivities().filter(x => x.work && !x.deep).length < 2) { t.value = a.kind; return toast('En az bir normal çalışma aktivitesi kalmalı.', 'error'); }
      if (f === 'kind' && v === 'break' && a.work && Tracker.visibleActivities().filter(x => x.work).length < 2) { t.value = a.kind; return toast('En az bir çalışma aktivitesi kalmalı.', 'error'); }
      updateActivity(t.dataset.aid, { [f]: v });
      if (f === 'kind' || f === 'color') this.render();
      toast('Aktivite güncellendi', 'success'); return;
    }
    if (t.dataset.setting) {
      const k = t.dataset.setting; let v = t.value;
      const nums = { dailyGoal: [1, 16, 8], pomoFocus: [5, 120, 25], pomoBreak: [1, 60, 5], pomoLong: [5, 90, 15], pomoEvery: [2, 8, 4] };
      if (nums[k]) { v = clamp(parseFloat(String(v).replace(',', '.')) || nums[k][2], nums[k][0], nums[k][1]); t.value = v; }
      if (k === 'teamName') v = v.trim() || 'Ekibim';
      if (String(DB.get('settings')[k]) === String(v)) return;
      DB.patchSettings({ [k]: v }); toast('Ayar kaydedildi — tüm ekibe yansıdı', 'success');
      if (k === 'teamName') this.render(); return;
    }
    if (t.dataset.pref) updatePrefs({ [t.dataset.pref]: t.dataset.pref === 'texOpacity' ? +t.value : t.value });
  },
  onInput(e) {
    const t = e.target;
    if (t.id === 'pulseInput') savePulse(false);
    if (t.id === 'chatInput') { Chat.draft = t.value; Chat.autoGrow(t); }
    if (t.dataset.pref === 'texOpacity') { document.documentElement.style.setProperty('--tex-opacity', t.value); const v = $('#texVal'); if (v) v.textContent = '%' + Math.round(t.value * 100); }
  },

  /** Saniyelik canlı güncelleme: sayaçlar, geri sayımlar, pomodoro geçişleri */
  tick(force) {
    if (!this.started || !Auth.user()) return;
    const t = NOW(), sod = T.sod(t), eod = T.eod(t), memo = {}, goal = DB.get('settings').dailyGoal * HOUR;
    const sum = id => memo[id] || (memo[id] = Tracker.summary(id === '*' ? null : id, sod, eod));
    $$('[data-live]').forEach(el => {
      const id = el.dataset.uid;
      switch (el.dataset.live) {
        case 'clock': el.textContent = new Date(t).toLocaleTimeString('tr-TR'); break;
        case 'since': el.textContent = T.clock(t - +el.dataset.start); break;
        case 'sum': el.textContent = T.dur(sum(id)[el.dataset.field]); break;
        case 'teamwork': el.textContent = T.dur(sum('*').work); break;
        case 'act': el.textContent = T.dur(sum(id).byAct[el.dataset.aid] || 0); break;
        case 'bar': el.style.width = Math.min(100, sum(id).work / goal * 100).toFixed(1) + '%'; break;
        case 'countdown': el.textContent = T.mmss(+el.dataset.end - t); break;
        case 'ago': el.textContent = T.ago(+el.dataset.at); break;
        case 'pring': { const C = parseFloat(el.getAttribute('stroke-dasharray')), s = +el.dataset.start, en = +el.dataset.end, p = clamp((t - s) / (en - s), 0, 1); el.setAttribute('stroke-dashoffset', (C * (1 - p)).toFixed(1)); el.style.opacity = p > .002 ? 1 : 0; break; }
      }
    });
    if (force) return;
    Pomo.check();
    const minute = Math.floor(t / MIN); if (minute === this.lastMinute) return; this.lastMinute = minute;
    if (T.key(t) !== this.dayKey) { this.dayKey = T.key(t); Tracker.autoClose(); this.scheduleRender(); return; }
    $$('[data-live="timeline"]').forEach(el => { el.innerHTML = Charts.timeline(el.dataset.uid, +el.dataset.day, el.dataset.compact === '1'); });
    if (this.view === 'reports' && !Modal.el) { const r = this.report, from = r.mode === 'daily' ? T.sod(r.date) : T.sow(r.date), to = r.mode === 'daily' ? T.eod(r.date) : T.addDays(from, 7); if (t >= from && t < to) this.scheduleRender(); }
  }
};

App.init();
</script>
