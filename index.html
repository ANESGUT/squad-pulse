<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141c">
<title>Squad Pulse</title>
<style>
:root{
  --bg:#11141c;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.075);
  --stroke:rgba(255,255,255,.09);
  --text:#e8eaf2;
  --muted:#8e94a8;
  --ink:#141824;
  --blue:#9ec5f2; --green:#a9dcc1; --lav:#c7b9ee; --yellow:#f1dc9d; --coral:#f2a999; --pink:#f4b8cf;
  --work:var(--blue); --game:var(--green); --movie:var(--lav); --break:var(--yellow);
  --radius:26px;
  --shadow:0 10px 30px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
input,select{font-family:inherit;color:inherit}

.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(160deg,#131826,#10131b 55%,#14171f)}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.3;animation:float 26s ease-in-out infinite}
.b1{width:440px;height:440px;background:#3a4c7c;top:-140px;left:-120px}
.b2{width:400px;height:400px;background:#5d4a70;top:35%;right:-160px;animation-delay:-9s}
.b3{width:440px;height:440px;background:#35645f;bottom:-180px;left:15%;animation-delay:-16s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
body.locked .wrap{display:none}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--blue),var(--lav));color:var(--ink);box-shadow:var(--shadow);flex-shrink:0}
.brand h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.03em;margin-top:2px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.clock{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.clock b{font-size:16px;font-weight:600}
.clock span{font-size:11.5px;color:var(--muted)}
.sess{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sess .me{font-size:13px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{padding:7px 12px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--stroke);transition:.2s;white-space:nowrap}
.sb:hover{border-color:var(--blue)}
.sb.out:hover{background:rgba(242,169,153,.22);border-color:var(--coral)}

.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%);border-radius:var(--radius);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(14,17,26,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:auto}
body.locked .login{display:flex}
.lcard{width:100%;max-width:400px;padding:28px 22px 24px;text-align:center;animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.lcard .logo{margin:0 auto 14px;width:54px;height:54px;font-size:26px;border-radius:18px}
.lcard h2{margin:0 0 4px;letter-spacing:.16em;font-size:20px}
.lcard p.hint{margin:0 0 20px;color:var(--muted);font-size:13.5px}
.lusers{display:flex;flex-direction:column;gap:10px}
.lu{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;background:var(--glass-2);border:1px solid var(--stroke);text-align:left;transition:.25s}
.lu:hover{border-color:var(--blue);transform:translateY(-2px)}
.lav{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.06);border:2px solid var(--stroke);flex-shrink:0}
.lu .lt{flex:1;display:flex;flex-direction:column;min-width:0}
.lu b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu small{color:var(--muted);font-size:12px;margin-top:2px}
.chev{color:var(--muted);font-size:24px}
.pinuser{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;font-size:18px;font-weight:700}
.pinuser .lav{width:46px;height:46px;font-size:25px}
.dots{display:flex;justify-content:center;gap:14px;margin:4px 0 10px}
.dots span{width:15px;height:15px;border-radius:50%;border:2px solid #6a7089;transition:.2s}
.dots span.f{background:var(--blue);border-color:var(--blue);transform:scale(1.1)}
.dots.ok span{background:var(--green);border-color:var(--green)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.perr{min-height:20px;font-size:12.5px;color:var(--coral);margin-bottom:12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:290px;margin:0 auto}
.key{height:60px;border-radius:20px;font-size:22px;font-weight:600;background:var(--glass-2);border:1px solid var(--stroke);transition:.15s}
.key:hover{border-color:rgba(158,197,242,.5)}
.key:active{transform:scale(.92);background:rgba(158,197,242,.2)}
.key.ghost{font-size:14px;color:var(--muted);font-weight:600}
[hidden]{display:none!important}

/* ---------- planner ---------- */
.planner{padding:18px;margin-bottom:20px}
.tabs{display:flex;gap:6px;padding:5px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid var(--stroke);margin-bottom:14px}
.tabs button{flex:1;padding:11px 8px;border-radius:13px;font-size:13.5px;font-weight:600;color:var(--muted);transition:.25s;display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button em{font-style:normal;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08)}
.tabs button.on{background:rgba(158,197,242,.16);color:var(--text);box-shadow:inset 0 0 0 1px rgba(158,197,242,.35)}
.add-form{display:grid;gap:10px;grid-template-columns:1fr}
.add-form input[type=text],.add-form select{width:100%;padding:13px 14px;border-radius:15px;border:1px solid var(--stroke);background:rgba(0,0,0,.22);outline:none;font-size:14.5px;transition:.25s}
.add-form select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.add-form option{background:#1a1f2d;color:var(--text)}
.add-form input:focus,.add-form select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(158,197,242,.14)}
.fld{display:flex;flex-direction:column;gap:5px}
.fld span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-left:4px}
.row2{display:grid;gap:10px;grid-template-columns:1fr}
.btn-add{padding:13px 22px;border-radius:15px;font-weight:700;font-size:14px;color:var(--ink);background:linear-gradient(135deg,var(--blue),#b7d4f5);box-shadow:var(--shadow);transition:.2s;white-space:nowrap}
.btn-add:active{transform:scale(.96)}
.btn-add:hover{filter:brightness(1.06)}
@media(min-width:760px){
  .add-form{grid-template-columns:1fr auto;align-items:end}
  .add-form .full{grid-column:1/-1}
  .row2{grid-template-columns:1fr 1fr}
}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 10px 10px 14px;border-radius:16px;font-size:14px;background:var(--glass-2);border:1px solid var(--stroke);animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
.chip .txt{flex:1;min-width:140px}
.badge{font-size:11.5px;padding:4px 10px;border-radius:99px;background:rgba(158,197,242,.14);color:var(--blue);border:1px solid rgba(158,197,242,.25);white-space:nowrap}
.badge.all{background:rgba(169,220,193,.13);color:var(--green);border-color:rgba(169,220,193,.25)}
.badge.day{background:rgba(199,185,238,.13);color:var(--lav);border-color:rgba(199,185,238,.25)}
.chip .x{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted);background:rgba(255,255,255,.06);transition:.2s}
.chip .x:hover{background:var(--coral);color:var(--ink)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1120px){.cards{grid-template-columns:repeat(3,1fr)}}

.card{--accent:#6f7690;--c1:#bfe4f6;--c2:#9fd0ee;position:relative;padding:18px;display:flex;flex-direction:column;gap:14px;transition:border-color .5s,box-shadow .5s;animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.card.s-work{--accent:var(--work)}.card.s-game{--accent:var(--game)}.card.s-movie{--accent:var(--movie)}.card.s-break{--accent:var(--break)}
.card.has-status{border-color:color-mix(in srgb,var(--accent) 42%,transparent)}
.card.own{box-shadow:var(--shadow),0 0 0 1px rgba(158,197,242,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.5s;background:radial-gradient(110% 55% at 50% 0%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 65%)}
.card.has-status::after{opacity:1}
.card.winner{border-color:rgba(242,169,153,.55);animation:winPulse 3s ease-in-out infinite}
@keyframes winPulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 0 4px rgba(242,169,153,.12)}}
.card>*{position:relative;z-index:1}

.top{display:flex;align-items:center;gap:13px}
.avatar{width:60px;height:60px;border-radius:19px;font-size:31px;display:grid;place-items:center;flex-shrink:0;position:relative;background:var(--glass-2);border:2px solid color-mix(in srgb,var(--c1) 65%,transparent);transition:.25s}
button.avatar:hover{transform:rotate(-5deg) scale(1.05)}
.avatar .edit{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;font-size:10.5px;display:grid;place-items:center;background:#1c2130;border:1px solid var(--stroke)}
.who{min-width:0;flex:1}
.name{width:100%;font-size:18.5px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed transparent;outline:none;padding:2px 0;transition:.2s;text-overflow:ellipsis}
.card.own .name:hover{border-bottom-color:var(--stroke)}
.card.own .name:focus{border-bottom-color:var(--c1)}
.name[readonly]{cursor:default;pointer-events:none}
.state-label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.me-tag{font-size:10px;font-weight:800;letter-spacing:.1em;padding:2px 8px;border-radius:99px;background:rgba(158,197,242,.18);color:var(--blue)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.card.has-status .dot{animation:blink 2s infinite}
@keyframes blink{50%{opacity:.4}}
.gear{width:42px;height:42px;border-radius:14px;font-size:19px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--stroke);transition:.25s;flex-shrink:0}
.gear:hover{transform:rotate(18deg);border-color:var(--c1)}

.timer-box{text-align:center;padding:13px 10px;border-radius:20px;background:rgba(0,0,0,.22);border:1px solid var(--stroke)}
.timer{font-size:37px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.1;color:color-mix(in srgb,var(--accent) 55%,#fff)}
.timer.idle{color:var(--muted);font-size:30px;font-weight:600}
.timer-sub{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.07em}
.totals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.tot{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-variant-numeric:tabular-nums}

.status-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sbtn{--k:#fff;padding:11px 8px;border-radius:15px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--glass-2);border:1px solid var(--stroke);transition:.25s}
.sbtn[data-s=work]{--k:var(--work)}.sbtn[data-s=game]{--k:var(--game)}.sbtn[data-s=movie]{--k:var(--movie)}.sbtn[data-s=break]{--k:var(--break)}
.sbtn:hover{border-color:color-mix(in srgb,var(--k) 60%,transparent)}
.sbtn:active{transform:scale(.95)}
.sbtn.on{background:color-mix(in srgb,var(--k) 22%,transparent);border-color:color-mix(in srgb,var(--k) 65%,transparent);color:#fff}

.invite-btn{width:100%;padding:12px;border-radius:16px;font-size:14px;font-weight:700;color:var(--green);background:rgba(169,220,193,.1);border:1px dashed rgba(169,220,193,.4);transition:.25s}
.invite-btn:hover{background:rgba(169,220,193,.18);transform:translateY(-1px)}
.invite-btn:active{transform:scale(.97)}

.note{width:100%;padding:12px 14px;border-radius:15px;border:1px solid var(--stroke);background:rgba(0,0,0,.2);outline:none;font-size:14px;transition:.25s}
.note:focus{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 16%,transparent)}
.note::placeholder{color:#6a7089}
.note-view{padding:12px 14px;border-radius:15px;background:rgba(0,0,0,.16);border:1px dashed var(--stroke);font-size:14px;color:var(--text);word-break:break-word}
.note-view.none{color:var(--muted);font-style:italic}

.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--stroke);margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);transition:.25s}
.seg button small{opacity:.8;margin-left:3px}
.seg button.on{background:color-mix(in srgb,var(--c1) 20%,transparent);color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 40%,transparent)}
.section-title{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pct{font-weight:700;font-size:14px;color:var(--c1);letter-spacing:0}
.progress{height:14px;border-radius:99px;background:rgba(0,0,0,.32);border:1px solid var(--stroke);overflow:hidden;margin-bottom:12px}
.fill{height:100%;width:0;border-radius:99px;position:relative;overflow:hidden;transition:width .9s cubic-bezier(.2,.9,.3,1);background:linear-gradient(90deg,var(--c1),var(--c2))}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);background-size:220% 100%;animation:shine 3s linear infinite}
@keyframes shine{from{background-position:220% 0}to{background-position:-220% 0}}
.todo-list{display:flex;flex-direction:column;gap:6px}
.todo{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.035);text-align:left;width:100%;transition:.25s;font-size:14px}
button.todo:hover{background:rgba(255,255,255,.07)}
.todo.ro{opacity:.9}
.box{width:22px;height:22px;border-radius:7px;border:2px solid #6a7089;flex-shrink:0;display:grid;place-items:center;font-size:13px;color:transparent;transition:.25s}
.todo.done .box{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;color:var(--ink);font-weight:900;animation:pop .35s}
.todo .t{flex:1}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.dtag{font-style:normal;font-size:10.5px;padding:3px 8px;border-radius:99px;background:rgba(199,185,238,.13);color:var(--lav);white-space:nowrap}
.dtag.today{background:rgba(242,169,153,.18);color:var(--coral)}
.dtag.me{background:rgba(158,197,242,.14);color:var(--blue)}
.no-todo{font-size:13px;color:var(--muted);padding:8px 4px}

.pay{text-align:center;font-weight:800;font-size:18px;letter-spacing:.04em;padding:14px 10px;border-radius:18px;color:#3a1f1a;background:linear-gradient(120deg,#f6c9a8,#f2a999,#f4b8cf,#f6c9a8);background-size:300% 100%;animation:payBg 6s linear infinite,payPulse 2.4s ease-in-out infinite;box-shadow:0 8px 24px rgba(242,169,153,.22)}
@keyframes payBg{to{background-position:300% 0}}
@keyframes payPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}

.reactions{display:flex;gap:8px}
.rx{flex:1;padding:9px 4px;border-radius:14px;background:var(--glass-2);border:1px solid var(--stroke);font-size:18px;display:flex;align-items:center;justify-content:center;gap:5px;transition:.2s}
.rx small{font-size:12px;color:var(--muted);font-weight:700;min-width:8px}
.rx:not(:disabled):hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.rx:not(:disabled):active{transform:scale(.9)}
.rx:disabled{opacity:.6}
.rx.has small{color:var(--text)}

.leave-btn{width:100%;padding:17px;border-radius:20px;font-size:17px;font-weight:800;letter-spacing:.03em;color:var(--ink);background:linear-gradient(135deg,#a9dcc1,#9ec5f2);box-shadow:var(--shadow);transition:.25s;position:relative;overflow:hidden}
.leave-btn::before{content:"";position:absolute;top:0;left:-120%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sweep 5s infinite}
@keyframes sweep{to{left:170%}}
.leave-btn:active{transform:scale(.97)}
.leave-btn.end{background:linear-gradient(135deg,#f4b8cf,#f2a999)}
.ro-hint{text-align:center;font-size:12px;color:var(--muted);padding:10px;border-radius:14px;border:1px dashed var(--stroke);background:rgba(0,0,0,.12)}

.card.leave{border-color:rgba(169,220,193,.4)}
.leave-panel{text-align:center;padding:20px 12px;border-radius:22px;background:linear-gradient(160deg,rgba(169,220,193,.12),rgba(158,197,242,.1));border:1px solid rgba(169,220,193,.28)}
.leave-panel .palm{font-size:44px;display:inline-block;animation:sway 3.5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.leave-panel h3{margin:6px 0 2px;font-size:14px;letter-spacing:.07em;color:var(--green)}
.leave-panel .lt2{font-size:33px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 10px}
.leave-panel .lbar{height:7px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.leave-panel .lbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--blue));transition:width 1s linear}
.leave-panel p{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.card.leave .todo-wrap{opacity:.55}
.card.leave.own .todo-wrap{pointer-events:none}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(8,10,16,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex;animation:fade .25s}
.overlay.center{align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:460px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));background:rgba(26,31,45,.94);animation:slide .35s cubic-bezier(.2,.9,.3,1);border-radius:28px 28px 0 0;max-height:92vh;overflow:auto}
.overlay.center .sheet{border-radius:28px}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:28px}}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{padding:16px 10px;border-radius:18px;background:var(--glass-2);border:1px solid var(--stroke);font-weight:700;font-size:15px;transition:.2s}
.opt:hover{border-color:var(--green);transform:translateY(-2px)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:3px}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.av{aspect-ratio:1;border-radius:16px;font-size:26px;background:var(--glass-2);border:1px solid var(--stroke);transition:.2s}
.av:hover{transform:scale(1.1);border-color:var(--blue)}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw{padding:12px;border-radius:18px;background:var(--glass-2);border:2px solid var(--stroke);text-align:left;transition:.2s}
.sw:hover{transform:translateY(-2px)}
.sw.on{border-color:#fff}
.sw .bar{height:12px;border-radius:99px;margin-bottom:9px}
.sw b{font-size:13.5px;display:flex;justify-content:space-between}
.cancel{margin-top:14px;width:100%;padding:13px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-weight:600;color:var(--muted)}
.cancel:hover{color:var(--text)}
.pinfields{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.pinfields input{width:100%;padding:14px;border-radius:15px;border:1px solid var(--stroke);background:rgba(0,0,0,.22);outline:none;font-size:18px;letter-spacing:.5em;text-align:center;transition:.25s}
.pinfields input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(158,197,242,.14)}
.pinfields input::placeholder{letter-spacing:.02em;font-size:13px;color:#6a7089}
.perr2{min-height:18px;font-size:12.5px;color:var(--coral);margin-bottom:10px}

.inv{text-align:center}
.inv .ico{font-size:50px;display:inline-block;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.inv h3{margin:6px 0 10px;letter-spacing:.06em;color:var(--green);font-size:14px;text-transform:uppercase}
.inv .msg{font-size:19px;line-height:1.4;margin:0 0 18px}
.inv .msg b{color:var(--blue)}
.replies{display:flex;flex-direction:column;gap:8px;text-align:left}
.rep{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--glass-2);border:1px solid var(--stroke)}
.rep .n{flex:1;font-weight:600;font-size:14px}
.rep button{padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--stroke);transition:.2s}
.rep button.y:hover{background:rgba(169,220,193,.25)}
.rep button.n2:hover{background:rgba(242,169,153,.25)}
.rep .res{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px}
.res.yes{background:rgba(169,220,193,.18);color:var(--green)}
.res.no{background:rgba(242,169,153,.16);color:var(--coral)}
.res.wait{background:rgba(255,255,255,.06);color:var(--muted);font-weight:600}

footer{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.reset{padding:11px 18px;border-radius:99px;font-size:12.5px;color:var(--muted);background:var(--glass);border:1px solid var(--stroke);transition:.2s}
.reset:hover{color:var(--text);border-color:var(--coral)}

#confetti{position:fixed;inset:0;z-index:120;pointer-events:none}
.float-emoji{position:fixed;z-index:130;pointer-events:none;font-size:28px;animation:fup 1.1s ease-out forwards}
@keyframes fup{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-120px) scale(1.4);opacity:0}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:135;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;max-width:92vw;text-align:center;background:rgba(26,31,45,.95);border:1px solid rgba(242,169,153,.5);box-shadow:var(--shadow);animation:toast 3.4s forwards}
.toast.info{border-color:rgba(158,197,242,.5)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-16px)}10%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px)}}
</style>
</head>
<body class="locked">
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="confetti"></canvas>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="lcard glass">
    <div class="logo">⚡</div>
    <h2>SQUAD PULSE</h2>
    <div id="stepUsers">
      <p class="hint">Kim giriş yapıyor? İsmini seç.</p>
      <div class="lusers" id="loginUsers"></div>
    </div>
    <div id="stepPin" hidden>
      <div class="pinuser" id="pinUser"></div>
      <p class="hint" style="margin-bottom:12px">4 haneli PIN'ini gir</p>
      <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
      <div class="perr" id="perr"></div>
      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
        <button class="key ghost" data-k="back">‹ Geri</button><button class="key" data-k="0">0</button><button class="key ghost" data-k="del">⌫</button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">⚡</div>
      <div><h1>SQUAD PULSE</h1><small>Anlık durum · verimlilik · görevler</small></div>
    </div>
    <div class="hright">
      <div class="sess" id="sess"></div>
      <div class="clock"><b id="clock">--:--</b><span id="date"></span></div>
    </div>
  </header>

  <section class="glass planner">
    <div class="tabs" id="tabs">
      <button data-tab="day" class="on">📋 Günün Görevleri <em id="cntDay">0</em></button>
      <button data-tab="week">🗓️ Haftalık Plan <em id="cntWeek">0</em></button>
    </div>
    <form class="add-form" id="taskForm" autocomplete="off">
      <div class="fld full"><span>Görev</span><input id="taskInput" type="text" maxlength="80" placeholder="Yeni görev yaz… (örn. Sunumu bitir)"></div>
      <div class="row2">
        <label class="fld"><span>Kime ata?</span><select id="assignSel"></select></label>
        <label class="fld" id="dayFld" style="display:none"><span>Hangi gün?</span><select id="daySel"></select></label>
      </div>
      <button class="btn-add" type="submit">＋ Ekle</button>
    </form>
    <div class="chips" id="chips"></div>
  </section>

  <main class="cards" id="cards"></main>

  <footer>
    <button class="reset" id="resetDay">↺ Günümü sıfırla</button>
    <button class="reset" id="resetWeek">↺ Haftamı sıfırla</button>
  </footer>
</div>

<div class="overlay" id="overlay"><div class="sheet glass" id="sheet"></div></div>

<script>
(() => {
'use strict';
const STORE = 'squad-pulse-v2';
const SESS  = 'squad-pulse-session';
const DEFAULT_PINS = ['1234','5678','9012'];
const STATUS = {
  work:  {emoji:'💻', label:'Çalışıyor'},
  game:  {emoji:'🎮', label:'Oyun'},
  movie: {emoji:'🎬', label:'Film/Dizi'},
  break: {emoji:'☕', label:'Mola'}
};
const THEMES = {
  pink:    {c:['#f4b8cf','#e9a3c0'], n:'Pastel Pembe'},
  mint:    {c:['#aee3cd','#8fd3b8'], n:'Soft Mint Yeşili'},
  yellow:  {c:['#f3e2a2','#ebd085'], n:'Pastel Sarı'},
  ice:     {c:['#c2e5f6','#9fd0ee'], n:'Buz Mavisi'},
  lavender:{c:['#d0c4f1','#b7a8e6'], n:'Lavanta'},
  coral:   {c:['#f6b6a6','#ee9c8b'], n:'Soft Mercan'}
};
const REACTS = {fire:'🔥', clap:'👏', coffee:'☕', clown:'🤡'};
const AVATARS = ['😎','🤓','🦊','🐱','🐼','🦁','🐸','🐙','🦄','🐲','👽','🤖','👻','🥷','🧙','🧛','🐵','🐯','🦉','🐺','🦖','🐧','🍕','🚀'];
const GAMES = [
  {k:'lol', e:'⚔️', l:'LoL', s:'Rift\'e girelim', phrase:'1 el LoL oynamaya'},
  {k:'fc',  e:'⚽', l:'FC24', s:'Maç yapalım', phrase:'1 el FC24 oynamaya'},
  {k:'any', e:'🎲', l:'Bir oyun', s:'Sen seç, ben varım', phrase:'1 el oyun oynamaya'}
];
const LEAVE_OPTS = [
  {l:'1 saat', ms:3600e3, s:'Kısa bir kaçamak'},
  {l:'3 saat', ms:3*3600e3, s:'Öğleden sonra'},
  {l:'Bugünlük', ms:'today', s:'Gece 00:00\'a kadar'},
  {l:'2 gün', ms:2*864e5, s:'Mini tatil'},
  {l:'1 hafta', ms:7*864e5, s:'Tam tatil modu'},
  {l:'Süresiz', ms:'inf', s:'Elle bitirene kadar'}
];
const DAY_LONG  = ['Hafta geneli','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DAY_SHORT = ['Hafta geneli','Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const todayIdx = () => ((new Date().getDay() + 6) % 7) + 1;

const emptyTotals = () => ({work:0,game:0,movie:0,break:0});
const emptyReacts = () => ({fire:0,clap:0,coffee:0,clown:0});
const defaultState = () => ({
  tab:'day', tasks:[], invite:null,
  users:[
    {id:'u1', name:'Kullanıcı 1', avatar:'😎', theme:'ice'},
    {id:'u2', name:'Kullanıcı 2', avatar:'🦊', theme:'pink'},
    {id:'u3', name:'Kullanıcı 3', avatar:'🐼', theme:'mint'}
  ].map((u,i) => ({...u, pin:DEFAULT_PINS[i], status:null, since:0, note:'', leave:null, done:{}, totals:emptyTotals(), reactions:emptyReacts(), celebrated:{day:false,week:false}}))
});

let state;
try { state = JSON.parse(localStorage.getItem(STORE)) || defaultState(); } catch(e){ state = defaultState(); }
if (!state.users || state.users.length !== 3) state = defaultState();
state.users.forEach((u,i) => { if (!/^\d{4}$/.test(u.pin||'')) u.pin = DEFAULT_PINS[i]; if (!u.celebrated) u.celebrated = {day:false,week:false}; delete u.view; });
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} };

/* session: per tab, so closing the tab logs out */
let me = null;
try { me = sessionStorage.getItem(SESS); } catch(e){}
const views = {};   // per-viewer UI choice (Gün/Hafta) – not shared

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmt = ms => { ms = Math.max(0, Math.floor(ms/1000)); const h=Math.floor(ms/3600), m=Math.floor(ms%3600/60), s=ms%60; return `${pad(h)}:${pad(m)}:${pad(s)}`; };
const fmtLeave = ms => { ms = Math.max(0, Math.floor(ms/1000)); const d=Math.floor(ms/86400), r=ms%86400; const h=Math.floor(r/3600), m=Math.floor(r%3600/60), s=r%60; return (d?`${d}g `:'') + `${pad(h)}:${pad(m)}:${pad(s)}`; };
const short = ms => { const m = Math.floor(ms/60000); return m >= 60 ? `${Math.floor(m/60)}s ${m%60}dk` : `${m}dk`; };
const getU = id => state.users.find(u => u.id === id);

function toast(text, info){
  const t = document.createElement('div');
  t.className = 'toast' + (info ? ' info' : ''); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

/* ---------- tasks logic ---------- */
function visibleTasks(u, scope){
  const list = state.tasks.filter(t => t.scope === scope && (t.assignee === 'all' || t.assignee === u.id));
  return scope === 'week' ? list.slice().sort((a,b) => a.day - b.day) : list;
}
function prog(u, scope){
  const list = visibleTasks(u, scope);
  if (!list.length) return {pct:0, done:0, total:0};
  const d = list.filter(t => u.done[t.id]).length;
  return {pct:Math.round(d/list.length*100), done:d, total:list.length};
}
function syncCelebrate(){
  state.users.forEach(u => {
    ['day','week'].forEach(sc => {
      const p = prog(u, sc);
      if (p.total > 0 && p.pct === 100){
        if (!u.celebrated[sc]){ u.celebrated[sc] = true; celebrate(u, sc); }
      } else u.celebrated[sc] = false;
    });
  });
}

/* ---------- status / leave ---------- */
function finalizeStatus(u){ if (u.status) u.totals[u.status] = (u.totals[u.status]||0) + (Date.now() - u.since); }
function setStatus(u, s){
  finalizeStatus(u);
  if (u.status === s){ u.status = null; u.since = 0; } else { u.status = s; u.since = Date.now(); }
}
function startLeave(u, opt){
  finalizeStatus(u); u.status = null; u.since = 0;
  const now = Date.now(); let until;
  if (opt.ms === 'today'){ const d = new Date(); d.setHours(23,59,59,999); until = d.getTime(); }
  else if (opt.ms === 'inf') until = null;
  else until = now + opt.ms;
  u.leave = {start:now, until, label:opt.l};
}

/* ---------- planner panel ---------- */
function renderPanel(){
  const tab = state.tab || 'day';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#cntDay').textContent = state.tasks.filter(t => t.scope === 'day').length;
  $('#cntWeek').textContent = state.tasks.filter(t => t.scope === 'week').length;
  $('#dayFld').style.display = tab === 'week' ? '' : 'none';
  $('#taskInput').placeholder = tab === 'week' ? 'Haftalık plana ekle… (örn. Cuma demosu hazırla)' : 'Bugünün görevini yaz… (örn. Sunumu bitir)';
  renderAssign(); renderChips();
}
function renderAssign(){
  const sel = $('#assignSel'); const cur = sel.value || 'all';
  sel.innerHTML = `<option value="all">👥 Herkes (Genel görev)</option>` + state.users.map(u => `<option value="${u.id}">${esc(u.avatar)} ${esc(u.name)}</option>`).join('');
  sel.value = (cur === 'all' || getU(cur)) ? cur : 'all';
  const ds = $('#daySel');
  if (!ds.options.length){ ds.innerHTML = DAY_LONG.map((d,i) => `<option value="${i}">${d}</option>`).join(''); ds.value = '0'; }
}
function renderChips(){
  const tab = state.tab || 'day';
  let list = state.tasks.filter(t => t.scope === tab);
  if (tab === 'week') list = list.slice().sort((a,b) => a.day - b.day);
  $('#chips').innerHTML = list.length ? list.map(t => {
    const au = t.assignee === 'all' ? null : getU(t.assignee);
    const who = au ? `<span class="badge">${esc(au.avatar)} ${esc(au.name)}</span>` : `<span class="badge all">👥 Genel</span>`;
    const day = tab === 'week' ? `<span class="badge day">🗓️ ${DAY_SHORT[t.day]}</span>` : '';
    return `<div class="chip"><span class="txt">${esc(t.text)}</span>${who}${day}<button class="x" data-del="${t.id}" aria-label="Sil">✕</button></div>`;
  }).join('') : `<div class="empty">${tab === 'week' ? 'Haftalık plan boş. Gün seçip görev ekleyebilirsin 🗓️' : 'Bugün için görev yok. Yukarıdan ekle, kartlarda belirsin ✨'}</div>`;
}

/* ---------- cards ---------- */
function cardHTML(u){
  const own = u.id === me;
  const th = THEMES[u.theme] || THEMES.ice;
  const view = views[u.id] || 'day';
  const list = visibleTasks(u, view);
  const p = prog(u, view), pd = prog(u, 'day'), pw = prog(u, 'week');
  const onLeave = !!u.leave;
  const showPay = p.total > 0 && p.pct === 100;
  const cls = ['card','glass', own ? 'own' : 'ro', u.status && !onLeave ? `has-status s-${u.status}` : '', onLeave ? 'leave' : '', showPay ? 'winner' : ''].join(' ');
  const stateLabel = onLeave ? 'İzinde 🌴' : (u.status ? `${STATUS[u.status].emoji} ${STATUS[u.status].label}` : 'Durum seçilmedi');

  const tk = Object.keys(STATUS).filter(k => (u.totals[k]||0) > 0 || u.status === k);
  const totalsHTML = tk.length ? `<div class="totals">${tk.map(k => `<span class="tot">${STATUS[k].emoji} <span data-tot="${k}" data-base="${u.totals[k]||0}" ${u.status===k?`data-since="${u.since}"`:''}>0dk</span></span>`).join('')}</div>` : '';
  const timerHTML = u.status
    ? `<div class="timer" data-since="${u.since}">00:00:00</div><div class="timer-sub">${STATUS[u.status].emoji} ${STATUS[u.status].label.toUpperCase()} · CANLI SAYAÇ</div>`
    : `<div class="timer idle">--:--:--</div><div class="timer-sub">${own ? 'BİR DURUM SEÇ, SAYAÇ BAŞLASIN' : 'ŞU AN DURUM SEÇİLMEDİ'}</div>`;

  let statusBlock;
  if (onLeave){
    statusBlock = `
    <div class="leave-panel">
      <div class="palm">🌴</div>
      <h3>İZİNLİ · ${esc(u.leave.label.toUpperCase())}</h3>
      ${u.leave.until
        ? `<div class="lt2" data-leave-until="${u.leave.until}" data-leave-start="${u.leave.start}">--:--:--</div>
           <div class="lbar"><i data-leave-bar style="width:100%"></i></div>
           <p>Kalan süre · bitince kart otomatik uyanır</p>`
        : `<div class="lt2">∞</div><p>Süresiz izin${own ? ' · "İzni Bitir" ile dön' : ''}</p>`}
    </div>`;
  } else if (own){
    statusBlock = `
    <div class="timer-box">${timerHTML}${totalsHTML}</div>
    <div class="status-row">
      ${Object.entries(STATUS).map(([k,v]) => `<button class="sbtn ${u.status===k?'on':''}" data-act="status" data-s="${k}" data-id="${u.id}">${v.emoji} ${v.label}</button>`).join('')}
    </div>
    <button class="invite-btn" data-act="invite" data-id="${u.id}">🎮 Mini Oyuna Davet Et</button>
    <input class="note" data-act="note" data-id="${u.id}" maxlength="90" placeholder="Şu an ne yapıyor?" value="${esc(u.note)}">`;
  } else {
    statusBlock = `
    <div class="timer-box">${timerHTML}${totalsHTML}</div>
    ${u.note ? `<div class="note-view">💬 ${esc(u.note)}</div>` : `<div class="note-view none">💬 Not yok</div>`}`;
  }

  const tdy = todayIdx();
  const todos = list.length
    ? `<div class="todo-list">${list.map(t => {
        const tag = view === 'week' ? `<em class="dtag ${t.day===tdy?'today':''}">${t.day===tdy?'Bugün · ':''}${DAY_SHORT[t.day]}</em>` : (t.assignee === u.id ? `<em class="dtag me">Kişisel</em>` : '');
        const inner = `<span class="box">✓</span><span class="t">${esc(t.text)}</span>${tag}`;
        return own
          ? `<button class="todo ${u.done[t.id]?'done':''}" data-act="toggle" data-id="${u.id}" data-t="${t.id}">${inner}</button>`
          : `<div class="todo ro ${u.done[t.id]?'done':''}">${inner}</div>`;
      }).join('')}</div>`
    : `<div class="no-todo">${view === 'week' ? 'Haftalık planda atanmış görev yok.' : 'Bugün için atanmış görev yok.'}</div>`;

  return `
  <article class="${cls}" data-uid="${u.id}" style="--c1:${th.c[0]};--c2:${th.c[1]}">
    <div class="top">
      ${own
        ? `<button class="avatar" data-act="avatar" data-id="${u.id}" aria-label="Avatar seç">${u.avatar}<span class="edit">✎</span></button>`
        : `<div class="avatar">${u.avatar}</div>`}
      <div class="who">
        <input class="name" data-act="name" data-id="${u.id}" maxlength="18" value="${esc(u.name)}" aria-label="İsim" ${own ? '' : 'readonly tabindex="-1"'}>
        <div class="state-label">${own ? '<span class="me-tag">SEN</span>' : ''}<span class="dot"></span>${stateLabel}</div>
      </div>
      ${own ? `<button class="gear" data-act="color" data-id="${u.id}" title="İlerleme barı rengi" aria-label="İlerleme barı rengini seç">🎨</button>` : ''}
    </div>

    ${statusBlock}

    <div class="todo-wrap">
      <div class="seg">
        <button class="${view==='day'?'on':''}" data-act="view" data-v="day" data-id="${u.id}">Günün Görevleri<small>${pd.done}/${pd.total}</small></button>
        <button class="${view==='week'?'on':''}" data-act="view" data-v="week" data-id="${u.id}">Haftalık Plan<small>${pw.done}/${pw.total}</small></button>
      </div>
      <div class="section-title"><span>${view==='day'?'Bugün':'Bu hafta'} · ${p.done}/${p.total}</span><span class="pct">${p.pct}%</span></div>
      <div class="progress"><div class="fill" style="width:${p.pct}%"></div></div>
      ${todos}
    </div>

    ${showPay ? `<div class="pay">🍕 HESAPLAR SENDE!</div>` : ''}

    <div class="reactions">
      ${Object.entries(REACTS).map(([k,e]) => `<button class="rx ${u.reactions[k]?'has':''}" data-act="react" data-id="${u.id}" data-r="${k}" ${own ? 'disabled title="Kendi kartına tepki veremezsin"' : ''}>${e}<small>${u.reactions[k]||''}</small></button>`).join('')}
    </div>

    ${own
      ? (onLeave
          ? `<button class="leave-btn end" data-act="endleave" data-id="${u.id}">↩ İzni Bitir</button>`
          : `<button class="leave-btn" data-act="leave" data-id="${u.id}">🌴 İzinliyim</button>`)
      : `<div class="ro-hint">👀 Canlı izleme · bu kartı yalnızca ${esc(u.name)} güncelleyebilir</div>`}
  </article>`;
}

function renderSess(){
  const u = getU(me); if (!u){ $('#sess').innerHTML = ''; return; }
  $('#sess').innerHTML = `<span class="me">${esc(u.avatar)} ${esc(u.name)}</span>
    <button class="sb" data-sess="pin" title="PIN değiştir">🔑</button>
    <button class="sb out" data-sess="out" title="Çıkış yap / kullanıcı değiştir">Çıkış Yap</button>`;
}
function render(){
  renderPanel(); renderSess();
  const ordered = state.users.slice().sort((a,b) => (b.id === me) - (a.id === me));
  $('#cards').innerHTML = ordered.map(cardHTML).join('');
  tick();
}

/* ---------- live ticking ---------- */
function tick(){
  const now = Date.now(), d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $('#date').textContent = d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
  let expired = false;
  state.users.forEach(u => { if (u.leave && u.leave.until && now >= u.leave.until){ u.leave = null; expired = true; } });
  if (expired){ save(); render(); return; }
  document.querySelectorAll('.timer[data-since]').forEach(el => el.textContent = fmt(now - +el.dataset.since));
  document.querySelectorAll('[data-tot]').forEach(el => {
    const base = +el.dataset.base, extra = el.dataset.since ? now - +el.dataset.since : 0;
    el.textContent = short(base + extra);
  });
  document.querySelectorAll('[data-leave-until]').forEach(el => {
    const until = +el.dataset.leaveUntil, start = +el.dataset.leaveStart;
    el.textContent = fmtLeave(until - now);
    const bar = el.parentElement.querySelector('[data-leave-bar]');
    if (bar) bar.style.width = Math.max(0, Math.min(100, (until-now)/(until-start)*100)) + '%';
  });
  lockTick();
}
setInterval(tick, 1000);

/* ---------- modals ---------- */
const overlay = $('#overlay'), sheet = $('#sheet');
let modalKind = null;
function openModal(html, kind, center){
  sheet.innerHTML = html; modalKind = kind || null;
  overlay.classList.toggle('center', !!center);
  overlay.classList.add('show');
}
function closeModal(){ overlay.classList.remove('show'); modalKind = null; sheet.onclick = null; }
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && me) closeModal(); });

function leaveModal(u){
  openModal(`
    <h3>🌴 ${esc(u.name)}, ne kadar izinlisin?</h3>
    <p class="sub">Süre bitince kart otomatik olarak geri döner.</p>
    <div class="opts">${LEAVE_OPTS.map((o,i) => `<button class="opt" data-lo="${i}">${o.l}<small>${o.s}</small></button>`).join('')}</div>
    <button class="cancel" data-close>Vazgeç</button>`, 'leave');
  sheet.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    const b = e.target.closest('[data-lo]'); if (!b || u.id !== me) return;
    startLeave(u, LEAVE_OPTS[+b.dataset.lo]); save(); closeModal(); render();
  };
}
function avatarModal(u){
  openModal(`
    <h3>Avatarını seç</h3><p class="sub">Kartının yüzü olacak emoji.</p>
    <div class="av-grid">${AVATARS.map(a => `<button class="av" data-av="${a}">${a}</button>`).join('')}</div>
    <button class="cancel" data-close>Kapat</button>`, 'avatar');
  sheet.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    const b = e.target.closest('[data-av]'); if (!b || u.id !== me) return;
    u.avatar = b.dataset.av; save(); closeModal(); render();
  };
}
function colorModal(u){
  openModal(`
    <h3>🎨 İlerleme barı rengi</h3><p class="sub">${esc(u.name)} için bar ve kart vurgusu bu renkte olacak.</p>
    <div class="swatches">${Object.entries(THEMES).map(([k,t]) => `
      <button class="sw ${u.theme===k?'on':''}" data-th="${k}">
        <div class="bar" style="background:linear-gradient(90deg,${t.c[0]},${t.c[1]})"></div>
        <b>${t.n}<span>${u.theme===k?'✓':''}</span></b>
      </button>`).join('')}</div>
    <button class="cancel" data-close>Tamam</button>`, 'color');
  sheet.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    const b = e.target.closest('[data-th]'); if (!b || u.id !== me) return;
    u.theme = b.dataset.th; save(); render(); colorModal(u);
  };
}
function pinModal(){
  const u = getU(me); if (!u) return;
  openModal(`
    <h3>🔑 PIN değiştir</h3><p class="sub">${esc(u.name)} için yeni 4 haneli PIN belirle.</p>
    <div class="pinfields">
      <input id="pOld" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Mevcut PIN">
      <input id="pNew" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Yeni PIN">
      <input id="pNew2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Yeni PIN (tekrar)">
    </div>
    <div class="perr2" id="pErr"></div>
    <button class="btn-add" style="width:100%" data-save>Kaydet</button>
    <button class="cancel" data-close>Vazgeç</button>`, 'pin');
  sheet.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    if (!e.target.closest('[data-save]')) return;
    const o = $('#pOld').value, n = $('#pNew').value, n2 = $('#pNew2').value, err = $('#pErr');
    if (o !== u.pin) return err.textContent = 'Mevcut PIN yanlış.';
    if (!/^\d{4}$/.test(n)) return err.textContent = 'Yeni PIN tam 4 rakam olmalı.';
    if (n !== n2) return err.textContent = 'Yeni PIN\'ler eşleşmiyor.';
    u.pin = n; save(); closeModal(); toast('🔑 PIN güncellendi', true);
  };
}

/* mini game invite */
let seenInvite = state.invite ? state.invite.id : null;
function inviteModal(u){
  openModal(`
    <h3>🎮 Hangi oyuna davet edelim?</h3><p class="sub">Gruptakilere anında davet bildirimi gider.</p>
    <div class="opts">${GAMES.map(g => `<button class="opt" data-g="${g.k}">${g.e} ${g.l}<small>${g.s}</small></button>`).join('')}</div>
    <button class="cancel" data-close>Vazgeç</button>`, 'invite-pick');
  sheet.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    const b = e.target.closest('[data-g]'); if (!b || u.id !== me) return;
    state.invite = {id:Date.now(), from:u.id, game:b.dataset.g, replies:{}};
    seenInvite = state.invite.id; save(); showInvite();
  };
}
function showInvite(){
  const inv = state.invite; if (!inv || !me) return;
  const from = getU(inv.from); if (!from) return;
  const g = GAMES.find(x => x.k === inv.game) || GAMES[2];
  const mine = inv.from === me;
  const others = state.users.filter(u => u.id !== inv.from);
  openModal(`
    <div class="inv">
      <div class="ico">${g.e}</div>
      <h3>${mine ? 'Davet gönderildi' : 'Mini oyun daveti'}</h3>
      <p class="msg">${mine
        ? `Gruba <b>${g.phrase.replace(' oynamaya','')}</b> daveti gönderdin!`
        : `<b>${esc(from.avatar)} ${esc(from.name)}</b> sizi ${g.phrase} davet ediyor!`}</p>
      <div class="replies">
        ${others.map(o => {
          const r = inv.replies[o.id];
          const ctrl = r
            ? `<span class="res ${r}">${r==='yes'?'✅ Geliyorum':'😴 Pas'}</span>`
            : (o.id === me
                ? `<button class="y" data-rep="yes">✅ Geliyorum</button><button class="n2" data-rep="no">Pas</button>`
                : `<span class="res wait">⏳ Bekliyor</span>`);
          return `<div class="rep"><span>${esc(o.avatar)}</span><span class="n">${esc(o.name)}</span>${ctrl}</div>`;
        }).join('')}
      </div>
      <button class="cancel" data-close>Kapat</button>
    </div>`, 'invite', true);
  sheet.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    const b = e.target.closest('[data-rep]'); if (!b || mine || !state.invite) return;
    state.invite.replies[me] = b.dataset.rep; save(); showInvite();
  };
  if (navigator.vibrate && !mine) navigator.vibrate([40,30,40]);
}

/* ---------- events (card actions: own-only except reactions) ---------- */
const OWN_ONLY = ['status','toggle','endleave','leave','avatar','color','invite'];
$('#cards').addEventListener('click', e => {
  if (!me) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, u = getU(b.dataset.id); if (!u) return;
  if (OWN_ONLY.includes(act) && u.id !== me) return;       // other people's cards are view-only
  if (act === 'react' && u.id === me) return;               // no self-reactions
  if (act === 'view'){ views[u.id] = b.dataset.v; render(); return; }
  if (act === 'status') setStatus(u, b.dataset.s);
  else if (act === 'toggle'){ const t = b.dataset.t; if (u.done[t]) delete u.done[t]; else u.done[t] = true; syncCelebrate(); }
  else if (act === 'react'){
    u.reactions[b.dataset.r] = (u.reactions[b.dataset.r]||0) + 1;
    const r = b.getBoundingClientRect();
    for (let i=0;i<3;i++) setTimeout(() => floatEmoji(r.left + r.width/2, r.top, REACTS[b.dataset.r]), i*90);
  }
  else if (act === 'endleave') u.leave = null;
  else if (act === 'leave'){ leaveModal(u); return; }
  else if (act === 'avatar'){ avatarModal(u); return; }
  else if (act === 'color'){ colorModal(u); return; }
  else if (act === 'invite'){ inviteModal(u); return; }
  else return;
  save(); render();
});
$('#cards').addEventListener('input', e => {
  const el = e.target, u = getU(el.dataset.id); if (!u || u.id !== me) return;
  if (el.dataset.act === 'name'){ u.name = el.value; save(); renderAssign(); renderChips(); renderSess(); }
  if (el.dataset.act === 'note'){ u.note = el.value; save(); }
});

$('#sess').addEventListener('click', e => {
  const b = e.target.closest('[data-sess]'); if (!b) return;
  if (b.dataset.sess === 'out') logout();
  else if (b.dataset.sess === 'pin') pinModal();
});

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  state.tab = b.dataset.tab; save(); renderPanel();
});
$('#taskForm').addEventListener('submit', e => {
  e.preventDefault(); if (!me) return;
  const inp = $('#taskInput'), text = inp.value.trim(); if (!text) return;
  const scope = state.tab || 'day';
  state.tasks.push({
    id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    text, scope, assignee:$('#assignSel').value, day: scope === 'week' ? +$('#daySel').value : 0
  });
  inp.value = ''; syncCelebrate(); save(); render();
});
$('#chips').addEventListener('click', e => {
  if (!me) return;
  const b = e.target.closest('[data-del]'); if (!b) return;
  state.tasks = state.tasks.filter(t => t.id !== b.dataset.del);
  state.users.forEach(u => delete u.done[b.dataset.del]);
  syncCelebrate(); save(); render();
});
function clearOwn(scope){
  const u = getU(me); if (!u) return;
  state.tasks.filter(t => t.scope === scope).forEach(t => delete u.done[t.id]);
  u.celebrated[scope] = false;
}
$('#resetDay').addEventListener('click', () => {
  const u = getU(me); if (!u) return;
  if (!confirm('Senin günlük tiklerin, sürelerin ve aldığın tepkiler sıfırlansın mı? (Görevler ve diğer kartlar etkilenmez)')) return;
  clearOwn('day'); u.totals = emptyTotals(); u.reactions = emptyReacts(); if (u.status) u.since = Date.now();
  save(); render();
});
$('#resetWeek').addEventListener('click', () => {
  if (!getU(me)) return;
  if (!confirm('Senin haftalık plandaki tiklerin sıfırlansın mı?')) return;
  clearOwn('week'); save(); render();
});

/* live sync from other tab/window of the same browser */
addEventListener('storage', e => {
  if (e.key !== STORE || !e.newValue) return;
  try {
    const ns = JSON.parse(e.newValue); if (!ns.users || ns.users.length !== 3) return;
    const old = state;
    // keep what I'm typing on my own card
    const a = document.activeElement;
    if (a && a.dataset && a.dataset.id === me && (a.dataset.act === 'note' || a.dataset.act === 'name')){
      const mu = ns.users.find(x => x.id === me); if (mu) mu[a.dataset.act] = a.value;
    }
    state = ns;
    // celebrate other people's wins live
    ns.users.forEach(nu => {
      const ou = old.users.find(x => x.id === nu.id);
      ['day','week'].forEach(sc => { if (me && nu.celebrated && nu.celebrated[sc] && !(ou && ou.celebrated && ou.celebrated[sc])) celebrate(nu, sc); });
    });
    if (!getU(me)) { logout(); return; }
    // re-render but keep focus in my inputs
    let info = null;
    if (a && a.tagName === 'INPUT' && a.closest('.cards')) info = {act:a.dataset.act, id:a.dataset.id, s:a.selectionStart, e:a.selectionEnd};
    render();
    if (info){
      const el = document.querySelector(`input[data-act="${info.act}"][data-id="${info.id}"]`);
      if (el){ el.focus(); try { el.setSelectionRange(info.s, info.e); } catch(err){} }
    }
    if (me && state.invite){
      if (state.invite.id !== seenInvite){ seenInvite = state.invite.id; if (state.invite.from !== me) showInvite(); }
      else if (modalKind === 'invite') showInvite();
    }
  } catch(err){}
});

/* ---------- login system ---------- */
const MAX_TRIES = 5, LOCK_MS = 30000;
let loginUser = null, pinBuf = '';
const tries = {}, lockedUntil = {};

function renderLoginUsers(){
  loginUser = null; pinBuf = '';
  $('#stepUsers').hidden = false; $('#stepPin').hidden = true;
  $('#loginUsers').innerHTML = state.users.map(u => {
    const th = THEMES[u.theme] || THEMES.ice;
    return `<button class="lu" data-lu="${u.id}"><span class="lav" style="border-color:${th.c[0]}">${esc(u.avatar)}</span><span class="lt"><b>${esc(u.name)}</b><small>🔒 PIN ile giriş</small></span><span class="chev">›</span></button>`;
  }).join('');
}
function openPin(uid){
  const u = getU(uid); if (!u) return;
  loginUser = uid; pinBuf = '';
  const th = THEMES[u.theme] || THEMES.ice;
  $('#pinUser').innerHTML = `<span class="lav" style="border-color:${th.c[0]}">${esc(u.avatar)}</span><span>${esc(u.name)}</span>`;
  $('#stepUsers').hidden = true; $('#stepPin').hidden = false;
  $('#perr').textContent = ''; updateDots(); lockTick();
}
function updateDots(){
  document.querySelectorAll('#dots span').forEach((s,i) => s.classList.toggle('f', i < pinBuf.length));
}
function isLocked(){ return loginUser && lockedUntil[loginUser] && lockedUntil[loginUser] > Date.now(); }
function lockTick(){
  if (!loginUser || $('#stepPin').hidden) return;
  const l = lockedUntil[loginUser];
  if (l && l > Date.now()) $('#perr').textContent = `Çok fazla yanlış deneme · ${Math.ceil((l - Date.now())/1000)} sn bekle`;
  else if (l){ delete lockedUntil[loginUser]; $('#perr').textContent = ''; }
}
function pinPress(k){
  if (!loginUser) return;
  if (k === 'back'){ renderLoginUsers(); return; }
  if (isLocked()){ lockTick(); return; }
  if (k === 'del'){ pinBuf = pinBuf.slice(0,-1); updateDots(); return; }
  if (pinBuf.length >= 4) return;
  pinBuf += k; updateDots(); $('#perr').textContent = '';
  if (pinBuf.length === 4) setTimeout(checkPin, 140);
}
function checkPin(){
  const u = getU(loginUser); if (!u) return;
  const dots = $('#dots');
  if (pinBuf === u.pin){
    tries[u.id] = 0; dots.classList.add('ok');
    setTimeout(() => { dots.classList.remove('ok'); loginSuccess(u); }, 260);
  } else {
    tries[u.id] = (tries[u.id]||0) + 1;
    dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    if (tries[u.id] >= MAX_TRIES){ lockedUntil[u.id] = Date.now() + LOCK_MS; tries[u.id] = 0; lockTick(); }
    else $('#perr').textContent = `Yanlış PIN · kalan hak: ${MAX_TRIES - tries[u.id]}`;
    setTimeout(() => { pinBuf = ''; updateDots(); }, 380);
  }
}
function loginSuccess(u){
  me = u.id; try { sessionStorage.setItem(SESS, me); } catch(e){}
  loginUser = null; pinBuf = '';
  document.body.classList.remove('locked');
  render(); toast(`👋 Hoş geldin ${u.name}!`, true);
}
function logout(){
  me = null; try { sessionStorage.removeItem(SESS); } catch(e){}
  closeModal(); parts = []; cx.clearRect(0,0,innerWidth,innerHeight);
  document.body.classList.add('locked');
  renderLoginUsers();
}
$('#loginUsers').addEventListener('click', e => { const b = e.target.closest('[data-lu]'); if (b) openPin(b.dataset.lu); });
$('#keypad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinPress(b.dataset.k); });
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('locked') || !loginUser) return;
  if (/^\d$/.test(e.key)) pinPress(e.key);
  else if (e.key === 'Backspace') pinPress('del');
  else if (e.key === 'Escape') pinPress('back');
});

/* ---------- fx ---------- */
function floatEmoji(x, y, emoji){
  const el = document.createElement('div');
  el.className = 'float-emoji'; el.textContent = emoji;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.setProperty('--dx', (Math.random()*70-35) + 'px');
  document.body.appendChild(el); setTimeout(() => el.remove(), 1200);
}
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = null;
function sizeCv(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', sizeCv); sizeCv();
const COLORS = ['#9ec5f2','#a9dcc1','#f2a999','#f4b8cf','#f1dc9d','#c7b9ee','#e8eaf2'];
function burst(x, y, n, spread, power){
  for (let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()-.5)*spread, v = power*(.5+Math.random()*.7);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:COLORS[Math.random()*COLORS.length|0],life:0,max:150+Math.random()*90,round:Math.random()<.25});
  }
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
  for (const p of parts){
    p.life++; p.vy += .22; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.min(1,(p.max-p.life)/40); cx.fillStyle = p.c;
    if (p.round){ cx.beginPath(); cx.arc(0,0,p.w/2,0,6.28); cx.fill(); } else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(loop) : null;
  if (!raf) cx.clearRect(0,0,innerWidth,innerHeight);
}
function celebrate(u, scope){
  const w = innerWidth, h = innerHeight;
  burst(w/2, h*.55, 140, 2.4, 17);
  burst(w*.1, h*.8, 90, 1.1, 20);
  burst(w*.9, h*.8, 90, 1.1, 20);
  setTimeout(() => burst(w/2, h*.4, 110, 3.2, 14), 350);
  setTimeout(() => burst(w*.25, h*.6, 70, 1.6, 16), 700);
  setTimeout(() => burst(w*.75, h*.6, 70, 1.6, 16), 900);
  if (!raf) raf = requestAnimationFrame(loop);
  toast(`🎉 ${u.name} ${scope==='day'?'günün görevlerini':'haftalık planı'} bitirdi! 🍕 Hesaplar onda!`);
  if (navigator.vibrate) navigator.vibrate([60,40,60]);
}

/* init */
if (me && getU(me)){ document.body.classList.remove('locked'); }
else { me = null; document.body.classList.add('locked'); }
renderLoginUsers();
syncCelebrate(); save(); render();
})();
</script>
