/* ---- Titreşim Gönder (Nudge) — MSN usulü ----
   Mesaj olarak gönderilir ({ nudge: true }); alıcıda (genel sohbette herkes, özelde karşı taraf)
   sohbet penceresi sarsılır, cihaz destekliyorsa titrer ve kısa bir ses çalar. 10 sn bekleme süresi vardır. */
const Nudge = {
  COOLDOWN: 10000, last: 0,
  send() {
    const me = Auth.current; if (!me) return;
    const t = NOW(), wait = this.COOLDOWN - (t - this.last);
    if (wait > 0) { toast(`Biraz yavaş 🙂 ${Math.ceil(wait / 1000)} sn sonra tekrar titreşim gönderebilirsin`, 'error'); return; }
    this.last = t;
    const m = { id: 'm' + t.toString(36) + Math.random().toString(36).slice(2, 7), userId: me, text: '', nudge: true, at: t };
    if (Chat.channel === 'lounge') m.room = 'lounge';
    else if (Chat.channel !== 'general') m.recipientId = Chat.channel;
    App.seenMsgs.add(m.id);
    DB.insert('messages', m);
    Chat.renderList([m.id]); Chat.markRead(); Chat.renderSide();
    Composer.closePops();
    this.play();
  },
  /** Sarsıntı + titreşim + ses */
  play() {
    this.shakeUntil = NOW() + 450;
    this.shake();
    const btn = $('[data-act="nudge"]'); if (btn) { btn.classList.remove('buzz'); void btn.offsetWidth; btn.classList.add('buzz'); setTimeout(() => btn.classList.remove('buzz'), 650); }
    try { if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]); } catch (e) {}
    try { Sound.prime(); Sound.beep(); } catch (e) {}
  },
  shake() {
    const el = (App.view === 'chat' && $('.chat-wrap')) || $('#main');
    if (el) { el.classList.remove('nudge-shake'); void el.offsetWidth; el.classList.add('nudge-shake'); clearTimeout(this._t); this._t = setTimeout(() => { const e = $('.nudge-shake'); if (e) e.classList.remove('nudge-shake'); }, 650); }
  },
  /** Sarsıntı sırasında sayfa yeniden çizilirse (ör. gelen mesajla) sarsıntıyı yeni öğede sürdür */
  afterRender() { if (this.shakeUntil && NOW() < this.shakeUntil) this.shake(); },
  /** Yeni gelen mesajlar arasında bana gönderilmiş taze bir titreşim var mı? */
  incoming(msgs) {
    const me = Auth.current, t = NOW();
    if (msgs.some(m => m && m.nudge && m.userId !== me && t - (m.at || 0) < 60000 && (!m.recipientId || m.recipientId === me))) this.play();
  },
  label(m, me = Auth.current) { return m.userId === me ? 'Sen bir titreşim gönderdin!' : `${firstName(Chat.senderName(m))} bir titreşim gönderdi!`; }
};

/* =========================================================
   SOSYAL ALAN — gerçek zamanlı mini oyunlar
   Oyunlar games/{id} altında tutulur; tüm hamleler tek alan (s) üzerinde transaction ile yapılır,
   böylece aynı anda gelen hamleler çakışmaz. Sayaçlı geçişleri (tur bitişi vb.) oyundaki herhangi
   bir istemci yapabilir; transaction koşulları aynı geçişin iki kez yapılmasını engeller.
   ========================================================= */
const TR_UP = s => String(s || '').toLocaleUpperCase('tr-TR');
const money = n => (Math.round(+n || 0)).toLocaleString('tr-TR') + ' ₺';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const other = (g, me) => (g.players || []).find(p => p !== me);
const pname = id => { const u = DB.find('users', id); return u ? firstName(u.name) : 'Oyuncu'; };
const pav = (id, s = 28) => { const u = DB.find('users', id); return u ? avatar(u, s) : ''; };
const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};

const GAMES = {};
const GameHub = {
  INVITE_TTL: 120000, IDLE: 20 * MIN,
  focus: null, dismissed: {}, notified: {}, _settle: {},
  list() { return DB.get('games').filter(g => g && g.type && GAMES[g.type]); },
  get(id) { const g = DB.find('games', id); return g && GAMES[g.type] ? g : null; },
  inGame(g, me = Auth.current) { return (g.players || []).includes(me) || g.sunucu === me; },
  invitedTo(g, me = Auth.current) { return (g.invitees || []).includes(me) && !(g.players || []).includes(me) && g.sunucu !== me && !(obj(g.declined)[me]); },
  expired(g) { return (g.status === 'invite' || g.status === 'lobby') && NOW() - (g.createdAt || 0) > (g.status === 'lobby' ? 10 * MIN : this.INVITE_TTL); },
  idle(g) { return g.status === 'active' && NOW() - (g.updatedAt || g.createdAt || 0) > this.IDLE; },
  myActive(me = Auth.current) { return this.list().filter(g => this.inGame(g, me) && (g.status === 'active' || g.status === 'lobby') && !this.idle(g) && !this.expired(g)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
  myInvites(me = Auth.current) { return this.list().filter(g => this.invitedTo(g, me) && (g.status === 'invite' || g.status === 'lobby') && !this.expired(g)); },

  /** Yeni oyun: davet oluşturur */
  create(type, invitees, opts = {}) {
    const me = Auth.current, def = GAMES[type]; if (!me || !def) return;
    invitees = invitees.filter(x => x && x !== me);
    if (!invitees.length) return toast('Lütfen en az bir kişi seç', 'error');
    const id = uid('g'), t = NOW(), sunucu = opts.hostRole === 'host' ? me : '';
    const g = { id, type, host: me, sunucu, players: sunucu ? [] : [me], invitees, opts, status: def.multi ? 'lobby' : 'invite', createdAt: t, updatedAt: t, declined: {} };
    DB.insert('games', g);
    this.focus = id;
    toast(`${def.emoji} Davet gönderildi — ${invitees.map(pname).join(', ')} bekleniyor`, 'success');
    App.go('social');
  },
  accept(id) {
    const g = this.get(id), me = Auth.current; if (!g || !this.invitedTo(g)) return;
    if (this.expired(g)) return toast('Bu davetin süresi dolmuş', 'error');
    this.hideInvite();
    const players = [...(g.players || []), me];
    if (GAMES[g.type].multi) { DB.update('games', id, { players, updatedAt: NOW() }); toast('Lobiye katıldın — oyun kurucusu başlatınca başlayacak', 'success'); }
    else { DB.update('games', id, { players, status: 'active', s: GAMES[g.type].init(players, g.opts || {}, g), startedAt: NOW(), updatedAt: NOW() }); }
    this.focus = id; App.go('social'); App.render();
  },
  decline(id) {
    const g = this.get(id), me = Auth.current; if (!g) return;
    this.hideInvite();
    const declined = { ...obj(g.declined), [me]: true };
    const left = (g.invitees || []).filter(u => !declined[u] && !(g.players || []).includes(u));
    const patch = { declined, updatedAt: NOW() };
    if (!GAMES[g.type].multi && !left.length) patch.status = 'declined';
    DB.update('games', id, patch); App.render();
  },
  cancel(id) { const g = this.get(id); if (!g || g.host !== Auth.current) return; DB.update('games', id, { status: 'cancelled', updatedAt: NOW() }); if (this.focus === id) this.focus = null; App.render(); },
  /** Açık artırma lobisi → başlat */
  start(id) {
    const g = this.get(id); if (!g || g.host !== Auth.current) return;
    if ((g.players || []).length < 2) return toast('Başlatmak için en az 2 teklif veren oyuncu gerekli', 'error');
    DB.update('games', id, { status: 'active', s: GAMES[g.type].init(g.players, g.opts || {}, g), startedAt: NOW(), updatedAt: NOW() }); App.render();
  },
  forfeit(id) {
    const g = this.get(id), me = Auth.current; if (!g || !this.inGame(g)) return;
    if (g.sunucu === me || GAMES[g.type].multi) { DB.update('games', id, { status: 'done', winner: '', result: 'Oyun erken bitirildi', endedAt: NOW(), updatedAt: NOW() }); App.render(); return; }
    const w = other(g, me) || '';
    DB.update('games', id, { status: 'done', winner: w, result: `${pname(me)} pes etti`, endedAt: NOW(), updatedAt: NOW() }); App.render();
  },
  rematch(id) {
    const g = this.get(id); if (!g) return;
    const others = [...new Set([...(g.players || []), ...(g.invitees || []), g.host])].filter(u => u && u !== Auth.current);
    this.create(g.type, others, g.opts || {});
  },
  /** Hamle: fn(s, g) yeni durumu döndürür ya da undefined (geçersiz hamle) */
  move(id, fn, retry = 1) {
    const g = this.get(id); if (!g || g.status !== 'active') return Promise.resolve(false);
    let nullSeen = false;
    return DB.transaction('games', id, 's', cur => {
      if (!cur) { nullSeen = true; return undefined; }
      const n = fn(JSON.parse(JSON.stringify(cur)), g);
      return n === undefined ? undefined : n;
    }).then(ok => {
      if (!ok && nullSeen && retry > 0) return new Promise(r => setTimeout(() => r(this.move(id, fn, retry - 1)), 300));
      if (ok) { DB.update('games', id, { updatedAt: NOW() }); this.finalize(id); }
      this.renderStage();
      return ok;
    });
  },
  /** Sonuç durum alanına yazıldıysa oyunu "bitti" olarak işaretle (her katılımcı yapabilir, idempotent) */
  finalize(id) {
    const g = this.get(id); if (!g || g.status !== 'active' || !g.s || !g.s.res) return;
    const r = g.s.res;
    DB.update('games', id, { status: 'done', winner: r.w || '', result: r.txt || '', endedAt: NOW(), updatedAt: NOW() });
    const me = Auth.current;
    if (this.inGame(g) && !this.notified[id]) { this.notified[id] = 1; if (r.w === me) { toast('🏆 Kazandın! Tebrikler', 'success'); this.confetti(); } else if (r.w === 'draw') toast('🤝 Berabere bitti'); }
  },
  /** Zamanlı geçişler (tur sonu, kart kapama, açık artırma kapanışı) */
  clock() {
    const me = Auth.current; if (!me) return;
    const t = NOW();
    this.list().forEach(g => {
      if (g.status !== 'active' || !g.s || !this.inGame(g)) return;
      if (g.s.res) { this.finalize(g.id); return; }
      const def = GAMES[g.type]; if (!def.due) return;
      const due = def.due(g.s, g, t);
      if (due && (!this._settle[g.id] || t - this._settle[g.id] > 700)) { this._settle[g.id] = t; this.move(g.id, (s, gg) => def.settle(s, gg, NOW())); }
    });
    // ekrandaki ince sayaçlar ve "şimdi" durumları
    $$('[data-gcount]').forEach(el => { const ms = +el.dataset.gcount - t; el.textContent = ms > 0 ? (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + ' sn' : '0 sn'; el.classList.toggle('hot', ms < 3500); });
    $$('[data-gwait]').forEach(el => { if (t >= +el.dataset.gwait) { el.removeAttribute('data-gwait'); this.renderStage(); } });
  },
  /** Sadece oyun sahnesini yeniden çizer; yazılan metin ve odak korunur */
  renderStage() {
    const st = $('#gameStage'); if (!st) return;
    const ae = document.activeElement, keep = ae && st.contains(ae) && ae.id ? { id: ae.id, v: ae.value, s: ae.selectionStart, e: ae.selectionEnd } : null;
    st.innerHTML = Views.gameStage();
    if (keep) { const el = document.getElementById(keep.id); if (el) { if ('value' in el && keep.v != null) el.value = keep.v; el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  },
  /* --- davet kartı (her sayfada) --- */
  inviteEl: null, inviteId: null,
  started: {},
  checkInvites() {
    const me = Auth.current; if (!me) return this.hideInvite();
    // Davet ettiğim oyun başladıysa ve ben başka sayfadaysam haber ver
    this.list().forEach(g => {
      if (g.status !== 'active' || !this.inGame(g) || this.started[g.id] || NOW() - (g.startedAt || 0) > 60000) return;
      this.started[g.id] = 1;
      if (g.host === me && App.view !== 'social') { this.focus = g.id; this.showStarted(g); }
    });
    if (this.startedEl) return;
    const inv = this.myInvites(me).find(g => !this.dismissed[g.id]);
    if (!inv) return this.hideInvite();
    if (this.inviteId === inv.id) return;
    this.showInvite(inv);
  },
  showInvite(g) {
    const def = GAMES[g.type];
    if (!this.inviteEl) { this.inviteEl = document.createElement('div'); this.inviteEl.id = 'gameInvite'; this.inviteEl.setAttribute('role', 'alertdialog'); document.body.appendChild(this.inviteEl); }
    this.inviteId = g.id;
    const extra = g.type === 'auction' ? `<small>${g.opts.count} ürün · ${money(g.opts.budget)} bütçe · ${g.opts.mode === 'sealed' ? 'kapalı zarf' : 'canlı artırma'}${g.sunucu ? ` · sunucu: ${esc(pname(g.sunucu))}` : ''}</small>` : '';
    this.inviteEl.innerHTML = `<div class="gi-card"><span class="gi-emoji">${def.emoji}</span><div class="gi-txt"><b>${esc(pname(g.host))} seni ${def.name} oynamaya çağırıyor!</b>${extra}<span class="gi-time" data-gcount="${(g.createdAt || 0) + (g.status === 'lobby' ? 10 * MIN : this.INVITE_TTL)}"></span></div>
      <div class="gi-btns"><button type="button" class="btn btn-primary btn-sm" data-act="gameAccept" data-id="${esc(g.id)}">${ic('check', 14)} Katıl</button><button type="button" class="btn btn-ghost btn-sm" data-act="gameDecline" data-id="${esc(g.id)}">Reddet</button></div></div>`;
    requestAnimationFrame(() => this.inviteEl && this.inviteEl.classList.add('show'));
    try { Sound.prime(); Sound.beep(); if ('vibrate' in navigator) navigator.vibrate([120, 60, 120]); } catch (e) {}
    try { Notify.show({ title: `🎮 ${pname(g.host)} seni oyuna çağırıyor`, body: `${def.emoji} ${def.name} — katılmak için Squad Pulse'u aç`, tag: 'sp-game-' + g.id }); } catch (e) {}
  },
  startedEl: null,
  showStarted(g) {
    const def = GAMES[g.type]; this.hideInvite();
    const el = document.createElement('div'); el.id = 'gameInvite'; el.setAttribute('role', 'alert');
    el.innerHTML = `<div class="gi-card"><span class="gi-emoji">${def.emoji}</span><div class="gi-txt"><b>${def.name} başladı!</b><small>${(g.players || []).filter(u => u !== Auth.current).map(pname).join(', ')} davetini kabul etti</small></div>
      <div class="gi-btns"><button type="button" class="btn btn-primary btn-sm" data-act="gFocus" data-id="${esc(g.id)}">${ic('play', 14)} Oyuna git</button><button type="button" class="btn btn-ghost btn-sm" data-act="gStartedClose">Sonra</button></div></div>`;
    document.body.appendChild(el); this.startedEl = el;
    requestAnimationFrame(() => el.classList.add('show'));
    try { Sound.prime(); Sound.beep(); } catch (e) {}
    clearTimeout(this._st); this._st = setTimeout(() => this.hideStarted(), 15000);
  },
  hideStarted() { if (!this.startedEl) return; const el = this.startedEl; this.startedEl = null; el.classList.remove('show'); setTimeout(() => el.remove(), 250); },
  hideInvite() { if (!this.inviteEl) return; const el = this.inviteEl; this.inviteEl = null; this.inviteId = null; el.classList.remove('show'); setTimeout(() => el.remove(), 250); },
  confetti() {
    const fx = document.createElement('div'); fx.className = 'g-confetti';
    fx.innerHTML = Array.from({ length: 28 }, (_, i) => `<i style="--x:${Math.random() * 100}vw;--d:${(Math.random() * .6).toFixed(2)}s;--r:${Math.round(Math.random() * 720 - 360)}deg">${['🎉', '✨', '🏆', '🎊', '⭐'][i % 5]}</i>`).join('');
    document.body.appendChild(fx); setTimeout(() => fx.remove(), 2600);
  },
  stats() {
    const done = this.list().filter(g => g.status === 'done'), w = {};
    done.forEach(g => { if (g.winner && g.winner !== 'draw') { w[g.winner] = w[g.winner] || { total: 0, by: {} }; w[g.winner].total++; w[g.winner].by[g.type] = (w[g.winner].by[g.type] || 0) + 1; } });
    return { w, played: done.length };
  }
};

/* ---------- 1. XOX ---------- */

/* ---------- 2. Dört Taş ---------- */
GAMES.c4 = {
  name: 'Dört Taş', emoji: '🔴', desc: 'Taşları bırak, dördünü yan yana diz.', time: '2–3 dk', players: '2 kişi',
  W: 7, H: 6,
  init(players) { return { b: '-'.repeat(42), turn: players[0] }; },
  drop(id, c) {
    GameHub.move(id, (s, g) => {
      const me = Auth.current; if (s.res || s.turn !== me) return;
      let r = -1; for (let y = this.H - 1; y >= 0; y--) if (s.b[y * this.W + c] === '-') { r = y; break; }
      if (r < 0) return;
      const m = me === g.players[0] ? 'A' : 'B', i = r * this.W + c;
      s.b = s.b.slice(0, i) + m + s.b.slice(i + 1); s.last = i;
      const win = this.check(s.b, r, c, m);
      if (win) s.res = { w: me, line: win.join(','), txt: `${pname(me)} dört taşı dizdi` };
      else if (!s.b.includes('-')) s.res = { w: 'draw', txt: 'Tahta doldu — berabere' };
      else s.turn = other(g, me);
      return s;
    });
  },
  check(b, r, c, m) {
    const at = (y, x) => y >= 0 && y < this.H && x >= 0 && x < this.W && b[y * this.W + x] === m;
    for (const [dy, dx] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const cells = [[r, c]];
      for (let k = 1; at(r + dy * k, c + dx * k); k++) cells.push([r + dy * k, c + dx * k]);
      for (let k = 1; at(r - dy * k, c - dx * k); k++) cells.push([r - dy * k, c - dx * k]);
      if (cells.length >= 4) return cells.map(([y, x]) => y * this.W + x);
    }
    return null;
  },
  view(g, s, me) {
    const my = s.turn === me && !s.res, line = s.res && s.res.line ? s.res.line.split(',').map(Number) : [];
    const ca = DB.find('users', g.players[0])?.color || '#ef4444', cb = DB.find('users', g.players[1])?.color || '#f59e0b';
    let cols = '';
    for (let x = 0; x < this.W; x++) {
      let cells = '';
      for (let y = 0; y < this.H; y++) { const i = y * this.W + x, v = s.b[i]; cells += `<span class="c4-cell ${v !== '-' ? 'on' : ''} ${line.includes(i) ? 'win' : ''} ${s.last === i ? 'last' : ''}" ${v !== '-' ? `style="--disc:${v === 'A' ? ca : cb}"` : ''}></span>`; }
      const full = s.b[x] !== '-';
      cols += `<button type="button" class="c4-col" ${my && !full ? `data-act="gC4" data-id="${esc(g.id)}" data-c="${x}"` : 'disabled'} aria-label="Sütun ${x + 1}">${cells}</button>`;
    }
    return `<div class="c4-board ${my ? 'my-turn' : ''}" style="--ca:${ca};--cb:${cb}">${cols}</div>`;
  },
  turnText(g, s, me) { const col = DB.find('users', me)?.color; return s.turn === me ? `Sıra sende <i class="g-dot" style="background:${col}"></i> bir sütun seç` : `${esc(pname(s.turn))} hamle yapıyor…`; }
};

const TR_ALPHA = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ'.split('');
GAMES.hangman = {
  name: 'Adam Asmaca', emoji: '🪢', desc: 'Harf harf kelimeyi bul. Hazır kelimeyle yarış ya da kelimeyi sen belirle.', time: '2–3 dk', players: '2 kişi', MAX: 6,
  init(players, opts) {
    if (opts.hmMode === 'custom' && opts.word) return { mode: 'custom', w: TR_UP(opts.word).trim(), hint: String(opts.hint || '').slice(0, 40), g: '', wrong: 0, turn: players[1], setter: players[0], sc: {} };
    const [cat, words] = HM_WORDS[Math.floor(Math.random() * HM_WORDS.length)];
    return { mode: 'race', w: words[Math.floor(Math.random() * words.length)], hint: cat, g: '', wrong: 0, turn: players[0], sc: { [players[0]]: 0, [players[1]]: 0 } };
  },
  solved(s) { return [...s.w].every(ch => ch === ' ' || s.g.includes(ch)); },
  finish(s, g) {
    if (s.mode === 'custom') return;
    const [a, b] = g.players, sc = obj(s.sc);
    s.res = sc[a] === sc[b] ? { w: 'draw', txt: `Kelime: ${s.w} · berabere` } : { w: sc[a] > sc[b] ? a : b, txt: `Kelime: ${s.w}` };
  },
  guess(id, L) {
    GameHub.move(id, (s, g) => {
      const me = Auth.current; L = TR_UP(L);
      if (s.res || s.turn !== me || !L || s.g.includes(L)) return;
      s.g += L;
      const n = [...s.w].filter(ch => ch === L).length;
      if (n) {
        if (s.mode === 'race') { const sc = obj(s.sc); sc[me] = (sc[me] || 0) + n; s.sc = sc; }

      } else {
        s.wrong++;

  },

  },

    const head = s.mode === 'custom'
      ? `<div class="g-score"><span>${s.setter === me ? 'Kelimeyi sen belirledin' : `Tahmin eden: <b>sen</b>`}</span><em>İpucu: ${esc(s.hint || '—')}</em><span>Hata ${s.wrong}/${this.MAX}</span></div>`
      : `<div class="g-score"><span>${pav(me, 26)} Sen <b>${sc[me] || 0}</b></span><em>Kategori: ${esc(s.hint)} · hata ${s.wrong}/${this.MAX}</em><span><b>${sc[op] || 0}</b> ${esc(pname(op))} ${pav(op, 26)}</span></div>`;
    return `${head}<div class="hm-wrap">${this.svg(s.wrong)}<div class="hm-word">${word}</div></div>
      ${s.res ? '' : `<div class="hm-keys">${TR_ALPHA.map(L => { const used = s.g.includes(L), hit = used && s.w.includes(L); return `<button type="button" class="hm-key ${used ? (hit ? 'hit' : 'miss') : ''}" ${my && !used ? `data-act="gHm" data-id="${esc(g.id)}" data-v="${L}"` : 'disabled'}>${L}</button>`; }).join('')}</div>

  },
  turnText(g, s, me) { return s.mode === 'custom' && s.setter === me ? `${esc(pname(s.turn))} tahmin ediyor…` : s.turn === me ? 'Sıra sende · bir harf seç' : `${esc(pname(s.turn))} harf seçiyor…`; }

const AUCTION_ITEMS = [
  ['⌚', 'Vintage kol saati', 'Aksesuar', 400, 3200], ['🎸', 'İmzalı gitar', 'Müzik', 800, 5000], ['🖼️', 'Anonim yağlı boya tablo', 'Sanat', 200, 6000],
  ['📷', 'Analog fotoğraf makinesi', 'Elektronik', 300, 2400], ['💎', '"Pırlanta" yüzük', 'Mücevher', 600, 7000], ['🏺', 'Antika vazo', 'Antika', 150, 4500],
  ['📱', 'Kutusu açılmamış telefon', 'Elektronik', 900, 3800], ['🛵', 'Retro scooter', 'Taşıt', 1200, 5500], ['🎮', 'Koleksiyonluk oyun konsolu', 'Oyun', 300, 2600],
  ['👟', 'Sınırlı üretim sneaker', 'Moda', 350, 3000], ['🧳', 'Deri seyahat çantası', 'Moda', 250, 1800], ['🍷', '20 yıllık şarap', 'Gurme', 200, 2800],

  ['🪙', 'Osmanlı sikkesi', 'Antika', 300, 5200], ['🚲', 'Karbon yol bisikleti', 'Spor', 600, 3400], ['💼', 'Gizemli kutu', 'Sürpriz', 100, 6000],
  ['🔭', 'Pirinç teleskop', 'Bilim', 250, 2000], ['🏆', 'Turnuva kupası', 'Koleksiyon', 150, 2500], ['☕', 'El yapımı espresso makinesi', 'Mutfak', 400, 2100]
];
GAMES.auction = {
  name: 'Açık Artırma', emoji: '🔨', desc: 'Gizli değerli ürünlere teklif ver; sonunda kim kâr etti, kim battı görün.', time: '5–10 dk', players: '2–4 kişi', multi: true,
  OPEN: 15000, STEP: 10000, SEALED: 20000, SOLD: 3200,
  genLots(count, budget) {
    const k = (budget || 10000) / 10000;
    return shuffle(AUCTION_ITEMS).slice(0, count).map(([e, n, c, lo, hi]) => {
      lo = Math.round(lo * k / 50) * 50; hi = Math.round(hi * k / 50) * 50;
      const r = Math.random(); let v;
      if (r < .14) v = hi * (1.4 + Math.random() * 1.2);            // büyük ikramiye
      else if (r < .3) v = lo * (.1 + Math.random() * .35);           // sahte / değersiz
      else v = lo + (hi - lo) * Math.pow(Math.random(), 1.3);
      return { e, n, c, lo, hi, v: Math.max(10, Math.round(v / 10) * 10) };
    });
  },
  init(players, o, g) {
    const budget = +o.budget || 10000, bud = {}, own = {};
    players.forEach(p => { bud[p] = budget; own[p] = ''; });
    const s = { lots: this.genLots(+o.count || 10, budget), i: 0, bud, own, log: {}, bid: 0, bidder: '', sb: {}, mode: o.mode === 'sealed' ? 'sealed' : 'live', budget };
    if (g && g.sunucu) { s.phase = 'setup'; s.endsAt = 0; }
    else { s.phase = 'lot'; s.endsAt = NOW() + (s.mode === 'sealed' ? this.SEALED : this.OPEN); }
    return s;
  },
  begin(id) { GameHub.move(id, (s, g) => { if (s.phase !== 'setup' || g.sunucu !== Auth.current) return; s.phase = 'lot'; s.endsAt = NOW() + (s.mode === 'sealed' ? this.SEALED : this.OPEN); return s; }); },
  editLot(id, i, field, val) {
    GameHub.move(id, (s, g) => {
      if (s.phase !== 'setup' || g.sunucu !== Auth.current || !s.lots[i]) return;
      if (field === 'v') { const v = Math.max(0, Math.round(+val || 0)); if (s.lots[i].v === v) return; s.lots[i].v = v; }
      else { const n = String(val || '').trim().slice(0, 40); if (!n || s.lots[i].n === n) return; s.lots[i].n = n; }
      return s;
    });
  },
  bid(id, amount) {
    amount = Math.round(+amount || 0);
    return GameHub.move(id, (s, g) => {
      const me = Auth.current, t = NOW(), bud = obj(s.bud);
      if (s.phase !== 'lot' || !g.players.includes(me) || t >= s.endsAt) return;
      if (s.mode === 'live') {
        if (amount <= (s.bid || 0) || amount < 50 || amount > (bud[me] || 0) || s.bidder === me) return;
        s.bid = amount; s.bidder = me; s.endsAt = t + this.STEP;
      } else {
        const sb = obj(s.sb); if (sb[me]) return;
        if (amount < 0 || amount > (bud[me] || 0)) return;
        sb[me] = { a: amount, t }; s.sb = sb;
        if (g.players.every(p => sb[p])) s.endsAt = t;
      }
      return s;
    }).then(ok => { if (!ok) toast('Teklif geçersiz — bütçeni ve güncel teklifi kontrol et', 'error'); return ok; });
  },
  due(s, g, t) { return (s.phase === 'lot' && s.endsAt && t >= s.endsAt + 250) || (s.phase === 'sold' && t >= (s.soldAt || 0) + this.SOLD); },
  settle(s, g, t) {
    if (s.phase === 'lot' && t >= s.endsAt) {
      let w = '', p = 0;
      if (s.mode === 'live') { w = s.bidder || ''; p = s.bid || 0; }
      else { const sb = obj(s.sb); const best = Object.entries(sb).filter(([, x]) => x && x.a > 0).sort((a, b) => b[1].a - a[1].a || a[1].t - b[1].t)[0]; if (best) { w = best[0]; p = best[1].a; } }
      const bud = obj(s.bud), own = obj(s.own), log = obj(s.log);
      if (w) { bud[w] = (bud[w] || 0) - p; own[w] = own[w] ? own[w] + ',' + s.i : String(s.i); }
      log['l' + s.i] = { w, p, sb: s.mode === 'sealed' ? obj(s.sb) : null };
      Object.assign(s, { bud, own, log, phase: 'sold', soldAt: t });
      return s;
    }
    if (s.phase === 'sold' && t >= (s.soldAt || 0) + this.SOLD) {
      s.i++; s.bid = 0; s.bidder = ''; s.sb = {};
      if (s.i >= s.lots.length) { s.phase = 'end'; const r = this.results(s, g); s.res = { w: r[0] ? r[0].u : '', txt: r[0] ? `${pname(r[0].u)} ${r[0].profit >= 0 ? '+' : ''}${money(r[0].profit)} ile kazandı` : '' }; }
      else { s.phase = 'lot'; s.endsAt = t + (s.mode === 'sealed' ? this.SEALED : this.OPEN); }
      return s;
    }
  },
  results(s, g) {
    const bud = obj(s.bud), own = obj(s.own), log = obj(s.log);
    return g.players.map(u => {
      const items = (own[u] ? String(own[u]).split(',').map(Number) : []).map(i => ({ ...s.lots[i], i, paid: (log['l' + i] || {}).p || 0 }));
      const value = items.reduce((a, x) => a + x.v, 0), spent = items.reduce((a, x) => a + x.paid, 0);
      return { u, items, value, spent, cash: bud[u] || 0, net: (bud[u] || 0) + value, profit: (bud[u] || 0) + value - s.budget };
    }).sort((a, b) => b.net - a.net);
  },
  view(g, s, me) {
    const host = g.sunucu === me, playing = g.players.includes(me), bud = obj(s.bud), lot = s.lots[Math.min(s.i, s.lots.length - 1)];
    const people = `<div class="au-people">${g.players.map(u => `<div class="au-p ${s.bidder === u && s.phase === 'lot' ? 'lead' : ''} ${u === me ? 'me' : ''}">${pav(u, 26)}<div><b>${esc(pname(u))}${u === me ? ' (sen)' : ''}</b><small>${money(bud[u])} · ${(obj(s.own)[u] ? String(obj(s.own)[u]).split(',').length : 0)} ürün</small></div>${s.mode === 'sealed' && s.phase === 'lot' ? `<em class="${obj(s.sb)[u] ? 'ok' : ''}">${obj(s.sb)[u] ? '✓ teklif verdi' : 'düşünüyor'}</em>` : ''}</div>`).join('')}${g.sunucu ? `<div class="au-p host">${pav(g.sunucu, 26)}<div><b>${esc(pname(g.sunucu))}</b><small>🎙️ Sunucu</small></div></div>` : ''}</div>`;
    if (s.phase === 'setup') {
      if (!host) return `${people}<div class="au-wait">🎙️ ${esc(pname(g.sunucu))} ürünleri hazırlıyor… Birazdan başlıyoruz.</div>`;
      return `${people}<div class="au-setup"><p class="g-hint">Ürünleri ve <b>gerçek değerlerini</b> düzenleyebilirsin — oyuncular değerleri göremez, sadece ipucu aralığını görür.</p>
        <div class="au-lots">${s.lots.map((l, i) => `<div class="au-lot-row"><span>${l.e}</span><input class="input" data-aulot="${esc(g.id)}" data-i="${i}" data-f="n" value="${esc(l.n)}" maxlength="40"><small>${money(l.lo)}–${money(l.hi)}</small><input class="input au-v" type="number" min="0" data-aulot="${esc(g.id)}" data-i="${i}" data-f="v" value="${l.v}"></div>`).join('')}</div>
        <button class="btn btn-primary" data-act="gAuBegin" data-id="${esc(g.id)}">${ic('play', 15)} Açık artırmayı başlat</button></div>`;
    }
    if (s.phase === 'end' || s.res) return people + this.endView(g, s, me);
    const log = obj(s.log)['l' + s.i], sold = s.phase === 'sold';
    const valueTag = host || sold && host ? `<span class="au-real">🎙️ Gerçek değer: <b>${money(lot.v)}</b></span>` : '';
    let center;
    if (sold) {
      center = log && log.w ? `<div class="au-sold"><b>SATILDI!</b><span>${pav(log.w, 30)} ${esc(pname(log.w))} · ${money(log.p)}</span>${s.mode === 'sealed' && log.sb ? `<small>${Object.entries(obj(log.sb)).map(([u, x]) => `${esc(pname(u))}: ${money(x.a)}`).join(' · ')}</small>` : ''}</div>`
        : `<div class="au-sold none"><b>Satılmadı</b><span>Kimse teklif vermedi</span></div>`;
    } else if (s.mode === 'live') {
      const cur = s.bid || 0, mine = s.bidder === me, can = playing && !mine;
      center = `<div class="au-bid"><span>Güncel teklif</span><b>${cur ? money(cur) : '—'}</b><small>${s.bidder ? `${pav(s.bidder, 22)} ${esc(pname(s.bidder))}${mine ? ' (sen)' : ''}` : 'İlk teklifi ver'}</small></div>
        ${playing ? `<div class="au-actions">${[100, 500, 1000].map(inc => { const a = Math.max(cur, 0) + inc; return `<button class="btn btn-ghost" ${can && a <= (bud[me] || 0) ? `data-act="gAuBid" data-id="${esc(g.id)}" data-v="${a}"` : 'disabled'}>+${inc.toLocaleString('tr-TR')}<small>${money(a)}</small></button>`; }).join('')}
          <form class="au-custom" data-aubid="${esc(g.id)}" autocomplete="off"><input class="input" id="auAmt" type="number" min="${cur + 50}" step="50" placeholder="Özel teklif"><button class="btn btn-primary" type="submit" ${can ? '' : 'disabled'}>Teklif ver</button></form></div>
          ${mine ? '<p class="g-hint">🟢 En yüksek teklif sende — biri geçerse tekrar artırabilirsin.</p>' : ''}` : ''}`;
    } else {
      const sb = obj(s.sb), done = sb[me];
      center = `<div class="au-bid"><span>Kapalı zarf</span><b>🤫</b><small>Teklifler süre bitince ya da herkes verince açılır</small></div>
        ${playing ? (done ? `<p class="g-hint">Gizli teklifin: <b>${money(done.a)}</b> — diğerleri bekleniyor…</p>` : `<form class="au-custom" data-aubid="${esc(g.id)}" autocomplete="off"><input class="input" id="auAmt" type="number" min="0" step="50" max="${bud[me] || 0}" placeholder="Gizli teklifin (₺)"><button class="btn btn-primary" type="submit">Zarfı gönder</button><button class="btn btn-ghost" type="button" data-act="gAuBid" data-id="${esc(g.id)}" data-v="0">Pas geç</button></form>`) : ''}`;
    }
    return `${people}<div class="au-stage ${sold ? 'sold' : ''}">
      <div class="au-lot"><span class="au-emoji">${lot.e}</span><div class="au-info"><small>Ürün ${s.i + 1}/${s.lots.length} · ${esc(lot.c)}</small><h3>${esc(lot.n)}</h3><span class="au-hint">Tahmini değer: ${money(lot.lo)} – ${money(lot.hi)}</span>${valueTag}</div>
        ${!sold ? `<span class="au-timer" data-gcount="${s.endsAt}">${Math.max(0, Math.ceil((s.endsAt - NOW()) / 1000))} sn</span>` : ''}</div>
      ${center}</div>`;
  },
  endView(g, s, me) {
    const r = this.results(s, g), medal = ['🥇', '🥈', '🥉', '4.'];
    return `<div class="au-end"><h3>🔨 Açık artırma bitti — sonuçlar</h3>
      ${r.map((x, k) => `<div class="au-res ${x.profit >= 0 ? 'up' : 'down'}" style="--d:${k * .25}s"><div class="au-res-head"><span class="au-medal">${medal[k] || ''}</span>${pav(x.u, 30)}<b>${esc(pname(x.u))}${x.u === me ? ' (sen)' : ''}</b>
        <span class="au-pl">${x.profit >= 0 ? '+' : ''}${money(x.profit)}</span></div>
        <div class="au-res-sub">Harcanan ${money(x.spent)} · Ürünlerin gerçek değeri ${money(x.value)} · Kalan nakit ${money(x.cash)}</div>
        ${x.items.length ? `<div class="au-items">${x.items.map(it => `<span class="${it.v >= it.paid ? 'good' : 'bad'}">${it.e} ${esc(it.n)} <small>${money(it.paid)} → ${money(it.v)}</small></span>`).join('')}</div>` : '<div class="au-res-sub">Hiç ürün almadı 🤷</div>'}</div>`).join('')}
      <details class="au-all"><summary>Tüm ürünlerin gerçek değerleri</summary>${s.lots.map((l, i) => { const lg = obj(s.log)['l' + i] || {}; return `<div><span>${l.e} ${esc(l.n)}</span><small>${lg.w ? `${esc(pname(lg.w))} · ${money(lg.p)}` : 'satılmadı'}</small><b>${money(l.v)}</b></div>`; }).join('')}</details></div>`;
  },
  turnText(g, s, me) { return s.phase === 'setup' ? 'Hazırlık' : s.phase === 'sold' ? 'Çekiç indi!' : s.mode === 'sealed' ? 'Kapalı zarf turu' : 'Canlı artırma'; }
};

Views.gameStage = () => {
  const me = Auth.current, g = GameHub.focus && GameHub.get(GameHub.focus);

  const vs = (g.players || []).map(u => `<span class="gs-vs">${pav(u, 22)} ${esc(pname(u))}</span>`).join('<i>vs</i>');
  if (g.status === 'invite' || g.status === 'lobby') {
    const waiting = (g.invitees || []).filter(u => !(g.players || []).includes(u) && !obj(g.declined)[u]);
    const declined = (g.invitees || []).filter(u => obj(g.declined)[u]);

      <div class="row-btns">${g.host === me && g.status === 'lobby' ? `<button class="btn btn-primary" data-act="gStart" data-id="${esc(g.id)}" ${(g.players || []).length >= 2 ? '' : 'disabled'}>${ic('play', 15)} Oyunu başlat (${(g.players || []).length} oyuncu)</button>` : ''}

  }

  const banner = done ? `<div class="gs-result ${r.w === me ? 'win' : r.w === 'draw' ? 'draw' : 'lose'}"><b>${winTxt}</b><small>${esc(r.txt || g.result || '')}</small>
    <div class="row-btns"><button class="btn btn-primary btn-sm" data-act="gRematch" data-id="${esc(g.id)}">${ic('refresh', 14)} Rövanş</button><button class="btn btn-ghost btn-sm" data-act="gClose">Kapat</button></div></div>` : '';
  const btns = !done ? `<button class="btn btn-ghost btn-sm" data-act="gForfeit" data-id="${esc(g.id)}">${g.type === 'auction' && (g.host === me) ? 'Bitir' : 'Pes et'}</button>` : '';
  return `<section class="card game-stage g-${g.type} ${done ? 'is-done' : ''}" data-game="${esc(g.id)}">

const Meet = {

/* ---- Sesli mesaj: kaydet → dalga formlu oynatıcıyla dinle (seçili mikrofon kullanılır, en fazla 2 dk) ---- */
const VoiceMsg = {
  MAX: 120000, rec: null, player: null, cur: null, rate: 1,
  mime() { const c = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/webm']; return (window.MediaRecorder && MediaRecorder.isTypeSupported && c.find(t => MediaRecorder.isTypeSupported(t))) || ''; },
  fmt(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); },
  async start() {
    if (this.rec) return;
    if (!window.MediaRecorder || !navigator.mediaDevices) return toast('Bu tarayıcı ses kaydını desteklemiyor', 'error');
    if (!window.isSecureContext) return toast('Ses kaydı için site HTTPS üzerinden açılmalı', 'error');
    this.stopPlay();
    let stream; try { stream = await MeetDev.getStream(true, false); }
    catch (e) { return toast(e && e.name === 'NotAllowedError' ? 'Mikrofon izni verilmedi — adres çubuğundaki kilit simgesinden izin verebilirsin' : 'Mikrofon açılamadı', 'error'); }
    const type = this.mime(); let mr;
    try { mr = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 }); } catch (e) { mr = new MediaRecorder(stream); }
    const r = this.rec = { stream, mr, chunks: [], peaks: [], t0: NOW(), ch: Chat.channel, cancel: false };
    mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
    mr.onstop = () => this.finish(r);
    try { r.ctx = new (window.AudioContext || window.webkitAudioContext)(); r.an = r.ctx.createAnalyser(); r.an.fftSize = 512; r.ctx.createMediaStreamSource(stream).connect(r.an); r.buf = new Uint8Array(r.an.fftSize); } catch (e) {}
    r.iv = setInterval(() => this.tick(), 100);
    mr.start(250);
    this.renderUI();
  },
  tick() {
    const r = this.rec; if (!r) return;
    let v = 0;
    if (r.an) { r.an.getByteTimeDomainData(r.buf); let s = 0; for (const x of r.buf) { const d = (x - 128) / 128; s += d * d; } v = Math.min(1, Math.sqrt(s / r.buf.length) * 3.5); }
    r.peaks.push(v);
    const t = $('#vrecTime'); if (t) t.textContent = this.fmt(NOW() - r.t0);
    const w = $('#vrecWave'); if (w) w.innerHTML = r.peaks.slice(-56).map(p => `<i style="height:${Math.max(10, Math.sqrt(p) * 100).toFixed(0)}%"></i>`).join('');
    if (NOW() - r.t0 >= this.MAX) { toast('2 dakika sınırına ulaşıldı — sesli mesaj gönderiliyor'); this.stop(true); }
  },
  stop(send) {
    const r = this.rec; if (!r) return;
    r.cancel = !send; clearInterval(r.iv);
    try { if (r.mr.state !== 'inactive') r.mr.stop(); else this.finish(r); } catch (e) { this.finish(r); }
  },
  async finish(r) {
    if (r.done) return; r.done = true;
    r.stream.getTracks().forEach(t => t.stop()); try { if (r.ctx) r.ctx.close(); } catch (e) {}
    if (this.rec === r) this.rec = null;
    this.renderUI();
    const dur = NOW() - r.t0;
    if (r.cancel) return;
    if (dur < 800 || !r.chunks.length) return toast('Kayıt çok kısa — mikrofona basıp konuş, bitince gönder\'e bas', 'error');

        const sh = this._shoot; if (sh) { sh.l += 14; const g2 = ctx.createLinearGradient(sh.x, sh.y, sh.x - 120, sh.y - 50); g2.addColorStop(0, '#fff'); g2.addColorStop(1, 'transparent'); ctx.globalAlpha = Math.max(0, 1 - sh.l / 500); ctx.strokeStyle = g2; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x - 120, sh.y - 50); ctx.stroke(); sh.x += 12; sh.y += 5; if (sh.l > 500) this._shoot = null; }
      } else if (id === 'snow' || id === 'sakura') {
        parts.forEach(p => {
          p.y += p.z * (id === 'snow' ? 1.1 : .8); p.x += Math.sin(t / 1600 + p.a) * .6; p.r += .01 * p.s;
          if (p.y > H + 10) { p.y = -10; p.x = R(0, W); }
          ctx.globalAlpha = .45 + p.z * .5;
          if (id === 'snow') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.z * 2.6, 0, 6.28); ctx.fill(); }
          else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.s > .5 ? '#f9a8d4' : '#fbcfe8'; ctx.beginPath(); ctx.ellipse(0, 0, 7 * p.z + 3, 4 * p.z + 2, 0, 0, 6.28); ctx.fill(); ctx.restore(); }
        });
      } else if (id === 'rain') {
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
        parts.forEach(p => { p.y += 9 * p.z + 4; p.x += 1.5; if (p.y > H) { p.y = R(-60, 0); p.x = R(-50, W); } ctx.globalAlpha = .15 + p.z * .35; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 3, p.y - 14 * p.z - 6); ctx.stroke(); });
      } else {
        parts.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; });
        ctx.lineWidth = 1;
        for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) { const a = parts[i], b = parts[j], dx = a.x - b.x, dy = a.y - b.y, d = dx * dx + dy * dy; if (d < 16000) { ctx.globalAlpha = (1 - d / 16000) * .45; ctx.strokeStyle = '#818cf8'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); } }
        ctx.globalAlpha = .85; ctx.fillStyle = '#a5b4fc'; parts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, 6.28); ctx.fill(); });
      }
      ctx.globalAlpha = 1;
    };
    const loop = t => {
      this._raf = requestAnimationFrame(loop);
      if (document.hidden || this.frozen() || t - last < 33) return;
      last = t; draw(t);
    };
    resize(); draw(0);
    if (!this._resizeBound) { this._resizeBound = true; addEventListener('resize', () => { if (this._resize) this._resize(); }); }
    this._resize = () => { if (cv.isConnected) { resize(); draw(performance.now()); } };
    this._raf = requestAnimationFrame(loop);
  },
  async upload(file) {
    if (!file) return;
    if (!/^(video|image)\//.test(file.type)) return toast('Video (mp4/webm) ya da GIF/resim seçmelisin', 'error');

    this.save({ id: 'custom', url: '', type: file.type, name: file.name, ver: NOW() });
    toast('🖼️ Duvar kağıdın ayarlandı — yalnızca bu tarayıcıda saklanır', 'success');
  },
  setUrl(url) {

  pickFile() {

  refreshUI() { $$('[data-wp-box]').forEach(el => { const a = document.activeElement; if (!(a && el.contains(a) && a.type === 'range')) el.innerHTML = Views.wpPicker(); }); },
  open() { Modal.open({ title: '🖼️ Hareketli duvar kağıdı', body: `<div data-wp-box>${Views.wpPicker()}</div>`, actions: [{ label: 'Tamam', cls: 'btn-primary' }] }); }
};

/* =========================================================
   MÜZİK BOTU — YouTube'dan ortak çalma listesi (Discord botu gibi)
   • Şarkı YouTube'un kendi oynatıcısıyla her kişinin cihazında çalar; herkes aynı saniyede senkron dinler.
   • Kuyruk ekip ayarlarında (settings.music) tutulur. Sohbette: !çal <link>, !geç, !dur, !devam
   ========================================================= */
const Music = {
  player: null, ready: false, _loaded: null, _apiP: null, _lastTitleFix: null,
  LKEY: 'squadpulse.music',
  local() { try { return { on: false, vol: 60, ...(JSON.parse(localStorage.getItem(this.LKEY) || '{}') || {}) }; } catch (e) { return { on: false, vol: 60 }; } },
  setLocal(p) { const v = { ...this.local(), ...p }; try { localStorage.setItem(this.LKEY, JSON.stringify(v)); } catch (e) {} return v; },
  state() { const m = (DB.get('settings') || {}).music || {}; const q = Array.isArray(m.queue) ? m.queue : Object.values(m.queue || {}); return { cur: m.cur || null, queue: q.filter(x => x && x.vid) }; },
  write(cur, queue) { DB.patchSettings({ music: { cur: cur || null, queue: (queue || []).slice(0, 50) } }); setTimeout(() => this.sync(), 30); },
  parse(u) {
    u = String(u || '').trim();
    const m = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/.exec(u);
    return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u) ? u : null);
  },
  pos(c) { return c.paused ? (c.pos || 0) : Math.max(0, (NOW() - c.startedAt) / 1000); },
  add(url) {
    const vid = this.parse(url);
    if (!vid) { toast('Geçerli bir YouTube bağlantısı yapıştır (youtube.com/watch?v=… ya da youtu.be/…)', 'error'); return false; }
    const st = this.state(), item = { id: uid('mq'), vid, title: '', by: Auth.current, at: NOW() };
    if (!st.cur) this.write({ ...item, startedAt: NOW() + 1500, paused: false }, st.queue);
    else this.write(st.cur, [...st.queue, item]);
    toast(st.cur ? `🎵 Sıraya eklendi (${st.queue.length + 1}. sırada)` : '🎵 Çalmaya başlıyor', 'success');
    if (!this.local().on) this.listen(true);
    return true;
  },
  toggle() { const { cur, queue } = this.state(); if (!cur) return; this.write(cur.paused ? { ...cur, paused: false, startedAt: NOW() - (cur.pos || 0) * 1000 } : { ...cur, paused: true, pos: this.pos(cur) }, queue); },
  skip(fromId) {
    const { cur, queue } = this.state();
    if (fromId && (!cur || cur.id !== fromId)) return;
    const [next, ...rest] = queue;
    this.write(next ? { ...next, startedAt: NOW() + 1000, paused: false } : null, rest);
  },
  remove(id) { const { cur, queue } = this.state(); this.write(cur, queue.filter(x => x.id !== id)); },
  stopAll() { this.write(null, []); },
  listen(on) {
    this.setLocal({ on });
    if (on) { this.ensurePlayer(); toast('🎧 Ortak müziği dinliyorsun — ses seviyesini mini oynatıcıdan ayarlayabilirsin', 'success'); }
    else if (this.player && this.ready) { try { this.player.pauseVideo(); } catch (e) {} }
    this.sync();
  },
  setVol(v) { v = Math.max(0, Math.min(100, +v || 0)); this.setLocal({ vol: v }); if (this.player && this.ready) try { this.player.setVolume(v); } catch (e) {} },
  loadApi() {
    if (window.YT && YT.Player) return Promise.resolve();
    return this._apiP || (this._apiP = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady = () => { if (prev) try { prev(); } catch (e) {} res(); };
      const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; sc.async = true;
      sc.onerror = () => { this._apiP = null; rej(new Error('YouTube oynatıcısı yüklenemedi')); };
      document.head.appendChild(sc);
    }));
  },
  host() {
    let h = $('#musicMini');
    if (!h) {
      h = document.createElement('div'); h.id = 'musicMini'; h.hidden = true;
      h.innerHTML = `<div class="mm-video"><div id="musicFrame"></div></div><div class="mm-body" id="mmBody"></div>`;
      document.body.appendChild(h);
    }
    return h;
  },
  async ensurePlayer() {
    if (this.player || this._creating) return;
    this._creating = true; this.host();
    try { await this.loadApi(); } catch (e) { this._creating = false; toast('YouTube oynatıcısı yüklenemedi — reklam engelleyiciyi kontrol et', 'error'); return; }
    this.player = new YT.Player('musicFrame', {
      width: 160, height: 90,
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, playsinline: 1, rel: 0, fs: 0, iv_load_policy: 3 },
      events: {
        onReady: () => { this.ready = true; this._creating = false; try { this.player.setVolume(this.local().vol); } catch (e) {} this._loaded = null; this.sync(); },
        onStateChange: e => this.onState(e),
        onError: e => this.onErr(e)
      }
    });
  },
  onState(e) {
    const { cur, queue } = this.state(); if (!cur) return;
    if (e.data === 0) { this.skip(cur.id); return; }   // bitti → sıradaki
    if (e.data === 1) {
      try {
        const d = this.player.getVideoData(), dur = Math.round(this.player.getDuration() || 0);
        if (d && d.video_id === cur.vid && (!cur.title || !cur.dur) && this._lastTitleFix !== cur.id) { this._lastTitleFix = cur.id; this.write({ ...cur, title: cur.title || d.title || '', dur: cur.dur || dur }, queue); }
      } catch (err) {}
    }
    this.renderUI();
  },
  onErr(e) {
    const { cur } = this.state(); if (!cur) return;
    const why = e.data === 101 || e.data === 150 ? 'sahibi başka sitelerde oynatılmasına izin vermiyor' : e.data === 100 ? 'video bulunamadı / kaldırılmış' : 'oynatılamadı';
    toast(`🎵 Bu şarkı ${why} — sıradakine geçiliyor`, 'error');
    if (cur.by === Auth.current || !DB.find('users', cur.by)) this.skip(cur.id); else setTimeout(() => this.skip(cur.id), 2500);
  },
  /** Herkesi aynı saniyeye getirir (her ayar değişikliğinde ve 5 sn'de bir) */
  sync() {
    const { cur } = this.state(), on = this.local().on && !!Auth.current;
    if (cur && cur.dur && !cur.paused && this.pos(cur) > cur.dur + 4) { this.skip(cur.id); return; }   // kimse dinlemese de liste ilerler
    this.renderUI();
    if (!on || !cur) { if (this.player && this.ready) try { if (!cur) { this.player.stopVideo(); this._loaded = null; } else this.player.pauseVideo(); } catch (e) {} return; }
    if (!this.player || !this.ready) { this.ensurePlayer(); return; }
    const want = this.pos(cur), p = this.player;
    try {
      if (this._loaded !== cur.id) { this._loaded = cur.id; p.loadVideoById({ videoId: cur.vid, startSeconds: Math.floor(want) }); if (cur.paused) setTimeout(() => { try { p.pauseVideo(); } catch (e) {} }, 800); return; }
      const st = p.getPlayerState();
      if (cur.paused) { if (st === 1 || st === 3) p.pauseVideo(); if (Math.abs(p.getCurrentTime() - want) > 1.5) p.seekTo(want, true); }
      else { if (Math.abs(p.getCurrentTime() - want) > 2.5) p.seekTo(want, true); if (st !== 1 && st !== 3) p.playVideo(); }
    } catch (e) {}
  },
  tick() {
    const { cur } = this.state();
    $$('[data-mu-prog]').forEach(el => { const d = cur && cur.dur, p = cur ? this.pos(cur) : 0; el.style.width = d ? Math.min(100, p / d * 100).toFixed(1) + '%' : '0%'; });
    $$('[data-mu-time]').forEach(el => { el.textContent = cur ? VoiceMsg.fmt(this.pos(cur) * 1000) + (cur.dur ? ' / ' + VoiceMsg.fmt(cur.dur * 1000) : '') : ''; });
    if (++this._n % 5 === 0) this.sync();
  },
  _n: 0,
  renderUI() {
    $$('[data-music-box]').forEach(el => { const a = document.activeElement; if (!(a && el.contains(a) && a.tagName === 'INPUT')) el.innerHTML = Views.musicBox(); });
    const { cur } = this.state(), l = this.local(), h = $('#musicMini');
    const show = !!(cur && l.on && Auth.current);
    if (h) { h.hidden = !show; if (show) { const b = $('#mmBody'); if (b && !b.contains(document.activeElement)) b.innerHTML = Views.musicMini(); } }
  },
  /** Sohbet komutları: !çal <link> · !geç · !dur · !devam */
  command(text) {
    const m = /^\s*[!/](çal|cal|play|p|geç|gec|skip|dur|pause|devam|resume)\b\s*(.*)$/i.exec(text || ''); if (!m) return false;
    const c = m[1].toLowerCase();
    if (/^(çal|cal|play|p)$/.test(c)) return this.add(m[2]);
    if (/^(geç|gec|skip)$/.test(c)) { if (this.state().cur) { this.skip(); toast('⏭️ Sıradaki şarkıya geçildi'); } return true; }
    const cur = this.state().cur; if (!cur) return true;
    if (/^(dur|pause)$/.test(c) && !cur.paused) this.toggle();
    if (/^(devam|resume)$/.test(c) && cur.paused) this.toggle();
    return true;
  }
};
const ytThumb = vid => `https://i.ytimg.com/vi/${encodeURIComponent(vid)}/mqdefault.jpg`;

/* ---- Yardım İste ----
   Takılan kişi, o an yoğun olmayan bir ekip arkadaşına not ile yardım talebi gönderir.
   Yoğun sayılanlar: Deep Work'te, Pomodoro odak süresinde, toplantıda ya da çevrimdışı olanlar.
   Talep özel mesaj olarak gider ({ help: { note, urg, status } }); alıcı her sayfada açılan kartla
   "Yardım ediyorum" / "Şu an müsait değilim" diyebilir, yanıt talep edene anında bildirilir. */
const Help = {
  shown: {}, told: {}, el: null, elId: null,
  availability(u) {
    const t = NOW(), st = Tracker.status(u.id), inMeet = Meet.members().some(m => m.uid === u.id);
    const online = Net.mode !== 'firebase' || Presence.online(u.id);
    if (!online) return { ok: false, label: 'Çevrimdışı', icon: '⚫' };
    if (inMeet) return { ok: false, label: 'Toplantıda', icon: '📹' };
    if (st.key === 'active' && st.deep) return { ok: false, label: 'Deep Work — rahatsız etme', icon: '🧠' };
    if (u.pomo && u.pomo.phase === 'focus' && u.pomo.endsAt > t) return { ok: false, label: `Pomodoro odakta · ${T.mmss(u.pomo.endsAt - t)}`, icon: '🍅' };
    if (st.key === 'break') return { ok: true, label: `Molada · ${st.label}`, icon: '☕' };
    if (st.key === 'active') return { ok: true, label: `Müsait · ${st.label}`, icon: '🟢' };
    if (st.key === 'done') return { ok: true, label: 'Günü bitirdi', icon: '🌙' };
    return { ok: true, label: 'Müsait', icon: '🟢' };
  },
  open(preset) {
    const me = Auth.current, users = DB.get('users').filter(u => u.id !== me);
    if (!users.length) return toast('Ekipte yardım isteyebileceğin kimse yok', 'error');
    const rows = users.map(u => ({ u, a: this.availability(u) })).sort((x, y) => (y.a.ok - x.a.ok) || x.u.name.localeCompare(y.u.name, 'tr'));
    const first = rows.find(r => r.a.ok);
    Modal.open({
      title: '🆘 Yardım iste',
      body: `<p class="muted sm" style="margin-bottom:10px">Takıldığın konuyu kısaca yaz ve o an yoğun olmayan bir ekip arkadaşını seç.</p>
        <div class="hp-people">${rows.map(({ u, a }) => `<label class="hp-opt ${a.ok ? '' : 'busy'}"><input type="radio" name="hpTo" value="${u.id}" ${a.ok ? '' : 'disabled'} ${(preset ? preset === u.id && a.ok : first && first.u.id === u.id) ? 'checked' : ''}>
          <span>${avatar(u, 36)}<span class="hp-meta"><b>${esc(u.name)}</b><small>${a.icon} ${esc(a.label)}</small></span>${a.ok ? '' : '<em>Yoğun</em>'}</span></label>`).join('')}</div>
        ${first ? '' : '<p class="hp-none">Şu an herkes yoğun görünüyor 😕 Biraz sonra tekrar dene ya da Genel Sohbet\'e yaz.</p>'}

      actions: [{ label: 'Vazgeç' }, { label: 'Talep gönder', cls: 'btn-primary', onClick: m => {
        const to = ($('input[name="hpTo"]:checked', m) || {}).value, note = $('#hpNote', m).value.trim();

        if (note.length < 3) { $('#hpNote', m).focus(); toast('Kısaca neye takıldığını yaz', 'error'); return false; }

      } }],
      onMount: m => {

        setTimeout(() => $('#hpNote', m).focus(), 60);
      }
    });
  },
  send(to, note, urg) {
    const me = Auth.current, t = NOW();
    const m = { id: 'm' + t.toString(36) + Math.random().toString(36).slice(2, 7), userId: me, recipientId: to, at: t,
      text: `🆘 ${urg === 'urgent' ? 'ACİL ' : ''}Yardım talebi: ${note}`, help: { note, urg, status: 'open' } };
    App.seenMsgs.add(m.id); DB.insert('messages', m);
    this.told[m.id] = 'open';
    toast(`Yardım talebin ${esc(firstName(DB.find('users', to)?.name || ''))} adlı kişiye gönderildi`, 'success');
    if (App.view === 'chat') Chat.open(to); else { Chat.channel = to; Chat.pane = 'conv'; }
  },
  respond(id, ok) {
    const m = DB.find('messages', id); if (!m || !m.help || m.recipientId !== Auth.current || m.help.status !== 'open') return;
    DB.update('messages', id, { help: { ...m.help, status: ok ? 'accepted' : 'declined', at: NOW() } });
    this.hide();
    if (ok) {
      const t = NOW(), r = { id: 'm' + t.toString(36) + Math.random().toString(36).slice(2, 7), userId: Auth.current, recipientId: m.userId, at: t, text: '🙋 Yardıma geliyorum! Hemen bakıyorum.' };
      App.seenMsgs.add(r.id); DB.insert('messages', r);
      Chat.open(m.userId);
    } else toast('Talep reddedildi — karşı tarafa bildirildi');
    if (App.view === 'chat') Chat.renderList();
  },
  /** Gelen / güncellenen talepleri izle (her mesaj değişikliğinde) */
  check() {
    const me = Auth.current; if (!me) return this.hide();
    const all = DB.get('messages').filter(m => m && m.help);
    const pending = all.filter(m => m.recipientId === me && m.help.status === 'open' && NOW() - m.at < 6 * HOUR).sort((a, b) => b.at - a.at);
    const top = pending.find(m => !this.shown[m.id]);
    if (top && !this.el) this.show(top);
    if (this.el && !pending.some(m => m.id === this.elId)) this.hide();
    all.filter(m => m.userId === me && m.help.status !== 'open').forEach(m => {
      if (this.told[m.id] === m.help.status) return;
      const first = this.told[m.id] === undefined; this.told[m.id] = m.help.status;
      if (first && NOW() - (m.help.at || 0) > 60000) return;   // eski yanıtları yeniden bildirme
      const who = firstName(DB.find('users', m.recipientId)?.name || 'Ekip arkadaşın');
      if (m.help.status === 'accepted') { toast(`🙋 ${esc(who)} yardıma geliyor!`, 'success'); try { Sound.prime(); Sound.beep(); } catch (e) {} }
      else toast(`${esc(who)} şu an müsait değil — başka birinden yardım isteyebilirsin`, 'error');

  show(m) {

    const el = document.createElement('div'); el.id = 'helpAlert'; el.setAttribute('role', 'alertdialog');
    el.innerHTML = `<div class="gi-card ${m.help.urg === 'urgent' ? 'urgent' : ''}"><span class="gi-emoji">🆘</span><div class="gi-txt"><b>${esc(u ? firstName(u.name) : 'Biri')} senden yardım istiyor${m.help.urg === 'urgent' ? ' · 🔥 Acil' : ''}</b><small class="hp-quote">“${esc(m.help.note)}”</small></div>
      <div class="gi-btns"><button type="button" class="btn btn-primary btn-sm" data-act="helpYes" data-id="${esc(m.id)}">🙋 Yardım ediyorum</button><button type="button" class="btn btn-ghost btn-sm" data-act="helpNo" data-id="${esc(m.id)}">Şu an müsait değilim</button></div></div>`;
    document.body.appendChild(el); this.el = el;
    requestAnimationFrame(() => el.classList.add('show'));
    try { Sound.prime(); Sound.beep(); if ('vibrate' in navigator) navigator.vibrate([150, 80, 150]); } catch (e) {}
  },
  hide() { const el = this.el; if (!el) return; this.el = null; this.elId = null; el.classList.remove('show'); setTimeout(() => el.remove(), 250); }
};

const EVENT_TYPES = {
  video: { label: 'Video Çekimi', icon: '🎬', color: '#3b82f6' },
  store: { label: 'Mağaza / Store Çekimi', icon: '🏬', color: '#22c55e' },
  special: { label: 'Özel Gün / Müşteri Teslimi', icon: '📅', color: '#f59e0b' }
};
const SpecialDays = {
  ui: { month: null, sel: null },
  nthSunday(y, m, n) { const d = new Date(y, m, 1); const first = (7 - d.getDay()) % 7 + 1; return new Date(y, m, first + (n - 1) * 7); },
  lastFriday(y, m) { const d = new Date(y, m + 1, 0); while (d.getDay() !== 5) d.setDate(d.getDate() - 1); return d; },
  /** Bir yılın tüm Türkiye özel günleri */
  year(y) {
    const k = (mm, dd) => `${y}-${mm}-${dd}`, out = [];
    SD_FIXED.forEach(([md, n, c, e]) => { const [mm, dd] = md.split('-'); out.push({ key: k(mm, dd), name: n, cat: c, e }); });
    const anne = this.nthSunday(y, 4, 2), baba = this.nthSunday(y, 5, 3), cuma = this.lastFriday(y, 10);
    out.push({ key: T.key(anne.getTime()), name: 'Anneler Günü', cat: 'Ticari', e: '💐' }, { key: T.key(baba.getTime()), name: 'Babalar Günü', cat: 'Ticari', e: '👔' }, { key: T.key(cuma.getTime()), name: 'Efsane Cuma / Black Friday', cat: 'Ticari', e: '🛍️' });
    (SD_RELIGIOUS[y] || []).forEach(([md, n]) => { const [mm, dd] = md.split('-'); out.push({ key: k(mm, dd), name: n, cat: 'Dini', e: /Bayram/.test(n) ? '🌙' : '🕌' }); });
    return out.map(x => ({ ...x, id: 'sd_' + x.key + '_' + x.name.replace(/[^a-zA-ZçğıöşüÇĞİÖŞÜ0-9]/g, '').slice(0, 24) }));
  },
  /** a–b (gün anahtarı) aralığındaki özel günler + ajans etkinlikleri */
  range(fromKey, toKey) {
    const y1 = +fromKey.slice(0, 4), y2 = +toKey.slice(0, 4), out = [];
    for (let y = y1; y <= y2; y++) out.push(...this.year(y).filter(d => d.key >= fromKey && d.key <= toKey).map(d => ({ ...d, kind: 'sd' })));
    DB.get('events').filter(e => e && e.date >= fromKey && e.date <= toKey).forEach(e => out.push({ ...e, key: e.date, kind: 'ev' }));
    return out.sort((a, b) => a.key.localeCompare(b.key) || String(a.time || '').localeCompare(String(b.time || '')));
  },
  daysLeft(key) { return Math.round((Clients.dateTs(key) - T.sod()) / DAY); },
  /** Renk: bugün kırmızı · ≤3 gün yeşil · ≤7 gün sarı */
  tone(key) { const d = this.daysLeft(key); return d === 0 ? 'red' : d > 0 && d <= 3 ? 'green' : d > 3 && d <= 7 ? 'yellow' : d < 0 ? 'past' : 'far'; },
  leftText(key) { const d = this.daysLeft(key); return d === 0 ? 'Bugün!' : d === 1 ? 'Yarın' : d > 0 ? `${d} gün kaldı` : `${-d} gün önce`; },
  prep(id) { return DB.find('dayprep', id); },
  togglePrep(id) {
    const p = this.prep(id);
    if (p && p.done) DB.remove('dayprep', id); else DB.insert('dayprep', { id, done: true, by: Auth.current, at: NOW() });
    this.backup();
  },
  backup() { try { localStorage.setItem('squadpulse.days.backup', JSON.stringify({ at: NOW(), events: DB.cache.events || {}, dayprep: DB.cache.dayprep || {} })); } catch (e) {} },
  monthStart() { const m = this.ui.month || T.sod(); const d = new Date(m); d.setDate(1); return d.getTime(); },
  shift(n) { const d = new Date(this.monthStart()); d.setMonth(d.getMonth() + n); this.ui.month = d.getTime(); },
  /* --- etkinlik formu --- */
  form(ev, dateKey) {
    const isNew = !ev; ev = ev || { type: 'video', date: dateKey || T.key(T.sod()), time: '10:00', clientId: '', title: '', notes: '' };
    const clients = Clients.list().sort((a, b) => a.name.localeCompare(b.name, 'tr'));
    Modal.open({
      title: isNew ? '➕ Yeni çekim / özel gün' : `✏️ ${esc(ev.title || EVENT_TYPES[ev.type].label)}`,
      body: `<div class="cl-form">
        <div class="lbl full">Tür<div class="ev-types">${Object.entries(EVENT_TYPES).map(([k, t]) => `<label class="ev-type" style="--tc:${t.color}"><input type="radio" name="evType" value="${k}" ${ev.type === k ? 'checked' : ''}><span>${t.icon} ${t.label}</span></label>`).join('')}</div></div>
        <label class="lbl full">Başlık<input class="input" id="evTitle" maxlength="80" value="${esc(ev.title || '')}" placeholder="örn. Yeni sezon ürün çekimi"></label>
        <label class="lbl">Tarih<input type="date" class="input" id="evDate" value="${esc(ev.date)}"></label>
        <label class="lbl">Saat<input type="time" class="input" id="evTime" value="${esc(ev.time || '')}"></label>
        <label class="lbl full">Firma / müşteri<select class="input" id="evClient"><option value="">— Seçilmedi —</option>${clients.map(c => `<option value="${esc(c.id)}" ${ev.clientId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}<option value="__other" ${ev.clientId === '' && ev.clientName ? 'selected' : ''}>Listede olmayan firma…</option></select></label>
        <label class="lbl full ev-other" ${ev.clientId === '' && ev.clientName ? '' : 'hidden'}>Firma adı<input class="input" id="evClientName" maxlength="60" value="${esc(ev.clientName || '')}"></label>
        <label class="lbl full">Notlar<textarea class="input" id="evNotes" rows="3" maxlength="500" placeholder="Lokasyon, ekip, ekipman, teslim detayları…">${esc(ev.notes || '')}</textarea></label>
      </div>`,
      actions: [...(isNew ? [] : [{ label: 'Sil', cls: 'btn-danger', onClick: () => { DB.remove('events', ev.id); this.backup(); toast('Etkinlik silindi'); setTimeout(() => App.render(), 0); } }]),
        { label: 'Vazgeç' }, { label: isNew ? 'Takvime ekle' : 'Kaydet', cls: 'btn-primary', onClick: m => {
          const type = ($('input[name="evType"]:checked', m) || {}).value || 'video', date = $('#evDate', m).value;
          if (!date) { toast('Tarih seç', 'error'); return false; }
          let clientId = $('#evClient', m).value, clientName = '';
          if (clientId === '__other') { clientName = $('#evClientName', m).value.trim(); clientId = ''; } else if (clientId) clientName = DB.find('clients', clientId)?.name || '';
          const title = $('#evTitle', m).value.trim() || (clientName ? `${clientName} · ${EVENT_TYPES[type].label}` : EVENT_TYPES[type].label);
          const doc = { ...ev, id: ev.id || uid('ev'), type, date, time: $('#evTime', m).value, clientId, clientName, title, notes: $('#evNotes', m).value.trim(), updatedAt: NOW(), updatedBy: Auth.current };
          if (isNew) { doc.createdAt = NOW(); doc.createdBy = Auth.current; DB.insert('events', doc); } else DB.update('events', ev.id, doc);
          this.backup(); toast(isNew ? 'Takvime eklendi' : 'Güncellendi', 'success'); this.ui.sel = date; setTimeout(() => App.render(), 0);
        } }],
      onMount: m => {
        const md = m.querySelector('.modal'); if (md) md.classList.add('modal-client');
        $('#evClient', m).addEventListener('change', e => { $('.ev-other', m).hidden = e.target.value !== '__other'; });
        setTimeout(() => $('#evTitle', m).focus(), 60);
      }
    });
  }
};

/* ---- Performans / Hafif mod ----
   'auto' (varsayılan): zayıf cihazda ya da ekran kare hızı düşükse bulanıklık ve sürekli animasyonları kapatır.
   'on' her zaman hafif, 'off' her zaman tam görünüm. Tercih bu tarayıcıda saklanır. */
const Perf = {
  KEY: 'squadpulse.perf',
  pref() { try { return localStorage.getItem(this.KEY) || 'auto'; } catch (e) { return 'auto'; } },
  set(v) { try { localStorage.setItem(this.KEY, v); } catch (e) {} this.auto = null; this.apply(); if (v === 'auto') this.measure(true); },
  weak() { const c = navigator.hardwareConcurrency || 8, m = navigator.deviceMemory || 8; return c <= 2 || m <= 2; },
  apply() {
    const p = this.pref(), lite = p === 'on' || (p === 'auto' && (this.weak() || this.auto === true));
    document.documentElement.classList.toggle('perf-lite', !!lite);
    $$('[data-act="perfSet"]').forEach(b => b.classList.toggle('on', b.dataset.v === p));
  },
  measure(force) {
    if (this.pref() !== 'auto' || (this._measured && !force)) return;
    this._measured = true;
    setTimeout(() => {
      if (document.hidden) { this._measured = false; return; }
      let n = 0; const t0 = performance.now();
      const f = () => { n++; if (performance.now() - t0 < 1500) requestAnimationFrame(f); else { const fps = n / 1.5; if (fps < 32 && this.pref() === 'auto') { this.auto = true; this.apply(); toast('Ekran yavaş çizildiği için hafif mod açıldı — Profil & Tema\'dan değiştirebilirsin'); } } };
      requestAnimationFrame(f);
    }, 3500);
  }
};

Views.chatMessages = (pop = new Set()) => {

  let html = note, lastDay = null;
  list.forEach((m, i) => {

    if (day !== lastDay) { html += `<div class="day-sep">${Chat.dayLabel(m.at)}</div>`; lastDay = day; }
    const sameAsPrev = prev && !prev.nudge && prev.userId === m.userId && T.key(prev.at) === day && m.at - prev.at < 5 * MIN;
    const sameAsNext = next && !next.nudge && next.userId === m.userId && T.key(next.at) === day && next.at - m.at < 5 * MIN;
    if (m.help) { html += Views.helpCard(m, me); return; }

      const live = Gemini.live[m.id], streaming = live != null || (m.pending && !!m.text);
      const stale = m.pending && live == null && NOW() - m.at > 180000;
      const shown = live != null ? live : m.text;
      const body = stale ? '⚠️ Yanıt alınamadı (soruyu soran kişinin bağlantısı kesildi).'
        : m.pending || live != null ? (shown ? miniMd(shown) + '<span class="ai-caret"></span>' : Gemini.waitHtml()) : miniMd(m.text);

        <span class="av-slot">${sameAsNext ? '' : '<span class="bot-av" style="width:30px;height:30px">🤖</span>'}</span>
        <div class="bubble bot ${streaming && !stale ? 'streaming' : ''} ${m.error || stale ? 'err' : ''}"><span class="who">${Gemini.NAME}</span><div class="txt">${body}</div><span class="meta">${T.hm(m.at)}</span></div>
      </div>`;
      return;
    }
    const u = DB.find('users', m.userId), mine = m.userId === me;
    const name = u ? (mine ? `${firstName(u.name)} (sen)` : u.name) : 'Eski üye';
    const color = u ? u.color : '#94a3b8';

  });
  return html;
};
