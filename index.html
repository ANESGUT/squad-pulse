/* ---- Tarayıcı (sistem) bildirimleri ----
   • Masaüstü tarayıcılarda sayfa açıkken (başka sekmede / küçültülmüşken bile) çalışır.
   • Android Chrome sayfadan doğrudan bildirime izin vermez: index.html'nin yanına sw.js konursa onu kullanır.
   • Tarayıcı tamamen kapalıyken bildirim için sunucu tarafı Web Push (FCM) gerekir — bu sürümde yok. */
const Notify = {
  BASE_TITLE: 'Squad Pulse · Canlı Ekip Takip',
  askedKey() { return 'squadpulse.notifyAsked.' + (Auth.current || ''); },   // kişi başına bir kez sorulur
  swReg: null, ctorBroken: false, _icon: null,
  supported() { return 'Notification' in window; },
  permission() { return this.supported() ? Notification.permission : 'unsupported'; },
  prefs(u = Auth.user()) { const n = (u && u.prefs && u.prefs.notify) || {}; return { dm: n.dm !== false, mention: n.mention !== false, all: !!n.all }; },
  /** Sayfa arka planda mı? (başka sekme, küçültülmüş pencere veya başka uygulama önde) */
  background() { return document.hidden || !document.hasFocus(); },
  async request(fromUser = true) {
    if (!this.supported()) { if (fromUser) toast('Bu tarayıcı sistem bildirimlerini desteklemiyor.', 'error'); return 'unsupported'; }
    try { localStorage.setItem(this.askedKey(), '1'); } catch (e) {}
    if (Notification.permission !== 'default') {
      if (fromUser && Notification.permission === 'denied') toast('Bildirimler bu site için engellenmiş. Adres çubuğundaki kilit/ayar simgesinden "Bildirimler → İzin ver" seçmelisin.', 'error');
      return Notification.permission;
    }
    let r = 'default';
    try { r = await Notification.requestPermission(); } catch (e) { r = 'denied'; }
    if (fromUser || r === 'granted') toast(r === 'granted' ? '🔔 Bildirimler açıldı' : 'Bildirim izni verilmedi', r === 'granted' ? 'success' : 'info');
    if (App.view === 'profile' || App.view === 'chat') App.render();
    return r;
  },
  /** Girişte bir kez sor (kullanıcı tıklamasıyla tetiklendiği için tarayıcılar izin verir) */
  maybeAskOnLogin() {
    if (!this.supported() || Notification.permission !== 'default') return;
    let asked = false; try { asked = localStorage.getItem(this.askedKey()) === '1'; } catch (e) {}
    if (!asked) this.request(false);
  },
  icon() {
    if (this._icon) return this._icon;
    try {
      const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 128, 128); g.addColorStop(0, '#6366f1'); g.addColorStop(1, '#ec4899');
      x.fillStyle = g; x.beginPath(); x.roundRect ? x.roundRect(0, 0, 128, 128, 34) : x.rect(0, 0, 128, 128); x.fill();
      x.strokeStyle = '#fff'; x.lineWidth = 10; x.lineCap = x.lineJoin = 'round';
      x.beginPath(); x.moveTo(18, 68); x.lineTo(42, 68); x.lineTo(54, 40); x.lineTo(74, 92); x.lineTo(86, 64); x.lineTo(110, 64); x.stroke();
      this._icon = c.toDataURL('image/png');
    } catch (e) { this._icon = ''; }
    return this._icon;
  },
  /** İsteğe bağlı service worker (sw.js yanındaysa ve sayfa http/https'ten açıldıysa) */
  async initSW() {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    try {
      this.swReg = await navigator.serviceWorker.register('sw.js');
      navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open-chat') { try { window.focus(); } catch (_) {} Chat.open(e.data.channel || 'general'); } });
    } catch (e) { this.swReg = null; /* sw.js yok: masaüstünde yine çalışır */ }
  },
  /** Sistem bildirimi göster; tıklanınca ilgili sohbeti açar */
  show({ title, body, tag, channel, force = false }) {
    if (this.permission() !== 'granted') return false;
    if (!force && !this.background()) return false;
    const opts = { body: String(body || '').slice(0, 180), tag: tag || 'squadpulse', icon: this.icon(), data: { channel }, renotify: true };
    if (this.swReg && this.swReg.active) { this.swReg.showNotification(title, opts).catch(() => {}); return true; }
    if (this.ctorBroken) return false;
    try {
      delete opts.renotify; delete opts.data;
      const n = new Notification(title, opts);
      n.onclick = e => { if (e && e.preventDefault) e.preventDefault(); try { window.focus(); } catch (_) {} n.close(); if (channel) Chat.open(channel); };
      return true;
    } catch (e) { this.ctorBroken = true; return false; }   // mobil tarayıcı: sw.js gerekir
  },
  /** Bu mesaj bana hangi tür bildirim olarak gelir? null = bildirim yok */
  kind(m, me = Auth.current) {
    if (m && m.mt) return null;   // toplantı sohbeti yalnızca odada görünür
    if (!m || m.userId === me || m.pending || (!m.text && !m.nudge && !attsOf(m).length)) return null;
    if (m.recipientId) return m.recipientId === me ? 'dm' : null;
    if (m.bot) return m.askedBy === me ? 'mention' : 'all';
    if (Mentions.hits(m.text, me)) return 'mention';
    return 'all';
  },
  plain(m) { if (m.nudge) return '⚠️ bir titreşim gönderdi! 📳'; return m.bot ? m.text.replace(/```[\s\S]*?```/g, ' ').replace(/[*`#_>]/g, '').replace(/\s+/g, ' ').trim() : (m.text ? (attsOf(m).length ? attLabel(m) + ' · ' : '') + m.text : attLabel(m)); },
  /** Yeni gelen mesajlar için: arka plandaysa sistem bildirimi, öndeyse toast */
  handle(msgs, convVisible) {
    const pr = this.prefs(), toastLeft = { n: 3 };
    msgs.forEach(m => {
      const k = this.kind(m); if (!k) return;
      const ch = m.recipientId ? m.userId : Chat.roomOf(m);
      const inOpenConv = convVisible && Chat.inChannel(m);
      const name = m.bot ? Gemini.NAME : Chat.senderName(m), text = this.plain(m);
      const allowed = (k === 'dm' && pr.dm) || (k === 'mention' && pr.mention) || (k === 'all' && pr.all);
      if (this.background()) {
        if (allowed) this.show({
          title: k === 'dm' ? `🔒 ${name} · özel mesaj` : k === 'mention' ? (m.bot ? '🤖 Gemini sorunu cevapladı' : `📣 ${name} seni etiketledi`) : `${m.room === 'lounge' ? '☕' : '💬'} ${name} · ${Chat.ROOMS[Chat.roomOf(m)]}`,
          body: text, tag: 'sp-' + ch, channel: ch
        });
        return;
      }
      if (inOpenConv || toastLeft.n <= 0) return;
      toastLeft.n--;
      const icon = k === 'dm' ? '🔒' : k === 'mention' ? '📣' : '💬';
      toast(`${icon} <b>${esc(m.bot ? Gemini.NAME : firstName(name))}${k === 'dm' ? ' (özel)' : k === 'mention' && !m.bot ? ' seni etiketledi' : ''}:</b> ${esc(text.length > 70 ? text.slice(0, 70) + '…' : text)}`);
    });
  },
  status() {
    const p = this.permission();
    if (p === 'unsupported') return { cls: 'gray', text: 'Bu tarayıcı desteklemiyor' };
    if (p === 'granted') return { cls: 'live', text: this.ctorBroken && !(this.swReg && this.swReg.active) ? 'İzin var · bu cihaz için sw.js gerekli' : 'Açık' };
    if (p === 'denied') return { cls: 'tomato', text: 'Engellendi' };
    return { cls: 'gray', text: 'Henüz izin verilmedi' };
  }
};

/* ---- @etiketleme: @Ad, @herkes / @ekip ---- */
const Mentions = {
  norm(s) { return String(s || '').replace(/İ/g, 'i').replace(/I/g, 'ı').toLocaleLowerCase('tr-TR').replace(/ı/g, 'i').normalize('NFD').replace(/[̀-ͯ]/g, ''); },
  ALL: ['herkes', 'ekip', 'everyone', 'all'],
  handle(u) { return this.norm(firstName(u.name)); },
  hits(text, uid) {
    const u = DB.find('users', uid); if (!u) return false;
    const t = this.norm(text), re = w => new RegExp('(^|[^a-z0-9_])@' + w + '(?![a-z0-9_])');
    return this.ALL.some(w => re(w).test(t)) || re(this.handle(u).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t);
  },
  /** Kaçışlanmış (escape) metindeki @etiketleri renklendirir */
  highlight(html, me = Auth.current) {
    const users = DB.get('users'), meU = DB.find('users', me);
    return html.replace(/(^|[\s(>])@([^\s@<>.,!?:;()"']+)/g, (all, pre, word) => {
      const w = this.norm(word);
      if (w === 'gemini') return `${pre}<span class="mention">@${word}</span>`;
      const isAll = this.ALL.includes(w), u = users.find(x => this.handle(x) === w);
      if (!isAll && !u) return all;
      const mine = isAll || (meU && u && u.id === meU.id);
      return `${pre}<span class="mention ${mine ? 'is-me' : ''}">@${word}</span>`;
    });
  }
};

/* ---- Zorunlu bildirim izni paneli ----
   Giriş yapan kullanıcıda bildirim izni 'granted' değilse geçilemeyen bir panel gösterir.
   • 'default'  → "Bildirimleri Aç & Devam Et" ile tarayıcının kendi izin penceresi açılır.
   • 'denied'   → tarayıcı bir daha sormaz; izni ayarlardan açma adımları gösterilir, izin verilince panel kendiliğinden kapanır.
   • desteklenmeyen tarayıcı → izin vermek imkânsız olduğu için panel gösterilmez.
   • Yönetici zorunluluğu Sistem Ayarları'ndan (veya panelden) kapatabilir: settings.notifyGate */
const NotifyGate = {
  el: null, shown: null, busy: false, adminConfirm: false,
  enabled() { const s = DB.get('settings'); return !!s && s.notifyGate !== false; },
  framed() { try { return window.top !== window; } catch (e) { return true; } },
  check() {
    const u = Auth.user(), p = Notify.permission();
    if (!u || !this.enabled() || p === 'granted' || p === 'unsupported') return this.hide();
    const key = p + '|' + u.id + '|' + u.role + '|' + this.adminConfirm;
    if (this.shown === key && this.el) return;
    this.render(p, u); this.shown = key;
  },
  render(p, u) {
    if (!this.el) { this.el = document.createElement('div'); this.el.id = 'notifyGate'; this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-modal', 'true'); document.body.appendChild(this.el); }
    const root = $('#root'); if (root) { root.inert = true; root.setAttribute('aria-hidden', 'true'); }
    document.body.classList.add('gate-open');
    const foot = `<div class="gate-foot"><span>${avatar(u, 22)} ${esc(u.name)}</span><button type="button" data-gate="logout">Farklı kullanıcıyla giriş</button></div>`;
    const admin = u.role === 'admin' ? `<div class="gate-admin"><button type="button" class="${this.adminConfirm ? 'confirm' : ''}" data-gate="disable">${this.adminConfirm ? 'Emin misin? Tüm ekip için zorunluluğu kapatmak için tekrar bas' : 'Yönetici: bildirim zorunluluğunu ekip için kapat'}</button></div>` : '';
    if (p === 'denied') {
      const env = this.framed() || location.protocol === 'file:';
      this.el.innerHTML = `<div class="gate-card">
        <div class="gate-icon denied">${ic('bellOff', 36)}</div>
        <h2>Bildirimler engellenmiş</h2>
        <p>Squad Pulse'u kullanmaya devam etmek için bu site için bildirimlere izin vermen gerekiyor. Tarayıcı izin penceresini bir daha göstermediği için izni ayarlardan açmalısın.</p>
        <div class="gate-steps">
          ${env ? `<b>⚠️ Sayfa ${this.framed() ? 'başka bir uygulamanın önizleme penceresinde' : 'bilgisayardaki dosyadan'} açılmış.</b> Bu ortamda bildirim izni verilemeyebilir. Sayfayı <b>Chrome / Edge</b> ile ya da sitenin web adresinden (ör. Netlify) aç.<br><br>` : ''}
          <b>Chrome / Edge:</b><ol><li>Adres çubuğunun solundaki <b>🔒 / ayar</b> simgesine tıkla</li><li><b>Bildirimler</b> → <b>İzin ver</b> seç</li><li>Sayfayı yenile</li></ol>
          <b style="display:block;margin-top:8px">Safari (Mac):</b><ol><li>Safari → Ayarlar → Web Siteleri → Bildirimler</li><li>Bu site için <b>İzin Ver</b> seç</li></ol>
        </div>
        <div class="gate-row"><button type="button" class="btn btn-ghost" data-gate="reload">${ic('refresh', 15)} Sayfayı yenile</button><button type="button" class="btn btn-primary" data-gate="allow">${ic('bell', 15)} Tekrar dene</button></div>
        ${admin}${foot}</div>`;
    } else {
      this.el.innerHTML = `<div class="gate-card">
        <div class="gate-icon">${ic('bell', 36)}</div>
        <h2>Bildirimleri açalım 🔔</h2>
        <p>Squad Pulse, ekipte sana bir şey olduğunda uygulama arka plandayken bile seni anında haberdar eder. Devam etmek için bildirimlere izin vermen gerekiyor.</p>
        <div class="gate-feats">
          <div class="gate-feat"><span>🔒</span><div><b>Özel mesajlar</b><small>Ekip arkadaşın sana yazdığında</small></div></div>
          <div class="gate-feat"><span>📣</span><div><b>Etiketlenmeler</b><small>@${esc(firstName(u.name))} veya @herkes yazıldığında · Gemini cevap verdiğinde</small></div></div>
          <div class="gate-feat"><span>🍅</span><div><b>Pomodoro & mola</b><small>Odak süren bitince ve mola sona erince</small></div></div>
        </div>
        <button type="button" class="btn btn-primary gate-btn" data-gate="allow">${ic('bell', 18)} Bildirimleri Aç & Devam Et</button>
        <p class="gate-wait" id="gateWait">👆 Tarayıcının açtığı izin penceresinde <b>"İzin ver"</b>e bas. Pencereyi göremiyorsan adres çubuğunun solundaki zil / kilit simgesine bak.</p>
        ${admin}${foot}</div>`;
    }
    requestAnimationFrame(() => { const b = this.el && this.el.querySelector('[data-gate="allow"]'); if (b) b.focus(); });
  },
  hide() {
    if (!this.el) return;
    const root = $('#root'); if (root) { root.inert = false; root.removeAttribute('aria-hidden'); }
    document.body.classList.remove('gate-open');
    this.el.remove(); this.el = null; this.shown = null; this.adminConfirm = false;
  },
  async allow(btn) {
    if (this.busy) return; this.busy = true;
    if (btn) { btn.classList.add('waiting'); btn.innerHTML = `${ic('clock', 17)} İzin bekleniyor…`; }
    const w = $('#gateWait'); if (w) w.classList.add('on');
    let r = Notify.permission();
    try { if (r !== 'granted' && r !== 'unsupported') r = await Notification.requestPermission(); } catch (e) { r = Notify.permission(); }
    this.busy = false;
    try { localStorage.setItem(Notify.askedKey(), '1'); } catch (e) {}
    if (r === 'granted') {
      this.hide(); toast('🔔 Bildirimler açıldı — hoş geldin!', 'success');
      Notify.show({ title: '🔔 Squad Pulse bildirimleri açık', body: 'Özel mesaj ve etiketlerde artık haberdar olacaksın.', tag: 'sp-welcome', force: true });
      App.render();
    } else {
      this.shown = null; this.check();
      if (r === 'denied') toast('İzin verilmedi. Devam etmek için izni tarayıcı ayarlarından açmalısın.', 'error');
    }
  },
  onClick(e) {
    const b = e.target.closest('[data-gate]'); if (!b || !this.el || !this.el.contains(b)) return;
    e.preventDefault(); e.stopPropagation();
    const a = b.dataset.gate;
    if (a === 'allow') this.allow(b);
    else if (a === 'reload') location.reload();
    else if (a === 'logout') { this.hide(); Actions.logout(); }
    else if (a === 'disable') {
      if (!this.adminConfirm) { this.adminConfirm = true; this.shown = null; this.check(); return; }
      DB.patchSettings({ notifyGate: false }); this.hide(); toast('Bildirim zorunluluğu tüm ekip için kapatıldı', 'success'); App.render();
    }
  },
  /** İzin tarayıcı ayarlarından değişirse paneli canlı güncelle */
  watch() {
    document.addEventListener('click', e => this.onClick(e), true);
    document.addEventListener('keydown', e => { if (this.el && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); } }, true);
    const recheck = () => { this.shown = null; this.check(); };
    window.addEventListener('focus', recheck);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
    try { navigator.permissions && navigator.permissions.query({ name: 'notifications' }).then(st => { st.onchange = recheck; }).catch(() => {}); } catch (e) {}
  }
};

/* ---- Gemini Asistan ---- */
function miniMd(s) {
  let h = esc(s);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => `<span class="md-pre">${c.replace(/\n$/, '')}</span>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/^#{1,6}\s+(.*)$/gm, '<b>$1</b>');
  h = h.replace(/^(\s*)[*-]\s+/gm, '$1• ');
  return h;
}
const Gemini = {
  BOT_ID: 'gemini',
  NAME: '🤖 Gemini Asistan',
  TRIGGER: /^\s*@gemini\b[\s,:;.!?-]*/i,
  hasKey() { const k = this.key(); return !!k && !/BURAYA/i.test(k); },
  title(q) { const w = q.replace(/\s+/g, ' ').trim().split(' ').filter(Boolean); return w.slice(0, 6).join(' ') + (w.length > 6 ? '…' : ''); },
  /** Akışta (streaming) gösterilen, henüz tamamlanmamış cevaplar: mesaj id → ekranda yazılmış metin */
  live: {},
  /** Canlı balonu yeniden çizim beklemeden günceller (daktilo efektinin her karesi) */
  paint(id, shown) {
    this.live[id] = shown;
    document.querySelectorAll(`[data-mid="${CSS.escape(id)}"]`).forEach(row => {
      const b = row.querySelector('.bubble'), tx = row.querySelector('.txt'); if (!tx) return;
      if (b) b.classList.add('streaming');
      const list = row.parentElement, stick = list && list.scrollHeight - list.scrollTop - list.clientHeight < 120;
      tx.innerHTML = shown ? miniMd(shown) + '<span class="ai-caret"></span>' : Gemini.waitHtml();
      if (stick) list.scrollTop = list.scrollHeight;
    });
  },
  waitHtml() { return `<span class="typing"><i></i><i></i><i></i><span>düşünüyor…</span></span>`; },
  /** Soru soran kişinin cihazında çalışır: cevabı akış hâlinde alır, kelime kelime yazar; ekip de ilerlemeyi görür */
  async handle(userMsg) {
    const me = Auth.user(); if (!me) return;
    const question = userMsg.text.replace(this.TRIGGER, '').trim();
    if (!question) { toast('Soru yazmayı unuttun: <b>@Gemini</b> sorunuz…'); return; }
    const t = NOW(), rnd = () => Math.random().toString(36).slice(2, 7);
    const botId = 'g' + t.toString(36) + rnd(), logId = 'l' + t.toString(36) + rnd();
    DB.insert('ai_logs', { id: logId, userId: me.id, userName: me.name, title: this.title(question), q: question.slice(0, 300), topic: AiTopics.of(question), src: 'team', at: t, status: 'pending' });
    // 1) Boş cam balon hemen ekrana gelir
    DB.insert('messages', { id: botId, userId: this.BOT_ID, bot: true, pending: true, text: '', at: t + 1, replyTo: userMsg.id, askedBy: me.id });
    this.live[botId] = '';
    App.seenMsgs.add(botId); Chat.renderList([botId]);
    // 2) Gelen parçalar daktilo ile yazılır; ekip arkadaşları için metin ~0.8 sn'de bir kaydedilir
    let lastSave = 0;
    const typer = new Typer(shown => this.paint(botId, shown));
    let text, ok = true, model = null;
    try {
      const r = await this.ask(question, me, full => {
        typer.push(full);
        if (NOW() - lastSave > 800) { lastSave = NOW(); DB.update('messages', botId, { text: full.slice(0, 4000) }); }
      });
      text = r.text; model = r.model; typer.push(text);
      await typer.finish();
    } catch (e) { ok = false; text = '⚠️ ' + (e.message || 'Bilinmeyen hata'); console.warn('[gemini]', e); typer.stop(); }
    delete this.live[botId];
    DB.update('messages', botId, { text, pending: null, error: ok ? null : true, model });
    DB.update('ai_logs', logId, { status: ok ? 'ok' : 'error', model, error: ok ? null : text.slice(0, 200) });
    Chat.renderList([]);
  },
  /** Kopyala-yapıştırda gelen boşluk/satır sonu/tırnakları temizlenmiş anahtar */
  key() { const s = DB.get('settings') || {}; return String(s.geminiKey || GEMINI_API_KEY || '').trim().replace(/^["'`]+|["'`]+$/g, ''); },
  keyInfo() {
    const k = this.key(); if (!this.hasKey()) return 'tanımlı değil';
    const type = k.startsWith('AQ.') ? 'AQ. — yeni tip "auth key"' : k.startsWith('AIza') ? 'AIza — standart API anahtarı' : 'tanınmayan biçim';
    return `${k.slice(0, 6)}…${k.slice(-4)} · ${k.length} karakter · ${type}`;
  },
  /** Google hata yanıtını anlaşılır Türkçe açıklamaya çevirir */
  explain(status, err = {}) {
    const msg = String(err.message || '').slice(0, 200);
    const reason = (err.details || []).map(d => d && d.reason).filter(Boolean)[0] || err.status || '';
    const g = msg ? `\n(Google: ${msg})` : '';
    const isAQ = this.key().startsWith('AQ.');
    if (status === 401 && /ACCESS_TOKEN_TYPE_UNSUPPORTED/i.test(reason + msg))
      return `401 · ACCESS_TOKEN_TYPE_UNSUPPORTED — Google bu anahtar türünü kabul etmedi${isAQ ? ' (AQ. ile başlayan yeni tip anahtar)' : ''}.\nÇözüm: Google Cloud Console → APIs & Services → Credentials → "Create credentials → API key" ile yeni bir anahtar oluştur, "API restrictions" kısmında yalnızca "Generative Language API"yi seç ve bu anahtarı GEMINI_API_KEY satırına yaz.${g}`;
    if (status === 401)
      return `401 · Kimlik doğrulama başarısız (${reason || 'UNAUTHENTICATED'}). Anahtar eksik/yanlış kopyalanmış, silinmiş veya bu API için geçersiz olabilir. Yönetici panelindeki "Bağlantıyı test et" ile anahtarı kontrol et.${g}`;
    if (/API_KEY_INVALID|api key not valid/i.test(reason + msg)) return `API anahtarı geçersiz (${status}). GEMINI_API_KEY değerini yeniden kopyala.${g}`;
    if (status === 403 && /SERVICE_DISABLED|has not been used|is disabled/i.test(reason + msg)) return `403 · Generative Language API bu Google Cloud projesinde kapalı. Cloud Console → APIs & Services → Library → "Generative Language API" → Enable.${g}`;
    if (status === 403 && /REFERRER|referer/i.test(reason + msg)) return `403 · Anahtarın web sitesi kısıtlaması bu sayfaya izin vermiyor. Anahtarın "Website restrictions" listesine bu sayfanın adresini ekle.${g}`;
    if (status === 403) return `403 · Anahtarın bu isteğe izni yok (${reason || 'PERMISSION_DENIED'}). Anahtar kısıtlamasının "Generative Language API"yi içerdiğinden emin ol.${g}`;
    if (status === 429) return `429 · Gemini kullanım kotası doldu. Biraz sonra tekrar dene.${g}`;
    return `Gemini hatası (${status}${reason ? ' · ' + reason : ''}).${g}`;
  },
  /** Tek istek. auth: 'header' (x-goog-api-key) veya 'query' (?key=) */
  /** Tek istek. auth: 'header' (x-goog-api-key) veya 'query' (?key=).
      Tarayıcı isteği tamamlayamazsa, ön kontrol (CORS preflight) gerektirmeyen "basit istek" ile bir kez daha dener. */
  async request(model, body, auth = 'header') {
    const k = this.key(), base = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    const url = auth === 'query' ? `${base}?key=${encodeURIComponent(k)}` : base;
    const headers = { 'Content-Type': 'application/json' }; if (auth === 'header') headers['x-goog-api-key'] = k;
    let res, firstErr;
    try { res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) }); }
    catch (e) { firstErr = e; }
    if (!res) {
      try { res = await fetch(`${base}?key=${encodeURIComponent(k)}`, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body) }); }
      catch (e2) { const er = new Error(await this.networkError(firstErr || e2)); er.status = 0; throw er; }
    }
    let data = {}; try { data = await res.json(); } catch (e) {}
    return { status: res.status, ok: res.ok, data };
  },
  /** Akışlı istek: streamGenerateContent?alt=sse → getReader() + TextDecoder ile "data: {...}" satırlarını okur.
      onText(birikmişMetin, yeniParça) her parçada çağrılır. Tarayıcı isteği hiç gönderemezse null döner (normal isteğe düşülür). */
  async requestStream(model, body, onText, signal) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`;
    let res;
    try { res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': this.key() }, body: JSON.stringify(body), signal }); }
    catch (e) { if (e && e.name === 'AbortError') throw e; return null; }
    if (!res.ok) { let data = {}; try { data = await res.json(); } catch (e) {} return { status: res.status, ok: false, data }; }
    let text = '', finish = null, block = null, err = null;
    const line = raw => {
      const l = raw.trim(); if (!l.startsWith('data:')) return;
      const p = l.slice(5).trim(); if (!p || p === '[DONE]') return;
      let j; try { j = JSON.parse(p); } catch (e) { return; }
      if (j.error) { err = j.error; return; }
      const c = j.candidates && j.candidates[0];
      if (c && c.finishReason && c.finishReason !== 'STOP') finish = c.finishReason;
      if (j.promptFeedback && j.promptFeedback.blockReason) block = j.promptFeedback.blockReason;
      const piece = ((c && c.content && c.content.parts) || []).filter(x => !x.thought).map(x => x.text || '').join('');
      if (piece) { text += piece; try { onText(text, piece); } catch (e) {} }
    };
    if (res.body && res.body.getReader) {
      const reader = res.body.getReader(), dec = new TextDecoder('utf-8');
      let buf = '';
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (signal && signal.aborted) { try { reader.cancel(); } catch (e) {} const ab = new Error('Durduruldu'); ab.name = 'AbortError'; throw ab; }
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let i; while ((i = buf.indexOf('\n')) >= 0) { line(buf.slice(0, i)); buf = buf.slice(i + 1); }
        }
      } catch (e) { if (e && e.name === 'AbortError') throw e; if (!text) return null; }
      buf += dec.decode(); buf.split('\n').forEach(line);
    } else { (await res.text()).split('\n').forEach(line); }
    if (err && !text) return { status: err.code || 500, ok: false, data: { error: err } };
    return { status: res.status, ok: true, streamed: true, text, finish, block };
  },
  /** Ağ hatasının gerçek sebebini ölçer ve tek, net bir açıklama üretir */
  async diagnose() {
    let framed = false; try { framed = window.top !== window; } catch (e) { framed = true; }
    let reach = false;
    try { await fetch('https://generativelanguage.googleapis.com/$discovery/rest?version=v1beta', { mode: 'no-cors', cache: 'no-store' }); reach = true; } catch (e) { reach = false; }
    const where = location.protocol === 'file:' ? 'bilgisayardaki dosyadan (file://)' : (location.host || location.protocol);
    return { framed, reach, online: navigator.onLine !== false, where };
  },
  async networkError(e) {
    const d = await this.diagnose();
    const info = `\n— Teşhis: sayfa ${d.where} açılmış${d.framed ? ', başka bir uygulamanın penceresi içinde' : ''} · internet: ${d.online ? 'var' : 'yok'} · Google'a erişim: ${d.reach ? 'var' : 'YOK'}${e && e.message ? ' · tarayıcı: ' + e.message : ''}`;
    if (!d.online) return `İnternet bağlantısı yok. Bağlantını kontrol edip tekrar dene.${info}`;
    if (!d.reach && d.framed) return `Sayfa başka bir uygulamanın önizleme penceresinde açılmış ve bu pencere dış bağlantıları engelliyor.\nÇözüm: index.html dosyasını Chrome veya Edge ile aç (dosyaya sağ tık → Birlikte aç → Chrome) ya da Netlify adresinden gir.${info}`;
    if (!d.reach) return `Tarayıcın veya ağın Google'ın yapay zeka adresine (generativelanguage.googleapis.com) erişimi engelliyor.\nÇözüm sırasıyla: 1) Reklam engelleyici / tarayıcı eklentisi varsa bu site için kapat. 2) Antivirüs veya şirket/okul ağı engelliyor olabilir: telefonun mobil verisiyle (Wi-Fi kapalı) dene. 3) Farklı bir tarayıcıyla (Chrome/Edge) dene.${info}`;
    return `Google'a ulaşılıyor, fakat Google isteği tarayıcının okuyamayacağı şekilde reddetti. Bu genellikle API anahtarından kaynaklanır${this.key().startsWith('AQ.') ? ' (AQ. ile başlayan yeni tip anahtarlar tarayıcıdan çağrıldığında sık reddediliyor)' : ''}.\nÇözüm: Google Cloud Console → Kimlik bilgileri → "+ Kimlik bilgisi oluştur → API anahtarı" ile AIza ile başlayan yeni bir anahtar oluştur, "API kısıtlamaları"nda yalnızca Generative Language API'yi seç ve o anahtarı kullan.${info}`;
  },
  /** Anahtarın erişebildiği güncel metin modellerini Google'dan listeler (oturum boyunca önbellekte tutulur) */
  async discover() {
    if (this._models && NOW() - this._modelsAt < 6 * HOUR) return this._models;
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: { 'x-goog-api-key': this.key() } });
      if (!r.ok) return [];
      const j = await r.json();
      const ver = n => { const m = /gemini-(\d+(?:\.\d+)?)/.exec(n); return m ? parseFloat(m[1]) : 0; };
      const list = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => String(m.name || '').replace(/^models\//, ''))
        .filter(n => /^gemini/.test(n) && /flash/.test(n) && !/tts|image|live|audio|embed|transcribe|robotics|thinking|exp/.test(n));
      list.sort((a, b) => (/preview/.test(a) - /preview/.test(b)) || (/lite/.test(a) - /lite/.test(b)) || ver(b) - ver(a));
      this._models = list.slice(0, 5); this._modelsAt = NOW();
      return this._models;
    } catch (e) { return []; }
  },
  /** Modelleri sırayla dener; 404'te yedek modele geçer, 401'de anahtarı ikinci yöntemle bir kez daha dener */
  async call(body, onText, signal) {
    if (!this.hasKey()) throw new Error('Gemini API anahtarı tanımlı değil. index.html içinde Firebase ayarlarının hemen altındaki GEMINI_API_KEY satırına anahtarını yaz.');
    if (this.key() === firebaseConfig.apiKey) throw new Error('GEMINI_API_KEY satırına Firebase anahtarı yazılmış. Gemini için ayrı bir anahtar gerekir (Google AI Studio veya Google Cloud Console → Credentials).');
    // Bir kez çalışan model bulunduysa doğrudan onunla başla (kapalı modele her soruda boşuna istek atma)
    const live = await this.discover();
    const models = [...new Set([this.workingModel, GEMINI_MODEL, ...live, ...GEMINI_FALLBACK_MODELS].filter(Boolean))].slice(0, 7);
    let lastErr = null, busyErr = null;
    const once = async (model, auth = 'header') => {
      if (signal && signal.aborted) { const e = new Error('Durduruldu'); e.name = 'AbortError'; throw e; }
      let r = onText && auth === 'header' ? await this.requestStream(model, body, onText, signal) : null;
      return r || this.request(model, body, auth);
    };
    for (const model of models) {
      let r = await once(model);
      if (r.status === 401) {
        // İkinci yöntem (?key=) yalnızca bir şanstır; o da başarısız olursa asıl 401 hatası gösterilir
        try { const r2 = await this.request(model, body, 'query'); if (r2.ok || (r2.status !== 401 && r2.status !== 0)) r = r2; } catch (e) { /* asıl 401 yanıtı korunur */ }
      }
      if (r.status === 503 || r.status === 500 || r.status === 429) {
        await new Promise(res => setTimeout(res, 1200));
        const r2 = await once(model).catch(e => { if (e && e.name === 'AbortError') throw e; return null; });
        if (r2 && r2.ok) r = r2;
        else { busyErr = new Error(r.status === 429 ? 'Gemini kullanım kotası doldu, biraz sonra tekrar dene.' : 'Gemini şu an çok yoğun (Google kaynaklı geçici durum). Birkaç saniye sonra tekrar dene.'); busyErr.status = r.status; continue; }
      }
      if (r.status === 404 || (r.status === 400 && /not (found|supported)|is not available/i.test(JSON.stringify(r.data || {})))) { lastErr = new Error(`Model bulunamadı: ${model}`); continue; }
      if (!r.ok) { const e = new Error(this.explain(r.status, r.data && r.data.error)); e.status = r.status; throw e; }
      let text, why;
      if (r.streamed) { text = (r.text || '').trim(); why = r.block || r.finish; }
      else {
        const cand = r.data.candidates && r.data.candidates[0];
        text = ((cand && cand.content && cand.content.parts) || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
        why = r.data.promptFeedback?.blockReason || cand?.finishReason;
        if (text && onText) onText(text, text);   // akış kullanılamadıysa cevap yine daktilo ile yazılır
      }
      if (!text) throw new Error(why && why !== 'STOP' ? `Gemini bu soruya yanıt vermedi (${why}).` : 'Gemini boş yanıt döndürdü.');
      this.workingModel = model;
      return { text: text.slice(0, 4000), model };
    }
    throw busyErr || new Error(`Bu anahtarla kullanılabilen bir Gemini metin modeli bulunamadı (denenenler: ${models.join(', ')}). Yönetici panelindeki "Bağlantıyı test et" sonucunu kontrol et.`);
  },
  async ask(question, me, onText) {
    const s = DB.get('settings');
    const recent = Chat.list('general').filter(m => !m.pending && m.text).slice(-11, -1)
      .map(m => `${m.bot ? 'Gemini Asistan' : Chat.senderName(m)}: ${m.text.slice(0, 400)}`).join('\n');
    const system = `Sen "${s.teamName}" ekibinin Squad Pulse uygulamasındaki ekip sohbetinde çalışan yardımcı asistansın (Gemini Asistan). ` +
      `Ekip sohbetinde herkes cevabını görür. Varsayılan olarak Türkçe, samimi, kısa ve net yanıt ver (gerekmedikçe 150 kelimeyi geçme). Gerekirse madde işaretleri kullan.`;
    return this.call({
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: (recent ? `Sohbetin son mesajları (bağlam için):\n${recent}\n\n` : '') + `${me.name} soruyor: ${question}` }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
    }, onText);
  },
  /** Yönetici panelindeki bağlantı testi — ai_logs'a yazmaz, sohbete mesaj göndermez */
  async test() {
    const t0 = Date.now();
    try { const r = await this.call({ contents: [{ role: 'user', parts: [{ text: 'Bağlantı testi. Sadece "tamam" yaz.' }] }], generationConfig: { maxOutputTokens: 400 } });
      return { ok: true, text: `✅ Bağlantı başarılı · model: ${r.model} · ${Date.now() - t0} ms · yanıt: "${r.text.slice(0, 40)}"` }; }
    catch (e) { const ms = this._models && this._models.length ? `\n— Anahtarın eriştiği modeller: ${this._models.join(', ')}` : '\n— Google model listesi alınamadı (anahtar ya da ağ).'; return { ok: false, text: '❌ ' + e.message + ms }; }
  }
};

/* ---- Daktilo efekti: akışla gelen metni kelime kelime yazar (geride kaldıkça hızlanır) ---- */
class Typer {
  constructor(paint) { this.paint = paint; this.target = ''; this.n = 0; this.timer = null; this.done = false; this.waiters = []; }
  push(full) { full = String(full || ''); if (!full.startsWith(this.target.slice(0, this.n))) this.n = 0; this.target = full; this.kick(); }
  kick() { if (!this.timer) this.timer = setTimeout(() => this.step(), document.hidden ? 0 : 32); }
  step() {
    this.timer = null; const s = this.target, left = s.length - this.n;
    if (left <= 0) { this.flush(); return; }
    if (document.hidden) this.n = s.length;   // sekme arka plandaysa beklemeden tamamla
    else {
      let p = this.n; const words = Math.max(1, Math.ceil(left / 90));
      for (let w = 0; w < words && p < s.length; w++) { while (p < s.length && /\s/.test(s[p])) p++; while (p < s.length && !/\s/.test(s[p])) p++; }
      this.n = p;
    }
    this.paint(s.slice(0, this.n));
    if (this.n < s.length) this.kick(); else this.flush();
  }
  flush() { if (this.done && this.n >= this.target.length) this.waiters.splice(0).forEach(f => f()); }
  /** Akış bitti: kalan kelimeler yazılınca çözülür (en fazla 8 sn) */
  finish() {
    this.done = true;
    return new Promise(res => {
      const safety = setTimeout(() => { this.n = this.target.length; this.paint(this.target); this.waiters.splice(0).forEach(f => f()); }, 8000);
      this.waiters.push(() => clearTimeout(safety), res); this.kick();
    });
  }
  stop() { clearTimeout(this.timer); this.timer = null; this.waiters.splice(0).forEach(f => f()); }
}

const AiTopics = {
  get(id) { return AI_TOPICS.find(x => x.id === id) || AI_TOPICS[AI_TOPICS.length - 1]; },
  of(text) {
    const q = ' ' + String(text || '').toLocaleLowerCase('tr-TR') + ' ';
    let best = 'other', bs = 0;
    AI_TOPICS.forEach(tp => { const sc = tp.kw.reduce((a, k) => a + (q.includes(k) ? (k.length > 5 ? 2 : 1) : 0), 0); if (sc > bs) { bs = sc; best = tp.id; } });
    return best;
  },
  ofLog(l) { return l.topic || this.of(l.q || l.title); },
  count(logs) {
    const m = {}; logs.forEach(l => { const id = this.ofLog(l); m[id] = (m[id] || 0) + 1; });
    return Object.entries(m).map(([id, n]) => ({ ...this.get(id), n })).sort((a, b) => b.n - a.n);
  }
};

const AiChat = {
  busy: false, ctrl: null, atBottom: true, draft: '', msgs: [], owner: null,
  storeKey() { return 'squadpulse.aichat.' + (Auth.current || 'anon'); },
  list() {
    if (this.owner !== Auth.current) {
      this.owner = Auth.current;
      try { this.msgs = JSON.parse(localStorage.getItem(this.storeKey()) || '[]') || []; } catch (e) { this.msgs = []; }
      if (!Array.isArray(this.msgs)) this.msgs = [];

  },
  persist() { try { localStorage.setItem(this.storeKey(), JSON.stringify(this.msgs.slice(-80))); } catch (e) { /* depolama dolu/kapalı: sohbet yalnızca bu oturumda kalır */ } },
  /** Gemini'a gönderilecek çok turlu konuşma (roller sırayla user/model olmalı) */
  body(hist, me) {
    const s = DB.get('settings'), contents = [];
    hist.filter(m => !m.pending && !m.error && m.text).slice(-16).forEach(m => {
      const role = m.role === 'user' ? 'user' : 'model', text = m.text.slice(0, 3000), last = contents[contents.length - 1];
      if (last && last.role === role) last.parts[0].text += '\n\n' + text; else contents.push({ role, parts: [{ text }] });
    });
    while (contents.length && contents[0].role !== 'user') contents.shift();
    const system = `Sen "${s.teamName}" sosyal medya ajansında çalışan ${me.name}${me.title ? ' (' + me.title + ')' : ''} için kişisel yapay zeka asistanısın. ` +
      `Bu sohbet özeldir, ekip görmez. Varsayılan olarak Türkçe, samimi, net ve uygulanabilir yanıt ver; gerektiğinde madde işaretleri ve **kalın** vurgular kullan. Uzun içerik istenirse eksiksiz yaz.`;
    return { systemInstruction: { parts: [{ text: system }] }, contents, generationConfig: { temperature: 0.8, maxOutputTokens: 4096 } };
  },
  async send(textArg) {
    const inp = $('#aiInput'), me = Auth.user();
    const text = String(textArg != null ? textArg : (inp ? inp.value : '')).trim();
    if (!text || !me) return;
    if (this.busy) { toast('Asistan hâlâ yazıyor — bitmesini bekle ya da durdur'); return; }
    if (inp && textArg == null) { inp.value = ''; this.grow(inp); }
    this.draft = '';
    const t = NOW(), rnd = () => Math.random().toString(36).slice(2, 7), list = this.list();
    const um = { id: 'u' + t.toString(36) + rnd(), role: 'user', text: text.slice(0, 4000), at: t };
    const bm = { id: 'a' + t.toString(36) + rnd(), role: 'model', text: '', at: t + 1, pending: true };
    list.push(um, bm); this.persist();
    const logId = 'l' + t.toString(36) + rnd();
    DB.insert('ai_logs', { id: logId, userId: me.id, userName: me.name, title: Gemini.title(text), q: text.slice(0, 300), topic: AiTopics.of(text), src: 'private', at: t, status: 'pending' });
    // Boş cam balon anında görünür, cevap geldikçe kelime kelime dolar
    Gemini.live[bm.id] = ''; this.busy = true; this.atBottom = true;
    this.renderList([um.id, bm.id]); this.renderBtn();
    const ctrl = this.ctrl = new AbortController();
    const typer = new Typer(shown => Gemini.paint(bm.id, shown));
    let ok = true, model = null, out = '';
    try {
      const r = await Gemini.call(this.body(list.slice(0, -1), me), full => { out = full; typer.push(full); }, ctrl.signal);
      out = r.text; model = r.model; typer.push(out); await typer.finish();
    } catch (e) {
      typer.stop();
      if (e && e.name === 'AbortError') out = (out ? out.trim() + '\n\n' : '') + '⏹️ (durduruldu)';
      else { ok = false; out = '⚠️ ' + (e.message || 'Bilinmeyen hata'); console.warn('[asistan]', e); }
    }
    delete Gemini.live[bm.id];
    Object.assign(bm, { text: out.slice(0, 12000), pending: false, error: ok ? null : true, model });
    this.persist();
    DB.update('ai_logs', logId, { status: ok ? 'ok' : 'error', model, error: ok ? null : out.slice(0, 200) });
    this.busy = false; this.ctrl = null;
    this.renderList([]); this.renderBtn();
  },

  async reset() {

  grow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; },
  afterRender() {
    const el = $('#aiList'); if (!el) return;
    el.scrollTop = this.atBottom ? el.scrollHeight : el.scrollTop;
    el.addEventListener('scroll', () => { this.atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80; }, { passive: true });
    const i = $('#aiInput'); if (i) this.grow(i);
  }
};

/* ---- Haftalık yardım raporu: her pazartesi geçen haftanın konularını özetler (ekip ayarlarında kişi başına saklanır) ---- */
const AiWeekly = {
  key(uid) { return 'aiWk_' + uid; },
  get(uid) { const s = DB.get('settings') || {}; return s[this.key(uid)] || null; },
  logs(uid, from, to) { return DB.get('ai_logs').filter(l => l && l.userId === uid && l.at >= from && l.at < to && l.status !== 'error'); },
  lastWeek() { const to = T.sow(NOW()); return { from: T.addDays(to, -7), to }; },
  range(from, to) { return `${T.fmt(from, { day: 'numeric', month: 'short' })} – ${T.fmt(T.addDays(to, -1), { day: 'numeric', month: 'short' })}`; },
  topics(rep) { return Object.values((rep && rep.topics) || {}).filter(Boolean).map(x => ({ ...AiTopics.get(x.id), n: x.n })); },
  fallback(topics, total) { const top = topics[0]; return top ? `Geçen hafta asistana ${total} soru sordun; en çok "${top.label}" konusunda yardım aldın.${topics[1] ? ` Ardından "${topics[1].label}" geliyor.` : ''}` : ''; },
  /** Geçen haftanın raporu yoksa bir kez oluşturur */
  async ensure(uid = Auth.current) {
    if (!uid || this.busy || !DB.get('settings')) return;
    const { from, to } = this.lastWeek(), wk = T.key(from), cur = this.get(uid);
    if ((cur && cur.week === wk) || this.tried === uid + wk) return;
    this.tried = uid + wk; this.busy = true;
    const logs = this.logs(uid, from, to), counted = AiTopics.count(logs);
    const rep = { week: wk, from, to, at: NOW(), total: logs.length, topics: counted.map(x => ({ id: x.id, n: x.n })), summary: '' };
    if (logs.length && Gemini.hasKey()) {
      const u = DB.find('users', uid);
      const qs = logs.slice(-60).map(l => '- ' + (l.q || l.title)).join('\n');
      try {
        const r = await Gemini.call({ contents: [{ role: 'user', parts: [{ text:
          `Aşağıda sosyal medya ajansı çalışanı ${u ? u.name : 'bir ekip üyesi'}'in geçen hafta yapay zeka asistanına sorduğu sorular var. ` +
          `Türkçe ve en fazla 3 kısa cümleyle: hangi konularda en çok yardım aldığını özetle ve gelecek hafta için 1 somut gelişim önerisi ver. Başlık veya madde işareti kullanma, ona "sen" diye hitap et.\n\n` +
          `Konu dağılımı: ${counted.map(x => `${x.label} ${x.n}`).join(', ')}\n\nSorular:\n${qs}` }] }],
          generationConfig: { temperature: 0.5, maxOutputTokens: 1024 } });
        rep.summary = r.text.slice(0, 700);
      } catch (e) { console.warn('[haftalık rapor]', e); }
    }
    this.busy = false;
    DB.patchSettings({ [this.key(uid)]: rep });
    if (rep.total) toast('📅 Haftalık yapay zeka raporun hazır — <b>Asistan</b> sayfasında', 'success');
    if (App.view === 'assistant') this.refresh();
  },
  refresh() { const w = $('#aiWeekly'); if (w) w.innerHTML = Views.aiWeekly(Auth.current); }
};

function toast(msg, type = 'info') {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast ' + type;
  el.innerHTML = `${ic(type === 'success' ? 'check' : type === 'error' ? 'x' : 'sparkles', 17)}<span>${msg}</span>`;
  box.appendChild(el); setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 3000);
}
const Modal = {
  el: null, onClose: null,
  open({ title, body, actions = [], onMount, onClose }) {
    this.close(true);
    const w = document.createElement('div'); w.className = 'modal-backdrop';
    w.innerHTML = `<div class="card modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>${title}</h3><button class="btn-icon sm" data-close>${ic('x', 16)}</button></div><div class="modal-body">${body}</div>${actions.length ? `<div class="modal-foot">${actions.map((a, i) => `<button class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${a.label}</button>`).join('')}</div>` : ''}</div>`;
    w.addEventListener('mousedown', e => { if (e.target === w) this.close(); });
    w.querySelector('[data-close]').onclick = () => this.close();
    w.querySelectorAll('.modal-foot [data-i]').forEach(b => b.onclick = () => { const a = actions[+b.dataset.i]; if ((a.onClick ? a.onClick(w) : undefined) !== false) this.close(); });
    document.body.appendChild(w); requestAnimationFrame(() => w.classList.add('show'));
    this.el = w; this.onClose = onClose || null; if (onMount) onMount(w); return w;
  },
  close(silent) { if (!this.el) return; const el = this.el, cb = this.onClose; this.el = null; this.onClose = null; el.classList.remove('show'); setTimeout(() => el.remove(), 200); if (cb && !silent) cb(); if (App.pending) App.scheduleRender(); }
};
function confirmBox(title, text, okLabel = 'Onayla', danger = true) {
  return new Promise(res => { let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    Modal.open({ title, body: `<p class="muted">${text}</p>`, onClose: () => fin(false), actions: [{ label: 'Vazgeç', onClick: () => fin(false) }, { label: okLabel, cls: danger ? 'btn-danger' : 'btn-primary', onClick: () => fin(true) }] }); });
}

function fileToAvatar(file) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/')) return rej(new Error('Lütfen bir görsel dosyası seç.'));
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const S = 200, c = document.createElement('canvas'); c.width = c.height = S; const m = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S); res(c.toDataURL('image/jpeg', .85)); }; img.onerror = () => rej(new Error('Görsel okunamadı.')); img.src = r.result; };
    r.onerror = () => rej(new Error('Dosya okunamadı.')); r.readAsDataURL(file);
  });
}

  chatBack() { Chat.back(); },
  gemHint() { const i = $('#chatInput'); if (!i) return; if (!/^\s*@gemini/i.test(i.value)) i.value = '@Gemini ' + i.value.replace(/^\s+/, ''); Chat.drafts.general = i.value; i.focus(); try { i.setSelectionRange(i.value.length, i.value.length); } catch (e) {} },
  unlockAdmin() { AdminGate.prompt(); },
  async testGemini(el) {

  exportAiLogs() {

    download(`squad-pulse-gemini-loglari-${T.key(NOW())}.csv`, '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8'); toast('Loglar indirildi', 'success');
  },
  async clearAiLogs() {
    if (!await confirmBox('Gemini loglarını temizle', 'Tüm yapay zeka kullanım kayıtları kalıcı olarak silinecek.', 'Temizle')) return;
    DB.multi({ ai_logs: null }); toast('Loglar temizlendi'); App.render();

  async clearTime() {

    DB.multi({ sessions: null, days: null }); DB.get('users').forEach(u => { if (u.pomo) DB.update('users', u.id, { pomo: null }); }); toast('Zaman kayıtları temizlendi'); App.render();
  },
  async resetAll() {
    if (!await confirmBox('Fabrika ayarlarına dön', 'Tüm üyeler, ayarlar ve kayıtlar veritabanından silinip başlangıç kurulumu yeniden oluşturulacak.', 'Sıfırla')) return;
    await DB.multi({ settings: null, users: null, sessions: null, days: null, presence: null, messages: null, ai_logs: null, clients: null, games: null, events: null, dayprep: null, meta: null });
    await Seed.run(); Auth.logout(); Theme.apply(Theme.defaults); App.go('dashboard'); toast('Uygulama sıfırlandı');
  },

  uploadAvatar() { $('#fileAvatar').click(); },
  avatarInitials() { DB.update('users', Auth.current, { avatar: { type: 'initials' } }); App.render(); },
  avatarEmoji(el) { DB.update('users', Auth.current, { avatar: { type: 'emoji', value: el.dataset.v } }); App.render(); },
  profileColor(el) { DB.update('users', Auth.current, { color: el.dataset.v }); App.render(); },
  saveProfile() {
    const name = $('#pfName').value.trim(), title = $('#pfTitle').value.trim(), pin = $('#pfPin').value.trim();
    if (name.length < 2) return toast('Lütfen geçerli bir ad gir.', 'error');
    if (pin && !/^\d{4,6}$/.test(pin)) return toast('PIN 4–6 haneli rakamlardan oluşmalı.', 'error');
    DB.update('users', Auth.current, { name, title: Pet.cursed(Auth.current) ? CURSED_TITLE : title, pin }); toast('Profil kaydedildi', 'success'); App.render();

  setMode(el) { Smooth.run(() => updatePrefs({ mode: el.dataset.v }), { kind: 'reveal', origin: el }); },
  setAccent(el) { updatePrefs({ accent: el.dataset.v }); },
  setBg(el) { updatePrefs({ bg: el.dataset.v }); },
  resetBg() { updatePrefs({ bg: null }); },
  setTexture(el) { updatePrefs({ texture: el.dataset.v }); }
};

/* ---------------- 9. UYGULAMA ÇEKİRDEĞİ ---------------- */
const App = {
  view: 'dashboard', report: { mode: 'daily', date: Date.now() }, pressing: false, pressTimer: null, seenMsgs: new Set(), pendingBots: new Set(), msgSig: '',
  pending: false, renderTimer: null, lastMinute: null, dayKey: null, started: false,

  async init() {
    document.addEventListener('click', e => this.onClick(e));
    document.addEventListener('change', e => this.onChange(e));
    document.addEventListener('input', e => this.onInput(e));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && BreakGuard.el) { BreakGuard.dismiss(); return; }
      if (e.key === 'Escape' && Modal.el) Modal.close();
      if (e.key === 'Enter' && e.target.id === 'chatInput' && !e.shiftKey && !e.isComposing) { e.preventDefault(); Chat.send(); return; }
      if (e.key === 'Enter' && e.target.id === 'aiInput' && !e.shiftKey && !e.isComposing) { e.preventDefault(); AiChat.send(); return; }
      if (e.key === 'Enter' && e.target.id === 'pulseInput') { e.preventDefault(); savePulse(true); e.target.blur(); toast('Durum notu ekiple paylaşıldı', 'success'); }
    });
    document.addEventListener('focusout', e => { const t = e.target; if (t && t.dataset && t.dataset.dirty) { delete t.dataset.dirty; this.onChange({ target: t }); } if (t && t.id === 'pulseInput') savePulse(true); });
    window.addEventListener('hashchange', () => this.route());
    // Emoji / ek panelleri: dışarı tıklayınca veya Esc ile kapanır
    document.addEventListener('pointerdown', e => { if ((Composer.emojiOpen || Composer.attachOpen) && !e.target.closest('#emojiPop, #attachPop, [data-act="emojiToggle"], [data-act="attachMenu"]')) Composer.closePops(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && (Composer.emojiOpen || Composer.attachOpen) && !Modal.el) { Composer.closePops(); const i = $('#chatInput'); if (i) i.focus(); } });
    // Sohbet arka planı: canlı yoğunluk / hareket ayarı, dışarı tıklayınca panel kapanır
    document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('cbg-intensity')) ChatBg.set({ intensity: +e.target.value }); });
    document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('cbg-motion')) ChatBg.set({ motion: e.target.checked }); });
    document.addEventListener('pointerdown', e => { if (ChatBg.open && !e.target.closest('#cbgPop, [data-act="chatBgToggle"]')) ChatBg.toggle(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && ChatBg.open && !Modal.el && !BreakGuard.el) ChatBg.toggle(false); });
    document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('soft-switch') && e.target.checked !== SoftMode.on()) SoftMode.toggle(e.target.closest('.switch')); });
    // Görevlerim kartı: görev ekleme formu
    document.addEventListener('submit', e => {
      if (!e.target || e.target.id !== 'tkAdd') return;
      e.preventDefault();
      const ti = $('#tkTitle'), due = $('#tkDue');
      if (!Tasks.add(ti.value, TaskUI.tab, $('#tkPrio').value, due ? due.value : '')) { ti.focus(); toast('Lütfen bir görev adı yaz', 'error'); return; }
      ti.value = ''; toast(TaskUI.tab === 'daily' ? 'Günlük görev eklendi' : 'Haftalık görev eklendi', 'success');
      App.render(); const n = $('#tkTitle'); if (n) n.focus();
    });
    // Müşteri listesi: arama ve sıralama (yalnızca liste yeniden çizilir)
    document.addEventListener('input', e => { if (e.target && e.target.id === 'clSearch') { Clients.ui.q = e.target.value; const l = $('#clList'); if (l) l.innerHTML = Views.clientList(); } });
    document.addEventListener('change', e => { if (e.target && e.target.id === 'clSort') { Clients.ui.sort = e.target.value; const l = $('#clList'); if (l) l.innerHTML = Views.clientList(); } });
    // Sosyal Alan: hız testi (anında tepki için pointerdown), formlar, klavye, sayaç
    document.addEventListener('pointerdown', e => { const pad = e.target.closest && e.target.closest('[data-reflex]'); if (pad && !pad.disabled) { e.preventDefault(); GAMES.reflex.press(pad.dataset.reflex); } });
    document.addEventListener('submit', e => {
      const f = e.target; if (!f || !f.dataset) return;
      if (f.dataset.hmsolve) { e.preventDefault(); const i = f.querySelector('input'); const v = i.value; i.value = ''; if (v.trim()) GAMES.hangman.solve(f.dataset.hmsolve, v); }
      if (f.dataset.aubid) { e.preventDefault(); const i = f.querySelector('input'); const v = +i.value; if (!v && v !== 0) return; GAMES.auction.bid(f.dataset.aubid, v).then(ok => { if (ok) { const n = $('#auAmt'); if (n) n.value = ''; } }); }
    });
    document.addEventListener('change', e => { const t = e.target; if (t && t.dataset && t.dataset.aulot) GAMES.auction.editLot(t.dataset.aulot, +t.dataset.i, t.dataset.f, t.value); });
    document.addEventListener('keydown', e => {
      if (this.view !== 'social' || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '') || Modal.el) return;
      const g = GameHub.focus && GameHub.get(GameHub.focus); if (!g || g.type !== 'hangman' || g.status !== 'active' || !g.s || g.s.turn !== Auth.current) return;
      const L = TR_UP(e.key); if (L.length === 1 && TR_ALPHA.includes(L)) { e.preventDefault(); GAMES.hangman.guess(g.id, L); }
    });
    setInterval(() => { if (this.view === 'social' || GameHub.inviteEl || GameHub.myActive().length) GameHub.clock(); }, 250);
    // Yönetici: Gemini anahtarını kaydet ve test et
    document.addEventListener('submit', async e => {
      if (!e.target || e.target.id !== 'gemKeyForm') return;
      e.preventDefault();
      const i = $('#gemKeyIn'), k = i.value.trim().replace(/^["'`]+|["'`]+$/g, '');
      if (!k) { toast('Anahtarı yapıştır', 'error'); return; }
      if (k.startsWith('ya29.')) { toast('Bu bir Gemini API anahtarı değil (geçici oturum jetonu). AI Studio\'daki "Create API key" ile anahtar oluştur.', 'error'); return; }
      if (!/^(AIza[0-9A-Za-z_\-]{30,}|AQ\.[0-9A-Za-z_.\-]{30,})$/.test(k)) { toast('Anahtar AIza… ya da AQ.… ile başlamalı — kopyalarken eksik kalmış olabilir', 'error'); return; }
      DB.patchSettings({ geminiKey: k }); Gemini.workingModel = null; i.value = '';
      toast('Anahtar kaydedildi, test ediliyor…'); const b = $('#gemTestBtn'); if (b) Actions.testGemini(b);
    });
    // Panoya kopyalanan görseli yapıştırma
    document.addEventListener('paste', e => { if (!e.target || e.target.id !== 'chatInput') return; const fl = [...((e.clipboardData && e.clipboardData.files) || [])]; if (fl.length) { e.preventDefault(); Composer.add(fl); } });
    // Sohbete dosya sürükle-bırak
    let dragDepth = 0;
    const isFileDrag = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
    document.addEventListener('dragenter', e => { const cm = e.target.closest && e.target.closest('.chat-main'); if (!cm || !isFileDrag(e)) return; dragDepth++; cm.classList.add('drop-on'); });
    document.addEventListener('dragleave', e => { const cm = e.target.closest && e.target.closest('.chat-main'); if (!cm) return; if (--dragDepth <= 0) { dragDepth = 0; cm.classList.remove('drop-on'); } });
    document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('.chat-main') && isFileDrag(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
    document.addEventListener('drop', e => { const cm = e.target.closest && e.target.closest('.chat-main'); if (!cm) return; e.preventDefault(); dragDepth = 0; cm.classList.remove('drop-on'); const fl = [...((e.dataTransfer && e.dataTransfer.files) || [])]; if (fl.length) Composer.add(fl); });
    const onPageScroll = () => document.documentElement.classList.toggle('is-scrolled', (window.scrollY || document.documentElement.scrollTop || 0) > 8);
    window.addEventListener('scroll', onPageScroll, { passive: true });
    onPageScroll();
    document.addEventListener('scroll', e => { if (e.target && e.target.id === 'chatList') { const l = e.target; Chat.stick = l.scrollHeight - l.scrollTop - l.clientHeight < 80; } }, true);
    const onResize = () => Chat.stickToBottom();
    window.addEventListener('resize', onResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && this.view === 'chat' && Chat.convVisible()) { Chat.markRead(); this.updateChatBadge(); } });
    const press = () => { this.pressing = true; clearTimeout(this.pressTimer); this.pressTimer = setTimeout(() => this.release(), 4000); };
    document.addEventListener('pointerdown', press, true);
    document.addEventListener('touchstart', press, { capture: true, passive: true });
    ['pointerup', 'pointercancel', 'touchend', 'touchcancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(this.pressTimer); this.pressTimer = setTimeout(() => this.release(), 350); }, { capture: true, passive: true }));
    window.addEventListener('beforeunload', () => { if ($('#pulseInput')) savePulse(true); Meet.leave(true); Voice.leave(true); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { const u = Auth.user(); if (u && Theme.prefs(u).mode === 'system') this.render(); });

    Theme.apply(Theme.defaults);
    let forceLocal = false; try { forceLocal = localStorage.getItem('squadpulse.forceLocal') === '1'; } catch (e) {}
    const sdk = typeof firebase !== 'undefined' && !!firebase.database;
    if (!forceLocal && !sdk) { $('#root').innerHTML = Views.setup('sdk'); return; }
    Net.mode = forceLocal ? 'local' : 'firebase';
    DB.backend = forceLocal ? LocalBackend : FirebaseBackend;
    $('#root').innerHTML = Views.loading(false);
    const slow = setTimeout(() => { if (!Net.ready) $('#root').innerHTML = Views.loading(true); }, 12000);
    try { await DB.backend.init(); }
    catch (e) { clearTimeout(slow); console.error(e); Net.error = e; $('#root').innerHTML = Views.setup(e); return; }
    clearTimeout(slow);

    // İlk kurulum: veritabanı boşsa yalnızca bir istemci başlangıç verisini yazar
    if (!DB.get('settings') || !DB.get('users').length) {
      const claim = await DB.backend.transaction('meta/seedLock', cur => (cur && NOW() - cur < 15000) ? undefined : NOW());
      if (claim.committed || !(await this.waitFor(() => DB.get('settings') && DB.get('users').length, 6000))) await Seed.run();
    }
    Net.ready = true;
    DB.get('messages').forEach(m => m && this.seenMsgs.add(m.id));
    this.dayKey = T.key(NOW());
    Auth.restore();
    if (Auth.current) Presence.attach(Auth.current);
    Tracker.autoClose();
    setInterval(() => this.tick(), 1000);
    setInterval(() => { if (Auth.current) Music.tick(); }, 1000);
    document.addEventListener('submit', e => { const f = e.target; if (f && f.matches && f.matches('[data-mu-form]')) { e.preventDefault(); const i = f.querySelector('#muUrl'); if (Music.add(i.value)) i.value = ''; } });
    document.addEventListener('visibilitychange', () => Wallpaper.sync());
    Perf.apply(); Perf.measure();
    Notify.initSW();
    NotifyGate.watch();
    this.started = true;
    this.route();
  },
  /** Yeni sohbet mesajı geldiğinde: sohbet açıksa yalnızca liste güncellenir, değilse rozet + bildirim */
  onMessages() {
    const all = Chat.all();
    const answered = all.filter(m => m.bot && !m.pending && this.pendingBots.has(m.id));
    answered.forEach(m => this.pendingBots.delete(m.id));
    all.filter(m => m.bot && m.pending).forEach(m => this.pendingBots.add(m.id));
    const fresh = all.filter(m => !this.seenMsgs.has(m.id));
    if (Auth.current && this.started) Nudge.incoming(fresh);
    DB.get('messages').forEach(m => m && this.seenMsgs.add(m.id));
    if (!Auth.current) return;
    const inChat = this.view === 'chat' && !!$('#chatList');
    const convVisible = inChat && Chat.convVisible();
    // Gemini cevabı sonradan tamamlandığında (kimliği zaten görülmüş olsa da) bildirim göster
    answered.forEach(m => { if ((!(convVisible && Chat.inChannel(m)) || Notify.background()) && !fresh.some(f => f.id === m.id)) fresh.push(m); });
    const sig = Chat.list().map(m => m.id + (m.pending ? 'p' : '') + (Gemini.live[m.id] != null ? 'L' : (m.text || '').length) + ':' + attsOf(m).length).join('|');
    const changed = sig !== this.msgSig; this.msgSig = sig;
    if (inChat) {
      const here = fresh.filter(m => Chat.inChannel(m));
      if (here.length || changed) Chat.renderList(here.map(m => m.id));
      if (convVisible && !document.hidden) Chat.markRead();
      Chat.renderSide();
    }
    // Yeni mesajlar: sayfa arka plandaysa sistem bildirimi, öndeyse (açık konuşmada değilse) toast
    Notify.handle(fresh, convVisible);
    Help.check(); Meet.onChat(fresh);
    this.updateChatBadge();
  },
  updateChatBadge() {
    const n = Chat.unreadTotal();
    document.title = n ? `(${n > 99 ? '99+' : n}) ${Notify.BASE_TITLE}` : Notify.BASE_TITLE;   // arka plandaki sekmede de görünür
    const b = $('#chatBadge'); if (!b) return;
    b.textContent = n > 99 ? '99+' : n; b.hidden = !n;
  },
  release() { this.pressing = false; if (this.pending && !Modal.el) this.scheduleRender(); },
  waitFor(fn, ms) { return new Promise(res => { const t0 = Date.now(); const iv = setInterval(() => { if (fn()) { clearInterval(iv); res(true); } else if (Date.now() - t0 > ms) { clearInterval(iv); res(false); } }, 150); }); },
  allowed(v) { const n = NAV.find(x => x.id === v); return n && (!n.admin || Auth.isAdmin()); },
  /** Sekme değiştirme — adres çubuğuna bağımlı değil, gömülü önizleyicilerde de çalışır */
  go(view, instant) {
    if (!this.started) return;
    // Akışkan geçiş: farklı bir sekmeye geçerken mevcut içerik kısaca solar, yenisi süzülerek gelir
    const next = this.allowed(view) ? view : 'dashboard', main = $('#main');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (main && next !== this.view && !instant) {
      this._leaving = true; main.classList.add('page-leave');
      clearTimeout(this._navTimer);
      this._navTimer = setTimeout(() => { this._leaving = false; this.go(next, true); }, 140);
      return;
    }
    clearTimeout(this._navTimer); this._leaving = false;
    this.view = next;
    try { if (location.hash !== '#/' + this.view) history.replaceState(null, '', '#/' + this.view); } catch (e) { /* sandbox: adres güncellenemedi, sorun değil */ }
    clearTimeout(this.renderTimer); this.pending = false;
    this.render();
    window.scrollTo(0, 0);
    if (this.view === 'aipanel' && !AdminGate.unlocked) setTimeout(() => AdminGate.prompt(), 60);
  },
  /** Adres çubuğundan veya geri tuşundan gelen değişiklikler */
  route() {
    if (!this.started) return;
    let v = 'dashboard';
    let q = '';
    try { [v, q = ''] = (location.hash.replace(/^#\/?/, '') || 'dashboard').split('?'); } catch (e) {}
    const c = new URLSearchParams(q).get('c');
    if (v === 'chat' && c && Auth.user()) { Chat.channel = DB.find('users', c) || Chat.isRoom(c) ? c : 'general'; Chat.pane = 'conv'; Chat.forceBottom = true; }
    if (v === this.view && $('#tabBar') && !c) return;
    this.view = this.allowed(v) ? v : 'dashboard';
    this.render();
  },
  /** Alt menü / yan menü butonlarına doğrudan tıklama dinleyicisi bağlar (her çizimden sonra) */
  bindNav() {
    $$('#tabBar [data-nav]').forEach(btn => btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      this.pressing = false;
      if (btn.dataset.nav === 'chat') Chat.pane = 'list';   // telefonda Sohbet sekmesi önce konuşma listesini açar
      this.go(btn.dataset.nav);
    }));
  },
  /** Uzak değişiklik geldiğinde — kısa gecikmeyle toplu yeniden çizim */
  onRemote(col) {
    if (!this.started) return;
    if (col === 'meet' || col === 'signals' || col === '*') { Meet.onRemote(); Voice.onRemote(); if (col !== '*') return; }
    if (col === 'messages' || col === '*') this.onMessages();
    if (col === 'messages') return;
    if (col === 'ai_logs') { if (this.view === 'aipanel' && AdminGate.unlocked) this.scheduleRender(); if (this.view === 'assistant') AiWeekly.refresh(); return; }
    if (col === 'games') { GameHub.checkInvites(); if (this.view === 'social') this.scheduleRender(); return; }   // oyun hamleleri diğer sayfaları yeniden çizmez   // sohbet mesajları sayfanın tamamını yeniden çizmez
    if (Auth.current && !DB.find('users', Auth.current)) { Auth.logout(); }
    if (col === 'settings' || col === '*') Music.sync();
    this.scheduleRender();
  },
  scheduleRender() {
    clearTimeout(this.renderTimer);
    this.renderTimer = setTimeout(() => {
      // Modal açıkken veya parmak/mouse ekrana basılıyken yeniden çizme — aksi halde dokunulan buton değişir ve tıklama kaybolur
      if (Modal.el || this.pressing) { this.pending = true; return; }
      this.pending = false; this.render();
    }, 60);
  },
  updateNet() { const b = $('#netBadge'); if (b) b.outerHTML = netBadge(); },
  render() {
    if (!this.started) return;
    if (Net.error && Net.ready) { $('#root').innerHTML = Views.setup(Net.error); return; }
    const u = Auth.user();
    if (!u) { Wallpaper.sync(); Music.renderUI(); NotifyGate.hide(); BreakGuard.hide(); Pet.hidePicker(); Widget.render(); delete document.body.dataset.view; Theme.apply(Theme.defaults); $('#root').innerHTML = Views.login(); return; }
    if (!this.allowed(this.view)) this.view = 'dashboard';
    // Yazı yazarken gelen canlı güncellemeler odağı ve imleci bozmasın
    const ae = document.activeElement, y = window.scrollY;
    const cl = $('#chatList'), chatAtBottom = !cl || cl.scrollHeight - cl.scrollTop - cl.clientHeight < 80, chatTop = cl ? cl.scrollTop : 0;
    const keep = ae && ae.id && $('#root').contains(ae) && 'value' in ae ? { id: ae.id, value: ae.value, s: ae.selectionStart, e: ae.selectionEnd } : null;
    Theme.apply(u.prefs);
    $('#root').innerHTML = Views.shell();
    $('#main').innerHTML = (Views[this.view] || Views.dashboard)();
    if (this._shownView !== this.view) {
      const first = this._shownView === undefined; this._shownView = this.view;
      const m = $('#main'), tb = $('.topbar'), nav = $('#tabBar');
      if (!first && !this._vtNav) {
        m.classList.add('page-enter'); if (tb) tb.classList.add('title-enter'); if (nav) nav.classList.add('nav-anim');
        clearTimeout(this._enterTimer);
        this._enterTimer = setTimeout(() => { const mm = $('#main'), t2 = $('.topbar'), n2 = $('#tabBar'); if (mm) mm.classList.remove('page-enter'); if (t2) t2.classList.remove('title-enter'); if (n2) n2.classList.remove('nav-anim'); }, 800);
      }
    }
    if (keep) {
      const el = document.getElementById(keep.id);
      if (el) {
        if (!['checkbox', 'color', 'range', 'file'].includes(el.type) && el.value !== keep.value) { el.value = keep.value; if (el.dataset.setting || el.dataset.field) el.dataset.dirty = '1'; }
        el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {}
      }
    }
    if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
    const ncl = $('#chatList');
    if (ncl) { ncl.scrollTop = (chatAtBottom || Chat.forceBottom) ? ncl.scrollHeight : chatTop; Chat.forceBottom = false; const ci = $('#chatInput'); if (ci) Chat.autoGrow(ci); if (!document.hidden && Chat.convVisible()) Chat.markRead(); }
    this.bindNav();
    if (Auth.current && !Tasks.map(Auth.current)) setTimeout(() => Tasks.ensure(), 0);   // örnek görevleri bir kez oluştur
    document.body.dataset.view = this.view;
    Meet.mount(); Meet.renderPill(); Voice.render(); Help.check();
    Wallpaper.sync(); Music.renderUI();
    if (VoiceMsg.rec && !$('#vrecSlot')) VoiceMsg.stop(false);   // sohbetten çıkılınca yarım kayıt iptal
    else if (VoiceMsg.rec) VoiceMsg.renderUI();
    if (VoiceMsg.cur) VoiceMsg.paint();
    if (this.view === 'assistant') AiChat.afterRender();
    if ((this.view === 'assistant' || this.view === 'dashboard') && !AiWeekly.busy) setTimeout(() => AiWeekly.ensure(), 1500);
    Nudge.afterRender();
    ChatBg.apply();
    SoftMode.apply();
    Widget.render();
    BreakGuard.check();
    NotifyGate.check();
    Pet.check();
    GameHub.checkInvites();
    this.updateChatBadge();
    this.tick(true);
  },
  renderMain() { this.render(); },

  onClick(e) { const el = e.target.closest('[data-act]'); if (!el) return; const fn = Actions[el.dataset.act]; if (!fn) return; e.preventDefault(); fn(el, e); },
  async onChange(e) {
    const t = e.target;
    if (t.dataset && t.dataset.mdev) { MeetDev.choose(t.dataset.mdev, t.value); return; }
    if (t.id === 'fileAvatar') { const f = t.files[0]; t.value = ''; if (!f) return; try { DB.update('users', Auth.current, { avatar: { type: 'image', value: await fileToAvatar(f) } }); toast('Profil fotoğrafı güncellendi', 'success'); this.render(); } catch (err) { toast(err.message, 'error'); } return; }
    if (t.id === 'fileImport') {
      const f = t.files[0]; t.value = ''; if (!f) return;
      try {
        const json = JSON.parse(await f.text()), d = json.data || json;
        if (!d.users || !d.settings) throw new Error('Geçersiz yedek dosyası.');
        const users = toMap(d.users);
        if (!await confirmBox('Yedekten yükle', `${Object.keys(users).length} üye ve ${Object.keys(toMap(d.sessions)).length} kayıt yüklenecek. Mevcut veriler HERKES için değiştirilecek.`, 'Yükle')) return;
        await DB.multi({ settings: { ...Seed.settings(), ...d.settings }, users, sessions: toMap(d.sessions), days: toMap(d.days), messages: toMap(d.messages), ai_logs: toMap(d.ai_logs), clients: toMap(d.clients), events: toMap(d.events), dayprep: toMap(d.dayprep) });
        if (!DB.find('users', Auth.current)) Auth.logout();
        toast('Yedek yüklendi', 'success'); this.render();
      } catch (err) { toast(err.message || 'Dosya okunamadı', 'error'); }
      return;
    }
    if (t.id === 'reportDate' && t.value) { this.report.date = T.fromKey(t.value); this.render(); return; }
    if (t.id === 'profileColorInput') { DB.update('users', Auth.current, { color: t.value }); this.render(); return; }
    if (t.dataset.field) {
      const f = t.dataset.field, v = t.value.trim(), a = Tracker.activity(t.dataset.aid);
      if ((f === 'name' || f === 'emoji') && !v) { t.value = a[f]; return; }
      if (f === 'kind' && a.work && !a.deep && v !== 'work' && Tracker.visibleActivities().filter(x => x.work && !x.deep).length < 2) { t.value = a.kind; return toast('En az bir normal çalışma aktivitesi kalmalı.', 'error'); }
      if (f === 'kind' && v === 'break' && a.work && Tracker.visibleActivities().filter(x => x.work).length < 2) { t.value = a.kind; return toast('En az bir çalışma aktivitesi kalmalı.', 'error'); }
      updateActivity(t.dataset.aid, { [f]: v });
      if (f === 'kind' || f === 'color') this.render();
      toast('Aktivite güncellendi', 'success'); return;
    }
    if (t.dataset.setting) {
      const k = t.dataset.setting; let v = t.type === 'checkbox' ? t.checked : t.value;
      const nums = { dailyGoal: [1, 16, 8], pomoFocus: [5, 120, 25], pomoBreak: [1, 60, 5], pomoLong: [5, 90, 15], pomoEvery: [2, 8, 4] };
      if (nums[k]) { v = clamp(parseFloat(String(v).replace(',', '.')) || nums[k][2], nums[k][0], nums[k][1]); t.value = v; }
      if (k === 'teamName') v = String(v).trim() || 'Ekibim';
      if (String(DB.get('settings')[k]) === String(v)) return;
      DB.patchSettings({ [k]: v }); toast('Ayar kaydedildi — tüm ekibe yansıdı', 'success');
      if (k === 'teamName' || k === 'notifyGate') this.render(); return;
    }
    if (t.dataset.notify) {
      const u = Auth.user(), prefs = { ...Theme.prefs(u), notify: { ...Notify.prefs(u), [t.dataset.notify]: t.checked } };
      DB.update('users', u.id, { prefs }); toast('Bildirim tercihi kaydedildi', 'success'); return;
    }
    if (t.dataset.pref) updatePrefs({ [t.dataset.pref]: t.dataset.pref === 'texOpacity' ? +t.value : t.value });
  },
  onInput(e) {
    const t = e.target;
    if (t.id === 'pulseInput') savePulse(false);
    if (t.id === 'chatInput') { Chat.drafts[Chat.channel] = t.value; Chat.autoGrow(t); }
    if (t.id === 'aiInput') { AiChat.draft = t.value; AiChat.grow(t); }
    if (t.dataset.wpRange) { const k = t.dataset.wpRange, v = +t.value; Wallpaper.save({ [k]: v }); const o = $(k === 'dim' ? '#wpDimVal' : '#wpBlurVal'); if (o) o.textContent = k === 'dim' ? '%' + Math.round(v * 100) : v + 'px'; }
    if (t.dataset.muVol != null) Music.setVol(t.value);
    if (t.dataset.pref === 'texOpacity') { document.documentElement.style.setProperty('--tex-opacity', t.value); const v = $('#texVal'); if (v) v.textContent = '%' + Math.round(t.value * 100); }
  },

  /** Saniyelik canlı güncelleme: sayaçlar, geri sayımlar, pomodoro geçişleri */
  tick(force) {
    if (!this.started || !Auth.user()) return;
    const t = NOW(), sod = T.sod(t), eod = T.eod(t), memo = {}, goal = DB.get('settings').dailyGoal * HOUR;
    const sum = id => memo[id] || (memo[id] = Tracker.summary(id === '*' ? null : id, sod, eod));
    $$('[data-live]').forEach(el => {
      const id = el.dataset.uid;
      switch (el.dataset.live) {
        case 'clock': el.textContent = new Date(t).toLocaleTimeString('tr-TR'); break;
        case 'since': el.textContent = T.clock(t - +el.dataset.start); break;
        case 'sum': el.textContent = T.dur(sum(id)[el.dataset.field]); break;
        case 'teamwork': el.textContent = T.dur(sum('*').work); break;
        case 'act': el.textContent = T.dur(sum(id).byAct[el.dataset.aid] || 0); break;
        case 'bar': el.style.width = Math.min(100, sum(id).work / goal * 100).toFixed(1) + '%'; break;
        case 'countdown': el.textContent = T.mmss(+el.dataset.end - t); break;
        case 'ago': el.textContent = T.ago(+el.dataset.at); break;
        case 'pring': { const C = parseFloat(el.getAttribute('stroke-dasharray')), s = +el.dataset.start, en = +el.dataset.end, p = clamp((t - s) / (en - s), 0, 1); el.setAttribute('stroke-dashoffset', (C * (1 - p)).toFixed(1)); el.style.opacity = p > .002 ? 1 : 0; break; }
      }
    });
    if (force) return;
    Pomo.check();
    const minute = Math.floor(t / MIN); if (minute === this.lastMinute) return; this.lastMinute = minute;
    BreakGuard.check();
    Pet.check();
    if (!(Widget.el && Widget.el.classList.contains('dragging'))) Widget.render();
    if (T.key(t) !== this.dayKey) { this.dayKey = T.key(t); Tracker.autoClose(); this.scheduleRender(); return; }
    $$('[data-live="timeline"]').forEach(el => { el.innerHTML = Charts.timeline(el.dataset.uid, +el.dataset.day, el.dataset.compact === '1'); });
    if (this.view === 'reports' && !Modal.el) { const r = this.report, from = r.mode === 'daily' ? T.sod(r.date) : T.sow(r.date), to = r.mode === 'daily' ? T.eod(r.date) : T.addDays(from, 7); if (t >= from && t < to) this.scheduleRender(); }
  }
};

App.init();
</script>
</body>
</html>
