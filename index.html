const Chat = {
  channel: 'general',     // 'general' = genel sohbet · 'lounge' = serbest (iş dışı) sohbet · aksi halde özel sohbetteki karşı tarafın userId'si
  ROOMS: { general: 'Genel Sohbet', lounge: 'Serbest Sohbet' },
  isRoom(ch = this.channel) { return ch === 'general' || ch === 'lounge'; },
  roomOf(m) { return m.recipientId ? null : (m.room === 'lounge' ? 'lounge' : 'general'); },
  pane: 'list',           // mobilde hangi panel görünür: 'list' (konuşma listesi) | 'conv' (konuşma)
  drafts: {},             // konuşma başına gönderilmemiş taslaklar
  stick: true, forceBottom: false, _read: {},
  /** Mesaj bu konuşmaya mı ait? recipientId boşsa genel, doluysa yalnızca gönderen ile alıcı arasında */
  inChannel(m, ch = this.channel, me = Auth.current) {
    if (ch === 'general') return !m.recipientId && m.room !== 'lounge';
    if (ch === 'lounge') return !m.recipientId && m.room === 'lounge';
    return (m.userId === me && m.recipientId === ch) || (m.userId === ch && m.recipientId === me);
  },
  /** Bu kullanıcının görebileceği tüm mesajlar: genel + dahil olduğu özel mesajlar */
  all() {
    const me = Auth.current;
    return DB.get('messages').filter(m => m && !m.mt && (m.text || m.pending || m.nudge || attsOf(m).length) && (!m.recipientId || m.userId === me || m.recipientId === me))
      .sort((a, b) => (a.at - b.at) || (a.id < b.id ? -1 : 1));
  },
  list(ch = this.channel) { return this.all().filter(m => this.inChannel(m, ch)); },
  lastMsg(ch) { const l = this.list(ch); return l[l.length - 1]; },
  peers() {
    return DB.get('users').filter(u => u.id !== Auth.current)
      .sort((a, b) => ((this.lastMsg(b.id) || {}).at || 0) - ((this.lastMsg(a.id) || {}).at || 0) || a.name.localeCompare(b.name, 'tr'));
  },
  readKey(ch = this.channel) { const base = 'squadpulse.chatRead.' + Auth.current; return ch === 'general' ? base : ch === 'lounge' ? base + '.lounge' : base + '.dm.' + ch; },
  lastRead(ch = this.channel) { const k = this.readKey(ch); try { const v = localStorage.getItem(k); if (v !== null) return +v || 0; } catch (e) {} return this._read[k] || 0; },
  markRead(ch = this.channel) {
    const last = this.list(ch).reduce((a, m) => Math.max(a, m.at || 0), 0);
    if (last <= this.lastRead(ch)) return;
    const k = this.readKey(ch); this._read[k] = last; try { localStorage.setItem(k, String(last)); } catch (e) {}
    App.updateChatBadge(); this.renderSide();
  },
  unread(ch = this.channel) { if (!Auth.current) return 0; const lr = this.lastRead(ch); return this.list(ch).filter(m => m.userId !== Auth.current && m.at > lr).length; },
  unreadTotal() { if (!Auth.current) return 0; return ['general', 'lounge', ...this.peers().map(u => u.id)].reduce((a, ch) => a + this.unread(ch), 0); },
  /** Konuşma ekranı gerçekten görünüyor mu? (mobilde liste paneli açıkken okundu sayılmaz) */
  convVisible() { const el = $('#chatList'); return !!(el && el.offsetParent !== null); },
  open(ch) {
    Meet.view = false;
    if (!this.isRoom(ch) && !DB.find('users', ch)) ch = 'general';
    this.channel = ch; this.pane = 'conv'; this.stick = true; this.forceBottom = true;
    if (App.view !== 'chat') App.go('chat'); else App.render();
    if (matchMedia('(min-width: 901px)').matches) { const i = $('#chatInput'); if (i) i.focus(); }
  },
  back() { this.pane = 'list'; App.render(); },
  send() {
    const inp = $('#chatInput'); if (!inp || !Auth.current) return;
    const text = inp.value.replace(/\s+$/, '').replace(/^\s+/, '').slice(0, 1000);
    const files = Composer.list();
    if (files.some(f => f.status === 'loading')) { toast('Ekler hazırlanıyor, bir saniye sonra tekrar dene', 'error'); return; }
    const att = files.filter(f => f.status === 'ready' && f.data).map(f => ({ kind: f.kind, name: f.name, size: f.size, type: f.type, data: f.data }));
    if (!text && !att.length) { inp.focus(); return; }
    if (text && Chat.isRoom() && /^\s*[!/](çal|cal|play|p|geç|gec|skip|dur|pause|devam|resume)\b/i.test(text)) Music.command(text);   // müzik botu komutları
    const m = { id: 'm' + NOW().toString(36) + Math.random().toString(36).slice(2, 7), userId: Auth.current, text, at: NOW() };
    if (att.length) m.att = att;                                     // fotoğraf / video / dosya ekleri
    if (this.channel === 'lounge') m.room = 'lounge';                // serbest sohbet odası
    else if (this.channel !== 'general') m.recipientId = this.channel;   // özel mesaj
    App.seenMsgs.add(m.id);
    DB.insert('messages', m);
    inp.value = ''; this.drafts[this.channel] = ''; this.autoGrow(inp);
    Composer.clear(); Composer.closePops();
    if (matchMedia('(hover: hover) and (pointer: fine)').matches) inp.focus();
    this.renderList([m.id]); this.markRead(); this.renderSide();
    if (this.channel === 'general' && text && Gemini.TRIGGER.test(text)) Gemini.handle(m);   // Gemini yalnızca genel sohbette
  },
  /** Sesli mesajı kaydın başladığı konuşmaya gönderir */
  sendVoice(att, ch = this.channel) {
    if (!Auth.current) return;
    const m = { id: 'm' + NOW().toString(36) + Math.random().toString(36).slice(2, 7), userId: Auth.current, text: '', at: NOW(), att: [att] };
    if (ch === 'lounge') m.room = 'lounge'; else if (ch !== 'general') m.recipientId = ch;
    App.seenMsgs.add(m.id); DB.insert('messages', m);
    if (ch === this.channel) { this.renderList([m.id]); this.markRead(); }
    this.renderSide();
  },
  stickToBottom() { const el = $('#chatList'); if (el && this.stick) el.scrollTop = el.scrollHeight; },
  autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 140) + 'px'; },
  senderName(m) { if (m.bot || m.userId === Gemini.BOT_ID) return Gemini.NAME; const u = DB.find('users', m.userId); return u ? u.name : 'Eski üye'; },
  preview(m) {
    if (!m) return '';
    const who = m.userId === Auth.current ? 'Sen' : (m.bot ? 'Gemini' : firstName(this.senderName(m)));
    const t = m.nudge ? '⚠️ ' + (m.userId === Auth.current ? 'titreşim gönderdin' : 'titreşim gönderdi') : m.pending ? 'düşünüyor…' : m.text ? String(m.text).replace(/```[\s\S]*?```/g, ' ').replace(/[*`#_>]/g, '').replace(/\s+/g, ' ').trim() : attLabel(m);
    return `${who}: ${t}`;
  },
  timeLabel(ts) { if (!ts) return ''; return T.key(ts) === T.key(NOW()) ? T.hm(ts) : T.sod(ts) === T.addDays(T.sod(), -1) ? 'Dün' : T.fmt(ts, { day: 'numeric', month: 'short' }); },
  dayLabel(ts) {
    const d = T.sod(ts), today = T.sod();
    if (d === today) return 'Bugün';
    if (d === T.addDays(today, -1)) return 'Dün';
    return T.fmt(ts, { day: 'numeric', month: 'long', weekday: 'long' });
  },
  /** Mesaj listesini yeniden üretir ve en alta kaydırır (yazma alanına dokunmaz) */
  renderList(popIds = []) {
    const el = $('#chatList'); if (!el) return;
    el.innerHTML = Views.chatMessages(new Set(popIds));
    this.stick = true;
    el.scrollTop = el.scrollHeight;
    requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  },
  /** Sol taraftaki konuşma listesini (rozetler, son mesaj önizlemesi) günceller */
  renderSide() { const el = $('#chatSide'); if (el) el.innerHTML = Views.chatSideItems(); }
};

/* ---- Sohbet ekleri & emoji seçici ----
   • Ekler mesajla birlikte veritabanına data-URL olarak yazılır (ayrı bir dosya sunucusu gerekmez).
   • Fotoğraflar gönderilmeden önce tarayıcıda küçültülür; video ve dosyalar için boyut sınırı vardır.
   • Önizlemeler konuşma bazında tutulur: sohbet değiştirince seçtiğin dosyalar kaybolmaz. */
const ATT_LIMITS = { count: 6, image: 25 * 1024 * 1024, video: 3 * 1024 * 1024, file: 2 * 1024 * 1024, total: 6 * 1024 * 1024 };
const attsOf = m => !m || !m.att ? [] : (Array.isArray(m.att) ? m.att : Object.values(m.att)).filter(a => a && a.data);
const fmtSize = b => { b = +b || 0; return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(b < 10485760 ? 1 : 0).replace('.', ',') + ' MB'; };
const fileExt = n => { const m = /\.([a-z0-9]{1,6})$/i.exec(String(n || '')); return m ? m[1].toUpperCase() : 'DOSYA'; };
function attLabel(m) {
  const a = attsOf(m); if (!a.length) return '';
  const img = a.filter(x => x.kind === 'image').length, vid = a.filter(x => x.kind === 'video').length;
  if (a.length === 1 && a[0].kind === 'audio') return `🎤 Sesli mesaj${a[0].dur ? ' (' + VoiceMsg.fmt(a[0].dur * 1000) + ')' : ''}`;
  if (img === a.length) return img === 1 ? '📷 Fotoğraf' : `📷 ${img} fotoğraf`;
  if (vid === a.length) return vid === 1 ? '🎬 Video' : `🎬 ${vid} video`;
  if (a.length === 1) return '📎 ' + a[0].name;
  return `📎 ${a.length} ek`;
}
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Dosya okunamadı.')); r.readAsDataURL(file); });
}
/** Fotoğrafı en fazla 1600 px'e küçültüp JPEG'e çevirir; küçük PNG/GIF/WebP dosyaları (saydamlık/animasyon korunsun diye) olduğu gibi kalır */
function compressImage(file, max = 1600, q = .82) {
  if (/^image\/(png|gif|webp)$/.test(file.type) && file.size <= 700 * 1024) return readAsDataURL(file);
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bu görsel biçimi tarayıcıda açılamadı.')); };
    img.src = url;
  });
}

const Composer = {
  files: {},              // konuşma (kanal) başına seçilen ekler
  emojiOpen: false, attachOpen: false, emojiCat: 'smileys',
  inputs: {},
  RECENT_KEY: 'squadpulse.emojiRecent',
  list(ch = Chat.channel) { return this.files[ch] || (this.files[ch] = []); },
  recent() { try { const v = JSON.parse(localStorage.getItem(this.RECENT_KEY) || '[]'); return Array.isArray(v) ? v.slice(0, 32) : []; } catch (e) { return this._recent || []; } },
  pushRecent(e) { const r = [e, ...this.recent().filter(x => x !== e)].slice(0, 32); this._recent = r; try { localStorage.setItem(this.RECENT_KEY, JSON.stringify(r)); } catch (err) {} },

  /* --- Emoji paneli --- */
  toggleEmoji(force) {
    this.emojiOpen = typeof force === 'boolean' ? force : !this.emojiOpen;
    if (this.emojiOpen) { this.attachOpen = false; if (this.emojiCat === 'recent' && !this.recent().length) this.emojiCat = 'smileys'; }
    this.syncPops();
  },
  setCat(c) { if (!EMOJI[c]) return; this.emojiCat = c; const p = $('#emojiPop'); if (p) p.innerHTML = Views.emojiPanel(); },
  insert(emoji) {
    const inp = $('#chatInput'); if (!inp) return;
    const max = +inp.getAttribute('maxlength') || 1000;
    if (inp.value.length + emoji.length > max) { toast('Mesaj uzunluk sınırına ulaşıldı', 'error'); return; }
    const s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    inp.value = inp.value.slice(0, s) + emoji + inp.value.slice(e);
    const pos = s + emoji.length;
    Chat.drafts[Chat.channel] = inp.value; Chat.autoGrow(inp);
    if (matchMedia('(hover: hover) and (pointer: fine)').matches) inp.focus({ preventScroll: true });
    try { inp.setSelectionRange(pos, pos); } catch (err) {}
    this.pushRecent(emoji);
  },

  /* --- Ek menüsü (mobil) ve dosya seçiciler --- */
  toggleAttach(force) { this.attachOpen = typeof force === 'boolean' ? force : !this.attachOpen; if (this.attachOpen) this.emojiOpen = false; this.syncPops(); },
  closePops() { if (!this.emojiOpen && !this.attachOpen) return; this.emojiOpen = this.attachOpen = false; this.syncPops(); },
  syncPops() {
    const ep = $('#emojiPop'), ap = $('#attachPop');
    if (ep) { if (this.emojiOpen) ep.innerHTML = Views.emojiPanel(); ep.hidden = !this.emojiOpen; }
    if (ap) ap.hidden = !this.attachOpen;
    $$('[data-act="emojiToggle"]').forEach(b => { b.classList.toggle('on', this.emojiOpen); b.setAttribute('aria-expanded', this.emojiOpen); });
    $$('[data-act="attachMenu"]').forEach(b => { b.classList.toggle('on', this.attachOpen); b.setAttribute('aria-expanded', this.attachOpen); });
  },
  pick(kind) {
    this.closePops();
    let inp = this.inputs[kind];
    if (!inp) {
      inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.hidden = true;
      if (kind === 'image') inp.accept = 'image/*'; else if (kind === 'video') inp.accept = 'video/*';
      inp.addEventListener('change', () => { const fl = [...inp.files]; inp.value = ''; this.add(fl, kind); });
      document.body.appendChild(inp); this.inputs[kind] = inp;
    }
    inp.click();
  },

  /* --- Ek listesi --- */
  kindOf(f, hint) {
    if (f.type.startsWith('image/') && hint !== 'file') return 'image';
    if (f.type.startsWith('video/') && hint !== 'file') return 'video';
    return 'file';
  },
  bytes(list) { return list.reduce((a, x) => a + (x.data ? Math.round((x.data.length - x.data.indexOf(',') - 1) * .75) : x.size), 0); },
  add(fileList, hint) {
    const ch = Chat.channel, list = this.list(ch);
    const files = [...(fileList || [])]; if (!files.length) return;
    let added = 0;
    for (const f of files) {
      if (list.length >= ATT_LIMITS.count) { toast(`Bir mesaja en fazla ${ATT_LIMITS.count} ek eklenebilir`, 'error'); break; }
      const kind = this.kindOf(f, hint);
      const lim = ATT_LIMITS[kind];
      if (f.size > lim) { toast(`${f.name}: ${kind === 'image' ? 'görsel' : kind === 'video' ? 'video' : 'dosya'} en fazla ${fmtSize(lim)} olabilir`, 'error'); continue; }
      if (!f.size && kind === 'file') { toast(`${f.name}: boş dosya eklenemez`, 'error'); continue; }
      if (kind !== 'image' && this.bytes(list) + f.size > ATT_LIMITS.total) { toast(`Toplam ek boyutu ${fmtSize(ATT_LIMITS.total)} sınırını aşıyor`, 'error'); continue; }
      const item = { id: uid('a'), kind, name: f.name || (kind === 'image' ? 'görsel.jpg' : 'dosya'), size: f.size, type: f.type || 'application/octet-stream', url: kind === 'file' ? '' : URL.createObjectURL(f), data: '', status: 'loading' };
      list.push(item); added++;
      (kind === 'image' ? compressImage(f) : readAsDataURL(f)).then(data => {
        if (!list.includes(item)) return;                       // bu arada kaldırıldıysa
        item.data = data; item.status = 'ready';
        if (kind === 'image') { item.type = data.slice(5, data.indexOf(';')) || item.type; item.size = Math.round((data.length - data.indexOf(',') - 1) * .75); }
        if (this.bytes(list.filter(x => x.status === 'ready')) > ATT_LIMITS.total) { this.remove(item.id, ch); toast(`${item.name}: toplam ek boyutu sınırı aşıldı`, 'error'); return; }
        this.renderTray();
      }).catch(err => { this.remove(item.id, ch); toast(`${item.name}: ${err.message}`, 'error'); });
    }
    if (added) { this.renderTray(); if (matchMedia('(hover: hover) and (pointer: fine)').matches) { const i = $('#chatInput'); if (i) i.focus({ preventScroll: true }); } }
  },
  remove(id, ch = Chat.channel) {
    const list = this.list(ch), i = list.findIndex(x => x.id === id); if (i < 0) return;
    const [it] = list.splice(i, 1); if (it.url) URL.revokeObjectURL(it.url);
    if (ch === Chat.channel) this.renderTray();
  },
  clear(ch = Chat.channel) { this.list(ch).forEach(x => x.url && URL.revokeObjectURL(x.url)); this.files[ch] = []; if (ch === Chat.channel) this.renderTray(); },
  renderTray() { const t = $('#attTray'); if (t) t.innerHTML = Views.attTray(); }
};

Views.emojiPanel = () => {

/** Mesaj balonundaki ekleri üretir. Yalnızca data: adresleri kabul edilir (başka kullanıcıdan gelen veri güvenliği) */
Views.msgAtts = m => {
  const a = attsOf(m); if (!a.length) return '';
  const media = a.filter(x => x.kind === 'image').length;
  return `<div class="att-grid ${a.length === 1 || media <= 1 ? 'one' : ''}">${a.map((x, i) => {

    if (x.kind === 'audio' && /^data:audio\//.test(data)) return Views.voiceMsg(m, x, i);
    if (x.kind === 'video' && /^data:video\//.test(data)) return `<video class="att-m-vid" src="${esc(data)}" controls playsinline preload="metadata" title="${name}"></video>`;

/* ---- Görevler & İzin talebi analizi ----
   Görevler users/{id}/tasks altında tutulur (ek veritabanı kuralı gerekmez):
     { title, scope: 'daily' | 'weekly', priority: 'urgent' | 'high' | 'normal', due?: 'YYYY-MM-DD', done?: bool, doneOn?: 'YYYY-MM-DD', createdAt }
   • Günlük görevler her gün yenilenir: doneOn bugünün tarihiyse tamamlanmış sayılır.
   • Haftalık görevler son tarihlidir; "haftalık" kapsam = önümüzdeki 7 gün + süresi geçmiş açık işler.
   İzin ihtimali; görev tamamlama oranları, izin gününden önce bitmesi gereken acil işler,
   son 7 günün çalışma süresi, talebin ne kadar önceden yapıldığı ve uzun mola durumundan hesaplanır. */
const PRIO = { urgent: { label: 'Acil', color: '#ef4444' }, high: { label: 'Yüksek', color: '#f59e0b' }, normal: { label: 'Normal', color: '#94a3b8' } };
const Tasks = {
  map(userId = Auth.current) { const u = DB.find('users', userId); return u && u.tasks && typeof u.tasks === 'object' ? u.tasks : null; },
  list(userId = Auth.current) { return Object.entries(this.map(userId) || {}).map(([id, t]) => ({ ...t, id })).filter(t => t && t.title); },
  save(map, userId = Auth.current) { DB.update('users', userId, { tasks: map }); },
  ensure(userId = Auth.current) { if (!userId || this.map(userId) || !DB.find('users', userId)) return; this.save(this.sample(), userId); App.scheduleRender(); },
  isDone(t, tk = T.key(NOW())) { return t.scope === 'daily' ? t.doneOn === tk : !!t.done; },
  sample() {
    const today = T.sod(), k = n => T.key(T.addDays(today, n)), at = NOW(), m = {};
    [
      { title: 'Günlük stand-up notlarını gir', scope: 'daily', priority: 'normal', doneOn: k(0) },
      { title: 'E-posta ve ekip mesajlarını yanıtla', scope: 'daily', priority: 'normal' },
      { title: 'Gün sonu durum raporunu yaz', scope: 'daily', priority: 'high' },
      { title: 'Kritik hata kayıtlarını kapat', scope: 'weekly', priority: 'urgent', due: k(1) },
      { title: 'Müşteri sunumunu tamamla', scope: 'weekly', priority: 'urgent', due: k(2) },
      { title: 'Sprint planlamasını güncelle', scope: 'weekly', priority: 'high', due: k(1), done: true },
      { title: 'Tasarım revizyonlarını işle', scope: 'weekly', priority: 'high', due: k(3) },
      { title: 'Haftalık raporu hazırla', scope: 'weekly', priority: 'normal', due: k(4) },
      { title: 'Proje dokümantasyonunu güncelle', scope: 'weekly', priority: 'normal', due: k(5), done: true }
    ].forEach((t, i) => { m[uid('t')] = { ...t, createdAt: at + i }; });
    return m;
  },
  toggle(id) {
    const map = { ...(this.map() || {}) }, t = map[id]; if (!t) return;
    const tk = T.key(NOW());
    map[id] = t.scope === 'daily' ? { ...t, doneOn: t.doneOn === tk ? null : tk } : { ...t, done: !t.done, doneAt: t.done ? null : NOW() };
    this.save(map);
    if (this.isDone(map[id], tk) && typeof Pet !== 'undefined') Pet.feed({ ...map[id], id });   // görev tamamlandı → pete mama
  },
  remove(id) { const map = { ...(this.map() || {}) }; delete map[id]; this.save(map); },
  add(title, scope, priority, due) {
    title = String(title || '').trim().slice(0, 120); if (!title) return false;
    const map = { ...(this.map() || {}) };
    map[uid('t')] = scope === 'daily' ? { title, scope, priority, createdAt: NOW() } : { title, scope: 'weekly', priority, due: due || T.key(T.addDays(T.sod(), 3)), createdAt: NOW() };
    this.save(map); return true;
  }
};

const Leave = {
  tab: 'weekly',
  state: { date: null, type: 'full', reason: '' },
  /** İzin kabul ihtimali analizi — leaveTs: izin günü (gün başlangıcı), half: yarım gün */
  analyze(userId = Auth.current, leaveTs = T.addDays(T.sod(), 1), half = false) {
    const today = T.sod(), tk = T.key(today), L = T.sod(leaveTs), lk = T.key(L), horizon = T.key(T.addDays(today, 7));
    const all = Tasks.list(userId), goal = (+DB.get('settings').dailyGoal || 8) * HOUR;
    const daily = all.filter(t => t.scope === 'daily');
    const weekly = all.filter(t => t.scope !== 'daily' && t.due && (t.due < horizon || t.due <= lk) && (t.due >= tk || !t.done));
    const dDone = daily.filter(t => Tasks.isDone(t, tk)).length, wDone = weekly.filter(t => t.done).length;
    const open = weekly.filter(t => !t.done), before = open.filter(t => t.due <= lk);
    const urgent = before.filter(t => t.priority === 'urgent').length, high = before.filter(t => t.priority === 'high').length;
    const overdue = open.filter(t => t.due < tk).length;
    const dRate = daily.length ? dDone / daily.length : 1, wRate = weekly.length ? wDone / weekly.length : 1;
    // Son 7 günün (bugün hariç) çalışılan günlerindeki ortalama net süre / günlük hedef
    const wk = Tracker.summary(userId, T.addDays(today, -7), today);
    const workedDays = new Set(DB.get('days').filter(d => d.userId === userId && d.date >= T.key(T.addDays(today, -7)) && d.date < tk).map(d => d.date)).size;
    const ratio = workedDays ? wk.work / workedDays / goal : 0;
    const lead = Math.round((L - today) / DAY), wd = new Date(L).getDay(), weekend = wd === 0 || wd === 6;
    const brk = BreakGuard.info(userId);
    const F = [];
    const f = (label, value, delta) => { F.push({ label, value, delta: Math.round(delta) }); return delta; };
    let p = 35;
    p += f('Haftalık görev tamamlama', `%${Math.round(wRate * 100)} · ${wDone}/${weekly.length}`, wRate * 30);
    p += f('Günlük görev tamamlama', `%${Math.round(dRate * 100)} · ${dDone}/${daily.length}`, dRate * 15);
    if (urgent) p += f('İzinden önce bitmesi gereken acil iş', `${urgent} görev`, -16 * urgent);
    if (high) p += f('İzinden önce bitmesi gereken yüksek öncelikli iş', `${high} görev`, -7 * high);
    if (overdue) p += f('Süresi geçmiş görev', `${overdue} görev`, -5 * overdue);
    if (!wk.work || !workedDays) f('Son 7 günün iş yükü', 'Kayıt yok', 0);
    else p += f('Son 7 günün iş yükü', `Günde ort. ${T.hours(wk.work / workedDays)} sa · hedefin %${Math.round(ratio * 100)}'i`, ratio >= 1 ? 8 : ratio >= .8 ? 3 : ratio >= .5 ? -5 : -10);
    p += f('Talep zamanı', lead <= 0 ? 'Aynı gün' : lead === 1 ? '1 gün önceden' : `${lead} gün önceden`, lead <= 0 ? -15 : lead === 1 ? -6 : lead === 2 ? 0 : lead < 7 ? 5 : 8);
    if (half) p += f('İzin türü', 'Yarım gün', 8);
    if (weekend) p += f('İzin günü', 'Hafta sonu', 10);
    if (brk.over) p += f('Bugünkü mola süresi', `${T.dur(brk.day)} · 3 saati aştı`, -8);
    p = Math.round(clamp(p, 3, 97));
    const level = p >= 70 ? 'good' : p >= 40 ? 'mid' : 'bad', color = { good: '#22c55e', mid: '#f59e0b', bad: '#ef4444' }[level];
    let title, msg;
    if (level === 'bad') { title = 'Riskli Bölge'; msg = urgent ? `${urgent} bekleyen acil görev var!` : overdue ? 'Süresi geçmiş görevlerin var!' : lead <= 0 ? 'Aynı gün izin talebi yöneticini zor durumda bırakabilir.' : 'İş yükün şu an çok yoğun.'; }
    else if (level === 'mid') { title = 'Değerlendirilebilir'; msg = before.length ? `İzinden önce ${before.length} görevi bitirmen gerekiyor.` : dRate < 1 ? `Bugün ${daily.length - dDone} günlük görevin kaldı; onları kapatırsan ihtimal yükselir.` : 'Birkaç iş kaldı; önce onları kapatırsan ihtimal yükselir.'; }
    else { title = wRate === 1 && dRate === 1 ? 'Mükemmel zamanlama' : 'Uygun zamanlama'; msg = wRate === 1 ? 'Haftalık görevler tamam!' : 'Kritik bekleyen iş yok, ekip seni rahatça idare eder.'; }
    return { p, level, color, title, msg, factors: F, daily, weekly, open, before, urgent, overdue, dDone, wDone, lk };
  },
  /** Önümüzdeki 14 gün içinde ihtimalin en yüksek olduğu iş günü */
  best(userId = Auth.current, half = false) {
    let best = null;
    for (let i = 1; i <= 14; i++) {
      const d = T.addDays(T.sod(), i), wd = new Date(d).getDay(); if (wd === 0 || wd === 6) continue;
      const a = this.analyze(userId, d, half); if (!best || a.p > best.p) best = { ts: d, p: a.p, color: a.color };
    }
    return best;
  },
  quick(userId = Auth.current) { if (!Tasks.map(userId)) return null; return this.analyze(userId, this.nextWorkday()); },
  nextWorkday() { let d = T.addDays(T.sod(), 1); while ([0, 6].includes(new Date(d).getDay())) d = T.addDays(d, 1); return d; },
  leaveTs() { const v = this.state.date; if (!v) return this.nextWorkday(); const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d).getTime(); },

  open() {
    if (!Auth.current) return;
    Tasks.ensure();
    this.state = { date: T.key(this.nextWorkday()), type: 'full', reason: '' };
    const w = Modal.open({
      title: '🏖️ İzin İste · İş yoğunluğu analizi',
      body: `<div class="lv-root">
        <div class="lv-col">
          <div class="lv-form">
            <label class="lbl">İzin günü<input type="date" class="input" id="lvDate" value="${this.state.date}" min="${T.key(T.sod())}"></label>

        </div>
        <div class="lv-col lv-tasks">
          <div class="lv-tasks-head"><h4>Görevlerin</h4><div class="seg lv-seg" id="lvTabs"></div></div>
          <div id="lvTaskList" class="lv-list"></div>
          <form class="lv-add" id="lvAdd" autocomplete="off">
            <input class="input" id="lvNewTitle" maxlength="120" placeholder="Yeni görev ekle…">
            <select class="input" id="lvNewPrio" title="Öncelik"><option value="normal">Normal</option><option value="high">Yüksek</option><option value="urgent">Acil</option></select>
            <input type="date" class="input" id="lvNewDue" title="Son tarih" value="${T.key(T.addDays(T.sod(), 3))}" min="${T.key(T.sod())}">
            <button type="submit" class="btn-icon" title="Görevi ekle">${ic('plus', 16)} Ekle</button>
          </form>
          <div id="lvHistory"></div>
        </div>
      </div>`,
      actions: [{ label: 'Vazgeç' }, { label: 'Talebi gönder', cls: 'btn-primary', onClick: () => this.send() }],
      onMount: m => {
        const md = m.querySelector('.modal'); if (md) md.classList.add('modal-leave');
        $('#lvDate', m).addEventListener('change', e => { this.state.date = e.target.value || T.key(this.nextWorkday()); this.refresh(); });
        $('#lvReason', m).addEventListener('input', e => { this.state.reason = e.target.value; });
        $('#lvAdd', m).addEventListener('submit', e => {
          e.preventDefault();
          const ok = Tasks.add($('#lvNewTitle', m).value, this.tab, $('#lvNewPrio', m).value, $('#lvNewDue', m).value);
          if (!ok) { $('#lvNewTitle', m).focus(); return; }
          $('#lvNewTitle', m).value = ''; this.refresh(); $('#lvNewTitle', m).focus();
        });
      }
    });
    this.refresh();
    return w;
  },
  setType(v) { this.state.type = v === 'half' ? 'half' : 'full'; $$('.lv-form .lv-seg button').forEach(b => b.classList.toggle('on', b.dataset.v === this.state.type)); this.refresh(); },
  setTab(v) { this.tab = v === 'daily' ? 'daily' : 'weekly'; this.refresh(); },
  refresh() {
    const box = $('#lvAnalysis'); if (!box) return;
    const half = this.state.type === 'half', a = this.analyze(Auth.current, this.leaveTs(), half), b = this.best(Auth.current, half);
    const dateTxt = T.fmt(this.leaveTs(), { day: 'numeric', month: 'long', weekday: 'long' });
    box.innerHTML = `<div class="lv-gauge lv-${a.level}" style="--lv:${a.color}">
        <div class="lv-top"><div class="lv-pct"><b>%${a.p}</b><span>kabul edilme ihtimali</span></div>
          <span class="lv-pill"><i></i>${a.level === 'good' ? 'Yeşil' : a.level === 'mid' ? 'Sarı' : 'Kırmızı'} bölge</span></div>
        <div class="lv-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${a.p}" aria-label="İzin kabul ihtimali">
          <div class="lv-zones"><span></span><span></span><span></span></div><div class="lv-fill" style="width:${a.p}%"></div><div class="lv-mark" style="left:${a.p}%"></div></div>
        <div class="lv-scale"><span>Riskli</span><span>Değerlendirilebilir</span><span>Uygun</span></div>
        <p class="lv-msg"><b>${a.title}</b> — ${esc(a.msg)}</p>
        <p class="lv-date muted sm">${esc(dateTxt)} · ${half ? 'Yarım gün' : 'Tam gün'}</p>
      </div>
      <ul class="lv-factors">${a.factors.map(x => `<li><span>${esc(x.label)}<small>${esc(x.value)}</small></span><em class="${x.delta > 0 ? 'up' : x.delta < 0 ? 'down' : ''}">${x.delta > 0 ? '+' : ''}${x.delta}</em></li>`).join('')}</ul>
      ${b && b.p > a.p ? `<button type="button" class="lv-best" data-act="leaveBest" data-v="${T.key(b.ts)}">${ic('sparkles', 15)} Daha iyi gün: <b>${esc(T.fmt(b.ts, { day: 'numeric', month: 'long', weekday: 'long' }))}</b> <em style="--lv:${b.color}">%${b.p}</em></button>` : ''}`;
    const tabs = $('#lvTabs');
    if (tabs) tabs.innerHTML = `<button type="button" class="${this.tab === 'daily' ? 'on' : ''}" data-act="leaveTab" data-v="daily">Günlük <small>${a.dDone}/${a.daily.length}</small></button><button type="button" class="${this.tab === 'weekly' ? 'on' : ''}" data-act="leaveTab" data-v="weekly">Haftalık <small>${a.wDone}/${a.weekly.length}</small></button>`;
    const due = $('#lvNewDue'); if (due) due.hidden = this.tab === 'daily';
    const list = $('#lvTaskList');
    if (list) {
      const tk = T.key(NOW());
      const items = (this.tab === 'daily' ? a.daily : Tasks.list().filter(t => t.scope !== 'daily'))
        .sort((x, y) => (Tasks.isDone(x, tk) - Tasks.isDone(y, tk)) || ((x.due || '') < (y.due || '') ? -1 : (x.due || '') > (y.due || '') ? 1 : 0) || (x.createdAt || 0) - (y.createdAt || 0));
      list.innerHTML = items.length ? items.map(t => {
        const done = Tasks.isDone(t, tk), pr = PRIO[t.priority] || PRIO.normal, late = !done && t.due && t.due < tk, crit = !done && t.due && t.due <= a.lk;
        const dueTxt = t.scope === 'daily' ? 'Her gün' : t.due === tk ? 'Bugün' : late ? 'Gecikti · ' + T.fmt(new Date(t.due + 'T00:00').getTime(), { day: 'numeric', month: 'short' }) : T.fmt(new Date(t.due + 'T00:00').getTime(), { day: 'numeric', month: 'short', weekday: 'short' });
        return `<div class="lv-task ${done ? 'done' : ''} ${crit ? 'crit' : ''}" style="--p:${pr.color}">
          <button type="button" class="lv-check" data-act="taskToggle" data-id="${esc(t.id)}" aria-pressed="${done}" title="${done ? 'Tamamlanmadı olarak işaretle' : 'Tamamlandı olarak işaretle'}">${done ? ic('check', 13) : ''}</button>
          <div class="lv-tmeta"><b>${esc(t.title)}</b><small><span class="lv-prio">${pr.label}</span> · <span class="${late ? 'late' : ''}">${dueTxt}</span>${crit ? ' · <span class="late">izinden önce</span>' : ''}</small></div>
          <button type="button" class="lv-del" data-act="taskDel" data-id="${esc(t.id)}" title="Görevi sil">${ic('x', 13)}</button>
        </div>`;
      }).join('') : `<p class="muted sm lv-empty">${this.tab === 'daily' ? 'Günlük rutin görevin yok.' : 'Önümüzdeki günler için görev yok.'}</p>`;
    }
    const hist = $('#lvHistory'), u = Auth.user();
    if (hist && u) {
      const reqs = Object.values(u.leaves || {}).filter(Boolean).sort((x, y) => y.at - x.at).slice(0, 3);
      hist.innerHTML = reqs.length ? `<div class="lv-hist"><h5>Son taleplerin</h5>${reqs.map(r => `<div><span>${esc(T.fmt(new Date(r.date + 'T00:00').getTime(), { day: 'numeric', month: 'short', weekday: 'short' }))} · ${r.type === 'half' ? 'Yarım' : 'Tam'} gün</span><em style="--lv:${r.p >= 70 ? '#22c55e' : r.p >= 40 ? '#f59e0b' : '#ef4444'}">%${r.p}</em><small>Yöneticiye iletildi</small></div>`).join('')}</div>` : '';
    }
  },
  send() {
    const u = Auth.user(); if (!u) return false;
    const half = this.state.type === 'half', L = this.leaveTs(), a = this.analyze(u.id, L, half), t = NOW();
    const dateTxt = T.fmt(L, { day: 'numeric', month: 'long', weekday: 'long' });
    const reason = String(this.state.reason || '').trim().slice(0, 300);
    const text = `🏖️ İzin talebi · ${dateTxt} (${half ? 'Yarım gün' : 'Tam gün'})`
      + (reason ? `\nAçıklama: ${reason}` : '')
      + `\nSistem analizi: %${a.p} · ${a.title} — ${a.msg}`
      + `\nGörevler: günlük ${a.dDone}/${a.daily.length} · haftalık ${a.wDone}/${a.weekly.length}${a.urgent ? ` · ${a.urgent} acil bekleyen` : ''}`;
    const admins = DB.get('users').filter(x => x.role === 'admin' && x.id !== u.id);
    const base = () => ({ id: 'm' + NOW().toString(36) + Math.random().toString(36).slice(2, 7), userId: u.id, text, at: t });
    if (admins.length) admins.forEach(ad => { const m = { ...base(), recipientId: ad.id }; App.seenMsgs.add(m.id); DB.insert('messages', m); });
    else { const m = base(); App.seenMsgs.add(m.id); DB.insert('messages', m); }
    const id = uid('lv');
    DB.update('users', u.id, { leaves: { ...(u.leaves || {}), [id]: { date: T.key(L), type: this.state.type, reason, p: a.p, at: t, status: 'pending' } } });
    toast(admins.length ? `İzin talebin ${admins.length > 1 ? 'yöneticilere' : esc(firstName(admins[0].name)) + ' adlı yöneticiye'} özel mesajla iletildi` : 'İzin talebin Genel Sohbet\'e iletildi', 'success');
    return true;
  }
};

/* ---- 3 saat üzeri uyarı (büyük cam modal) ----
   • Kesintisiz çalışma 3 saati geçerse   → "Çok uzun süredir ekrandasın, biraz dinlenmelisin!"
   • Kesintisiz mola 3 saati geçerse      → "Çok uzun süre bu modda kaldın, artık çalışmaya ne dersin?"
   • Günün toplam molası 3 saati geçerse  → bilgilendirme (izin analizine de yansır)
   Her durum için bir kez gösterilir; "30 dk sonra hatırlat" ertelemesi vardır. Yan widget da uyarı rengine geçer.
   Kendi katmanını kullanır: açık olan başka bir pencereyi (ör. İzin İste paneli) kapatmaz. */
const BreakGuard = {
  LIMIT: 3 * HOUR, SNOOZE: 30 * MIN, warned: {}, el: null, shownKey: null,
  info(userId = Auth.current) {
    const open = userId ? Tracker.openSession(userId) : null, t = NOW();
    const a = open ? Tracker.activity(open.activityId) : null;
    const span = open ? t - open.start : 0;
    const cur = a && !a.work ? span : 0, work = a && a.work ? span : 0;
    const day = userId ? Tracker.summary(userId, T.sod(t), T.eod(t)).brk : 0;
    const kind = work >= this.LIMIT ? 'work' : cur >= this.LIMIT ? 'break' : day >= this.LIMIT ? 'day' : null;
    return { cur, work, day, open, act: a, kind, over: cur >= this.LIMIT || day >= this.LIMIT, alert: !!kind };
  },
  key(i, id = Auth.current) { return `${id}|${T.key(NOW())}|${i.kind}|${i.kind === 'day' ? 'day' : i.open ? i.open.id : ''}`; },
  check() {
    const id = Auth.current; if (!id) return this.hide();
    const i = this.info(id);
    if (!i.kind) return this.hide();
    const k = this.key(i, id), w = this.warned[k];
    if (this.el && this.shownKey === k) return this.update(i);
    if (w === true || (typeof w === 'number' && NOW() < w)) return;
    this.warned[k] = true; this.show(i, k);
  },
  copy(i) {
    if (i.kind === 'work') return { icon: i.act && i.act.deep ? '🧠' : '💻', tone: 'rest', title: 'Çok uzun süredir ekrandasın, biraz dinlenmelisin!',
      body: `${i.act && i.act.deep ? 'Deep Work' : 'Çalışma'} modunda <b>${T.dur(i.work)}</b> oldu. Gözlerini dinlendir, su iç, biraz hareket et — 10 dakikalık bir mola odağını tazeler.` };
    if (i.kind === 'break') return { icon: i.act ? i.act.emoji : '☕', tone: 'back', title: 'Çok uzun süre bu modda kaldın, artık çalışmaya ne dersin?',
      body: `<b>${esc(i.act ? i.act.name : 'Mola')}</b> modunda <b>${T.dur(i.cur)}</b> geçti. Hazırsan kaldığın yerden devam edelim.` };
    return { icon: '⏰', tone: 'info', title: 'Bugünkü toplam molan 3 saati aştı',
      body: `Bugün toplam <b>${T.dur(i.day)}</b> mola verdin. Bu durum İzin İste analizindeki ihtimali de düşürür.` };
  },
  show(i, k) {
    if (!this.el) { this.el = document.createElement('div'); this.el.id = 'bigAlert'; this.el.setAttribute('role', 'alertdialog'); this.el.setAttribute('aria-modal', 'true'); document.body.appendChild(this.el); }
    this.shownKey = k;
    const c = this.copy(i), brk = Tracker.pomoBreakId();
    const primary = i.kind === 'work'
      ? (brk ? `<button type="button" class="btn btn-primary" data-act="breakTake" data-id="${esc(brk)}">${ic('coffee', 16)} Mola ver</button>` : '')
      : i.kind === 'break' ? `<button type="button" class="btn btn-primary" data-act="breakBack">${ic('play', 15)} Çalışmaya dön</button>` : '';
    this.el.className = 'tone-' + c.tone;
    this.el.innerHTML = `<div class="ba-card">
        <div class="ba-orb">${c.icon}</div>
        <span class="ba-tag">${ic('clock', 13)} <span class="ba-time">${T.clock(i.kind === 'work' ? i.work : i.kind === 'break' ? i.cur : i.day)}</span></span>
        <h2>${c.title}</h2>
        <p>${c.body}</p>
        <div class="ba-actions">${primary}
          ${i.kind !== 'day' ? `<button type="button" class="btn btn-ghost" data-act="breakSnooze">${ic('bell', 15)} 30 dk sonra hatırlat</button>` : ''}
          <button type="button" class="btn btn-ghost" data-act="breakDismiss">${i.kind === 'day' ? 'Anladım' : 'Kapat'}</button></div>
      </div>`;
    requestAnimationFrame(() => this.el && this.el.classList.add('show'));
    try { Sound.prime(); Sound.beep(); } catch (e) {}
    try { Notify.show({ title: c.title, body: c.body.replace(/<[^>]+>/g, ''), tag: 'squadpulse-break' }); } catch (e) {}
    Widget.render();
  },
  update(i) { const t = this.el && this.el.querySelector('.ba-time'); if (t) t.textContent = T.clock(i.kind === 'work' ? i.work : i.kind === 'break' ? i.cur : i.day); },
  /** Kapatıldıysa bu durum için bugün tekrar gösterme */
  dismiss() { if (this.shownKey) this.warned[this.shownKey] = true; this.hide(); },
  snooze() { if (this.shownKey) this.warned[this.shownKey] = NOW() + this.SNOOZE; toast('30 dakika sonra tekrar hatırlatacağım', 'success'); this.hide(); },
  hide() { if (!this.el) return; const el = this.el; this.el = null; this.shownKey = null; el.classList.remove('show'); setTimeout(() => el.remove(), 260); }
};

/* ---- Yan canlı zaman widget'ı ----
   Sabit, cam efektli küçük kart: mevcut mod + saniyelik sayaç + dostane mesaj + günlük hedef + İzin İste rozeti.
   Başlığından sürükleyip dört köşeden birine bırakılabilir; küçültülebilir. Tercihler bu tarayıcıda saklanır. */
const Widget = {
  el: null, KEY: 'squadpulse.widget',
  prefs() { const d = { corner: 'br', min: matchMedia('(max-width: 900px)').matches }; try { return { ...d, ...(this._p || {}), ...(JSON.parse(localStorage.getItem(this.KEY) || '{}')) }; } catch (e) { return { ...d, ...(this._p || {}) }; } },   // mobilde varsayılan: küçük kapsül
  save(p) { this._p = p; try { localStorage.setItem(this.KEY, JSON.stringify(p)); } catch (e) {} },
  mount() {
    if (this.el) return this.el;
    this.el = document.createElement('aside'); this.el.id = 'timeWidget'; this.el.className = 'tw'; this.el.setAttribute('aria-label', 'Canlı zaman takibi');
    document.body.appendChild(this.el);
    this.bindDrag();
    return this.el;
  },
  message(st, ms, i) {
    const h = Math.floor(ms / HOUR), m = Math.floor(ms / MIN), hTxt = h === 1 ? '1 saattir' : `${h} saattir`;
    if (st.key === 'active') {
      const deep = st.deep, mode = deep ? 'Deep Work modundasın' : 'Çalışma modundasın';
      if (ms >= BreakGuard.LIMIT) return `${hTxt} aralıksız ekrandasın — biraz dinlenmelisin! 🌿`;
      if (h >= 2) return `${mode} — ${hTxt} odaktasın, kısa bir mola iyi gelebilir ☕`;
      if (h >= 1) return `${mode} — ${hTxt} harika gidiyorsun ${deep ? '🧠' : '🚀'}`;
      if (m >= 20) return `${mode} — güzel bir ritim yakaladın ✨`;
      return `${mode} — ısınma turu, odaklan ${deep ? '🎧' : '💪'}`;
    }
    if (st.key === 'break') {
      if (ms >= BreakGuard.LIMIT) return 'Çok uzun süredir moladasın — çalışmaya ne dersin? ⏰';
      if (h >= 1) return `${hTxt} moladasın, hazır olunca devam edelim 🙂`;
      if (m >= 20) return 'Molan biraz uzadı, enerjin toplandıysa devam 🔋';
      return `${st.emoji || '☕'} ${st.label} molasındasın — keyfini çıkar`;
    }
    if (st.key === 'idle') return 'Sayaç duraklatıldı — bir işe dokununca devam eder ⏸️';
    if (st.key === 'done') return 'Günü tamamladın, emeğine sağlık 🌙';
    return 'Henüz başlamadın — güne başlamaya hazır mısın? ☀️';
  },
  render() {
    const u = Auth.user();
    if (!u || !App.started) { if (this.el) { this.el.remove(); this.el = null; } document.body.classList.remove('has-tw'); return; }
    const el = this.mount(), p = this.prefs(), st = Tracker.status(u.id), t = NOW(), i = BreakGuard.info(u.id);
    const goal = (+DB.get('settings').dailyGoal || 8) * HOUR, today = Tracker.summary(u.id, T.sod(t), T.eod(t));
    const start = st.session ? st.session.start : null, ms = start ? t - start : 0;
    const warn = i.alert || (st.key !== 'offline' && st.key !== 'done' && ms >= BreakGuard.LIMIT);
    const tone = warn ? 'warn' : st.key === 'active' ? (st.deep ? 'deep' : 'work') : st.key === 'break' ? 'break' : 'idle';
    const label = st.key === 'active' ? (st.deep ? 'Deep Work' : 'Çalışma modu') : st.key === 'break' ? `Mola · ${st.label}` : st.key === 'idle' ? 'Beklemede' : st.key === 'done' ? 'Gün tamamlandı' : 'Başlamadın';
    const q = Leave.quick(u.id), pomo = u.pomo && u.pomo.endsAt > t ? u.pomo : null;
    const brk = Tracker.pomoBreakId();
    const action = st.key === 'active' ? (brk ? `<button type="button" class="tw-btn" data-act="breakTake" data-id="${esc(brk)}" title="Mola ver">${ic('coffee', 15)}<span>Mola</span></button>` : '')
      : st.key === 'break' || st.key === 'idle' ? `<button type="button" class="tw-btn" data-act="breakBack" title="Çalışmaya dön">${ic('play', 14)}<span>Devam</span></button>`
      : `<button type="button" class="tw-btn" data-act="startDay" data-id="${esc(Tracker.defaultWork() || '')}" title="Güne başla">${ic('sunrise', 15)}<span>Başla</span></button>`;
    el.dataset.corner = p.corner; el.dataset.tone = tone;
    const min = (App.view === 'chat' || App.view === 'clients' || App.view === 'social') ? !this.chatOpen : !!p.min;   // sohbette varsayılan: kapsül (yazma alanını kapatmasın)
    el.classList.toggle('min', min);
    document.body.classList.add('has-tw');
    document.body.dataset.twCorner = p.corner; document.body.classList.toggle('tw-min', min);
    const timer = start ? `<span data-live="since" data-start="${start}">${T.clock(ms)}</span>` : `<span>${st.key === 'done' ? T.clock(today.work) : '00:00:00'}</span>`;
    el.innerHTML = `
      <div class="tw-head" data-drag title="Sürükleyerek köşeye taşı">
        <span class="tw-dot"></span><span class="tw-label">${esc(label)}</span>
        <button type="button" class="tw-ic" data-act="twToggle" title="${min ? 'Genişlet' : 'Küçült'}" aria-label="${min ? 'Widget\'ı genişlet' : 'Widget\'ı küçült'}">${ic(min ? 'plus' : 'minus', 14)}</button>
      </div>
      <div class="tw-body">
        <div class="tw-timer">${timer}</div>
        <p class="tw-msg">${this.message(st, ms, i)}</p>
        ${pomo ? `<div class="tw-pomo">🍅 ${pomo.phase === 'focus' ? 'Odak' : 'Mola'} · <span data-live="countdown" data-end="${pomo.endsAt}">${T.mmss(pomo.endsAt - t)}</span> kaldı</div>` : ''}
        ${(() => { const ps = Pet.state(u.id); return ps && !ps.lost ? `<button type="button" class="tw-pet" data-act="petGo" style="--pm:${ps.mood.tone}" title="${esc(ps.name)} · ${ps.mood.label}"><span class="tp-e">${ps.t.emoji}</span><span>${esc(ps.name)}</span><span class="tp-bar"><i style="width:${Math.round(ps.food)}%"></i></span><b>%${Math.round(ps.food)}</b></button>` : ''; })()}
        <div class="tw-goal"><div class="tw-goal-row"><span>Bugün net</span><b data-live="sum" data-uid="${u.id}" data-field="work">${T.dur(today.work)}</b><small>/ ${String(DB.get('settings').dailyGoal).replace('.', ',')} sa</small></div>
          <div class="tw-track"><i data-live="bar" data-uid="${u.id}" style="width:${Math.min(100, today.work / goal * 100).toFixed(1)}%"></i></div>
          <div class="tw-goal-row sub"><span>Mola</span><b data-live="sum" data-uid="${u.id}" data-field="brk">${T.dur(today.brk)}</b>${i.day >= BreakGuard.LIMIT ? '<em>3 saati aştı</em>' : ''}</div></div>
        <div class="tw-foot">${action}
          ${q ? `<button type="button" class="tw-leave" data-act="leaveOpen" title="İzin İste — sonraki iş günü için tahmini ihtimal" style="--lv:${q.color}">🏖️ İzin <b>%${q.p}</b></button>` : ''}</div>
      </div>
      <button type="button" class="tw-mini" data-act="twToggle" aria-label="Widget'ı genişlet" title="Genişlet"><span class="tw-dot"></span>${start ? `<span data-live="since" data-start="${start}">${T.clock(ms)}</span>` : `<span>${esc(label)}</span>`}</button>`;
  },
  toggle() { if (App.view === 'chat' || App.view === 'clients' || App.view === 'social') { this.chatOpen = !this.chatOpen; return this.render(); } const p = this.prefs(); p.min = !p.min; this.save(p); this.render(); },
  bindDrag() {
    const el = this.el; let sx, sy, ox, oy, drag = null;
    el.addEventListener('pointerdown', e => {
      const h = e.target.closest('[data-drag]'); if (!h || e.target.closest('button') || e.button > 0) return;
      const r = el.getBoundingClientRect(); drag = { id: e.pointerId, moved: false }; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
      h.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!drag.moved && Math.hypot(dx, dy) < 4) return;
      drag.moved = true; el.classList.add('dragging');
      el.style.transform = `translate(${dx}px, ${dy}px)`;
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const moved = drag.moved; drag = null; el.classList.remove('dragging');
      if (!moved) { el.style.transform = ''; return; }
      const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const corner = (cy < innerHeight / 2 ? 't' : 'b') + (cx < innerWidth / 2 ? 'l' : 'r');
      el.style.transform = ''; const p = this.prefs(); p.corner = corner; this.save(p); this.render();
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
};

/* ---- Sohbet arka planı kişiselleştirme ----
   Seçim bu tarayıcıda (localStorage) kullanıcı bazında saklanır; sayfa yenilense de korunur.

const ChatBg = {

  ],
  open: false,
  key() { return 'squadpulse.chatBg.' + (Auth.current || 'guest'); },
  get() {
    const d = { id: 'default', intensity: 1, motion: true };
    try { const v = JSON.parse(localStorage.getItem(this.key()) || 'null'); if (v && typeof v === 'object') return { ...d, ...v }; } catch (e) {}

  },
  set(patch) {

    v.intensity = clamp(+v.intensity || 1, .4, 1.6); v.motion = !!v.motion;

  },

    const v = this.get(), r = document.documentElement;

  sync() {

/* ---- Soft pastel renk profili + akışkan dalga geçişi ----
   Yazma kapsülündeki 🌸 tetikleyici, mevcut temanın (vurgu rengi + sohbet arka planı) üzerine
   pastel bir katman ekler; tekrar basınca normal temaya döner. Tercih bu tarayıcıda kullanıcı bazında saklanır.
   Geçişte tıklanan noktadan yayılan pastel bir dalga ve arayüzde yumuşak bir süzülme oynatılır. */
const SoftMode = {
  key() { return 'squadpulse.soft.' + (Auth.current || 'guest'); },
  on() { try { const v = localStorage.getItem(this.key()); if (v !== null) return v === '1'; } catch (e) {} return !!this._mem; },
  save(v) { this._mem = v; try { localStorage.setItem(this.key(), v ? '1' : '0'); } catch (e) {} },
  /** Kullanıcının vurgu renginden pastel ton üretir (tonu korur, doygunluğu düşürür, açıklığı artırır) */
  pastel(hex, dark) {
    const [r, g, b] = hexToRgb(hex || '#6366f1').map(v => v / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; }
    const S = Math.min(s, .7) * .78, L = dark ? .78 : .72;
    const q = L < .5 ? L * (1 + S) : L + S - L * S, p = 2 * L - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3), f(h), f(h - 1 / 3)].map(v => Math.round(v * 255));
  },
  apply() {
    const r = document.documentElement, on = this.on();
    r.dataset.soft = on ? 'on' : 'off';
    if (on) {
      const acc = r.style.getPropertyValue('--accent').trim() || (Auth.user()?.prefs?.accent) || Theme.defaults.accent;
      const rgb = this.pastel(acc, r.dataset.mode === 'dark');
      r.style.setProperty('--soft-accent', `rgb(${rgb.join(',')})`);
      r.style.setProperty('--soft-accent-rgb', rgb.join(','));
    }
    $$('[data-act="softToggle"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.title = on ? 'Normal temaya dön' : 'Soft pastel mod'; });
    $$('.soft-switch').forEach(c => { c.checked = on; });
  },
  toggle(origin) {
    const next = !this.on(), r = document.documentElement;
    this.save(next);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    r.classList.add('soft-switching');
    clearTimeout(this._t); this._t = setTimeout(() => r.classList.remove('soft-switching'), 900);
    // Destekleyen tarayıcıda yeni renkler tıklanan noktadan dairesel olarak açılır; diğerlerinde pastel dalga + renk geçişi
    const vt = Smooth.run(() => this.apply(), { kind: 'reveal', origin });
    if (!reduce) { if (vt) { r.classList.remove('soft-wave'); void r.offsetWidth; r.classList.add('soft-wave'); clearTimeout(this._w); this._w = setTimeout(() => r.classList.remove('soft-wave'), 1100); } else this.wave(origin, next); }
    toast(next ? '🌸 Soft pastel mod açıldı' : 'Normal temaya dönüldü', 'success');
  },
  /** Tıklanan noktadan yayılan pastel dalga + arayüz süzülmesi */
  wave(origin, toSoft) {
    const r = document.documentElement;
    let x = innerWidth / 2, y = innerHeight - 60;
    if (origin && origin.getBoundingClientRect) { const b = origin.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top + b.height / 2; }
    const fx = document.createElement('div');
    fx.className = 'soft-wave-fx ' + (toSoft ? 'to-soft' : 'to-normal');
    fx.style.setProperty('--wx', x + 'px'); fx.style.setProperty('--wy', y + 'px');
    fx.innerHTML = '<i></i><i></i><i></i>';
    document.body.appendChild(fx);
    setTimeout(() => fx.remove(), 1300);
    r.classList.remove('soft-wave'); void r.offsetWidth; r.classList.add('soft-wave');
    clearTimeout(this._w); this._w = setTimeout(() => r.classList.remove('soft-wave'), 1100);
  }
};

/* ---- Akıcı geçiş yardımcısı (View Transitions API) ----
   Destekleyen tarayıcılarda (Chrome, Edge, Safari 18+) sekme, tema ve arka plan değişimlerini
   eski/yeni görünüm arasında yumuşakça canlandırır; desteklemeyenlerde CSS geçişleri devrede kalır. */
const Smooth = {
  ok() { return typeof document.startViewTransition === 'function' && !document.hidden; },
  run(fn, { kind = 'fade', origin } = {}) {
    if (!this.ok()) { fn(); return false; }
    const r = document.documentElement;
    if (origin && origin.getBoundingClientRect) { const b = origin.getBoundingClientRect(); r.style.setProperty('--vt-x', Math.round(b.left + b.width / 2) + 'px'); r.style.setProperty('--vt-y', Math.round(b.top + b.height / 2) + 'px'); }
    ['vt-page', 'vt-reveal', 'vt-fade'].forEach(c => r.classList.remove(c));
    const cls = 'vt-' + kind; r.classList.add(cls);
    try {
      const vt = document.startViewTransition(() => { fn(); });
      vt.finished.catch(() => {}).finally(() => r.classList.remove(cls));
      vt.ready.catch(() => {});
    } catch (e) { r.classList.remove(cls); fn(); }
    return true;
  }
};

/* ---- Pet (evcil hayvan) & görev cezası sistemi ----
   • İlk girişte 6 petten biri seçilir; seçim yalnızca bir kez yapılır.
   • Tokluk (0–100) iş günlerinde saatte 0,75 puan azalır (hafta sonu azalmaz → tam ihmalde ~4 iş günü dayanır).
   • Günlük görev tamamlamak +12, haftalık görev +6 mama verir (aynı görev günde bir kez, günde en fazla +50).
   • Tokluk 0'a düşerse pet kaçar; kullanıcının ünvanı kalıcı olarak "Kötü İnsan" olur ve yeni pet seçilemez.
   Durum users/{id}/pet içinde (ekip de görür) ve ayrıca localStorage'da saklanır. */
const PETS = [
  { id: 'cat', emoji: '🐱', name: 'Mochi', kind: 'Kedi', food: '🐟', color: '#f9a8d4' },
  { id: 'dog', emoji: '🐶', name: 'Fıstık', kind: 'Köpek', food: '🦴', color: '#fcd34d' },
  { id: 'bunny', emoji: '🐰', name: 'Pamuk', kind: 'Tavşan', food: '🥕', color: '#fdba74' },
  { id: 'panda', emoji: '🐼', name: 'Bambu', kind: 'Panda', food: '🎋', color: '#86efac' },
  { id: 'fox', emoji: '🦊', name: 'Kıvılcım', kind: 'Tilki', food: '🍇', color: '#fb923c' },
  { id: 'penguin', emoji: '🐧', name: 'Buz', kind: 'Penguen', food: '🐠', color: '#93c5fd' }
];
const CURSED_TITLE = 'Kötü İnsan';
const Pet = {
  START: 70, DECAY_PER_HOUR: .75, FEED_DAILY: 12, FEED_WEEKLY: 6, DAY_CAP: 50,
  _warned: {}, el: null,
  lsKey(id) { return 'squadpulse.pet.' + id; },
  type(id) { return PETS.find(p => p.id === id) || PETS[0]; },
  /** Kayıt: önce veritabanı (ekip senkron), yoksa localStorage */
  raw(userId = Auth.current) {
    const u = DB.find('users', userId); if (u && u.pet && u.pet.type) return u.pet;
    if (userId === Auth.current) { try { const v = JSON.parse(localStorage.getItem(this.lsKey(userId)) || 'null'); if (v && v.type) return v; } catch (e) {} }
    return null;
  },
  cursed(userId = Auth.current) {
    const u = DB.find('users', userId); if (u && u.cursed) return true;
    if (userId === Auth.current) { try { return localStorage.getItem(this.lsKey(userId) + '.cursed') === '1'; } catch (e) {} }
    return false;
  },
  save(pet, extra = {}, userId = Auth.current) {
    DB.update('users', userId, { pet, ...extra });
    try { localStorage.setItem(this.lsKey(userId), JSON.stringify(pet)); if (extra.cursed) localStorage.setItem(this.lsKey(userId) + '.cursed', '1'); } catch (e) {}
  },
  /** a–b arasındaki iş günü (Pzt–Cum) süresi, ms */
  weekdayMs(a, b) {
    if (b <= a) return 0; let ms = 0, d = T.sod(a);
    for (let i = 0; d < b && i < 400; i++) { const e = T.addDays(d, 1), wd = new Date(d).getDay(); if (wd !== 0 && wd !== 6) ms += Math.max(0, Math.min(b, e) - Math.max(a, d)); d = e; }
    return ms;
  },
  food(p, t = NOW()) { if (!p) return 0; if (p.lostAt) return 0; return clamp((+p.food || 0) - this.weekdayMs(p.at || t, t) / HOUR * this.DECAY_PER_HOUR, 0, 100); },
  /** Tokluğun sıfıra ineceği tahmini an (sadece iş günleri sayılır) */
  hoursLeft(p) { return this.food(p) / this.DECAY_PER_HOUR; },
  mood(f, lost) {
    if (lost) return { key: 'gone', label: 'Kaçtı', face: '💔', tone: '#94a3b8' };
    if (f >= 75) return { key: 'happy', label: 'Çok mutlu', face: '😊', tone: '#22c55e' };
    if (f >= 50) return { key: 'ok', label: 'Keyifli', face: '🙂', tone: '#84cc16' };
    if (f >= 30) return { key: 'hungry', label: 'Acıktı', face: '😕', tone: '#f59e0b' };
    if (f >= 12) return { key: 'sad', label: 'Çok aç', face: '😢', tone: '#f97316' };
    return { key: 'danger', label: 'Kaçmak üzere!', face: '😿', tone: '#ef4444' };
  },
  state(userId = Auth.current) {
    const p = this.raw(userId); if (!p) return null;
    const t = this.type(p.type), f = this.food(p), lost = !!p.lostAt;
    return { p, t, name: p.name || t.name, food: f, lost, mood: this.mood(f, lost), hours: this.hoursLeft(p) };
  },
  adopt(type, name) {
    const id = Auth.current; if (!id || this.raw(id) || this.cursed(id)) return false;
    const t = this.type(type), now = NOW();
    this.save({ type: t.id, name: String(name || t.name).trim().slice(0, 18) || t.name, adoptedAt: now, food: this.START, at: now, gained: {}, fedKeys: {} });
    return true;
  },
  /** Görev tamamlandığında mama ver (aynı görev günde bir kez) */
  feed(task) {
    const id = Auth.current, p = this.raw(id); if (!p || p.lostAt || !task) return 0;
    const tk = T.key(NOW()), key = `${task.id}_${tk}`;
    const fedKeys = Object.fromEntries(Object.entries(p.fedKeys || {}).filter(([k]) => k.endsWith(tk)));
    if (fedKeys[key]) return 0;
    const gainedToday = (p.gained && p.gained[tk]) || 0;
    const amount = Math.max(0, Math.min(task.scope === 'daily' ? this.FEED_DAILY : this.FEED_WEEKLY, this.DAY_CAP - gainedToday));
    fedKeys[key] = 1;
    const now = NOW(), f = Math.min(100, this.food(p, now) + amount);
    this.save({ ...p, food: f, at: now, fedKeys, gained: { [tk]: gainedToday + amount } });
    const s = this.state(id);
    if (amount) { toast(`${s.t.food} ${esc(s.name)} beslendi! +${amount} tokluk`, 'success'); setTimeout(() => this.celebrate(), 90); }
    else toast(`${s.t.food} ${esc(s.name)} bugün yeterince yedi — yarın yine besle`, 'info');
    return amount;
  },
  lose() {
    const id = Auth.current, p = this.raw(id); if (!p || p.lostAt) return;
    this.save({ ...p, food: 0, at: NOW(), lostAt: NOW() }, { cursed: true, title: CURSED_TITLE });
    this.showLoss();
  },
  /** Dakikalık kontrol: uyarılar, kayıp, ünvan kilidi, ilk seçim */
  check() {
    const u = Auth.user(); if (!u) return this.hidePicker();
    if (this.cursed(u.id) && u.title !== CURSED_TITLE) DB.update('users', u.id, { title: CURSED_TITLE, cursed: true });   // ünvan geri alınamaz
    const s = this.state(u.id);
    if (!s) { if (!this.cursed(u.id)) this.offerPicker(); return; }
    this.hidePicker();
    if (s.lost) { if (!s.p.lossSeen && !this.lossEl) this.showLoss(); return; }
    if (s.food <= 0) return this.lose();
    const tk = T.key(NOW()), lvl = s.food < 12 ? 'danger' : s.food < 30 ? 'hungry' : null;
    if (lvl && !this._warned[lvl + tk]) {
      this._warned[lvl + tk] = true;
      const msg = lvl === 'danger' ? `${s.t.emoji} ${s.name} kaçmak üzere! Bugünkü görevlerini tamamlayıp onu besle.` : `${s.t.emoji} ${s.name} acıktı — günlük görevlerini tamamlayarak besleyebilirsin.`;
      toast(esc(msg), 'error');
      try { Notify.show({ title: lvl === 'danger' ? 'Petin kaçmak üzere!' : 'Petin acıktı', body: msg, tag: 'squadpulse-pet' }); } catch (e) {}
    }
  },
  celebrate() { $$('.pet-orb').forEach(o => { o.classList.remove('eat'); void o.offsetWidth; o.classList.add('eat'); setTimeout(() => o.classList.remove('eat'), 1300); }); },

  /* --- Petini Seç modalı --- */
  pick: null,
  offerPicker() {
    if (this.el || (typeof NotifyGate !== 'undefined' && NotifyGate.el) || BreakGuard.el) return;
    this.pick = this.pick || 'cat';
    this.el = document.createElement('div'); this.el.id = 'petPicker'; this.el.setAttribute('role', 'dialog'); this.el.setAttribute('aria-modal', 'true');
    document.body.appendChild(this.el); this.renderPicker();
    requestAnimationFrame(() => this.el && this.el.classList.add('show'));
  },
  renderPicker() {
    if (!this.el) return; const sel = this.type(this.pick);
    this.el.innerHTML = `<div class="pp-card">
      <div class="pp-head"><span class="pp-kicker">Yeni ekip arkadaşın</span><h2>Petini Seç</h2>
        <p>Günlük görevlerini tamamladıkça petini beslersin. Uzun süre ihmal edersen evden kaçar — ve ünvanın kalıcı olarak <b>"${CURSED_TITLE}"</b> olur.</p></div>
      <div class="pp-grid">${PETS.map(p => `<button type="button" class="pp-opt ${p.id === this.pick ? 'on' : ''}" data-act="petPick" data-v="${p.id}" style="--pc:${p.color}" aria-pressed="${p.id === this.pick}">
          <span class="pp-emoji">${p.emoji}</span><b>${p.name}</b><small>${p.kind} · ${p.food}</small></button>`).join('')}</div>
      <label class="pp-name"><span>Adı</span><input class="input" id="petName" maxlength="18" value="${esc(this.pickName || sel.name)}" placeholder="${sel.name}"></label>
      <div class="pp-foot"><span class="pp-warn">${ic('lock', 13)} Bu seçim yalnızca <b>bir kez</b> yapılır</span>
        <button type="button" class="btn btn-primary" data-act="petAdopt">${sel.emoji} ${esc(this.pickName || sel.name)}'yi sahiplen</button></div>
    </div>`;
    const inp = $('#petName'); if (inp) inp.addEventListener('input', e => { this.pickName = e.target.value; const b = this.el.querySelector('[data-act="petAdopt"]'); if (b) b.textContent = `${sel.emoji} ${e.target.value.trim() || sel.name}'yi sahiplen`; });
  },
  choose(v) { const prevDefault = this.type(this.pick).name; if (!this.pickName || this.pickName === prevDefault) this.pickName = this.type(v).name; this.pick = v; this.renderPicker(); },
  confirmAdopt() {
    const t = this.type(this.pick), name = (this.pickName || t.name).trim() || t.name;
    if (!this.adopt(t.id, name)) return;
    this.hidePicker(); this.pickName = '';
    toast(`${t.emoji} ${esc(name)} artık seninle! Günlük görevlerini tamamlayarak onu besle.`, 'success');
    App.render();
  },
  hidePicker() { if (!this.el) return; const el = this.el; this.el = null; el.classList.remove('show'); setTimeout(() => el.remove(), 260); },

  /* --- Kayıp modalı --- */
  lossEl: null,
  showLoss() {
    const s = this.state(); if (!s || this.lossEl) return;
    this.lossEl = document.createElement('div'); this.lossEl.id = 'petLoss'; this.lossEl.setAttribute('role', 'alertdialog');
    this.lossEl.innerHTML = `<div class="pl-card">
      <div class="pl-scene"><span class="pl-pet">${s.t.emoji}</span><span class="pl-bowl">🥣</span></div>

/* ---- Ajans müşteri & içerik takibi ----
   Müşteriler clients/{id} altında tutulur → tüm ekip aynı listeyi görür ve anlık güncellenir.
   Ayrıca her değişiklikte bu tarayıcıya (localStorage) yedeklenir.
   { name, sector, color, start:'YYYY-MM-DD', months, total, done, every (gün), next:'YYYY-MM-DD', lastPostAt, platforms[], notes, createdAt, createdBy } */
const PLATFORMS = [
  { id: 'instagram', label: 'Instagram', short: 'IG', color: '#e1306c' },
  { id: 'tiktok', label: 'TikTok', short: 'TT', color: '#25f4ee' },
  { id: 'youtube', label: 'YouTube', short: 'YT', color: '#ff0033' },
  { id: 'linkedin', label: 'LinkedIn', short: 'in', color: '#0a66c2' },
  { id: 'x', label: 'X', short: 'X', color: '#94a3b8' },
  { id: 'facebook', label: 'Facebook', short: 'FB', color: '#1877f2' }
];
const Clients = {
  ui: { q: '', filter: 'all', sort: 'next' },
  LS: 'squadpulse.clients.backup',
  list() { return DB.get('clients').filter(c => c && c.name); },
  backup() { try { localStorage.setItem(this.LS, JSON.stringify({ at: NOW(), clients: DB.cache.clients || {} })); } catch (e) {} },
  dateTs(k) { if (!k) return null; const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1).getTime(); },
  endTs(c) { const s = this.dateTs(c.start); if (!s) return null; const d = new Date(s); d.setMonth(d.getMonth() + (+c.months || 1)); return d.getTime(); },
  /** Tüm hesaplanan alanlar: süre, içerik, tempo, paylaşım durumu */
  info(c) {
    const today = T.sod(), tk = T.key(today), start = this.dateTs(c.start) || today, end = this.endTs(c) || today;
    const totalDays = Math.max(1, Math.round((end - start) / DAY)), leftDays = Math.round((end - today) / DAY);
    const timePct = clamp((today - start) / (end - start || 1), 0, 1);
    const total = Math.max(0, +c.total || 0), done = clamp(+c.done || 0, 0, total), left = total - done, contentPct = total ? done / total : 1;
    const pace = !total || leftDays < 0 ? 'none' : contentPct + .08 < timePct ? 'behind' : contentPct > timePct + .15 ? 'ahead' : 'ok';
    const postedToday = c.lastPostAt && T.key(c.lastPostAt) === tk;
    let post;
    if (leftDays < 0) post = { key: 'ended', label: 'Sözleşme bitti', color: '#94a3b8' };
    else if (!left) post = { key: 'complete', label: 'Tüm içerikler paylaşıldı', color: '#22c55e' };
    else if (postedToday) post = { key: 'posted', label: 'Bugün paylaşıldı', color: '#22c55e' };
    else if (c.next && c.next < tk) post = { key: 'late', label: `Gecikti · ${Math.round((today - this.dateTs(c.next)) / DAY)} gün`, color: '#ef4444' };
    else if (c.next === tk) post = { key: 'today', label: 'Bugün paylaşılacak', color: '#f59e0b' };
    else if (c.next) post = { key: 'planned', label: 'Planlandı · ' + T.fmt(this.dateTs(c.next), { day: 'numeric', month: 'short', weekday: 'short' }), color: '#38bdf8' };
    else post = { key: 'waiting', label: 'Bekliyor', color: '#f59e0b' };
    const contract = leftDays < 0 ? 'ended' : leftDays <= 14 ? 'ending' : 'active';
    return { start, end, totalDays, leftDays, timePct, total, done, left, contentPct, pace, post, contract, postedToday };
  },
  filtered() {
    const q = this.ui.q.trim().toLocaleLowerCase('tr-TR');
    let l = this.list().map(c => ({ c, i: this.info(c) }));
    if (q) l = l.filter(({ c }) => (c.name + ' ' + (c.sector || '') + ' ' + (c.notes || '')).toLocaleLowerCase('tr-TR').includes(q));
    const f = this.ui.filter;
    if (f === 'due') l = l.filter(x => ['late', 'today', 'waiting'].includes(x.i.post.key));
    else if (f === 'ending') l = l.filter(x => x.i.contract === 'ending');
    else if (f === 'ended') l = l.filter(x => x.i.contract === 'ended');
    else if (f === 'active') l = l.filter(x => x.i.contract !== 'ended');
    const rank = { late: 0, today: 1, waiting: 2, planned: 3, posted: 4, complete: 5, ended: 6 };
    const s = this.ui.sort;
    l.sort((a, b) => s === 'name' ? a.c.name.localeCompare(b.c.name, 'tr')
      : s === 'left' ? b.i.left - a.i.left
      : s === 'end' ? a.i.leftDays - b.i.leftDays
      : (rank[a.i.post.key] - rank[b.i.post.key]) || String(a.c.next || '9').localeCompare(String(b.c.next || '9')));
    return l;
  },
  save(c) {
    const clean0 = { ...c, total: Math.max(0, Math.round(+c.total || 0)), done: Math.max(0, Math.round(+c.done || 0)), months: Math.max(1, Math.round(+c.months || 1)), every: Math.max(1, Math.round(+c.every || 3)) };
    clean0.done = Math.min(clean0.done, clean0.total);
    if (DB.find('clients', c.id)) DB.update('clients', c.id, clean0); else DB.insert('clients', clean0);
    this.backup();
  },
  remove(id) { DB.remove('clients', id); this.backup(); },
  posted(id) {
    const c = DB.find('clients', id); if (!c) return;
    const i = this.info(c); if (!i.left) return toast('Bu müşterinin tüm içerikleri zaten paylaşıldı', 'info');
    const next = T.key(T.addDays(T.sod(), +c.every || 3));
    DB.update('clients', id, { done: i.done + 1, prevLastPostAt: c.lastPostAt || null, prevNext: c.next || null, lastPostAt: NOW(), next, lastPostBy: Auth.current });
    this.backup();
    toast(`${esc(c.name)} · içerik paylaşıldı (${i.done + 1}/${i.total}) — sıradaki: ${T.fmt(this.dateTs(next), { day: 'numeric', month: 'short' })}`, 'success');
  },
  undoPost(id) {
    const c = DB.find('clients', id); if (!c || !(+c.done)) return;
    DB.update('clients', id, { done: (+c.done) - 1, lastPostAt: c.prevLastPostAt || null, next: c.prevNext || c.next || null, prevLastPostAt: null, prevNext: null }); this.backup(); toast('Son paylaşım geri alındı');
  },
  seed() {
    const k = n => T.key(T.addDays(T.sod(), n)), now = NOW();
    [
      { name: 'Nova Kahve', sector: 'Yiyecek & İçecek', color: '#f59e0b', start: k(-45), months: 3, total: 36, done: 15, every: 2, next: k(0), platforms: ['instagram', 'tiktok'] },
      { name: 'Atlas Mobilya', sector: 'Perakende', color: '#6366f1', start: k(-80), months: 3, total: 24, done: 14, every: 3, next: k(-2), platforms: ['instagram', 'facebook'] },
      { name: 'Pera Klinik', sector: 'Sağlık', color: '#14b8a6', start: k(-20), months: 6, total: 48, done: 9, every: 4, next: k(2), platforms: ['instagram', 'youtube'], lastPostAt: now - 2 * DAY },
      { name: 'Kuzey Yazılım', sector: 'Teknoloji · B2B', color: '#0ea5e9', start: k(-170), months: 6, total: 26, done: 25, every: 7, next: k(5), platforms: ['linkedin', 'x'] }
    ].forEach((c, i) => this.save({ ...c, id: uid('cl'), createdAt: now + i, createdBy: Auth.current }));
    toast('Örnek müşteriler eklendi', 'success');
  },
  form(c) {
    const isNew = !c, today = T.key(T.sod());
    c = c || { name: '', sector: '', color: COLORS[this.list().length % COLORS.length], start: today, months: 3, total: 12, done: 0, every: 3, next: today, platforms: ['instagram'], notes: '' };
    const w = Modal.open({
      title: isNew ? '➕ Yeni firma / proje' : `✏️ ${esc(c.name)}`,
      body: `<div class="cl-form">
        <label class="lbl full">Firma / müşteri adı<input class="input" id="clName" maxlength="60" value="${esc(c.name)}" placeholder="örn. Nova Kahve"></label>
        <label class="lbl full">Sektör / proje notu<input class="input" id="clSector" maxlength="60" value="${esc(c.sector || '')}" placeholder="örn. Yiyecek & İçecek · Lansman kampanyası"></label>
        <div class="lbl full">Renk<div class="swatches" id="clColors">${COLORS.map(x => `<button type="button" class="swatch ${x === c.color ? 'on' : ''}" style="--sw:${x};background:${x}" data-c="${x}" aria-label="${x}"></button>`).join('')}</div></div>
        <label class="lbl">Sözleşme başlangıcı<input type="date" class="input" id="clStart" value="${esc(c.start || today)}"></label>
        <label class="lbl">Çalışma süresi (ay)<input type="number" class="input" id="clMonths" min="1" max="60" value="${+c.months || 3}"></label>
        <label class="lbl">Toplam içerik<input type="number" class="input" id="clTotal" min="0" max="9999" value="${+c.total || 0}"></label>
        <label class="lbl">Paylaşılan içerik<input type="number" class="input" id="clDone" min="0" max="9999" value="${+c.done || 0}"></label>
        <label class="lbl">Paylaşım sıklığı (gün)<input type="number" class="input" id="clEvery" min="1" max="60" value="${+c.every || 3}"></label>
        <label class="lbl">Sıradaki paylaşım<input type="date" class="input" id="clNext" value="${esc(c.next || '')}"></label>
        <div class="lbl full">Platformlar<div class="cl-plats">${PLATFORMS.map(p => `<label class="cl-plat" style="--pc:${p.color}"><input type="checkbox" value="${p.id}" ${(c.platforms || []).includes(p.id) ? 'checked' : ''}><span>${p.label}</span></label>`).join('')}</div></div>
        <label class="lbl full">Notlar<textarea class="input" id="clNotes" rows="2" maxlength="400" placeholder="Brief, iletişim kişisi, onay süreci…">${esc(c.notes || '')}</textarea></label>
        <p class="cl-preview full muted sm" id="clPrev"></p>
      </div>`,
      actions: [{ label: 'Vazgeç' }, { label: isNew ? 'Firmayı ekle' : 'Kaydet', cls: 'btn-primary', onClick: m => {
        const v = id => $(id, m).value;
        const name = v('#clName').trim();
        if (name.length < 2) { $('#clName', m).focus(); toast('Lütfen firma adını yaz', 'error'); return false; }
        const total = +v('#clTotal'), done = +v('#clDone');
        if (done > total) { toast('Paylaşılan içerik, toplamdan fazla olamaz', 'error'); return false; }
        if (!v('#clStart')) { toast('Sözleşme başlangıç tarihini seç', 'error'); return false; }
        const data = { ...c, id: c.id || uid('cl'), name, sector: v('#clSector').trim(), color: $('#clColors .swatch.on', m)?.dataset.c || c.color,
          start: v('#clStart'), months: +v('#clMonths'), total, done, every: +v('#clEvery'), next: v('#clNext') || null,
          platforms: $$('.cl-plat input:checked', m).map(i => i.value), notes: v('#clNotes').trim(), updatedAt: NOW(), updatedBy: Auth.current };
        if (isNew) { data.createdAt = NOW(); data.createdBy = Auth.current; }
        this.save(data);
        toast(isNew ? `${esc(name)} eklendi` : `${esc(name)} güncellendi`, 'success');
        setTimeout(() => App.render(), 0);
      } }],
      onMount: m => {
        const md = m.querySelector('.modal'); if (md) md.classList.add('modal-client');
        $$('#clColors .swatch', m).forEach(b => b.onclick = () => { $$('#clColors .swatch', m).forEach(x => x.classList.remove('on')); b.classList.add('on'); });
        const prev = () => {
          const d = { start: $('#clStart', m).value, months: +$('#clMonths', m).value, total: +$('#clTotal', m).value, done: +$('#clDone', m).value, next: $('#clNext', m).value };
          const i = this.info(d);
          $('#clPrev', m).innerHTML = d.start ? `Bitiş: <b>${T.fmt(i.end, { day: 'numeric', month: 'long', year: 'numeric' })}</b> · ${i.leftDays >= 0 ? `kalan <b>${i.leftDays} gün</b>` : '<b>süresi doldu</b>'} · <b>${Math.max(0, i.total - Math.min(i.done, i.total))}</b> içerik kaldı` : '';
        };
        $$('input', m).forEach(i => i.addEventListener('input', prev)); prev();
        setTimeout(() => $('#clName', m).focus(), 60);
      }
    });
    return w;
  }
};
