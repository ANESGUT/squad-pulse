.lv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lv-pct b{display:block;font-size:42px;line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--lv);text-shadow:0 0 28px color-mix(in srgb,var(--lv) 55%,transparent);font-variant-numeric:tabular-nums}
.lv-pct span{font-size:12px;color:var(--muted);font-weight:600}
.lv-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;color:var(--lv);background:color-mix(in srgb,var(--lv) 14%,transparent);border:1px solid color-mix(in srgb,var(--lv) 32%,transparent);white-space:nowrap}
.lv-pill i{width:8px;height:8px;border-radius:50%;background:var(--lv);box-shadow:0 0 0 3px color-mix(in srgb,var(--lv) 25%,transparent),0 0 12px var(--lv);animation:pulse 1.8s infinite}
.lv-bar{position:relative;height:12px;margin:16px 0 6px;border-radius:999px;background:rgba(var(--ink),.08);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.lv-zones{position:absolute;inset:0;display:grid;grid-template-columns:40fr 30fr 30fr;border-radius:inherit;overflow:hidden;opacity:.28}
.lv-zones span:nth-child(1){background:#ef4444}.lv-zones span:nth-child(2){background:#f59e0b}.lv-zones span:nth-child(3){background:#22c55e}
.lv-fill{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--lv) 55%,transparent),var(--lv));box-shadow:0 0 18px -2px var(--lv);transition:width .6s var(--ease),background .3s}
.lv-mark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--lv);box-shadow:0 0 0 4px color-mix(in srgb,var(--lv) 25%,transparent),0 4px 10px rgba(0,0,0,.35);transition:left .6s var(--ease),border-color .3s}
.lv-scale{display:grid;grid-template-columns:40fr 30fr 30fr;font-size:10.5px;font-weight:650;color:var(--faint)}
.lv-scale span:nth-child(2){text-align:center}.lv-scale span:nth-child(3){text-align:right}
.lv-msg{margin-top:12px;font-size:14px;line-height:1.45}
.lv-msg b{color:var(--lv)}
.lv-date{margin-top:4px}
.lv-factors{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lv-factors li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;font-size:13px}
.lv-factors li:nth-child(odd){background:var(--glass-bg-soft,var(--surface-2))}
.lv-factors li small{display:block;color:var(--muted);font-size:11.5px}
.lv-factors em{font-style:normal;font-weight:750;font-size:12.5px;min-width:42px;text-align:center;padding:3px 8px;border-radius:999px;color:var(--muted);background:rgba(var(--ink),.06);font-variant-numeric:tabular-nums}
.lv-factors em.up{color:#22c55e;background:rgba(34,197,94,.13)}
.lv-factors em.down{color:#ef4444;background:rgba(239,68,68,.13)}
.lv-best{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;padding:10px 12px;border-radius:14px;border:1px dashed rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.08);color:var(--text);font-size:13px;text-align:left;transition:background .2s,box-shadow .2s}
.lv-best *{pointer-events:none}
.lv-best:hover{background:rgba(var(--accent-rgb),.14);box-shadow:0 0 22px -8px rgba(var(--accent-rgb),.7)}
.lv-best .ic{color:var(--accent)}
.lv-best em{margin-left:auto;font-style:normal;font-weight:750;color:var(--lv)}
.lv-tasks{padding:14px;border-radius:18px;background:var(--glass-bg-soft,var(--surface-2));border:1px solid var(--glass-border,var(--border));box-shadow:var(--glass-hi,none);gap:10px}
.lv-tasks-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lv-tasks-head h4{font-size:14.5px}
.lv-tasks-head .seg button{padding:6px 11px;font-size:12.5px}
.lv-list{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto;padding-right:2px;overscroll-behavior:contain}
.lv-task{--p:#94a3b8;position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:13px;background:rgba(var(--ink),.035);border:1px solid var(--glass-border,var(--border));transition:background .2s,opacity .2s}
.lv-task::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--p);box-shadow:0 0 8px var(--p)}
.lv-task:hover{background:rgba(var(--ink),.06)}
.lv-task.crit{border-color:color-mix(in srgb,var(--p) 40%,transparent)}
.lv-task.done{opacity:.55}
.lv-task.done b{text-decoration:line-through;text-decoration-color:var(--muted)}
.lv-check{width:22px;height:22px;flex-shrink:0;border-radius:7px;border:1.5px solid rgba(var(--ink),.3);background:transparent;display:grid;place-items:center;color:#fff;padding:0;transition:.15s}
.lv-check *{pointer-events:none}
.lv-check:hover{border-color:var(--accent);box-shadow:0 0 12px -2px rgba(var(--accent-rgb),.7)}
.lv-task.done .lv-check{background:#22c55e;border-color:#22c55e;box-shadow:0 0 12px -3px #22c55e}
.lv-tmeta{flex:1;min-width:0}
.lv-tmeta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-tmeta small{font-size:11.5px;color:var(--muted)}
.lv-prio{color:var(--p);font-weight:700}
.lv-tmeta .late{color:#ef4444;font-weight:650}
.lv-del{width:26px;height:26px;flex-shrink:0;border:0;border-radius:8px;background:none;color:var(--faint);display:grid;place-items:center;opacity:0;transition:.15s}
.lv-del *{pointer-events:none}
.lv-task:hover .lv-del,.lv-del:focus-visible{opacity:1}
.lv-del:hover{color:#ef4444;background:rgba(239,68,68,.12)}
@media (hover:none){.lv-del{opacity:.7}}
.lv-empty{padding:14px 4px;text-align:center}
.lv-add{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px}
.lv-add .input{padding:8px 10px;font-size:13px;border-radius:11px}
.lv-add select.input{padding-right:28px;background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.lv-add input[type=date][hidden]{display:none}
.lv-hist h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 6px}
.lv-hist div{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:7px 10px;border-radius:11px;background:rgba(var(--ink),.035);margin-bottom:4px;font-size:12.5px}
.lv-hist em{font-style:normal;font-weight:750;color:var(--lv)}
.lv-hist small{grid-column:1/-1;color:var(--muted);font-size:11px}
@media (max-width:760px){
  .lv-root{grid-template-columns:minmax(0,1fr)}
  .lv-list{max-height:none}
}
@media (max-width:640px){
  .leave-btn b{display:none}
  .leave-btn{padding:0 6px 0 10px}
  .lv-form{grid-template-columns:minmax(0,1fr)}
  .lv-pct b{font-size:36px}
  .lv-add{grid-template-columns:minmax(0,1fr) auto auto}
  .lv-add input[type=date]{grid-column:1/-2}
}
/* ---------- Yan canlı zaman widget'ı ---------- */
.tw{--tw:#22c55e;position:fixed;z-index:8500;width:282px;border-radius:22px;padding:12px 14px 14px;color:var(--text);
  background:var(--glass-sheen,none),linear-gradient(160deg,color-mix(in srgb,var(--tw) 14%,transparent),transparent 60%),linear-gradient(var(--pop-bg,var(--surface-solid)),var(--pop-bg,var(--surface-solid)));
  border:1px solid color-mix(in srgb,var(--tw) 30%,var(--glass-border-hi,var(--border)));
  box-shadow:0 24px 50px -20px rgba(0,0,0,.6),0 0 34px -14px var(--tw),var(--glass-hi,none);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  transition:border-color .4s,box-shadow .4s,top .35s var(--ease),bottom .35s var(--ease),left .35s var(--ease),right .35s var(--ease),width .3s var(--ease);animation:twIn .4s var(--ease)}
@keyframes twIn{from{opacity:0;transform:translateY(12px) scale(.96)}}
.tw[data-tone="work"]{--tw:#22c55e}.tw[data-tone="deep"]{--tw:#8b5cf6}.tw[data-tone="break"]{--tw:#38bdf8}.tw[data-tone="idle"]{--tw:#94a3b8}
.tw[data-tone="warn"]{--tw:#f59e0b;animation:twIn .4s var(--ease),twWarn 2.2s ease-in-out infinite}
@keyframes twWarn{50%{box-shadow:0 24px 50px -20px rgba(0,0,0,.6),0 0 0 4px rgba(245,158,11,.18),0 0 46px -8px #f59e0b,var(--glass-hi,none)}}
.tw[data-corner="br"]{right:22px;bottom:22px}.tw[data-corner="bl"]{left:22px;bottom:22px}
.tw[data-corner="tr"]{right:22px;top:92px}.tw[data-corner="tl"]{left:22px;top:92px}
.tw.dragging{transition:none;cursor:grabbing;opacity:.92;box-shadow:0 34px 70px -20px rgba(0,0,0,.7),0 0 40px -10px var(--tw)}
.tw-head{display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding-bottom:6px}
.tw-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--tw);box-shadow:0 0 0 3px color-mix(in srgb,var(--tw) 25%,transparent),0 0 12px var(--tw);animation:pulse 1.8s infinite}
.tw-label{flex:1;min-width:0;font-size:12px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--tw) 70%,var(--text));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-ic{width:24px;height:24px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);display:grid;place-items:center;padding:0;transition:.15s}
.tw-ic *{pointer-events:none}
.tw-ic:hover{color:var(--text);background:var(--surface-3);border-color:var(--glass-border,var(--border))}
.tw-timer{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 0 26px color-mix(in srgb,var(--tw) 45%,transparent)}
.tw-msg{margin-top:4px;font-size:13px;line-height:1.4;color:var(--text);opacity:.9}
.tw-pomo{margin-top:8px;font-size:12px;font-weight:650;color:var(--muted)}
.tw-pomo span{color:var(--text);font-variant-numeric:tabular-nums}
.tw-goal{margin-top:10px;padding:9px 10px;border-radius:14px;background:rgba(var(--ink),.045);border:1px solid var(--glass-border,var(--border))}
.tw-goal-row{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted)}
.tw-goal-row b{color:var(--text);font-size:13px;font-variant-numeric:tabular-nums}
.tw-goal-row span{flex:0 0 auto}
.tw-goal-row b{margin-left:auto}
.tw-goal-row.sub{margin-top:6px}
.tw-goal-row em{font-style:normal;font-size:10.5px;font-weight:700;color:#f59e0b;padding:1px 6px;border-radius:999px;background:rgba(245,158,11,.14)}
.tw-track{height:6px;margin-top:6px;border-radius:999px;background:rgba(var(--ink),.08);overflow:hidden}
.tw-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));box-shadow:0 0 12px -2px rgba(var(--accent-rgb),.8);transition:width .6s var(--ease)}
.tw-foot{display:flex;gap:6px;margin-top:10px}
.tw-btn,.tw-leave{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:11px;font-size:12.5px;font-weight:650;border:1px solid var(--glass-border,var(--border));background:var(--glass-bg-soft,var(--surface-2));color:var(--text);transition:box-shadow .2s,border-color .2s,transform .12s}
.tw-btn *,.tw-leave *{pointer-events:none}
.tw-btn:hover{border-color:color-mix(in srgb,var(--tw) 50%,transparent);box-shadow:0 0 20px -6px var(--tw)}
.tw-btn .ic{color:var(--tw)}
.tw-leave b{color:var(--lv)}
.tw-leave:hover{border-color:color-mix(in srgb,var(--lv) 50%,transparent);box-shadow:0 0 20px -6px var(--lv)}
.tw-btn:active,.tw-leave:active{transform:scale(.96)}
.tw-mini{display:none}
/* küçültülmüş hâl: kapsül */
.tw.min{width:auto;padding:0;border-radius:999px}
.tw.min .tw-head,.tw.min .tw-body{display:none}
.tw.min .tw-mini{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 14px;border:0;background:none;color:var(--text);font-weight:750;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer}
.tw.min .tw-mini *{pointer-events:none}
/* bildirim kutularını widget'ın üstüne taşı */
body.has-tw[data-tw-corner="br"] #toasts{bottom:calc(22px + 300px)}
body.has-tw.tw-min[data-tw-corner="br"] #toasts{bottom:80px}
/* sohbette yazma alanını kapatmasın */
body[data-view="chat"] .tw[data-corner="br"],body[data-view="chat"] .tw[data-corner="bl"]{bottom:150px}
body[data-view="chat"] .tw:not(.min) .tw-goal,body[data-view="chat"] .tw:not(.min) .tw-pomo{display:none}
body.has-tw[data-view="chat"][data-tw-corner="br"] #toasts{bottom:calc(128px + 210px)}
@media (max-width:900px){
  .tw{width:min(282px,calc(100vw - 28px))}
  .tw[data-corner="br"],.tw[data-corner="bl"]{bottom:calc(86px + env(safe-area-inset-bottom))}
  .tw[data-corner="br"]{right:14px}.tw[data-corner="bl"]{left:14px}
  .tw[data-corner="tr"],.tw[data-corner="tl"]{top:14px}
  .tw[data-corner="tr"]{right:14px}.tw[data-corner="tl"]{left:14px}
  body[data-view="chat"] .tw{display:none}
  body.has-tw[data-tw-corner="br"] #toasts,body.has-tw[data-tw-corner="bl"] #toasts{bottom:calc(86px + 300px + env(safe-area-inset-bottom))}
  body.has-tw.tw-min[data-tw-corner="br"] #toasts,body.has-tw.tw-min[data-tw-corner="bl"] #toasts{bottom:calc(140px + env(safe-area-inset-bottom))}
  body.has-tw[data-view="chat"] #toasts{bottom:calc(100px + env(safe-area-inset-bottom))}
}
/* ---------- 3 saat büyük uyarı modalı ---------- */
#bigAlert{--ba:#f59e0b;position:fixed;inset:0;z-index:9700;display:grid;place-items:center;padding:20px;background:rgba(2,6,23,.55);-webkit-backdrop-filter:blur(12px) saturate(130%);backdrop-filter:blur(12px) saturate(130%);opacity:0;transition:opacity .25s}
#bigAlert.tone-back{--ba:#38bdf8}#bigAlert.tone-info{--ba:#a78bfa}
#bigAlert.show{opacity:1}
.ba-card{position:relative;width:min(480px,100%);padding:30px 26px 24px;border-radius:28px;text-align:center;overflow:hidden;
  background:var(--glass-sheen,none),radial-gradient(ellipse 80% 60% at 50% 0%,color-mix(in srgb,var(--ba) 26%,transparent),transparent 70%),linear-gradient(var(--modal-bg,var(--surface-solid)),var(--modal-bg,var(--surface-solid)));
  border:1px solid color-mix(in srgb,var(--ba) 40%,var(--glass-border-hi,var(--border)));
  box-shadow:0 40px 80px -24px rgba(0,0,0,.7),0 0 60px -20px var(--ba),var(--glass-hi,none);transform:translateY(16px) scale(.96);transition:transform .35s var(--ease)}
#bigAlert.show .ba-card{transform:none}
.ba-orb{width:86px;height:86px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;font-size:42px;background:color-mix(in srgb,var(--ba) 16%,transparent);border:1px solid color-mix(in srgb,var(--ba) 40%,transparent);box-shadow:0 0 0 8px color-mix(in srgb,var(--ba) 8%,transparent),0 0 40px -6px var(--ba);animation:baFloat 3s ease-in-out infinite}
@keyframes baFloat{50%{transform:translateY(-5px)}}
.ba-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--ba);background:color-mix(in srgb,var(--ba) 14%,transparent);border:1px solid color-mix(in srgb,var(--ba) 32%,transparent)}
.ba-card h2{margin-top:14px;font-size:21px;line-height:1.3}
.ba-card p{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.55}
.ba-card p b{color:var(--text)}
.ba-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.ba-actions .btn{min-width:120px}
@media (max-width:480px){.ba-actions .btn{flex:1 1 100%}}
/* =========================================================
   AKIŞKAN GEÇİŞLER & MODERN KARTLAR
   (Tailwind karşılıkları yorumlarda: transition-all duration-300 ease-in-out, hover:-translate-y-1,
    backdrop-blur-xl bg-white/5 border-white/10 shadow-lg rounded-2xl)
   ========================================================= */
:root{--ease-io:cubic-bezier(.4,0,.2,1);--page-dur:.32s}
/* ---- Sayfa geçişi: çıkış (kısa) → giriş (süzülerek) ---- */
#main{transform-origin:50% 0}
#main.page-leave{animation:pageLeave .14s var(--ease-io) forwards;pointer-events:none}
#main.page-enter{animation:pageEnter var(--page-dur) var(--ease-io) both}
@keyframes pageLeave{to{opacity:0;transform:translateY(-6px) scale(.995);filter:blur(3px)}}
@keyframes pageEnter{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* kartlar sırayla süzülür */
#main.page-enter .card{animation:cardIn .5s var(--ease) both}
#main.page-enter .card:nth-child(2){animation-delay:.04s}#main.page-enter .card:nth-child(3){animation-delay:.08s}
#main.page-enter .card:nth-child(4){animation-delay:.12s}#main.page-enter .card:nth-child(5){animation-delay:.16s}
#main.page-enter .card:nth-child(6){animation-delay:.2s}#main.page-enter .card:nth-child(n+7){animation-delay:.24s}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.985)}}
/* başlık yumuşak geçiş */
.topbar .page-title{transition:opacity .3s var(--ease-io)}
.topbar.title-enter .page-title,.topbar.title-enter .page-title+p{animation:titleIn .4s var(--ease) both}
@keyframes titleIn{from{opacity:0;transform:translateX(-8px)}}
/* aktif menü öğesi: geçişte parlayarak oturur */
#tabBar.nav-anim .nav-item.active{animation:navIn .45s var(--ease) both}
@keyframes navIn{0%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.0);transform:scale(.97)}50%{box-shadow:0 0 0 6px rgba(var(--accent-rgb),.12),0 0 30px -6px rgba(var(--accent-rgb),.7)}100%{transform:none}}
/* sekme / segment butonları */
.nav-item,.seg button,.cs-item,.btn,.btn-icon,.leave-btn,.tw-btn,.tw-leave{transition-property:background,background-color,border-color,color,box-shadow,transform,opacity,filter;transition-duration:.3s;transition-timing-function:var(--ease-io)}

/* ---- Modern kişi kartları (Ekip Canlı) ---- */
.member-card{border-radius:20px;
  background:var(--glass-sheen,none),linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)),linear-gradient(var(--glass-bg,var(--surface)),var(--glass-bg,var(--surface)));   /* bg-white/5 */
  border:1px solid rgba(255,255,255,.10);                                                         /* border-white/10 */
  box-shadow:0 10px 15px -3px rgba(0,0,0,.28),0 4px 6px -4px rgba(0,0,0,.22),var(--glass-hi,none); /* shadow-lg */
  transition:transform .3s var(--ease-io),box-shadow .3s var(--ease-io),border-color .3s var(--ease-io)}
html[data-mode="light"] .member-card{background:var(--glass-sheen,none),linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55));border-color:rgba(255,255,255,.75);box-shadow:0 10px 24px -10px rgba(35,45,90,.22),var(--glass-hi,none)}
.member-card::before{left:18px;right:18px;height:2px;border-radius:0 0 3px 3px;box-shadow:0 0 14px 1px var(--c);opacity:.9}
.member-card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);opacity:.55;pointer-events:none;transition:opacity .3s,transform .5s var(--ease)}
.member-card>*{position:relative;z-index:1}
.member-card:hover{transform:translateY(-4px);                                                    /* hover:-translate-y-1 */

/* =========================================================

html[data-soft="on"]{--accent:var(--soft-accent) !important;--accent-rgb:var(--soft-accent-rgb) !important;--on-accent:#221c33 !important}

  --text:#f6f3ff;--muted:#bab4cf;--faint:#8a83a3;

  --text:#2a2340;--muted:#6f6886;--faint:#a39cb6;

  --tint1:color-mix(in srgb,rgba(var(--c1,var(--soft-accent-rgb)),calc(.22 * var(--cbm,1))) 50%,rgba(255,214,240,calc(.22 * var(--cbm,1))));
  --tint2:color-mix(in srgb,rgba(var(--c2,var(--soft-accent-rgb)),calc(.18 * var(--cbm,1))) 50%,rgba(221,214,254,calc(.18 * var(--cbm,1))));
  --tint-border:rgba(255,226,246,.26);

html[data-soft="on"][data-chatbg="default"],html[data-soft="on"]:not([data-chatbg]){
  --cb1:rgba(221,214,254,calc(.22 * var(--cbm,1)));--cb2:rgba(251,207,232,calc(.18 * var(--cbm,1)));--cb3:rgba(204,251,241,calc(.16 * var(--cbm,1)));

/* =========================================================
   PET SİSTEMİ

.pet-card{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,.9fr);gap:22px;align-items:center;overflow:hidden}

.pet-orb.happy .pet-body{animation:petHappy 1.6s ease-in-out infinite}

.pet-orb.hungry .pet-body{animation:petIdle 4.5s ease-in-out infinite;filter:saturate(.8)}

/* =========================================================
   AKICI GEÇİŞLER (View Transitions) + SAKİN CAM (neon azaltma)
   ========================================================= */
/* ---- Sayfa / tema geçişleri: tarayıcının görünüm geçişi API'si ---- */
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
html.vt-page #main{view-transition-name:sp-page}
html.vt-page::view-transition-old(sp-page){animation:vtOut .2s cubic-bezier(.4,0,1,1) both}
html.vt-page::view-transition-new(sp-page){animation:vtIn .42s cubic-bezier(.2,.8,.2,1) .06s both}
html.vt-page::view-transition-group(sp-page){animation-duration:.42s}
@keyframes vtOut{to{opacity:0;transform:translateY(-10px) scale(.99);filter:blur(4px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(18px) scale(.995);filter:blur(6px)}}
html.vt-reveal::view-transition-old(root){animation:none;z-index:1}
html.vt-reveal::view-transition-new(root){animation:vtReveal .75s cubic-bezier(.4,0,.2,1) both;z-index:2}
@keyframes vtReveal{from{clip-path:circle(0 at var(--vt-x,50%) var(--vt-y,90%))}to{clip-path:circle(160vmax at var(--vt-x,50%) var(--vt-y,90%))}}
html.vt-fade::view-transition-old(root){animation:vtFadeOut .45s ease both}
html.vt-fade::view-transition-new(root){animation:vtFadeIn .45s ease both}
@keyframes vtFadeOut{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0}}
/* Hareket azaltma açıkken: kayma yok, yalnızca yumuşak solma */
@media (prefers-reduced-motion:reduce){
  html.vt-page::view-transition-old(sp-page){animation:vtFadeOut .2s ease both}
  html.vt-page::view-transition-new(sp-page){animation:vtFadeIn .3s ease both}
  html.vt-reveal::view-transition-new(root){animation:vtFadeIn .4s ease both}
}

/* ---------- Titreşim Gönder (Nudge) ---------- */
@keyframes nudgeShake{
  0%,100%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-11px,-2px) rotate(-.7deg)}20%{transform:translate(10px,2px) rotate(.6deg)}
  30%{transform:translate(-9px,1px) rotate(-.4deg)}40%{transform:translate(9px,-2px) rotate(.5deg)}
  50%{transform:translate(-7px,2px)}60%{transform:translate(6px,-1px)}70%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}90%{transform:translate(-2px,0)}}
.nudge-shake{animation:nudgeShake .5s cubic-bezier(.36,.07,.19,.97) both !important}
.chat-wrap.nudge-shake{border-color:rgba(245,158,11,.55);box-shadow:var(--shadow),0 0 0 3px rgba(245,158,11,.16),var(--glass-hi,none)}
@media (prefers-reduced-motion:reduce){
  @keyframes nudgeShakeSoft{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .nudge-shake{animation:nudgeShakeSoft .4s ease both !important;animation-duration:.4s !important}
}
.cmp-btn.cmp-nudge:hover{color:#f59e0b;border-color:rgba(245,158,11,.4)}
.cmp-btn.cmp-nudge.buzz{color:#f59e0b;animation:nudgeBtn .5s ease both !important;animation-duration:.5s !important}
@keyframes nudgeBtn{0%,100%{transform:none}20%{transform:rotate(-18deg) scale(1.12)}40%{transform:rotate(16deg) scale(1.12)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}

  color:color-mix(in srgb,#f59e0b 80%,var(--text));background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.32);box-shadow:var(--glass-hi,none);max-width:92%;text-align:center}

.card,.sidebar .side,.input,.btn-icon,.seg,.clock-pill,.leave-btn,.day-sep,.att-card,.att-x,.att-tag,.chat-head,
.chat-main .composer-wrap,.login-user,.member-card,.cl-row,.soc-card,.mt-name,.cmp-btn,.cbg-opt,
.card *:not(.cmp-pop):not(.cbg-pop):not(.att-x){-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
/* açılır paneller kartın içinde olsa da arkasını göremediği için opak zemin */
.ambient i{will-change:auto}
.ambient i:nth-child(3),.ambient i:nth-child(4){display:none}
.ambient i:nth-child(1){animation-duration:70s}.ambient i:nth-child(2){animation-duration:90s}
/* hareketli dokular: döndürme/eğme yerine yalnızca yavaş kayma (çok daha hafif) */
.texture{contain:strict}
@keyframes lqDriftA{0%{transform:translate3d(-4%,-3%,0)}100%{transform:translate3d(4%,4%,0)}}
@keyframes lqDriftB{0%{transform:translate3d(3%,4%,0)}100%{transform:translate3d(-4%,-3%,0)}}
@keyframes lqAurora{0%{transform:translate3d(-5%,0,0)}100%{transform:translate3d(5%,2%,0)}}
.texture.tx-mesh::before,.texture.tx-mesh::after,.texture.tx-aurora::before,.texture.tx-aurora::after{will-change:auto;inset:-12%}
/* mesh/aurora dokusu zaten ışık lekesi içerdiği için ek ışık katmanı gizlenir */
html:has(.texture.tx-mesh) .ambient,html:has(.texture.tx-aurora) .ambient{display:none}
/* Hafif mod: tüm bulanıklık ve sürekli animasyonlar kapalı */
html.perf-lite *,html.perf-lite *::before,html.perf-lite *::after{-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
html.perf-lite .ambient{display:none}
html.perf-lite[data-mode="dark"]{--pop-bg:rgb(17,24,43);--modal-bg:rgb(17,24,43);--topbar-bg:rgba(2,6,23,.6);--topbar-bg-stuck:rgba(2,6,23,.94)}
html.perf-lite[data-mode="light"]{--pop-bg:#fff;--modal-bg:#fff;--topbar-bg-stuck:rgba(242,243,248,.96)}
html.perf-lite[data-soft="on"][data-mode="dark"]{--pop-bg:rgb(36,30,54);--modal-bg:rgb(36,30,54)}
html.perf-lite .texture::before,html.perf-lite .texture::after,html.perf-lite .chat-main,html.perf-lite .pet-body,html.perf-lite .tw-dot,html.perf-lite .lv-pill i,html.perf-lite .mp-dot,html.perf-lite .gi-emoji,html.perf-lite .ba-orb{animation:none !important}
html.perf-lite .modal-backdrop,html.perf-lite #bigAlert,html.perf-lite #petPicker,html.perf-lite #petLoss{background:rgba(2,6,23,.72)}
html.perf-lite[data-mode="light"] .modal-backdrop{background:rgba(20,28,60,.45)}
/* ---------- Toplantı v2: kalıcı oda, konuşmacı görünümü, sohbet, tam ekran ---------- */
.mt-mount{flex:1;min-height:0;display:flex}
.mt-room{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px;background:transparent}
.mt-room:fullscreen{padding:16px;background:#05070f}
.mt-body{flex:1;min-height:0;display:flex;gap:10px}
.mt-stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.mt-grid{flex:1;min-height:0}
.mt-strip{display:flex;gap:8px;overflow-x:auto;flex-shrink:0;padding-bottom:2px}
.mt-strip[hidden]{display:none}
.mt-strip .mt-tile{flex:0 0 168px;height:100px;min-height:0;border-radius:14px}
.mt-strip .mt-avatar>*{transform:scale(.55)}
.mt-strip .mt-name{font-size:11px;padding:3px 7px;left:6px;bottom:6px}
.mt-strip .mt-tools{display:none}
.mt-room.spot .mt-grid{grid-template-columns:1fr !important;grid-auto-rows:1fr}
.mt-tile.focus video{object-fit:contain}
.mt-tile.me{order:0}
.mt-tile:fullscreen{border-radius:0;border:0}
.mt-tile:fullscreen video{object-fit:contain}
.mt-tools{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.mt-tile:hover .mt-tools,.mt-tile.pinned .mt-tools{opacity:1}
@media (hover:none){.mt-tools{opacity:1}}
.mt-tb{width:30px;height:30px;border-radius:9px;border:0;background:rgba(8,10,18,.6);color:#fff;display:grid;place-items:center}
.mt-tb *{pointer-events:none}
.mt-tb:hover{background:rgba(8,10,18,.85)}
.mt-tile.pinned .mt-tb:first-child{background:var(--accent)}
.mt-conn[hidden]{display:none}
.mt-share-note{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:700;font-size:15px;text-align:center;background:linear-gradient(160deg,rgba(var(--accent-rgb),.45),#0b1020)}
.mt-share-note small{font-weight:500;font-size:12px;opacity:.8}
.mt-tile.self-share .mt-share-note{display:flex}
.mt-tile.self-share video,.mt-tile.self-share .mt-avatar{visibility:hidden}
.mt-ctl{position:relative}
.mt-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center}
/* toplantı sohbeti */
.mt-chat{display:none;width:300px;flex-shrink:0;flex-direction:column;border-radius:18px;background:var(--glass-bg-strong,var(--surface));border:1px solid var(--glass-border,var(--border));overflow:hidden}
.mt-room.chat-open .mt-chat{display:flex}
.mtc-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--glass-border,var(--border))}
.mtc-head b{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.mtc-list{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mtc-msg{display:flex;flex-direction:column;gap:1px;padding:7px 10px;border-radius:12px;background:rgba(var(--ink),.05);font-size:13px}
.mtc-msg.mine{background:rgba(var(--accent-rgb),.14)}
.mtc-msg b{font-size:11.5px}
.mtc-msg span{white-space:pre-wrap;word-break:break-word}
.mtc-msg time{align-self:flex-end;font-size:10.5px;color:var(--muted)}
.mtc-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:16px 6px}
.mtc-form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--glass-border,var(--border))}
.mtc-form .input{min-width:0;padding:9px 12px;font-size:13px}
.mtc-form .send-btn{width:40px;height:40px;border-radius:12px}
.mt-room:fullscreen .mt-chat{background:rgba(15,23,42,.9)}
#meetPill{cursor:pointer}
@media (max-width:1100px){
  .mt-room.chat-open .mt-stage{display:none}
  .mt-room.chat-open .mt-chat{width:100%}
}
@media (max-width:900px){.mt-strip .mt-tile{flex-basis:120px;height:80px}}
.mt-ctl.icon{width:46px;padding:0;justify-content:center}
.mt-ctl.icon span{display:none}
@media (min-width:901px){.chat-wrap.meeting-live .chat-side{display:none}}
.mt-backchat{flex-shrink:0}
@media (max-width:900px){.mt-backchat{display:none}}
@media (max-width:640px){.mt-bar{gap:6px;padding:8px}.mt-ctl,.mt-ctl.icon{width:42px;height:42px}}
.gem-key{margin-bottom:14px}.gem-key .lbl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:650;color:var(--muted)}.gem-key-row{display:flex;gap:8px}.gem-key-row .input{flex:1;min-width:0}

/* ===== Gemini akış (streaming) balonu + Kişisel Asistan + Haftalık rapor ===== */
.bubble.bot.streaming{background:linear-gradient(rgba(30,41,59,.5),rgba(30,41,59,.5)) padding-box,linear-gradient(135deg,#4285f4,#9b72cb,#d96570,#4285f4) border-box;background-size:100% 100%,300% 300%;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);animation:aiFlow 3s linear infinite;box-shadow:0 0 0 1px rgba(155,114,203,.15),0 14px 34px -14px rgba(155,114,203,.75),inset 0 1px 0 rgba(255,255,255,.12)}
html[data-mode="light"] .bubble.bot.streaming{background:linear-gradient(rgba(255,255,255,.72),rgba(255,255,255,.72)) padding-box,linear-gradient(135deg,#4285f4,#9b72cb,#d96570,#4285f4) border-box;background-size:100% 100%,300% 300%}
@keyframes aiFlow{to{background-position:0 0,300% 0}}
.ai-caret{display:inline-block;width:.5em;height:1.05em;margin-left:2px;vertical-align:-.15em;border-radius:2px;background:linear-gradient(180deg,#9b72cb,#4285f4);animation:aiCaret 1s steps(2,start) infinite}
@keyframes aiCaret{to{visibility:hidden}}
.bubble.bot .txt{white-space:pre-wrap;word-break:break-word}
html.perf-lite .bubble.bot.streaming{-webkit-backdrop-filter:none;backdrop-filter:none;animation:none}
.ai-page{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.ai-chat .chat-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--glass-border,var(--border))}
.ai-list .msg.theirs{max-width:min(92%,780px)}
.ai-list .msg.mine{max-width:min(80%,620px)}
.ai-list .bubble .txt{font-size:14.5px;line-height:1.55}
.ai-composer{align-items:flex-end}
.ai-composer textarea{flex:1;min-height:46px}
.ai-stop{background:linear-gradient(135deg,#9b72cb,#d96570)!important}
.ai-stop-sq{width:14px;height:14px;border-radius:3px;background:#fff;display:block}
.ai-copy{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer;opacity:.8}
.ai-copy:hover{opacity:1}
.ai-empty{margin:auto;text-align:center;max-width:560px;padding:20px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ai-empty h4{font-size:19px;color:var(--text)}
.ai-empty p{color:var(--muted);font-size:13.5px}
.ai-orb{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 55%),linear-gradient(135deg,#4285f4,#9b72cb,#d96570);box-shadow:0 18px 40px -14px rgba(155,114,203,.8);animation:aiOrb 4s ease-in-out infinite}
@keyframes aiOrb{50%{transform:translateY(-5px) scale(1.04)}}
.ai-sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;width:100%}
.ai-sug{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--glass-border,var(--border));background:var(--glass-bg,var(--surface));color:var(--text);font:inherit;font-size:13px;line-height:1.4;cursor:pointer;box-shadow:var(--glass-hi,none);transition:transform .18s var(--ease),border-color .2s,box-shadow .25s}
.ai-sug span{font-size:18px;line-height:1}
.ai-sug:hover{transform:translateY(-2px);border-color:rgba(155,114,203,.55);box-shadow:0 12px 28px -16px rgba(155,114,203,.8),var(--glass-hi,none)}
.ai-week{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.aiw-hero{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(135deg,hsla(var(--h),85%,62%,.22),hsla(calc(var(--h) + 40),85%,62%,.08));border:1px solid hsla(var(--h),85%,62%,.35)}
.aiw-hero>span{font-size:30px}
.aiw-hero small{display:block;font-size:11.5px;color:var(--muted)}
.aiw-hero b{display:block;font-size:17px}
.aiw-hero em{font-style:normal;font-size:12px;color:var(--muted)}
.aiw-bars{display:flex;flex-direction:column;gap:9px}
.aiw-row{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-size:12.5px}
.aiw-lbl{display:flex;gap:6px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aiw-lbl em{font-style:normal}
.aiw-row b{font-size:12.5px}
.aiw-bar{grid-column:1/-1;height:7px;border-radius:99px;background:rgba(127,127,127,.15);overflow:hidden}
.aiw-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,hsl(var(--h),80%,60%),hsl(calc(var(--h) + 35),80%,62%));transform-origin:left;animation:aiwGrow .7s var(--ease) both}
@keyframes aiwGrow{from{transform:scaleX(0)}}
.aiw-sum{font-size:13.5px;line-height:1.55;padding:12px 14px;border-radius:14px;background:rgba(155,114,203,.1);border:1px solid rgba(155,114,203,.25)}
.aiw-empty,.aiw-wait{font-size:13px;color:var(--muted);padding:6px 0}
.aiw-sec{border-top:1px solid var(--glass-border,var(--border));padding-top:12px}
.aiw-sec h4{font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.aiw-hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:110px;align-items:end}
.aiw-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--muted)}
.aiw-col i{width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:rgba(155,114,203,.35);flex:0 0 auto}
.aiw-col.now i{background:linear-gradient(180deg,#9b72cb,#4285f4)}
.aiw-col b{font-size:11px;color:var(--text)}
.aiw-col span{white-space:nowrap}
.aiw-note{display:flex;gap:6px;align-items:center}
.aiw-admin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.aiw-people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.aiw-people li{display:flex;gap:10px;align-items:center;font-size:13px}
.aiw-people li span{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aiw-people li em{font-style:normal;font-weight:700}
@media (max-width:1100px){.ai-page{grid-template-columns:1fr}.ai-week{position:static}}
.aiw-people li>:first-child{flex:0 0 28px;width:28px;height:28px}
@media (max-width:900px){.ai-chat{height:calc(100vh - 300px - env(safe-area-inset-bottom));height:calc(100dvh - 300px - env(safe-area-inset-bottom));min-height:380px}}
@media (max-width:640px){.ai-sugs{grid-template-columns:1fr}.aiw-admin{grid-template-columns:1fr}.ai-chat .hide-sm{display:none}.ai-chat .dm-chip{display:none}}
@media (prefers-reduced-motion:reduce){.bubble.bot.streaming,.ai-orb{animation:none}}

/* ===== Serbest Sohbet + toplantı cihaz seçimi ===== */
.lounge-ic{background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(249,115,22,.18))!important;color:#f59e0b;font-size:19px;display:inline-grid;place-items:center}
.cs-tag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(245,158,11,.16);color:#f59e0b;vertical-align:1px}
.lounge-chip{background:rgba(245,158,11,.15);color:#f59e0b}
.mdev{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.mdev-row{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted)}
.mdev-row select{width:100%;min-height:42px;font-size:13.5px;color:var(--text)}
.mdev-unlock{align-self:flex-start}
.mdev-pre{width:100%;border:1px solid var(--glass-border,var(--border));border-radius:16px;padding:10px 12px;background:rgba(255,255,255,.03);text-align:left}
.mdev-pre summary{cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:650;font-size:13.5px;list-style:none}
.mdev-pre summary::-webkit-details-marker{display:none}
.mdev-pre summary small{color:var(--muted);font-weight:500;font-size:11.5px;margin-left:auto}
.mdev-pre[open] summary{margin-bottom:10px}

/* ===== Sesli mesaj + canlı sesli oda ===== */
.cmp-voice{color:var(--accent)}
.chat-main .composer-wrap .composer{position:relative}
#vrecSlot{display:contents}
.vrec{position:absolute;inset:0;z-index:5;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-radius:inherit;background:var(--glass-sheen,none),linear-gradient(var(--pop-bg,var(--surface-solid)),var(--pop-bg,var(--surface-solid)));animation:pop .22s var(--ease)}
.vrec-x{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(239,68,68,.12);color:#ef4444;cursor:pointer;flex-shrink:0}
.vrec-dot{width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:recPulse 1.2s infinite;flex-shrink:0}
@keyframes recPulse{70%{box-shadow:0 0 0 9px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.vrec b{font-variant-numeric:tabular-nums;font-size:14px;min-width:38px}
.vrec-wave{flex:1;min-width:0;height:34px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden}
.vrec-wave i{flex:0 0 3px;border-radius:3px;background:linear-gradient(180deg,var(--accent),#ef4444);transition:height .1s}
.vm{display:flex;align-items:center;gap:9px;min-width:220px;max-width:300px;padding:4px 2px}
.vm-btn{width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;flex-shrink:0;cursor:pointer;background:var(--c,var(--accent));color:#fff;box-shadow:0 6px 16px -8px var(--c,var(--accent))}
.msg.mine .vm-btn{background:rgba(255,255,255,.95);color:var(--accent)}
.vm-btn .vm-pa,.vm.playing .vm-btn .vm-pl{display:none}
.vm.playing .vm-btn .vm-pa{display:grid}
.vm-btn span{display:grid;place-items:center}
.vm-wave{flex:1;height:30px;display:flex;align-items:center;gap:2px;cursor:pointer}
.vm-wave i{flex:1;min-width:2px;border-radius:3px;background:currentColor;opacity:.32;transition:opacity .15s}
.vm-wave i.on{opacity:1}
.vm time{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.8;min-width:30px}
.vm-rate{border:0;border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:700;background:rgba(127,127,127,.18);color:inherit;cursor:pointer}
.vc-box{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--glass-border,var(--border));background:linear-gradient(90deg,rgba(245,158,11,.09),rgba(245,158,11,.02))}
.vc-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(245,158,11,.16);font-size:16px;flex-shrink:0}
.vc-ic.live{background:rgba(34,197,94,.18);animation:pulse 1.8s infinite}
.vc-meta{min-width:0}
.vc-meta b{display:block;font-size:13px}
.vc-meta small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-people{flex:1;display:flex;gap:6px;justify-content:flex-end;min-width:0;overflow:hidden}
.vc-p{position:relative;border-radius:50%;transition:box-shadow .15s}
.vc-p.speaking{box-shadow:0 0 0 2px #22c55e,0 0 14px 2px rgba(34,197,94,.55)}
.vc-mute{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#ef4444;color:#fff;font-style:normal}
.vc-join{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border:0;flex-shrink:0}
.vc-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--glass-border,var(--border));display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;flex-shrink:0}
.vc-btn.off{background:rgba(239,68,68,.15);color:#ef4444;border-color:rgba(239,68,68,.35)}
.vc-btn.leave{background:#ef4444;color:#fff;border-color:transparent}
#voicePill{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:8590;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;cursor:pointer;background:var(--glass-sheen,none),linear-gradient(var(--pop-bg,var(--surface-solid)),var(--pop-bg,var(--surface-solid)));border:1px solid rgba(245,158,11,.5);box-shadow:0 18px 40px -16px rgba(0,0,0,.6),var(--glass-hi,none);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
#voicePill b{font-size:13px}#voicePill small{font-size:12px;color:var(--muted)}
#meetPill~#voicePill{bottom:84px}
@media (max-width:900px){#voicePill{bottom:calc(92px + env(safe-area-inset-bottom))}}
@media (max-width:640px){.vc-meta small{display:none}.vc-box{padding:8px 10px;gap:8px}.vm{min-width:190px}}

/* ===== Hareketli duvar kağıdı ===== */
.wp{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none;filter:blur(var(--wp-blur,0px));transform:scale(1.04)}
html.has-wp .wp{display:block}
html.has-wp .ambient,html.has-wp .texture{display:none}
html.has-wp body{background:#05060a}
.wp::after{content:"";position:absolute;inset:0;background:rgba(2,4,10,var(--wp-dim,.35))}
html[data-mode="light"] .wp::after{background:rgba(245,247,252,var(--wp-dim,.35))}
.wp-cv,.wp-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background-size:cover;background-position:center}
.wp.paused *{animation-play-state:paused!important}
.wp[data-wp="aurora"]{background:#020617}

   Veritabanı yapısı (squadpulse/v1/…):
     settings              → ekip ayarları + aktivite listesi
     users/{userId}        → profil, tema, canlı not (pulse), pomodoro
     sessions/{sessionId}  → { userId, activityId, note, start, end }
     days/{userId_tarih}   → { userId, date, start, end }   (Güne Başladım / Günü Tamamla)
     presence/{userId}     → { connections:{…}, lastSeen }  (çevrimiçi durumu)
     messages/{messageId}  → { userId, text, at, recipientId? } (recipientId boş = genel sohbet, dolu = özel mesaj; Gemini cevapları userId:'gemini')
     ai_logs/{logId}       → { userId, userName, title, at, status, model }  (Gemini kullanım kayıtları)
   Her değişiklik belge bazında yazılır, böylece 3 kişi aynı anda yazsa da çakışma olmaz.
---------------------------------------------------------- */
const Net = { mode: 'firebase', connected: false, ready: false, error: null };

function onWriteError(e) {
  console.error('[firebase] yazma hatası', e);
  const denied = String(e && (e.code || e.message)).toUpperCase().includes('PERMISSION');
  toast(denied ? 'Kaydedilemedi: veritabanı kuralları yazmaya izin vermiyor.' : 'Kaydedilemedi: ' + (e.message || e), 'error');
}

const FirebaseBackend = {
  name: 'Firebase Realtime Database',
  init() {
    return new Promise((resolve, reject) => {
      try {
        firebase.initializeApp(firebaseConfig);
        this.db = firebase.database();
        this.root = this.db.ref(DB_ROOT);
      } catch (e) { return reject(e); }
      this.db.ref('.info/serverTimeOffset').on('value', s => { Clock.offset = s.val() || 0; });
      this.db.ref('.info/connected').on('value', s => {
        Net.connected = !!s.val();
        if (Net.connected) Presence.reattach();
        App.updateNet();
      });
      this.subscribe(resolve, reject);
    });
  },
  subscribe(resolve, reject) {
    const since = NOW() - HISTORY_DAYS * DAY, loaded = new Set();
    const bind = (col, ref) => ref.on('value', snap => {
      DB.setCache(col, snap.val());
      if (!loaded.has(col)) { loaded.add(col); if (loaded.size === 13) resolve(); }
      else App.onRemote(col);
    }, err => { if (!Net.ready) reject(err); else { Net.error = err; App.render(); } });
    bind('settings', this.root.child('settings'));
    bind('users', this.root.child('users'));
    bind('presence', this.root.child('presence'));
    bind('sessions', this.root.child('sessions').orderByChild('start').startAt(since));
    bind('days', this.root.child('days').orderByChild('date').startAt(T.key(since)));
    bind('messages', this.root.child('messages').orderByChild('at').limitToLast(CHAT_LIMIT));
    bind('ai_logs', this.root.child('ai_logs').orderByChild('at').limitToLast(2000));
    bind('clients', this.root.child('clients'));
    bind('games', this.root.child('games').orderByChild('createdAt').limitToLast(150));
    bind('meet', this.root.child('meet'));
    bind('events', this.root.child('events'));
    bind('dayprep', this.root.child('dayprep'));
    bind('signals', this.root.child('signals').orderByChild('at').limitToLast(400));
  },
  ref(path) { return this.root.child(path); },
  set(path, v) { return this.root.child(path).set(v).catch(onWriteError); },
  update(path, patch) { return this.root.child(path).update(patch).catch(onWriteError); },
  multi(updates) { return this.root.update(updates).catch(onWriteError); },
  transaction(path, fn) { return this.root.child(path).transaction(fn).then(r => ({ committed: r.committed, value: r.snapshot.val() })).catch(e => { onWriteError(e); return { committed: false }; }); },
  ts() { return firebase.database.ServerValue.TIMESTAMP; }
};

/* Firebase'e ulaşılamadığında kullanılan yedek: aynı arayüz, veriler yalnızca bu tarayıcıda */
const LocalBackend = {
  name: 'Yerel mod (bu tarayıcı)', key: 'squadpulse.local.v2',
  init() {
    try { this.data = JSON.parse(localStorage.getItem(this.key) || '{}'); } catch (e) { this.data = {}; }
    this.load();
    window.addEventListener('storage', e => { if (e.key === this.key) { try { this.data = JSON.parse(e.newValue || '{}'); } catch (_) {} this.load(); App.onRemote('*'); } });
    Net.connected = true;
    return Promise.resolve();
  },
  load() { ['settings', 'users', 'sessions', 'days', 'presence', 'messages', 'ai_logs', 'clients', 'games', 'meet', 'signals', 'events', 'dayprep'].forEach(c => DB.setCache(c, this.data[c])); },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { toast('Kaydedilemedi: depolama alanı dolu olabilir.', 'error'); } },
  put(path, v) {
    const p = path.split('/'); let o = this.data;
    for (let i = 0; i < p.length - 1; i++) o = (o[p[i]] && typeof o[p[i]] === 'object') ? o[p[i]] : (o[p[i]] = {});
    const k = p[p.length - 1];
    if (v === null || v === undefined) delete o[k]; else o[k] = clean(v);
  },
  set(path, v) { this.put(path, v); this.save(); return Promise.resolve(); },
  update(path, patch) { Object.entries(patch).forEach(([k, v]) => this.put(path + '/' + k, v)); this.save(); return Promise.resolve(); },
  multi(up) { Object.entries(up).forEach(([k, v]) => this.put(k, v)); this.save(); return Promise.resolve(); },
  transaction(path, fn) {
    const cur = path.split('/').reduce((o, k) => (o == null ? undefined : o[k]), this.data);
    const next = fn(cur ?? null);
    if (next === undefined) return Promise.resolve({ committed: false, value: cur });
    this.put(path, next); this.save(); return Promise.resolve({ committed: true, value: next });
  },
  ts() { return NOW(); }
};

/* Uygulamanın konuştuğu tek veri arayüzü — önbellek + seçili backend */
const DB = {
  backend: null,
  cache: { settings: null, users: {}, sessions: {}, days: {}, presence: {}, messages: {}, ai_logs: {}, clients: {}, games: {}, meet: {}, signals: {}, events: {}, dayprep: {} },
  _arr: {},
  setCache(col, val) {
    if (col === 'settings') this.cache.settings = normalizeSettings(val);
    else this.cache[col] = (val && typeof val === 'object') ? { ...val } : {};
    delete this._arr[col];
  },
  get(col) {
    if (col === 'settings') return this.cache.settings;
    return this._arr[col] || (this._arr[col] = Object.entries(this.cache[col] || {}).map(([k, v]) => ({ ...v, id: v.id || k })));
  },
  find(col, id) { const d = (this.cache[col] || {})[id]; return d ? { ...d, id: d.id || id } : undefined; },
  insert(col, doc) {
    doc = clean(doc); this.cache[col][doc.id] = doc; delete this._arr[col];
    this.backend.set(`${col}/${doc.id}`, doc); return doc;
  },
  update(col, id, patch) {
    const cur = this.cache[col][id]; if (!cur) return;
    patch = clean(patch); const next = { ...cur };
    Object.entries(patch).forEach(([k, v]) => { if (v === null) delete next[k]; else next[k] = v; });
    this.cache[col][id] = next; delete this._arr[col];
    this.backend.update(`${col}/${id}`, patch); return next;
  },
  remove(col, pred) {
    const fn = typeof pred === 'function' ? pred : d => d.id === pred;
    const up = {};
    this.get(col).filter(fn).forEach(d => { delete this.cache[col][d.id]; up[`${col}/${d.id}`] = null; });
    delete this._arr[col];
    if (Object.keys(up).length) this.backend.multi(up);
  },
  /** Çok yollu atomik yazma: { 'col/id': doc | null } veya { col: map | null } */
  multi(updates) {
    updates = clean(updates);
    Object.entries(updates).forEach(([k, v]) => {
      const [col, id] = k.split('/');
      if (col === 'settings' && !id) this.cache.settings = normalizeSettings(v);
      else if (!id) this.cache[col] = v || {};
      else { if (!this.cache[col] || typeof this.cache[col] !== 'object') this.cache[col] = {}; if (v === null) delete this.cache[col][id]; else this.cache[col][id] = v; }
      delete this._arr[col];
    });
    return this.backend.multi(updates);
  },
  patchSettings(patch) {
    this.cache.settings = normalizeSettings({ ...this.cache.settings, ...clean(patch) });
    this.backend.update('settings', clean(patch));
  },
  async transaction(col, id, field, fn) {
    const r = await this.backend.transaction(`${col}/${id}/${field}`, fn);
    if (r.committed && this.cache[col][id]) { const n = { ...this.cache[col][id] }; if (r.value == null) delete n[field]; else n[field] = r.value; this.cache[col][id] = n; delete this._arr[col]; }
    return r.committed;
  }
};

/* Çevrimiçi (presence) takibi — sekme kapanınca Firebase otomatik olarak düşürür */
const Presence = {
  con: null, uid: null,
  attach(id) { if (this.uid === id && this.con) return; this.detach(); this.uid = id; this.reattach(); },
  reattach() {
    if (Net.mode !== 'firebase' || !this.uid || !Net.connected || !FirebaseBackend.root) return;
    try {
      const base = FirebaseBackend.ref(`presence/${this.uid}`);
      if (this.con) { this.con.onDisconnect().cancel(); this.con.remove(); }
      this.con = base.child('connections').push();
      this.con.onDisconnect().remove();
      base.child('lastSeen').onDisconnect().set(FirebaseBackend.ts());
      this.con.set(true).catch(() => {});
      base.child('lastSeen').set(FirebaseBackend.ts()).catch(() => {});
    } catch (e) { console.warn('[presence]', e); }
  },
  detach() {
    if (this.con && Net.mode === 'firebase') {
      try { this.con.onDisconnect().cancel(); this.con.remove(); FirebaseBackend.ref(`presence/${this.uid}/lastSeen`).set(FirebaseBackend.ts()); } catch (e) {}
    }
    this.con = null; this.uid = null;
  },
  online(id) {
    if (Net.mode !== 'firebase') return id === Auth.current;
    const p = DB.find('presence', id);
    return !!(p && p.connections && Object.keys(p.connections).length);
  },
  lastSeen(id) { return DB.find('presence', id)?.lastSeen; }
};

function normalizeSettings(s) {
  if (!s) return null;

  return { ...Seed.settings(), ...s, activities: (acts.length ? acts : DEFAULT_ACTIVITIES).filter(Boolean).map(normalizeActivity) };

      { id: 'u_zeynep', name: 'Zeynep Demir', title: 'Frontend Geliştirici', role: 'member', pin: '', color: '#14b8a6', avatar: { type: 'initials' }, prefs: { mode: 'dark', accent: '#14b8a6', texture: 'aurora', texOpacity: .9 } }
    ];

    const up = { settings: this.settings(), 'meta/initializedAt': NOW() };
    this.users().forEach(u => up[`users/${u.id}`] = u);
    return DB.multi(up);
  },
  rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  /** Son iş günlerine örnek kayıtlar ekler (kaydı olan günlere dokunmaz). */
  demoHistory(daysBack = 12) {
    const rnd = this.rng(NOW() % 100000), users = DB.get('users');
    const ids = new Set(Tracker.visibleActivities().map(a => a.id));
    const W = [{ meeting: 3, sync: 3, focus: 2, research: 1 }, { design: 5, deep: 2, sync: 1, research: 1 }, { deep: 4, focus: 3, research: 2, sync: 1 }];
    const pick = w => { const e = Object.entries(w).filter(([k]) => ids.has(k)); const tot = e.reduce((a, [, v]) => a + v, 0); let r = rnd() * tot; for (const [k, v] of e) if ((r -= v) <= 0) return k; return e[0]?.[0] || Tracker.defaultWork(); };
    const up = {}; let added = 0; const today = T.sod();
    for (let back = daysBack; back >= 1; back--) {
      const day = T.addDays(today, -back); if (!T.isWeekday(day)) continue;
      users.forEach((u, i) => {
        const k = T.key(day), did = `${u.id}_${k}`;
        if (DB.find('days', did) || rnd() < 0.06) return;
        let t = day + 8 * HOUR + 25 * MIN + Math.floor(rnd() * 70) * MIN;
        const startT = t, endT = t + (8 * 60 + 35 + Math.floor(rnd() * 95)) * MIN; let lunch = false;
        while (t < endT - 10 * MIN) {
          let aid, len;
          if (!lunch && new Date(t).getHours() >= 12 && ids.has('lunch')) { aid = 'lunch'; len = 40 + Math.floor(rnd() * 25); lunch = true; }
          else if (rnd() < 0.16) { aid = rnd() < .5 && ids.has('coffee') ? 'coffee' : (ids.has('short') ? 'short' : Tracker.breakIds()[0]); len = 6 + Math.floor(rnd() * 12); }
          else { aid = pick(W[i % 3]); len = 30 + Math.floor(rnd() * 85); }
          if (!aid) { aid = Tracker.defaultWork(); }
          const end = Math.min(t + len * MIN, endT), sid = uid('s'), notes = DEMO_NOTES[aid] || [''];
          up[`sessions/${sid}`] = { id: sid, userId: u.id, activityId: aid, note: notes[Math.floor(rnd() * notes.length)], start: t, end, demo: true };
          t = end;
        }
        up[`days/${did}`] = { id: did, userId: u.id, date: k, start: startT, end: t };
        added++;
      });
    }
    if (added) DB.multi(up);
    return added;
  }
};

  user() { return this.current ? DB.find('users', this.current) : null; },

const Tracker = {
  activities() { return DB.get('settings').activities; },
  visibleActivities() { return this.activities().filter(a => !a.archived); },
  activity(id) { return this.activities().find(a => a.id === id) || normalizeActivity({ id, name: 'Diğer', emoji: '•', color: '#94a3b8', kind: 'work' }); },
  defaultWork() { const s = DB.get('settings'), a = this.visibleActivities(); return (a.find(x => x.id === s.defaultActivity && x.work && !x.deep) || a.find(x => x.work && !x.deep) || a.find(x => x.work) || a[0])?.id; },
  deepId() { const s = DB.get('settings'), a = this.visibleActivities(); return (a.find(x => x.id === s.deepActivity && x.deep) || a.find(x => x.deep))?.id || null; },
  breakIds() { return this.visibleActivities().filter(a => !a.work).map(a => a.id); },
  pomoBreakId() { const s = DB.get('settings'); const b = this.breakIds(); return b.includes(s.pomoBreakActivity) ? s.pomoBreakActivity : b[0] || null; },
  openSession(userId) { return DB.get('sessions').find(s => s.userId === userId && !s.end); },
  dayId(userId, ts = NOW()) { return `${userId}_${T.key(ts)}`; },
  day(userId, ts = NOW()) { return DB.find('days', this.dayId(userId, ts)); },
  lastWork(userId, { noDeep = false } = {}) {
    const s = DB.get('sessions').filter(x => x.userId === userId).sort((a, b) => b.start - a.start)
      .find(x => { const a = this.activity(x.activityId); return a.work && !a.archived && (!noDeep || !a.deep) && this.activities().some(y => y.id === a.id); });
    return s ? s.activityId : this.defaultWork();
  },
  status(userId) {
    const day = this.day(userId), open = this.openSession(userId);
    if (open) { const a = this.activity(open.activityId); return { key: a.work ? 'active' : 'break', label: a.name, emoji: a.emoji, color: a.color, deep: a.deep, session: open, day }; }
    if (!day) return { key: 'offline', label: 'Henüz başlamadı', color: '#94a3b8', day };
    if (day.end) return { key: 'done', label: 'Günü tamamladı', color: '#22c55e', day };
    return { key: 'idle', label: 'Beklemede', color: '#f59e0b', day };
  },
  ensureDay(userId, t = NOW()) {
    const id = this.dayId(userId, t), d = DB.find('days', id);
    if (!d) return DB.insert('days', { id, userId, date: T.key(t), start: t });
    if (d.end) return DB.update('days', id, { end: null });
    return d;
  },
  close(session, at = NOW()) {
    if (at - session.start < 3000) DB.remove('sessions', session.id);
    else DB.update('sessions', session.id, { end: at });
  },
  startDay(userId, activityId) { this.ensureDay(userId); this.switchTo(userId, activityId || this.defaultWork()); },
  switchTo(userId, activityId) {
    if (!activityId) return;
    const t = NOW(), open = this.openSession(userId);
    if (open && open.activityId === activityId) return;
    if (open) this.close(open, t);
    this.ensureDay(userId, t);
    const pulse = DB.find('users', userId)?.pulse?.text || '';
    DB.insert('sessions', { id: uid('s'), userId, activityId, note: pulse, start: t });
  },
  setPulse(userId, text) {
    text = String(text || '').trim().slice(0, 140);
    const u = DB.find('users', userId); if (!u || (u.pulse?.text || '') === text) return false;
    DB.update('users', userId, { pulse: { text, at: NOW() } });
    const o = this.openSession(userId); if (o) DB.update('sessions', o.id, { note: text });
    return true;
  },
  stop(userId) { const o = this.openSession(userId); if (o) this.close(o); },
  endDay(userId) {
    this.stop(userId);
    const d = this.day(userId); if (d) DB.update('days', d.id, { end: NOW() });
    DB.update('users', userId, { pomo: null, pulse: { text: '', at: NOW() } });
  },
  /** Önceki günlerden açık kalan sayaçları "otomatik gün sonu" saatinde kapatır. */
  autoClose() {
    const [h, m] = String(DB.get('settings').autoEnd || '23:59').split(':').map(Number);
    const today = T.sod(), up = {};
    DB.get('sessions').forEach(s => {
      if (s.end || s.start >= today) return;
      const d = new Date(T.sod(s.start)); d.setHours(h || 0, m || 0, 0, 0);
      let end = d.getTime(); if (end <= s.start) end = T.eod(s.start) - 1000;
      up[`sessions/${s.id}`] = { ...s, end, autoClosed: true };
    });
    const tk = T.key(today);
    DB.get('days').forEach(d => {
      if (d.end || d.date >= tk) return;
      const last = DB.get('sessions').filter(s => s.userId === d.userId && T.key(s.start) === d.date).reduce((a, s) => Math.max(a, up[`sessions/${s.id}`]?.end || s.end || 0), d.start);
      up[`days/${d.id}`] = { ...d, end: last };
    });
    if (Object.keys(up).length) DB.multi(up);
  },
  summary(userId, from, to) {
    const t = NOW(), r = { work: 0, brk: 0, deep: 0, total: 0, breaks: 0, byAct: {}, first: null, last: null };
    for (const s of DB.get('sessions')) {
      if (userId && s.userId !== userId) continue;
      const end = s.end ?? t; if (s.start >= to || end <= from) continue;
      const st = Math.max(s.start, from), en = Math.min(end, to), d = en - st; if (d <= 0) continue;
      const a = this.activity(s.activityId);
      r.byAct[a.id] = (r.byAct[a.id] || 0) + d;
      if (a.work) r.work += d; else { r.brk += d; r.breaks++; }
      if (a.deep) r.deep += d;
      r.total += d;
      r.first = r.first == null ? st : Math.min(r.first, st);
      r.last = r.last == null ? en : Math.max(r.last, en);
    }
    return r;
  },
  sessionsIn(userId, from, to) { const t = NOW(); return DB.get('sessions').filter(s => (!userId || s.userId === userId) && s.start < to && (s.end ?? t) > from).sort((a, b) => a.start - b.start); },
  recentNotes(userId) { const seen = new Set(); return DB.get('sessions').filter(s => s.userId === userId && s.note).sort((a, b) => b.start - a.start).map(s => s.note).filter(n => !seen.has(n) && seen.add(n)).slice(0, 8); },
  lastWorkedDay() { const s = DB.get('sessions'); return s.length ? T.sod(s.reduce((a, x) => Math.max(a, x.start), 0)) : null; }
};

/* Pomodoro — durum users/{id}/pomo içinde tutulur, böylece ekip de geri sayımı görür */
const Pomo = {
  busy: false,
  cfg() { const s = DB.get('settings'); return { focus: +s.pomoFocus || 25, brk: +s.pomoBreak || 5, long: +s.pomoLong || 15, every: +s.pomoEvery || 4 }; },
  start(userId) {
    const st = Tracker.status(userId), c = this.cfg(), t = NOW();
    if (st.key !== 'active') { if (st.key === 'offline' || st.key === 'done') Tracker.startDay(userId, Tracker.lastWork(userId)); else Tracker.switchTo(userId, Tracker.lastWork(userId)); }
    DB.update('users', userId, { pomo: { phase: 'focus', startedAt: t, endsAt: t + c.focus * MIN, cycle: 1 } });
    Sound.prime();
  },
  stop(userId) { DB.update('users', userId, { pomo: null }); },
  skip(userId) { const u = DB.find('users', userId); if (u?.pomo) DB.update('users', userId, { pomo: { ...u.pomo, endsAt: NOW() } }); },
  /** Saniyelik kontrol — yalnızca kendi kullanıcın için faz geçişi yapar (transaction ile çift tetikleme önlenir) */
  check() {
    const u = Auth.user(); if (!u || !u.pomo || this.busy) return;
    const p = u.pomo, t = NOW(); if (t < p.endsAt) return;
    const c = this.cfg(); let next;
    if (p.phase === 'focus') { const long = p.cycle % c.every === 0; next = { phase: 'break', long, startedAt: t, endsAt: t + (long ? c.long : c.brk) * MIN, cycle: p.cycle }; }
    else next = { phase: 'focus', startedAt: t, endsAt: t + c.focus * MIN, cycle: p.cycle + 1 };
    this.busy = true;
    DB.transaction('users', u.id, 'pomo', cur => (cur && cur.endsAt === p.endsAt) ? next : undefined).then(ok => {
      this.busy = false; if (!ok) return;
      if (next.phase === 'break') {
        const b = Tracker.pomoBreakId(); if (b) Tracker.switchTo(u.id, b);
        Sound.alert('🍅 Pomodoro tamamlandı!', `${next.long ? c.long : c.brk} dakikalık ${next.long ? 'uzun ' : ''}mola zamanı.`);
      } else {
        Tracker.switchTo(u.id, Tracker.lastWork(u.id));
        Sound.alert('Mola bitti', `Odak zamanı — Pomodoro #${next.cycle} başladı.`);
      }
      App.render();
    });
  }
};

const Sound = {
  ctx: null,
  prime() {
    try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  },
  beep() {
    if (!this.ctx) return;
    [0, .22, .44].forEach((d, i) => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime + d;
      o.type = 'sine'; o.frequency.value = i === 2 ? 1046 : 784;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .2);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + .22);
    });
  },
  alert(title, body) {
    this.beep(); toast(`<b>${title}</b> ${body}`, 'success');
    Notify.show({ title, body, tag: 'sp-pomo' });
  }
};

  effectiveMode(p) { return p.mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p.mode; },
  prefs(u) { return { ...this.defaults, ...(u?.prefs || {}) }; },

    root.style.setProperty('--tex-opacity', p.texOpacity);

};

function avatar(u, size = 40) {

  if (a.type === 'image' && a.value) return `<span class="av" style="${base}"><img src="${a.value}" alt=""></span>`;

  return `<span class="av" style="${base}font-size:${Math.round(size * .36)}px;background:linear-gradient(140deg,${u.color},color-mix(in srgb,${u.color} 55%,#000));color:#fff">${esc(initials(u.name))}</span>`;
}
const avatarDot = (u, size, st) => `<span class="avw">${avatar(u, size)}<i class="sdot st-${st.key}" style="--c:${st.color}" title="${esc(st.label)}"></i></span>`;
const statusPill = (st, small) => `<span class="pill ${small ? 'pill-sm' : ''} st-${st.key}" style="--c:${st.color}"><i class="pdot"></i>${st.emoji ? st.emoji + ' ' : ''}${esc(st.label)}</span>`;

const Charts = {
  actItems(byAct) { return Object.entries(byAct).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([id, v]) => { const a = Tracker.activity(id); return { id, label: a.name, emoji: a.emoji, color: a.color, value: v, work: a.work }; }); },
  donut(items, { size = 170, center = '', sub = '' } = {}) {
    const total = items.reduce((a, b) => a + b.value, 0);
    if (!total) return `<div class="tl-empty" style="height:${size}px;width:100%">Henüz veri yok</div>`;
    let acc = 0;
    const stops = items.map(it => { const a = acc / total * 360; acc += it.value; return `${it.color} ${a.toFixed(2)}deg ${(acc / total * 360).toFixed(2)}deg`; }).join(',');
    return `<div class="donut" style="width:${size}px;height:${size}px;background:conic-gradient(${stops})"><div class="donut-hole"><b>${center}</b><span>${sub}</span></div></div>`;
  },
  legend(items, max = 8) { const total = items.reduce((a, b) => a + b.value, 0) || 1; return `<ul class="legend">${items.slice(0, max).map(it => `<li><i style="background:${it.color}"></i><span>${it.emoji || ''} ${esc(it.label)}</span><b>${T.dur(it.value)}</b><em>%${Math.round(it.value / total * 100)}</em></li>`).join('')}</ul>`; },
  stack(items) { return `<div class="stack">${items.map(it => `<i style="flex:${it.value};background:${it.color}" title="${esc((it.emoji || '') + ' ' + it.label + ' · ' + T.dur(it.value))}"></i>`).join('')}</div>`; },
  ring(p, { size = 168, attrs = '', center = '', sub = '' } = {}) {
    const r = 52, C = 2 * Math.PI * r, q = clamp(p, 0, 1);
    return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="${r}" class="ring-bg"/><circle cx="60" cy="60" r="${r}" class="ring-fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - q)).toFixed(1)}" style="opacity:${q > .002 ? 1 : 0}" ${attrs}/></svg><div class="ring-center">${center}${sub}</div></div>`;
  },
  timeline(userId, dayTs, compact = false) {
    const from = T.sod(dayTs), to = T.eod(dayTs), t = NOW(), list = Tracker.sessionsIn(userId, from, to);
    if (!list.length) return `<div class="tl-empty ${compact ? 'compact' : ''}">Bu gün için kayıt yok</div>`;
    const a = Math.max(list[0].start, from), b = Math.min(Math.max(...list.map(s => s.end ?? t)), to);
    const rs = Math.min(from + Math.floor((a - from) / HOUR) * HOUR, from + 8 * HOUR);
    const re = Math.min(Math.max(from + Math.ceil((b - from) / HOUR) * HOUR, from + 18 * HOUR), to);
    const span = re - rs, pct = x => (x - rs) / span * 100;
    const segs = list.map(s => {
      const st = Math.max(s.start, rs), en = Math.min(s.end ?? t, re); if (en <= st) return '';
      const ac = Tracker.activity(s.activityId);
      const tip = `${ac.emoji} ${ac.name} · ${T.hm(st)}–${s.end ? T.hm(en) : 'şimdi'} · ${T.dur(en - st)}${s.note ? ' · ' + s.note : ''}`;
      return `<i class="tl-seg ${s.end ? '' : 'live'} ${ac.work ? '' : 'brk'}" style="left:${pct(st).toFixed(3)}%;width:${Math.max(pct(en) - pct(st), .35).toFixed(3)}%;--c:${ac.color}" title="${esc(tip)}"></i>`;
    }).join('');
    const hours = span / HOUR, step = compact ? (hours > 12 ? 4 : 3) : (hours > 12 ? 2 : 1);
    let ticks = ''; for (let x = rs; x <= re; x += step * HOUR) ticks += `<span style="left:${pct(x).toFixed(2)}%">${x >= to ? '24' : pad(new Date(x).getHours())}:00</span>`;
    const nowMark = t >= rs && t <= re ? `<i class="tl-now" style="left:${pct(t).toFixed(2)}%"></i>` : '';
    return `<div class="tl ${compact ? 'compact' : ''}"><div class="tl-track">${segs}${nowMark}</div><div class="tl-axis">${ticks}</div></div>`;
  },
  columns(cols, { goal = 0, height = 200 } = {}) {
    const max = Math.max(goal * 1.08, ...cols.map(c => c.total * 1.12), HOUR);
    return `<div class="cols"><div class="cols-plot" style="height:${height}px">
      ${goal ? `<div class="goal-line" style="bottom:${(goal / max * 100).toFixed(2)}%"><span>Hedef ${T.hours(goal)} sa</span></div>` : ''}
      ${cols.map(c => { const h = c.total / max * 100; return `<div class="col ${c.today ? 'today' : ''}"><div class="col-stack" style="height:${h.toFixed(2)}%">${c.segs.filter(s => s.value > 0).map(s => `<i style="flex:${s.value};background:${s.color}" title="${esc(s.title || '')}"></i>`).join('')}</div>${c.total ? `<span class="col-val" style="bottom:calc(${h.toFixed(2)}% + 6px)">${T.hours(c.total)}</span>` : ''}</div>`; }).join('')}
    </div><div class="cols-labels">${cols.map(c => `<span class="${c.today ? 'today' : ''}">${c.label}<em>${c.sub || ''}</em></span>`).join('')}</div></div>`;
  }
};

function pomoCard(u) {
  const p = u.pomo, c = Pomo.cfg(), t = NOW();
  if (!p) return `<section class="card pomo-card">
    <div class="card-head"><h3>${ic('tomato', 17)} Pomodoro</h3><span class="sub">${c.focus} / ${c.brk} dk</span></div>
    ${Charts.ring(0, { size: 160, center: `<b>${pad(c.focus)}:00</b>`, sub: '<span>odak süresi</span>' })}
    <p class="help" style="margin-top:12px">${c.focus} dk odak, ${c.brk} dk kısa mola; her ${c.every}. turda ${c.long} dk uzun mola. Geçişler otomatik yapılır.</p>
    <div class="pomo-actions"><button class="btn btn-primary" data-act="pomoStart">${ic('play', 15)} Pomodoro başlat</button></div></section>`;
  const total = p.endsAt - p.startedAt;
  return `<section class="card pomo-card on phase-${p.phase}">
    <div class="card-head"><h3>${ic('tomato', 17)} Pomodoro</h3><span class="badge ${p.phase === 'focus' ? 'tomato' : 'live'}">${p.phase === 'focus' ? `Odak #${p.cycle}` : (p.long ? 'Uzun mola' : 'Mola')}</span></div>
    ${Charts.ring((t - p.startedAt) / total, { size: 160, attrs: `data-live="pring" data-start="${p.startedAt}" data-end="${p.endsAt}"`, center: `<b data-live="countdown" data-end="${p.endsAt}">${T.mmss(p.endsAt - t)}</b>`, sub: `<span>${p.phase === 'focus' ? 'odaklanma kaldı' : 'mola kaldı'}</span>` })}
    <div class="pomo-dots">${Array.from({ length: c.every }, (_, i) => `<i class="${i < ((p.cycle - 1) % c.every) + (p.phase === 'break' ? 1 : 0) ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pomo-actions"><button class="btn btn-ghost" data-act="pomoSkip">${ic('skip', 15)} ${p.phase === 'focus' ? 'Molaya geç' : 'Molayı bitir'}</button><button class="btn btn-ghost danger" data-act="pomoStop">${ic('x', 15)} Durdur</button></div></section>`;
}

const autoSummary = (title, lines) => `<section class="card summary-card span-all"><div class="card-head"><h3>${ic('sparkles', 17)} ${title}</h3><span class="sub">Kayıtlardan otomatik oluşturuldu</span></div><div class="sum-text">${lines.map(l => `<p>${l}</p>`).join('')}</div></section>`;
const goalTxt = () => String(DB.get('settings').dailyGoal).replace('.', ',');

Views.reportDaily = (from, to, isCurrent) => {
  const users = DB.get('users'), goal = DB.get('settings').dailyGoal * HOUR, team = Tracker.summary(null, from, to);
  if (!team.total) { const last = Tracker.lastWorkedDay(); return `<div class="card">${emptyBox('calendar', 'Bu gün için kayıt yok', isCurrent ? 'Ekipten henüz kimse güne başlamadı.' : 'Seçilen tarihte çalışma kaydı bulunmuyor.', last && last !== from ? `<button class="btn btn-primary" data-act="gotoDate" data-ts="${last}">${ic('calendar', 15)} Son çalışılan güne git</button>` : '')}</div>`; }
  const rows = users.map(u => ({ u, sm: Tracker.summary(u.id, from, to), day: Tracker.day(u.id, from), open: Tracker.openSession(u.id) })).sort((a, b) => b.sm.work - a.sm.work);
  const worked = rows.filter(r => r.sm.total > 0), items = Charts.actItems(team.byAct), workItems = items.filter(i => i.work);
  const startOf = r => r.day ? r.day.start : r.sm.first;
  const starts = worked.map(r => startOf(r) - from), avgStart = starts.length ? from + starts.reduce((a, b) => a + b, 0) / starts.length : null;
  const reached = worked.filter(r => r.sm.work >= goal).length, early = [...worked].sort((a, b) => startOf(a) - startOf(b))[0];
  const deepTop = [...worked].sort((a, b) => b.sm.deep - a.sm.deep)[0];
  const lines = [
    `Ekip ${isCurrent ? 'bugün şu ana kadar' : 'bu gün'} toplam <b>${T.dur(team.work)}</b> net çalıştı ve <b>${team.breaks}</b> molada toplam <b>${T.dur(team.brk)}</b> dinlendi.`,
    worked.length ? `En uzun mesai <b>${esc(worked[0].u.name)}</b> (${T.dur(worked[0].sm.work)}); güne en erken başlayan <b>${esc(firstName(early.u.name))}</b> (${T.hm(startOf(early))}).` : '',
    team.deep ? `Deep Work toplamı <b>${T.dur(team.deep)}</b> — en uzun odak süresi <b>${esc(firstName(deepTop.u.name))}</b> (${T.dur(deepTop.sm.deep)}).` : '',

Views.reportWeekly = (from, to, isCurrent) => {
  const users = DB.get('users'), goal = DB.get('settings').dailyGoal * HOUR, t = NOW(), team = Tracker.summary(null, from, to);
  if (!team.total) { const last = Tracker.lastWorkedDay(); return `<div class="card">${emptyBox('chart', 'Bu hafta için kayıt yok', 'Seçilen haftada çalışma kaydı bulunmuyor.', last && T.sow(last) !== from ? `<button class="btn btn-primary" data-act="gotoDate" data-ts="${last}">${ic('calendar', 15)} Son çalışılan haftaya git</button>` : '')}</div>`; }
  const days = DAYS_SHORT.map((l, i) => { const d = T.addDays(from, i); return { ts: d, label: l, sub: T.fmt(d, { day: 'numeric', month: 'short' }), today: T.key(d) === T.key(t) }; });
  const matrix = users.map(u => ({ u, cells: days.map(d => Tracker.summary(u.id, d.ts, T.addDays(d.ts, 1))), sm: Tracker.summary(u.id, from, to) }));
  const dayTotals = days.map((d, i) => matrix.reduce((a, m) => a + m.cells[i].work, 0));
  const maxCell = Math.max(HOUR, ...matrix.flatMap(m => m.cells.map(c => c.work))), busiest = dayTotals.indexOf(Math.max(...dayTotals));
  const elapsed = days.filter(d => T.isWeekday(d.ts) && d.ts <= t).length;
  const goalPct = elapsed ? Math.round(team.work / (goal * users.length * elapsed) * 100) : 0;
  const items = Charts.actItems(team.byAct), workItems = items.filter(i => i.work), ranked = [...matrix].sort((a, b) => b.sm.work - a.sm.work);
  const cols = days.map((d, i) => ({ label: d.label, sub: d.sub, today: d.today, total: dayTotals[i], segs: matrix.map(m => ({ value: m.cells[i].work, color: m.u.color, title: `${m.u.name} · ${T.dur(m.cells[i].work)}` })) }));
  const lines = [
    `Ekip bu hafta ${isCurrent ? 'şu ana kadar ' : ''}toplam <b>${T.dur(team.work)}</b> net çalıştı; kişi başı ortalama <b>${T.dur(team.work / users.length)}</b>. Toplam mola <b>${T.dur(team.brk)}</b> (${team.breaks} mola).`,
    `Haftanın en yoğun günü <b>${T.fmt(days[busiest].ts, { weekday: 'long' })}</b> (${T.dur(dayTotals[busiest])}); en çok çalışan üye <b>${esc(ranked[0].u.name)}</b> (${T.dur(ranked[0].sm.work)}).`,
    team.deep ? `Haftalık Deep Work: <b>${T.dur(team.deep)}</b> — net çalışmanın %${Math.round(team.deep / (team.work || 1) * 100)}'i.` : '',
    workItems.length ? `En çok zaman ayrılan alan <b>${workItems[0].emoji} ${esc(workItems[0].label)}</b>${workItems[1] ? `, ardından <b>${esc(workItems[1].label)}</b>` : ''}.` : '',
    elapsed ? `Geçen ${elapsed} iş gününe göre hedef tamamlama oranı <b>%${goalPct}</b>.` : ''
  ].filter(Boolean);
  return `<div class="grid g-4">
      ${kpi('clock', 'Haftalık net çalışma', T.dur(team.work), `${T.dur(team.brk)} mola`)}
      ${kpi('users', 'Kişi başı ortalama', T.dur(team.work / users.length), `${users.length} üye`)}
      ${kpi('brain', 'Deep Work', T.dur(team.deep), 'haftalık toplam', '', 'deep')}
      ${kpi('target', 'Hedef tamamlama', elapsed ? '%' + goalPct : '—', `${elapsed} iş günü baz alındı`, '', 'ok')}
    </div>
    <div class="grid g-3 mt">
      ${autoSummary('Otomatik hafta sonu özeti', lines)}
      <section class="card span-2"><div class="card-head"><h3>Günlere göre ekip çalışması</h3><div class="chips">${users.map(u => `<span class="chip" style="--c:${u.color}">● ${esc(firstName(u.name))}</span>`).join('')}</div></div>
        ${Charts.columns(cols, { goal: goal * users.length, height: 300 })}</section>
      <section class="card"><div class="card-head"><h3>Vakit dağılımı</h3></div>
        <div style="display:flex;justify-content:center;margin-bottom:18px">${Charts.donut(items, { size: 170, center: T.dur(team.total), sub: 'toplam' })}</div>${Charts.legend(items, 9)}</section>
      <section class="card span-all"><div class="card-head"><h3>Üye × gün net çalışma (saat)</h3><span class="sub">Renk yoğunluğu çalışma süresini gösterir</span></div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Üye</th>${days.map(d => `<th>${d.label}<br><span style="font-weight:500;text-transform:none">${d.sub}</span></th>`).join('')}<th>Toplam</th><th>Ort./gün</th><th>Mola</th><th>Deep</th></tr></thead>
        <tbody>${matrix.map(m => { const wd = m.cells.filter(c => c.work > 0).length; return `<tr><td><span class="uc">${avatar(m.u, 30)}${esc(m.u.name)}</span></td>
          ${m.cells.map(c => `<td class="heat" style="--a:${(c.work / maxCell * .42).toFixed(3)}"><span>${c.work ? T.hours(c.work) : '·'}</span></td>`).join('')}
          <td class="total">${T.hours(m.sm.work)}</td><td>${wd ? T.hours(m.sm.work / wd) : '—'}</td><td>${T.hours(m.sm.brk)}</td><td>${T.hours(m.sm.deep)}</td></tr>`; }).join('')}
          <tr><td><b>Ekip</b></td>${dayTotals.map(x => `<td><b>${x ? T.hours(x) : '·'}</b></td>`).join('')}<td class="total">${T.hours(team.work)}</td><td>—</td><td>${T.hours(team.brk)}</td><td>${T.hours(team.deep)}</td></tr></tbody></table></div></section>
      <section class="card span-all"><div class="card-head"><h3>Üyelerin vakit dağılımı</h3></div>
        ${ranked.map(m => { const ai = Charts.actItems(m.sm.byAct); return `<div class="rep-row"><div class="rr-user">${avatar(m.u, 40)}<div><b>${esc(m.u.name)}</b><span>${T.dur(m.sm.work)} net · ${T.dur(m.sm.brk)} mola</span></div></div>
          <div class="rr-body" style="justify-content:center">${Charts.stack(ai)}<div class="chips">${ai.slice(0, 7).map(a => `<span class="chip" style="--c:${a.color}">${a.emoji} ${esc(a.label)} <b>%${Math.round(a.value / (m.sm.total || 1) * 100)}</b></span>`).join('')}</div></div></div>`; }).join('')}</section>
    </div>`;
};
